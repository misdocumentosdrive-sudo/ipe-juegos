<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuadra la nómina · IPE I</title>
<style>@font-face{font-family:"Aleo";src:url(aleo.woff2?v=d7c8feba) format("woff2"),url(aleo.ttf?v=fed0d713) format("truetype");font-weight:100 900;font-style:normal;font-display:swap}</style>
<style>
:root{--verde:#004230;--verde2:#0d6b4f;--naranja:#ff5900;--naranjaAA:#c24400;--amarillo:#fcd100;--fondo:#f4f8f6;--texto:#1d2a30;--gris:#5b6b70;--ok:#178045;--mal:#d33a1f;--piedra:#6b6f72}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{background:var(--fondo);color:var(--texto);font:16px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:520px;min-height:100%;display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
h1,h2,.serif{font-family:Aleo,Georgia,serif}
.ico{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none;display:inline-block}
.marca{font:800 13px Aleo,Georgia,serif;color:var(--verde);letter-spacing:.3px}
.pill{background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);white-space:nowrap}
.confeti{position:fixed;top:-12px;width:10px;height:14px;border-radius:2px;pointer-events:none;animation:cae linear forwards;z-index:40}
@keyframes cae{to{transform:translateY(105vh) rotate(720deg)}}
/* portada */
.portada{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px}
.heroe.mesa{background:linear-gradient(180deg,rgba(0,40,29,.55) 0%,rgba(0,34,25,.82) 46%,rgba(0,22,16,.96) 100%),url(nomina_fondo.webp) center 40%/cover no-repeat,#062a1f}
.heroe.mesa h1,.heroe.mesa .hm,.heroe.mesa>p{text-shadow:0 1px 3px rgba(0,0,0,.55)}
.heroe .narra{margin:12px 0 6px}
.heroe .tira{display:flex;gap:6px;margin:10px 0 6px}
.heroe .tira img{width:46px;height:46px;filter:drop-shadow(0 4px 5px rgba(0,0,0,.45))}
.heroe .tira img:nth-child(2n){transform:translateY(-4px) rotate(-6deg)}
.nivel{border:0;border-radius:18px;padding:14px 16px;text-align:left;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.07);cursor:pointer;display:flex;gap:14px;align-items:center;font:inherit;color:inherit}
.nivel .n{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 20px Aleo,Georgia,serif;color:#fff}
.nivel b{display:block;font:800 17px Aleo,Georgia,serif;color:var(--verde)}
.nivel span{font-size:14px;color:var(--gris)}
.record{font-size:13px;color:var(--gris)}
.oficial{background:#fff;border:2px solid var(--verde);border-radius:16px;padding:14px;margin:14px 0;text-align:left;display:grid;gap:8px}
.oficial label span,.oficial small{font-size:13px;opacity:.75}
.oficial input{font:700 20px/1.2 "Helvetica Neue",Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;padding:10px 12px;border:2px solid #cfd8d3;border-radius:10px;width:100%}
.oficial input.error{border-color:#c0392b;background:#fdecea}
.oficial .btn[disabled]{opacity:.5}
.entreno{color:var(--verde);font-size:18px;margin:6px 0 4px;text-align:left}
.oficial .primera{margin:8px 0 0;font-size:14px;font-weight:700;color:var(--verde)}
.aviso-of{background:#fff8d6;border:2px solid #fcd100;border-radius:14px;padding:12px;margin:14px 0;line-height:1.5}
.cifras{font-size:12.5px;color:var(--gris);background:#fff;border-radius:12px;padding:8px 12px;text-align:left}
#envio{margin-top:8px;font-weight:700;color:var(--verde)}
.libro{font-size:14px;color:var(--verde2)}
.btns{display:grid;gap:10px;margin-top:16px}
.btn{border:0;border-radius:14px;padding:14px;font:800 17px Aleo,Georgia,serif;cursor:pointer;min-height:48px}
.btn.p{background:var(--verde);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 4px 12px rgba(0,66,48,.25)}
.btn.s{background:#e3ece8;color:var(--verde)}
.pie{text-align:center;font-size:12px;color:var(--gris);margin-top:auto;padding-top:14px}
/* presentación del nivel */
.intro{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px}
.intro h1{color:var(--verde);margin:0;font-size:27px;line-height:1.15}
.escena-n{position:relative;border-radius:20px;overflow:hidden;padding:64px 12px 12px;background:linear-gradient(180deg,rgba(0,40,29,.05) 0%,rgba(0,32,23,.72) 58%,rgba(0,24,17,.94) 100%),var(--fondo,url(nomina_fondo.webp)) center 45%/cover no-repeat,#0b5a40;box-shadow:0 10px 26px rgba(0,66,48,.3)}
.reglas{background:#fff;border-radius:16px;padding:12px 16px;font-size:15px;line-height:1.45;box-shadow:0 3px 10px rgba(0,0,0,.06)}
.reglas .cortas{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
.reglas .cortas li{display:flex;gap:10px;align-items:flex-start}
.reglas .cortas .ico{color:var(--naranjaAA);margin-top:2px}
.reglas details{margin-top:8px;font-size:14px}
.reglas summary{cursor:pointer;font-weight:700;color:var(--verde);min-height:44px;display:flex;align-items:center}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tres div{border-radius:12px;padding:8px 6px;color:#fff;font:700 13px/1.25 "Helvetica Neue",Arial,sans-serif;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.tres .ico{width:22px;height:22px}
.tres small{font-weight:600;opacity:.9;font-size:11.5px}
.tuto-msg{background:#fff8d6;border-radius:10px;padding:8px 10px;margin:8px 0 0;font-size:14px;line-height:1.4}
/* ===== pantalla de juego: escenario lógico fijo de 360 × 640 (igual en todos los dispositivos), escalado a la pantalla ===== */
#app.jugando{max-width:none;padding:6px 6px calc(6px + env(safe-area-inset-bottom));height:100%;min-height:0;background:linear-gradient(rgba(10,6,0,.14),rgba(10,6,0,.28)),var(--fondo,url(nomina_fondo.webp)) center/cover no-repeat,#3b3026}
@media (orientation:portrait){#app.jugando.v{background:linear-gradient(rgba(10,6,0,.12),rgba(10,6,0,.28)),url(nomina_fondo_v.webp) center/cover no-repeat,#5a4630}}
.juego{flex:1;display:flex;flex-direction:column;min-height:0}
.hud{display:flex;justify-content:space-between;align-items:center;gap:6px;margin:0 auto 6px;width:100%;flex-wrap:wrap}
.hud .pill{background:rgba(8,28,21,.82);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 6px rgba(0,0,0,.25);font-size:14px;padding:6px 11px;font-variant-numeric:tabular-nums;backdrop-filter:blur(3px)}
.hud .racha{background:linear-gradient(#ff7a2e,#c24400);display:none}
.hud .racha.si{display:inline-block;animation:salta .35s cubic-bezier(.3,1.7,.5,1)}
.hud .ctl{display:flex;gap:6px}
.hud button.pill{border:0;cursor:pointer;font:inherit;font-weight:700;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.hud .ctl .ico{width:22px;height:22px}
@keyframes salta{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.marco{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
.lienzo{position:relative;flex:none}
.esc{position:absolute;left:0;top:0;width:360px;height:640px;transform-origin:0 0}
/* la cinta de arriba: lo que viene. Larga, con rodillos en los extremos (la banda da la vuelta sobre el cilindro) y estirada a los
   lados si sobra pantalla (--ext). Revisión del 19-11-2026: una sola regla (antes, tres que se pisaban), sombra de caja en vez
   de filtro (el filtro se recalculaba entero en cada fotograma) y las fichas se mueven con transform */
.cinta{position:absolute;left:calc(60px - var(--ext,0px));right:calc(60px - var(--ext,0px));top:2px;height:88px;overflow:hidden;
 background:url(nomina_cinta.webp) 0 0/auto 100% repeat-x;box-shadow:0 6px 6px rgba(0,0,0,.4)}
.cinta::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 70%,rgba(0,0,0,.25))}
.cinta img{position:absolute;left:0;top:13px;width:62px;height:62px;z-index:1;filter:drop-shadow(0 3px 3px rgba(0,0,0,.5));will-change:transform}
/* la ficha activa */
.actual{position:absolute;left:0;top:0;width:150px;height:150px;margin:-75px 0 0 -75px;will-change:transform;cursor:grab;touch-action:none}
.actual img{position:absolute;left:11px;top:11px;width:128px;height:128px;filter:drop-shadow(0 10px 10px rgba(0,0,0,.45));pointer-events:none}
.actual svg.anillo{position:absolute;inset:0;width:150px;height:150px;transform:rotate(-90deg);pointer-events:none}
.anillo circle{fill:none;stroke-width:7;stroke-linecap:round}
.anillo .fondo{stroke:rgba(0,0,0,.28)}
.anillo .t{stroke:#2fd47a;transition:stroke .2s}
.anillo .t.medio{stroke:#fcd100}.anillo .t.poco{stroke:#ff5900}
.actual.oro img{filter:drop-shadow(0 0 10px rgba(252,209,0,.95)) drop-shadow(0 0 22px rgba(252,190,0,.7)) drop-shadow(0 10px 10px rgba(0,0,0,.45))}
.actual.oro::after{content:"×3";position:absolute;right:2px;top:2px;background:linear-gradient(#ffe25a,#e0a800);color:#3a2a00;font:900 15px Aleo,Georgia,serif;border-radius:999px;padding:3px 8px;box-shadow:0 3px 6px rgba(0,0,0,.35)}
.chapa{position:absolute;left:50%;transform:translateX(-50%);width:max-content;max-width:200px;text-align:center;padding:7px 14px 8px;border-radius:14px;color:#f1f8f4;
 background:linear-gradient(rgba(22,52,42,.92),rgba(8,28,21,.92));box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -2px 0 rgba(0,0,0,.3),0 4px 0 rgba(0,0,0,.25);
 font:700 16px/1.2 ui-rounded,"SF Pro Rounded","Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;pointer-events:none}
.chapa small{display:block;font-weight:600;font-size:13px;color:#bfe3d2;margin-top:3px}
.actual .chapa{top:146px;max-width:262px}   /* 22-11-2026: con 200 px, «Dietas de viaje / mantenimiento en hoteles de otra provincia» bajaba a 3 líneas y tapaba «No va en la nómina» */
/* bandejas */
.bandeja{position:absolute;border:0;padding:0;background:none;cursor:pointer;touch-action:manipulation}
.bandeja img{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 8px rgba(0,0,0,.4));pointer-events:none}
.bandeja .rot{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:5px;width:max-content;max-width:130px;padding:5px 10px;border-radius:12px;color:#fff;
 font:800 13px/1.15 ui-rounded,"SF Pro Rounded","Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;text-align:left;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -2px 0 rgba(0,0,0,.25),0 3px 0 rgba(0,0,0,.25)}
.bandeja .rot .ico{width:17px;height:17px}
.b-izq{left:-34px;top:168px;width:118px;height:160px}
.b-der{right:-34px;top:168px;width:118px;height:160px}
.b-abj{left:84px;bottom:70px;width:192px;height:138px}   /* José, 18-11-2026: más cerca de las fichas */
.b-izq .rot,.b-der .rot{top:-32px;transform:none}
.b-izq .rot{left:34px}.b-der .rot{left:auto;right:34px}
.b-abj .rot{top:-30px}
.bandeja.traga{animation:traga .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes traga{0%{transform:scale(1)}35%{transform:scale(1.1,.9)}100%{transform:scale(1)}}
.bandeja.buena img{filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 12px rgba(47,212,122,.95)) drop-shadow(0 8px 8px rgba(0,0,0,.4))}
.mano{position:absolute;width:56px;height:56px;pointer-events:none;z-index:6;color:#fff;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.flota{position:absolute;font:900 22px Aleo,Georgia,serif;color:#fcd100;text-shadow:0 2px 0 #6b4a00,0 3px 8px rgba(0,0,0,.5);pointer-events:none;white-space:nowrap;z-index:7}
.flota.mal{color:#ffb39a;text-shadow:0 2px 0 #5c1608,0 3px 8px rgba(0,0,0,.5)}
.porque{position:absolute;left:12px;right:12px;top:366px;z-index:8;border-radius:14px;padding:9px 12px;font:700 14.5px/1.35 "Helvetica Neue",Arial,sans-serif;color:#fff;background:linear-gradient(rgba(140,30,10,.95),rgba(110,22,6,.95));box-shadow:0 6px 18px rgba(0,0,0,.4);pointer-events:none}
.porque.bien{background:linear-gradient(rgba(10,90,50,.95),rgba(6,64,36,.95))}
.porque .tit{display:block;font:800 15px Aleo,Georgia,serif;color:#ffd9cc;margin-bottom:1px}
.porque.bien .tit{color:#bff3d6}
.porque b{color:#fcd100}
.nomina3 .porque{top:474px}
.aviso-c{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);color:#fff;font:900 30px Aleo,Georgia,serif;text-align:center;text-shadow:0 3px 0 rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.6);pointer-events:none;z-index:9;white-space:nowrap}
.aviso-c small{display:block;font:700 15px "Helvetica Neue",Arial,sans-serif;margin-top:6px}
/* nivel 3: la nómina de plastilina */
.doc{position:absolute;left:4px;top:0;width:352px;height:485px}   /* José, 18-11-2026: la nómina, algo más grande */
.doc>img{width:100%;height:100%;display:block;filter:drop-shadow(0 12px 14px rgba(0,0,0,.45));pointer-events:none}
.zona{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;border-radius:8px;touch-action:manipulation}
.zona::before{content:"";position:absolute;left:-6px;right:-6px;top:calc(-1*var(--arr,0%));bottom:calc(-1*var(--abj,0%))}   /* el toque, hasta la mitad del hueco */
.zona .zt{position:absolute;left:3px;top:3px;font:800 10.5px/1 ui-rounded,"SF Pro Rounded","Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#fff;background:rgba(0,66,48,.88);border-radius:999px;padding:3px 7px;letter-spacing:.02em;pointer-events:none}
.zona .zp{position:absolute;right:4px;bottom:3px;left:4px;display:flex;justify-content:flex-end;gap:2px;pointer-events:none}
.zona .zp img{width:30px;height:30px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));animation:encaja .3s cubic-bezier(.3,1.7,.5,1)}
@keyframes encaja{from{transform:scale(1.8)}}
.zona.sobre,.zona:focus-visible{box-shadow:0 0 0 3px #fcd100,0 0 18px rgba(252,209,0,.7);outline:none}
.zona.buena{box-shadow:0 0 0 3px #2fd47a,0 0 18px rgba(47,212,122,.8)}
.zona.mala{box-shadow:0 0 0 3px #ff5900}
.z2 .zt{top:50%;transform:translateY(-50%)}
.z2 .zp{bottom:50%;transform:translateY(50%)}
.z2 .zp img{width:24px;height:24px}
.lineas{position:absolute;inset:18px 6px 4px 6px;font:600 10.5px/1.32 "Helvetica Neue",Arial,sans-serif;color:#2b2015;font-variant-numeric:tabular-nums;pointer-events:none}
.lineas div{display:flex;justify-content:space-between;gap:6px;white-space:nowrap}
.lineas div span:first-child{overflow:hidden;text-overflow:ellipsis}
.lineas .tot{font-weight:800;border-top:1px solid rgba(43,32,21,.35);margin-top:1px;padding-top:1px}
.z2 .lineas{inset:0 6px 0 98px;display:flex;align-items:center}
.z5 .lineas{inset:22px 10px 6px 10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.z5 .lineas div{flex-direction:column;align-items:center;justify-content:center;gap:1px;white-space:normal;font-size:9.5px;line-height:1.15}
.z5 .lineas b{font-size:11px}
.sello{position:absolute;left:50%;top:44%;z-index:8;transform:translate(-50%,-50%) rotate(-14deg);border:5px solid #c8341b;border-radius:12px;padding:6px 16px;color:#c8341b;
 font:900 40px/1 Aleo,Georgia,serif;letter-spacing:.06em;background:rgba(255,250,240,.35);box-shadow:inset 0 0 0 3px rgba(200,52,27,.35);mix-blend-mode:multiply;pointer-events:none}
.liquido{position:absolute;left:10px;right:10px;top:478px;border-radius:16px;padding:10px 14px;color:#fff;background:linear-gradient(#0b5a40,#063524);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -3px 0 rgba(0,0,0,.3),0 8px 18px rgba(0,0,0,.4);text-align:center}
.liquido small{display:block;font:700 12px "Helvetica Neue",Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#a8e6cc}
.liquido .cifra{font:900 38px/1.1 Aleo,Georgia,serif;color:#fcd100;font-variant-numeric:tabular-nums}
.odo{display:inline-flex;overflow:hidden;height:1.1em;vertical-align:top}
.odo span{display:inline-block;width:.62em;text-align:center}
.odo .sep{width:auto}
.odo .col{display:flex;flex-direction:column;transition:transform 1.1s cubic-bezier(.2,.9,.25,1)}
.odo .col span{height:1.1em;line-height:1.1em}
.abajo3{position:absolute;left:0;right:0;top:487px;height:153px}
.abajo3 .actual{left:74px!important;top:76px!important}
.abajo3 .ch3{left:136px;top:50%;transform:translateY(-50%);max-width:214px;text-align:left}
.z3 .lineas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:10px;align-content:start;font-size:9.8px}
.z3 .lineas div{min-width:0}
.z3 .lineas .tot{grid-column:1/-1}
.liquido{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left}
.liquido .btn{padding:10px 14px;font-size:15px;min-height:44px;background:#fcd100;color:#3a2a00;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
/* tarjetas, pausa y giro */
.tarjeta{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(0,20,14,.55);backdrop-filter:blur(2px);z-index:20;overflow-y:auto}
.tarjeta.tapa{background:#0b1f19;backdrop-filter:none}
.ficha{width:100%;max-width:440px;background:#fbf6ea;border-radius:18px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.45);border-top:8px solid var(--naranja);margin:auto 0}
.ficha .eti{font:800 12px Aleo,Georgia,serif;letter-spacing:1.5px;color:#c24400;text-transform:uppercase}
.ficha .caso{font:600 18px/1.4 Aleo,Georgia,serif;color:var(--texto);margin:6px 0 10px}
.saltar{position:absolute;top:6px;right:6px;z-index:12;min-height:44px;border:0;border-radius:999px;padding:8px 14px;background:rgba(0,0,0,.5);color:#fff;font:700 13px "Helvetica Neue",Arial,sans-serif;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.giro{display:none}
@media (orientation:landscape) and (max-height:500px) and (pointer:coarse){.juego .giro{display:flex;position:fixed;inset:0;z-index:30;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#0d2a20;color:#fff;font:800 20px Aleo,Georgia,serif;text-align:center;padding:20px}.giro span{font-size:46px}}
/* final */
.final{text-align:center}
.final .gran{font:800 56px Aleo,Georgia,serif;color:var(--verde);margin:4px 0}
#finT:focus{outline:none}
.final .falta{margin-top:4px;font-weight:700;color:#8a4a00}
.estrellas{font-size:34px;letter-spacing:4px;color:var(--amarillo);text-shadow:0 1px 0 #c9a400}
.final .escena-n{margin:12px 0 4px;text-align:left;padding:30px 12px;background-position:center 45%}   /* José, 18-11-2026: el presentador, centrado en vertical */
.fallos{text-align:left;margin-top:16px}
.fallo{background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:14px;display:flex;gap:10px;align-items:center}
.fallo img{width:44px;height:44px;flex:none}
.fallo b{display:block;color:var(--verde);margin-top:2px}
.fallo small{color:var(--gris)}
@keyframes no{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #fcd100;outline-offset:2px;box-shadow:0 0 0 6px #004230}
/* ===== 18-11-2026: todo plastilina dentro del juego (José: «muy tosco, mezcla plastilina con no plastilina») ===== */
/* letras grabadas en la plastilina: hundidas (brillo debajo, sombra encima), del color del barro */
.zona .zt{left:7px;top:6px;background:none;padding:0;border-radius:0;color:#1d4d3a;font:800 10.5px/1 Aleo,Georgia,serif;letter-spacing:.1em;text-transform:uppercase;
 text-shadow:0 1px 0 rgba(255,255,255,.85),0 -1px 0 rgba(90,55,20,.4)}
.grabado{position:absolute;color:#5b3f22;font-family:Aleo,Georgia,serif;text-shadow:0 1px 0 rgba(255,255,255,.85),0 -1px 0 rgba(80,45,10,.45);pointer-events:none}
.grabado b{font-weight:800}
.z1 .zt{left:13px;top:14px}
.z5 .zt{top:auto;bottom:1px}
.grabado{text-align:left}
.g1{left:13px;right:13px;top:30px;display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.15}
.g1 span{font-weight:600;font-size:11.5px}
.g2{left:96px;right:12px;top:50%;transform:translateY(-50%);display:flex;justify-content:space-between;gap:8px;font-size:11px;white-space:nowrap}
.grabado.cifra{right:10px;bottom:5px;text-align:right}
.cifra small{display:block;font-weight:800;font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.grabado.cifra b{font-size:23px;line-height:1.1;font-variant-numeric:tabular-nums}
.caja{top:78.8%;height:10.4%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.1}
.caja small{font-weight:800;font-size:7.4px;letter-spacing:.05em;text-transform:uppercase}
.caja b{font-size:12px;font-variant-numeric:tabular-nums}
.cuadrada .zp{justify-content:flex-start}
.cuadrada .z1 .zp,.cuadrada .z2 .zp,.cuadrada .z5 .zp{opacity:0}
/* el líquido, en una placa de plastilina verde (la bandeja tumbada, estirada por el centro sin deformar el borde) y la cifra en relieve amarillo */
.liquido{left:2px;right:2px;top:0;height:100px;padding:0 6px;border-radius:0;background:none;box-shadow:none;border:30px solid transparent;border-image:url(nomina_bandeja_verde_h.webp) 96 fill / 30px stretch;
 filter:drop-shadow(0 8px 8px rgba(0,0,0,.42));margin:0;align-items:center}
.liquido>div{margin:-22px 0}
.liquido small{color:#cdeedf;font:800 11px Aleo,Georgia,serif;letter-spacing:.14em;text-shadow:0 -1px 0 rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.18)}
.liquido .cifra{font:900 34px/1.05 Aleo,Georgia,serif;color:#fcd100;text-shadow:0 2px 0 #b48a00,0 3px 0 #7a5d00,0 6px 8px rgba(0,0,0,.45)}
.odo{vertical-align:top;line-height:1.1em}
.odo>span{vertical-align:top}
/* botones y avisos dentro del juego: la «chapita oscura» de la Serpiente (no botones de página web) */
.chapa-btn{flex:none;margin:-22px -8px -22px 0;border:0;border-radius:14px;padding:10px 14px;min-height:44px;cursor:pointer;color:#fff;font:800 15px Aleo,Georgia,serif;
 background:linear-gradient(rgba(22,52,42,.96),rgba(8,28,21,.96));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -2px 0 rgba(0,0,0,.3),0 4px 0 rgba(0,0,0,.3)}
.nomina3 .aviso-c{top:40%;padding:10px 18px 12px;border-radius:16px;color:#fcd100;font-size:28px;background:linear-gradient(rgba(22,52,42,.95),rgba(8,28,21,.95));
 box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -2px 0 rgba(0,0,0,.3),0 4px 0 rgba(0,0,0,.28);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.nomina3 .aviso-c small{color:#e8f5ee}
/* ===== 18-11-2026 (2): las placas de plastilina de José (nomina_rotulo_*.webp) en TODOS los rótulos del juego; cada placa se
   estira por el centro (border-image) sin deformar los cantos, y el texto va en relieve: claro sobre placa oscura, oscuro sobre clara ===== */
.placa{border-style:solid;border-color:transparent;border-width:12px 17px;border-image:var(--placa) 44% 30% fill / 12px 17px stretch;
 background:none!important;box-shadow:none!important;border-radius:0!important;filter:drop-shadow(0 3px 3px rgba(0,0,0,.32))}
.grab-c{color:#fbf6ec;text-shadow:0 -1px 0 rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.18)}
.grab-o{color:#43301c;text-shadow:0 1px 0 rgba(255,255,255,.6),0 -1px 0 rgba(0,0,0,.25)}
.bandeja .rot{padding:0 2px}
.b-izq .rot{left:28px}.b-der .rot{right:28px}
/* la ficha: su nombre en una placa crema */
.chapa{--placa:url(nomina_rotulo_crema.webp);border-style:solid;border-color:transparent;border-width:13px 18px;border-image:var(--placa) 44% 30% fill / 13px 18px stretch;
 background:none;box-shadow:none;border-radius:0;padding:0 2px;color:#3d2a17;text-shadow:0 1px 0 rgba(255,255,255,.65),0 -1px 0 rgba(0,0,0,.18);filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
.chapa small{color:#6e5134}
/* marcador: placas marrón (la racha, naranja) */
.hud .pill{--placa:url(nomina_rotulo_marron.webp);border-style:solid;border-color:transparent;border-width:10px 14px;border-image:var(--placa) 44% 30% fill / 10px 14px stretch;
 background:none;box-shadow:none;border-radius:0;padding:0 2px;backdrop-filter:none;color:#fbf6ec;text-shadow:0 -1px 0 rgba(0,0,0,.5);filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.hud .racha{--placa:url(nomina_rotulo_naranja.webp);background:none}
.jugando .hud{flex-wrap:nowrap;gap:4px}
.hud .pill{border-width:10px 11px;border-image-width:10px 11px;font-size:13px}
.hud button.pill{min-width:48px;min-height:46px;padding:0;border-style:solid;border-color:transparent;border-width:10px 14px;border-image:var(--placa) 44% 30% fill / 10px 14px stretch;color:#fbf6ec}
/* avisos y explicaciones: placa marrón (fallo) o verde (bien); botones dentro del juego: placa verde */
.porque{--placa:url(nomina_rotulo_marron.webp);border-style:solid;border-color:transparent;border-width:14px 18px;border-image:var(--placa) 44% 30% fill / 14px 18px stretch;
 background:none;box-shadow:none;border-radius:0;padding:0 4px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4));text-shadow:0 -1px 0 rgba(0,0,0,.45)}
.porque.bien{--placa:url(nomina_rotulo_verde.webp);background:none}
.porque .tit{color:#ffc9b5}
.aviso-c,.nomina3 .aviso-c{--placa:url(nomina_rotulo_marron.webp);border-style:solid;border-color:transparent;border-width:14px 20px;border-image:var(--placa) 44% 30% fill / 14px 20px stretch;
 background:none;box-shadow:none;border-radius:0;padding:0 6px;color:#fcd100;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}
.chapa-btn{--placa:url(nomina_rotulo_verde.webp);border-style:solid;border-color:transparent;border-width:12px 16px;border-image:var(--placa) 44% 30% fill / 12px 16px stretch;
 background:none;box-shadow:none;border-radius:0;padding:0 2px;text-shadow:0 -1px 0 rgba(0,0,0,.5);filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
/* el sello del final: la pieza roja de plastilina, con la palabra en relieve */
.sello{left:27%!important;top:40%!important;width:150px;height:150px;padding:0;border:0;border-radius:50%;background:url(nomina_sello.webp) center/contain no-repeat;box-shadow:none;mix-blend-mode:normal;
 display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 10px 10px rgba(0,0,0,.45))}
.sello span{font:900 15px/1 Aleo,Georgia,serif;letter-spacing:.03em;color:#ffd9cf;text-shadow:0 -1px 0 rgba(80,0,0,.6),0 1px 0 rgba(255,255,255,.28)}
/* ===== 18-11-2026 (3): placas sin costuras (fondo estirado en vez de border-image, que dejaba rayitas al escalar), el aro de
   plastilina como reloj (se vacía con una máscara cónica y pasa de verde a amarillo y naranja) y la cinta de plastilina que corre ===== */
.placa,.chapa,.hud .pill,.hud button.pill,.porque,.aviso-c,.nomina3 .aviso-c,.chapa-btn{border:0!important;border-image:none!important;background:var(--placa) center/100% 100% no-repeat!important}
.bandeja .rot.placa{padding:9px 15px}
.chapa{padding:12px 20px 13px}
.abajo3 .ch3{padding:12px 20px 13px}
.hud .pill{padding:9px 13px}
.hud button.pill{padding:0;min-width:50px;min-height:46px}
.porque{padding:13px 20px}
.aviso-c,.nomina3 .aviso-c{padding:12px 22px}
.chapa-btn{padding:11px 18px}
.aro{position:absolute;right:-4px;top:-4px;width:60px;height:60px;z-index:2;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.aro::before{content:"";position:absolute;inset:0;background:url(nomina_aro_verde.webp) center/contain no-repeat;filter:grayscale(1) brightness(.5);opacity:.45}
.aro i{position:absolute;inset:0;background:var(--aro,url(nomina_aro_verde.webp)) center/contain no-repeat;
 -webkit-mask:conic-gradient(#000 calc(var(--q,1)*360deg),transparent 0);mask:conic-gradient(#000 calc(var(--q,1)*360deg),transparent 0)}
.actual.oro::after{right:auto;left:2px}
.liquido{height:92px}
.marco{overflow:hidden}
.rodillo{position:absolute;top:-4px;height:100px;width:50px;pointer-events:none;z-index:1;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
.r-izq{left:calc(10px - var(--ext,0px))}.r-der{right:calc(10px - var(--ext,0px))}
/* José, 18-11-2026 («algo más centrado o algo más diseño top»): la escena del nivel como un cartel de cine, con el escenario a
   la vista y la persona compañera centrada en vertical; en pantallas anchas el bocadillo no se estira de lado a lado */
.escena-n{display:flex;align-items:center;justify-content:center;min-height:178px;padding:22px 16px;
 background:linear-gradient(90deg,rgba(0,26,18,.82) 0%,rgba(0,26,18,.5) 50%,rgba(0,26,18,.2) 100%),linear-gradient(0deg,rgba(0,20,14,.55),rgba(0,20,14,0) 60%),var(--fondo,url(nomina_fondo.webp)) center 45%/cover no-repeat,#0b5a40;
 box-shadow:0 14px 32px rgba(0,40,28,.32),inset 0 1px 0 rgba(255,255,255,.12)}
.escena-n .pres{width:100%;max-width:640px}
.escena-n .pres-cara{width:72px;height:72px}
.final .escena-n{padding:22px 16px}
/* José, 18-11-2026 («los verdes confunden»): las tres categorías no son botones: la bandeja de plastilina de cada una, con su placa y
   su gesto; así el único botón verde de la pantalla es «¡Vamos allá!» */
.tres .ley{background:none!important;color:var(--texto);padding:4px 0 0;display:flex;flex-direction:column;align-items:center;gap:6px}
.tres .ley img{height:56px;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 4px 4px rgba(0,0,0,.28))}
.tres .ley .placa{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;font:800 12.5px/1.15 ui-rounded,"SF Pro Rounded","Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;text-align:center}
.tres .ley .placa .ico{width:15px;height:15px;flex:none}
.tres .ley small{color:var(--gris);font-weight:700;font-size:12px;opacity:1}
/* José, 18-11-2026 («las letras deben respirar»): en una placa con forma de pastilla, el texto va en el hueco del centro: margen
   ancho en las puntas redondeadas y algo arriba y abajo para no pisar el reborde */
.chapa{padding:15px 34px 16px;max-width:248px}
.abajo3 .ch3{padding:14px 32px 15px;max-width:224px}
.bandeja .rot.placa{padding:10px 22px}
.hud .pill{padding:9px 17px}
.porque{padding:16px 36px 17px}
.aviso-c,.nomina3 .aviso-c{padding:14px 32px}
.chapa-btn{padding:12px 26px}
.tres .ley .placa{padding:8px 20px}
/* José, 18-11-2026: «Salarial» y «No salarial», centrados sobre sus bandejas (las bandejas, algo hacia dentro para que quepan
   enteras también en el móvil) */
.b-izq{left:8px;top:176px;width:104px;height:142px}.b-der{right:8px;top:176px;width:104px;height:142px}
.b-izq .rot,.b-der .rot{left:50%!important;right:auto!important;top:-36px;transform:translateX(-50%)!important;max-width:124px;white-space:nowrap}
.bandeja .rot.placa{padding:10px 16px}
/* José, 18-11-2026 («vamos a cuidar el diseño»): en pantalla ancha, la portada como un cartel de juego: título, fichas, texto
   y niveles a la izquierda (con un ancho de lectura cómodo) y la protagonista a la derecha, sobre la mesa de la gestoría más
   visible. En el móvil, todo en columna como antes. */
.portada{container-type:inline-size}
.heroe.mesa p{max-width:46ch}
@container (min-width:640px){
 .heroe.mesa{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"hm narra" "h1 narra" "tira narra" "p narra" "chips narra";
  column-gap:28px;align-items:start;padding:30px 30px 26px;min-height:330px;
  background:linear-gradient(90deg,rgba(0,30,22,.94) 0%,rgba(0,30,22,.82) 40%,rgba(0,30,22,.35) 72%,rgba(0,30,22,.18) 100%),linear-gradient(0deg,rgba(0,22,16,.6),rgba(0,22,16,0) 45%),url(nomina_fondo.webp) center 42%/cover no-repeat,#062a1f}
 .heroe.mesa .hm{grid-area:hm}.heroe.mesa h1{grid-area:h1;font-size:52px}.heroe.mesa .tira{grid-area:tira}
 .heroe.mesa>p{grid-area:p;font-size:15.5px}.heroe.mesa .chips{grid-area:chips}
 .heroe.mesa .narra{grid-area:narra;align-self:center;justify-self:center;width:100%;max-width:440px;margin:0}
 .heroe.mesa .narra .pres{flex-direction:column-reverse;align-items:flex-start;text-align:left;gap:12px}   /* José, 19-11-2026: la cara debajo del bocadillo, a la izquierda */
 .heroe.mesa .narra .pres-cara{width:96px;height:96px;border-width:4px;margin-left:6px}
 .heroe.mesa .narra .pres-globo{flex:none;width:100%;box-sizing:border-box;font-size:16px;padding:14px 18px}
 .heroe.mesa .narra .pres-globo:before{left:44px;bottom:-8px;border:9px solid transparent;border-top-color:#fffaf0;border-bottom:0}
}
/* José, 18-11-2026 («separar un pelín las bandejas… que la distancia de las 3 sea simétrica»): la ficha a la altura del centro
   de las bandejas de los lados y las tres bandejas a la misma distancia de ella; en el PC, donde sobra sitio, algo más separadas.
   Letreros con la Aleo de la identidad del centro, más fina: respiran mejor */
.b-izq{left:calc(6px - min(var(--ext,0px),26px));top:158px;width:90px;height:124px}
.b-der{right:calc(6px - min(var(--ext,0px),26px));top:158px;width:90px;height:124px}
.b-abj{top:calc(404px + min(var(--ext,0px),26px) + var(--baja,0px));bottom:auto}   /* el mismo hueco que a los lados, contando desde el letrero de la ficha */
.chapa{font:600 16.5px/1.18 Aleo,Georgia,serif;letter-spacing:.005em}
/* revisión 19-11-2026: un punto más (a 320 px quedaba en unos 11 px) */
.chapa small{font:500 14px/1.25 Aleo,Georgia,serif;letter-spacing:.01em;margin-top:4px}
.bandeja .rot.placa{font:600 13.5px/1.1 Aleo,Georgia,serif;letter-spacing:.02em}
.bandeja .rot.placa .ico{width:15px;height:15px}
.tres .ley .placa{font:600 12.5px/1.15 Aleo,Georgia,serif;letter-spacing:.02em}
/* José, 18-11-2026: «Cotiza entero se sale del letrero»: el letrero crece con su texto (en una línea si cabe; en el móvil, en dos,
   siempre dentro de la placa) y el de abajo, que tiene sitio, en una sola línea */
.b-izq .rot,.b-der .rot{white-space:normal!important;text-align:center;justify-content:center;max-width:calc(118px + 2 * min(var(--ext,0px),60px))!important;width:max-content}
.b-abj .rot{white-space:nowrap;max-width:none;width:max-content}
/* José, 18-11-2026: los letreros, siempre por encima de su bandeja (crecen hacia arriba si van en dos líneas) y con margen para no
   pisar las puntas redondeadas de la placa */
.bandeja .rot{top:auto!important;bottom:calc(100% + 5px)}
.bandeja .rot.placa{padding:10px 24px}
.b-izq .rot.placa,.b-der .rot.placa{padding:10px 20px}
/* José, 18-11-2026 («elimina arriba los objetos y deja solo la cinta»): en pantalla ancha el escenario se apoya por abajo y la franja
   de arriba (maceta, taza, archivador, carpetas) queda fuera; la cinta, sola arriba */
@media (orientation:landscape){#app.jugando{background-position:0 0,center 88%}}   /* sin llegar a enseñar las patas de la mesa */
/* José, 18-11-2026 («esos letreros sí que hay que hacer que respiren, y bastante»): el aviso del fallo, con mucho margen dentro de
   su placa, la misma letra de los letreros y arriba, sobre la cinta (no tapa el nombre de la ficha ni la bandeja de abajo) */
.porque{top:0;left:6px;right:6px;padding:22px 52px 24px!important;font:500 14.5px/1.4 Aleo,Georgia,serif;text-align:center;z-index:12}
.porque .tit{font:700 15.5px/1.3 Aleo,Georgia,serif;margin-bottom:4px}
.nomina3 .porque{top:474px}
/* la placa de la ficha, más ancha: debajo de la ficha hay sitio y así no baja hasta el letrero de abajo */
.actual .chapa{max-width:296px}
.actual .chapa.larga{font-size:14px;letter-spacing:-.005em;max-width:340px;padding-left:34px;padding-right:34px}   /* revisión 19-11-2026: los títulos largos, en una línea (en dos, la chapa tapaba el rótulo de la bandeja de abajo) */
/* 22-11-2026 (José: «rectangular con las esquinas redondeadas suaves»): la placa de la ficha ya no es una cápsula (el texto se apretaba
   contra los extremos redondos). Placa crema de plastilina hecha con CSS, como los carteles de Señales: luz arriba, canto abajo y
   sombra. Va al final para ganar a la imagen de la cápsula (que se pone con !important más arriba) y con menos relleno a los lados.
   Y lo mismo los letreros de las bandejas (José: «esta también»), cada uno con el color de su placa de antes */
.chapa,.actual .chapa.larga{border:1px solid rgba(90,60,25,.22)!important;border-radius:12px!important;padding:10px 20px 11px;
 background:linear-gradient(#f8f1e2,#eadbc0)!important;box-shadow:inset 0 2px 0 rgba(255,255,255,.85),inset 0 -3px 0 rgba(120,85,40,.2),0 4px 9px rgba(0,0,0,.34);filter:none}
.placa[data-rot]{border:1px solid rgba(0,0,0,.28)!important;border-radius:10px!important;background:linear-gradient(var(--c1),var(--c2))!important;
 box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.22),0 3px 7px rgba(0,0,0,.32)}
.bandeja .rot.placa[data-rot],.b-izq .rot.placa[data-rot],.b-der .rot.placa[data-rot]{padding:7px 13px}
.tres .ley .placa[data-rot]{padding:6px 9px;gap:5px}
.tres .ley{min-width:0}
@media (max-width:390px){.tres{gap:5px}.tres .ley .placa[data-rot]{font-size:11.5px;padding:5px 7px;gap:4px}.tres .ley .placa .ico{width:13px;height:13px}}   /* a 360 px se salía 6 px de la tarjeta */
@media (max-width:340px){.tres{gap:3px}.tres .ley .placa[data-rot]{font-size:10.5px;padding:4px 5px;gap:3px}.tres .ley .placa .ico{width:12px;height:12px}}
.placa[data-rot]{display:inline-flex!important;align-items:center;justify-content:center;gap:7px;text-align:center}
.placa[data-rot] .tx{white-space:nowrap;text-align:center;line-height:1.12}
.bandeja .rot.placa[data-rot],.b-izq .rot.placa[data-rot],.b-der .rot.placa[data-rot],.tres .ley .placa[data-rot]{width:max-content!important;max-width:none!important}
.placa[data-rot=azul]{--c1:#35375b;--c2:#282944}
.placa[data-rot=crema]{--c1:#efe9e2;--c2:#c5af95}
.placa[data-rot=gris]{--c1:#8a807f;--c2:#675f5e}
.placa[data-rot=grisazul]{--c1:#778390;--c2:#58626c}
.placa[data-rot=marron]{--c1:#70443c;--c2:#54332d}
.placa[data-rot=mostaza]{--c1:#d1aa68;--c2:#b38536}
.placa[data-rot=naranja]{--c1:#d55b2b;--c2:#9f4420}
.placa[data-rot=verde]{--c1:#27704a;--c2:#1d5437}
/* José, 19-11-2026 («afina, que respiren y estén justificados todos los títulos»): la chapa del nivel 3 siempre del mismo tamaño,
   con el título y la letra pequeña centrados y equilibrados en el hueco de la pastilla, lejos de las puntas redondeadas */
.abajo3 .ch3{width:214px;max-width:214px;min-height:96px;box-sizing:border-box;padding:17px 38px 18px!important;display:flex;flex-direction:column;align-items:center;justify-content:center;
 text-align:center;text-wrap:balance;font-size:15px;line-height:1.2;letter-spacing:.01em}
.abajo3 .ch3 small{font-size:11.5px;line-height:1.25;margin-top:5px;text-wrap:balance}
/* revisión 19-11-2026: el sello dice cuántos retoques hubo y las piezas falladas quedan marcadas en naranja */

/* ===== «Cuadra la nómina» (UD6, CE d del RA3): cifras, motor de la nómina y banco de fichas (18-11-2026) =====
   montar_nomina.py lo mete en la plantilla. Las cifras de cotización están en UN SOLO SITIO (COTIZA): el curso que viene se
   cambia aquí y nada más. Cotejadas con el BOE consolidado el 18-11-2026 (Orden PJC/297/2026, de 30 de marzo, BOE-A-2026-7296):
   arts. 2-5, 16 y 33. Dietas y kilometraje exentos: Reglamento del IRPF, art. 9 (Orden HFP/792/2023), sin cambios en 2026.
   El libro trae las de 2024: el juego usa siempre las últimas publicadas (José, 18-11-2026). */
const COTIZA = {
 año: 2026, norma: 'Orden PJC/297/2026',
 baseMin: { 1: 1989.30, 2: 1649.70, 3: 1435.20, 4: 1424.40, 5: 1424.40, 6: 1424.40, 7: 1424.40 }, baseMax: 5101.20,
 trab: { cc: 4.70, mei: 0.15, desInd: 1.55, desTemp: 1.60, fp: 0.10, he: 4.70, heFM: 2.00 },
 emp: { cc: 23.60, mei: 0.75, desInd: 5.50, desTemp: 6.70, fogasa: 0.20, fp: 0.60, he: 23.60 },
 dietaSin: 26.67, dietaCon: 53.34, km: 0.26
};
const r2 = x => Math.round(x * 100 + (x >= 0 ? 1e-7 : -1e-7)) / 100;
const euros = x => r2(x).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: false }) + ' €';
const pct = x => (Number.isInteger(x) ? String(x) : x.toFixed(2).replace('.', ',')) + ' %';

/* La nómina de un mes (Figura 6.3 del libro, con las cifras de COTIZA).
   d.sal: [{t, i, pagas}] percepciones salariales (pagas: entra en las pagas extra) · d.he: horas extraordinarias
   d.noSal: [{t, i}] con tipo 'entero' (cotiza entero: transporte, distancia, quebranto, prendas, herramientas),
            'dieta' ({dias, dia, pernocta}) o 'km' ({km, porKm}): solo cotiza y tributa lo que pasa del límite */
function nomina(d) {
 const T = COTIZA.trab, E = COTIZA.emp;
 const noSal = d.noSal.map(x => {
  if (x.tipo === 'dieta') { const lim = x.pernocta ? COTIZA.dietaCon : COTIZA.dietaSin;
   return Object.assign({}, x, { i: r2(x.dias * x.dia), exceso: r2(x.dias * Math.max(0, x.dia - lim)), exento: r2(x.dias * Math.min(x.dia, lim)) }) }
  if (x.tipo === 'km') return Object.assign({}, x, { i: r2(x.km * x.porKm), exceso: r2(x.km * Math.max(0, x.porKm - COTIZA.km)), exento: r2(x.km * Math.min(x.porKm, COTIZA.km)) });
  return Object.assign({}, x, { exceso: x.i, exento: 0 });
 });
 const sumSal = d.sal.reduce((a, x) => a + x.i, 0), he = d.he || 0;
 const devengado = r2(sumSal + he + noSal.reduce((a, x) => a + x.i, 0));
 const prorrata = r2((d.pagas || 2) * d.sal.filter(x => x.pagas).reduce((a, x) => a + x.i, 0) / 12);
 const tope = b => Math.min(COTIZA.baseMax, Math.max(COTIZA.baseMin[d.grupo] || 0, b));
 const bcc = r2(tope(sumSal + prorrata + noSal.reduce((a, x) => a + x.exceso, 0)));
 const bcp = r2(Math.min(COTIZA.baseMax, bcc + he)), bhe = he;
 const des = d.temporal ? T.desTemp : T.desInd;
 const cuotas = [
  { t: 'Contingencias comunes', p: r2(T.cc + T.mei), i: r2(bcc * (T.cc + T.mei) / 100) },
  { t: 'Desempleo', p: des, i: r2(bcp * des / 100) },
  { t: 'Formación profesional', p: T.fp, i: r2(bcp * T.fp / 100) }
 ].concat(he ? [{ t: 'Horas extraordinarias', p: T.he, i: r2(bhe * T.he / 100) }] : []);
 const totalCuotas = r2(cuotas.reduce((a, x) => a + x.i, 0));
 const baseIrpf = r2(devengado - noSal.reduce((a, x) => a + x.exento, 0));
 const irpf = r2(baseIrpf * d.irpf / 100);
 const deducir = r2(totalCuotas + irpf);
 const empresa = r2(bcc * (E.cc + E.mei) / 100 + bcp * ((d.temporal ? E.desTemp : E.desInd) + E.fogasa + E.fp) / 100 + bhe * E.he / 100);
 return { sal: d.sal, he, noSal, devengado, prorrata, bcc, bcp, bhe, cuotas, totalCuotas, baseIrpf, irpf, irpfP: d.irpf, deducir, liquido: r2(devengado - deducir), empresa };
}

/* Nivel 3: el banco de piezas de la nómina de cada ciclo y su parte (b): 1 encabezamiento, 2 período de liquidación, 3 devengos,
   4 deducciones, 5 bases de cotización y aportación de la empresa (Figura 6.2 del libro). Los importes salen del motor.
   Revisión del 19-11-2026: antes eran siempre las mismas 12 piezas y el nivel se aprendía de memoria; ahora cada partida sortea
   12 de unas 20 (reparto 2/1/3/3/3, en la plantilla) y la dorada sale de tres candidatas (oro): la aportación de la empresa,
   el devengo no salarial y la base de IRPF. */

  'Plus de nocturnidad': ['Nocturnidad', '', 'luna'] })[x.t]).map(([t, s, img], k) => F(t, euros(d.sal[k].i) + s, 3, img));
 const noSal = N.noSal.map(x => x.tipo === 'dieta' ? F('Dietas', euros(x.i) + ' · ' + (x.pernocta ? x.dias + ' noches a ' : x.dias + ' días a ') + euros(x.dia).replace(',00', ''), 3, x.pernocta ? 'cama' : 'plato')
  : x.tipo === 'km' ? F('Kilometraje', euros(x.i) + ' · ' + x.km + ' km a ' + euros(x.porKm), 3, 'coche')
  : F(x.t, euros(x.i), 3, { 'Plus de transporte': 'autobus', 'Desgaste de herramientas': 'herramientas', 'Plus de uniformidad': 'bota' }[x.t]));
 noSal[0].oro = true;   // la candidata a dorada de los devengos: no es salario, pero va en los devengos
 const ex = { 1: 'Los datos de la empresa y los tuyos van arriba, en el encabezamiento.',
  2: 'Las fechas que paga la nómina son el período de liquidación.',
  3: 'Todo lo que cobras, salarial o no, va en los devengos.',
  4: 'Lo que te descuentan va en las deducciones.',
  5: 'Las bases y lo que cotiza la empresa van abajo: no te lo descuentan.' };
 const exPropia = { 'Aportación de la empresa': 'Lo que cotiza la empresa no te lo descuentan: va abajo, con las bases.',
  'Anticipo': 'Lo que te adelantaron ya lo cobraste: se descuenta en las deducciones.',
  'Cuota sindical': 'Te la descuentan solo si la pides: va en las deducciones.',
  'Cotización por horas extra': 'Lo que cotizas por las horas extra te lo descuentan: deducciones.' };
 return [

/* ===== Las fichas de cada partida ===== */
function fichasDe(n,c){
 const l=NIVELES[n-1],B=BANCO[n],todas=(B[c]||[]).concat(B.comun);
 const vistos=new Set(),cand=[];
 for(const f of todas)if(!vistos.has(f.t)){vistos.add(f.t);cand.push(f)}
 /* la dorada, en cualquier bandeja: primero la bandeja, luego una de sus candidatas */
 const conOro=baraja([...new Set(cand.filter(f=>f.oro).map(f=>f.b))])[0], oro=baraja(cand.filter(f=>f.oro&&f.b===conOro))[0], usadas=new Set([oro.img]), sale=[];
 const propias=new Set((B[c]||[]).map(f=>f.t));
 for(const [k,cuantas] of Object.entries(repartoDe(l.reparto))){
  let falta=cuantas-(oro.b===k?1:0);
  /* primero lo propio del ciclo; después el resto, sin repetir objeto si se puede */
  const pool=baraja(cand.filter(f=>f!==oro&&f.b===k)).sort((a,b)=>propias.has(b.t)-propias.has(a.t));
  for(const f of pool){if(!falta)break;if(usadas.has(f.img))continue;sale.push(f);usadas.add(f.img);falta--}
  for(const f of pool){if(!falta)break;if(!sale.includes(f)){sale.push(f);falta--}}
 }
 const r=baraja(sale);r.splice(ORO_EN,0,oro);
 return r.map(f=>Object.assign({},f,{oro:f===oro}));   // las otras candidatas a dorada salen como fichas normales
}
/* un reparto al azar entre los que caben en los márgenes de cada bandeja y suman 12 */
function repartoDe(r){
 const ks=Object.keys(r),ok=[];
 const va=(i,acc,suma)=>{if(i===ks.length){if(suma===12)ok.push(acc);return}for(let m=r[ks[i]][0];m<=r[ks[i]][1];m++)va(i+1,{...acc,[ks[i]]:m},suma+m)};
 va(0,{},0);return baraja(ok)[0];
}
/* nivel 3 (revisión 19-11-2026): 12 piezas de unas 20, con el reparto del nivel y sin repetir dibujo; la dorada, una de sus tres candidatas */
function fichas3(c){
 const p=piezas(c),oro=baraja(p.filter(f=>f.oro))[0],usadas=new Set([oro.img]),sale=[];
 for(const [z,m] of Object.entries(NIVELES[2].reparto)){
  let falta=m-(oro.b==z?1:0);const pool=baraja(p.filter(f=>f!==oro&&f.b==z));
  for(const f of pool){if(!falta)break;if(usadas.has(f.img))continue;sale.push(f);usadas.add(f.img);falta--}
  for(const f of pool){if(!falta)break;if(!sale.includes(f)){sale.push(f);falta--}}
 }
 const r=baraja(sale);r.splice(ORO_EN,0,oro);
 return r.map(f=>Object.assign({},f,{oro:f===oro}));
}

   más equilibrado («No / salarial», «Cotiza / entero», «No entra / en la base») y así el letrero mide justo su texto, con el icono
   pegado y todo centrado (si el navegador partía la línea, la caja quedaba más ancha y el icono se iba a la esquina) */
function dosLineas(t,p){
 const w=String(t).split(' ');if(p==='abj'||w.length<2||t.length<=10)return t;
 if(p==='ley'){   // en la leyenda, tres columnas estrechas: líneas de hasta 11 letras («Solo lo que / pasa del / límite»)
  const l=[];let a='';for(const x of w){if(a&&(a+' '+x).length>11){l.push(a);a=x}else a=a?a+' '+x:x}l.push(a);return l.join('<br>')}
 let mejor=1,dm=1e9;for(let i=1;i<w.length;i++){const a=w.slice(0,i).join(' ').length,b=w.slice(i).join(' ').length,d=Math.max(a,b);if(d<dm){dm=d;mejor=i}}
 return w.slice(0,mejor).join(' ')+'<br>'+w.slice(mejor).join(' ');
}

  const d=b.left<8?8-b.left:b.right>W-8?W-8-b.right:0;if(d){const k=r.offsetWidth?b.width/r.offsetWidth:1;r.style.marginLeft=Math.round(d/(k||1))+'px'}}

/* 22-11-2026: una placa de tres líneas («Indemnización por fin de contrato / acaba tu contrato temporal») pisaba el letrero de la
   bandeja de abajo, que va siempre encima de su bandeja (José, 18-11-2026): la bandeja baja lo justo y vuelve con la siguiente ficha */
function huecoAbajo(){
 const b=document.querySelector('.b-abj'),ch=$('#actCh');if(!b||!ch)return;
 encuadraLetreros();b.style.setProperty('--baja','0px');const r=b.querySelector('.rot');if(!r)return;

 if(ov>0)b.style.setProperty('--baja',Math.ceil(ov/(k||1))+'px');
}

  } catch (e) { return 'HIG' }
}

/* Caras con gesto (elenco_prota_HIG_bien.jpg, _mal, _piensa…): comun_montar.py escribe en ELENCO_GESTOS las que existen.
   Sin el archivo, se usa la cara de siempre y el gesto lo pone el aro de color. */
const gestoDe = (cara, animo) => { const g = cara.replace(/\.jpg$/, '_' + animo + '.jpg');
  return typeof ELENCO_GESTOS !== 'undefined' && ELENCO_GESTOS.indexOf(g) >= 0 ? g : cara };

function personaje(ciclo, quien) {
  const c = ELENCO[ciclo] || ELENCO.HIG, k = ELENCO[ciclo] ? ciclo : 'HIG', vet = quien === 'vet';
  return { nombre: vet ? c.vet : c.prota, ella: vet ? c.vetElla : c.ella, cara: `elenco_${vet ? 'vet' : 'prota'}_${k}.jpg`,
    edad: vet ? c.vetEdad : c.edad, de: vet ? c.vetDe : c.de, puesto: vet ? c.vetPuesto : c.puesto,
    lugar: vet ? c.vetLugar : c.lugar, empresa: vet ? c.vetLugar : c.lugar, sector: c.sector, visita: vet ? c.vetVisita : '' };
}

const fondoPuesto = ciclo => `elenco_puesto_${ELENCO[ciclo] ? ciclo : 'HIG'}.jpg`;

function presenta(cont, op) {
  if (!cont) return null;

  el.className = 'pres pres-' + (op.animo || 'neutro') + (op.compacto ? ' pres-compacto' : '');
  el.dataset.cara = p.cara;
  el.innerHTML = `<div class="pres-cara"><img src="${gestoDe(p.cara, op.animo || 'neutro')}" alt="" draggable="false"></div>
    <div class="pres-globo" role="status" aria-live="polite"><b>${p.nombre}</b><span class="pres-txt"></span></div>`;
  el.querySelector('.pres-txt').textContent = op.texto || '';

}

function reacciona(cont, animo, texto) {
  const el = cont && (cont.classList && cont.classList.contains('pres') ? cont : cont.querySelector('.pres'));

}

/* ===== Común a los tres juegos (José, 9-11-2026): libro, sonido sí/no, accesibilidad e instalable =====
   Lo meten los montar_*.py antes de </body>, junto con PAGINAS (paginas_libro.js). */

/* «Repasa» con la página del libro de tu ciclo (sale del código de lista; sin código, solo el apartado). */
function libro(ud, ap, txt) {
  let c = '';
  try { c = (/^[12]([A-Z]{2,5})-/.exec((localStorage.getItem('ipe_codigo') || '').toUpperCase()) || [])[1] || '' } catch (e) {}
  const p = (((typeof PAGINAS !== 'undefined' && PAGINAS['UD' + ud]) || {})[c] || {})[ap];
  return `📖 En el libro: UD ${ud}, apartado ${txt || ap}${p ? `, página ${p}` : ''}`;
}

/* Diálogo propio (fase 2, 17-11-2026): sustituye a alert y confirm del navegador, que en el móvil parecen un error y no
   llevan los colores del centro. dialogo(texto) avisa; dialogo(texto, {si, no}) pregunta y devuelve true o false. */
function dialogo(txt, op) {
  return new Promise(res => {
    const antes = document.activeElement;
    const fondo = document.createElement('div'); fondo.className = 'dlg-fondo';
    const caja = document.createElement('div'); caja.className = 'dlg';
    caja.setAttribute('role', op ? 'alertdialog' : 'dialog'); caja.setAttribute('aria-modal', 'true');
    const p = document.createElement('p'); p.id = 'dlg-txt'; p.textContent = txt; caja.setAttribute('aria-describedby', 'dlg-txt');
    const bs = document.createElement('div'); bs.className = 'dlg-btns';
    const boton = (texto, clase, v) => { const b = document.createElement('button'); b.type = 'button'; b.className = clase; b.textContent = texto; b.onclick = e => { e.stopPropagation(); fin(v) }; bs.appendChild(b); return b };
    const tecla = e => {
      e.stopPropagation();                                   // el juego no se entera de las teclas mientras está abierto
      if (e.key === 'Escape') { e.preventDefault(); fin(!op) }
      else if (e.key === 'Tab') { const l = [...bs.children], i = l.indexOf(document.activeElement); e.preventDefault(); l[(i + (e.shiftKey ? l.length - 1 : 1)) % l.length].focus() }
    };
    const fin = v => { document.removeEventListener('keydown', tecla, true); fondo.remove(); try { antes && antes.focus && antes.focus({ preventScroll: true }) } catch (e) {} res(v) };
    if (op) boton(op.no || 'No', 'no', false);
    const si = boton(op ? (op.si || 'Sí') : 'Entendido', 'si', true);
    caja.append(p, bs); fondo.appendChild(caja);
    ['pointerdown', 'touchstart', 'mousedown', 'click'].forEach(ev => fondo.addEventListener(ev, e => e.stopPropagation()));
    document.addEventListener('keydown', tecla, true);
    document.body.appendChild(fondo); si.focus({ preventScroll: true });
  });
}

/* ===== Sonido y respuesta física comunes (fase 5, 17-11-2026) =====
   Todo sintetizado con WebAudio (sin archivos). Un solo contexto: el «actx» del juego si lo declara (let actx=null) y,
   si no, uno propio. Pasa por un volumen general y un compresor para que nada sature. Respeta «Sin sonido» (SILENCIO),
   que también quita la vibración. Se desbloquea con el primer toque (iOS).
   sfx('toque'|'acierto'|'fallo'|'tic'|'golpe'|'rompe'|'premio'|'fanfarria'|'alarma'|'barrido'|'paso', n) · vibrar(ms o patrón)
   sacudir(elemento, px) · parada(ms) → promesa (pausa de impacto; el juego decide qué congela) */
const AUDIO = { ctx: null, maestro: null, ruido: null };
function audio() {

    let c = typeof actx !== 'undefined' ? actx : AUDIO.ctx;
    if (!c) { c = new (window.AudioContext || window.webkitAudioContext)(); if (typeof actx !== 'undefined') actx = c; }
    AUDIO.ctx = c;
    if (!AUDIO.maestro || AUDIO.maestro.context !== c) {
      const comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
      AUDIO.maestro = c.createGain(); AUDIO.maestro.gain.value = .8; AUDIO.maestro.connect(comp).connect(c.destination);
      const b = c.createBuffer(1, c.sampleRate * .5, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      AUDIO.ruido = b;
    }
    if (c.state === 'suspended' && !window.SILENCIO) c.resume();
    return c;
  } catch (e) { return null }
}
function nota(f, dur, tipo = 'sine', vol = .2, d = 0, hasta = 0) {
  const c = audio(); if (!c || window.SILENCIO) return;
  const t0 = c.currentTime + d, o = c.createOscillator(), g = c.createGain();
  o.type = tipo; o.frequency.setValueAtTime(f, t0); if (hasta) o.frequency.exponentialRampToValueAtTime(hasta, t0 + dur);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .012); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g).connect(AUDIO.maestro); o.start(t0); o.stop(t0 + dur + .03);
}
function ruido(dur, vol = .2, filtro = 1200, d = 0, q = 1) {
  const c = audio(); if (!c || window.SILENCIO) return;
  const t0 = c.currentTime + d, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = AUDIO.ruido; f.type = 'bandpass'; f.frequency.value = filtro; f.Q.value = q;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  s.connect(f).connect(g).connect(AUDIO.maestro); s.start(t0); s.stop(t0 + dur + .02);
}
const PENTA = [0, 2, 4, 7, 9];
const escala = n => 523.25 * Math.pow(2, (PENTA[n % 5] + 12 * Math.floor(n / 5)) / 12);   // do pentatónico que sube con n
function sfx(nombre, n = 0) {
  switch (nombre) {
    case 'toque': nota(1400, .035, 'triangle', .12); break;
    case 'paso': nota(320 + n * 6, .03, 'sine', .05); break;
    case 'tic': nota(1000, .03, 'square', .07); break;
    case 'acierto': { const b = escala(Math.min(n, 9)); nota(b, .12, 'triangle', .22); nota(b * 1.5, .16, 'triangle', .2, .07); break }
    case 'fallo': nota(220, .16, 'square', .14); nota(155, .2, 'square', .14, .12); break;
    case 'golpe': nota(160, .09, 'sine', .3, 0, 60); ruido(.05, .12, 900); break;
    case 'rompe': ruido(.09, .22, 1800 + Math.min(n, 12) * 180, 0, 2); nota(escala(Math.min(n, 12)), .07, 'triangle', .1); break;
    case 'premio': [0, 2, 4].forEach((k, i) => nota(escala(k + 5), .14, 'sine', .18, i * .07)); break;
    case 'fanfarria': [523, 659, 784, 1047].forEach((f, i) => nota(f, .22, 'triangle', .2, i * .11)); break;
    case 'alarma': nota(880, .12, 'square', .1); nota(880, .12, 'square', .1, .2); break;
    case 'barrido': ruido(.25, .08, 600, 0, .7); break;
  }
}
function vibrar(p) { try { if (!window.SILENCIO && navigator.vibrate) navigator.vibrate(p) } catch (e) {} }

function sacudir(el, px = 6) {

}
const parada = ms => new Promise(r => setTimeout(r, MOV_REDUCIDO ? 0 : ms));

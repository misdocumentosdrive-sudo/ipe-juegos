<title>Serpiente PRL · IPE I</title>
<style>@font-face{font-family:"Aleo";src:url(aleo.woff2?v=d7c8feba) format("woff2"),url(aleo.ttf?v=fed0d713) format("truetype");font-weight:100 900;font-style:normal;font-display:swap}</style>
<style>

:root{--verde:#004230;--verde2:#0d6b4f;--naranja:#ff5900;--amarillo:#fcd100;--fondo:#f4f8f6;--texto:#1d2a30;--gris:#5b6b70;--ok:#178045;--mal:#d33a1f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--fondo);color:var(--texto);font:16px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:520px;min-height:100%;display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
h1,h2,.serif{font-family:Aleo,Georgia,serif}
.cab{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.marca{font:800 13px Aleo,Georgia,serif;color:var(--verde);letter-spacing:.3px}
.pill{background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.vidas{color:var(--mal);letter-spacing:2px}
.barra{height:8px;background:#dde7e2;border-radius:99px;overflow:hidden;margin:6px 0 14px}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--verde2),var(--verde));width:0;transition:width .3s}
.tiempo{height:5px;background:#eadfcf;border-radius:99px;overflow:hidden;margin:-8px 0 12px}
.tiempo i{display:block;height:100%;background:var(--naranja);width:100%}
.tarjeta{background:#fff;border-radius:22px;box-shadow:0 6px 20px rgba(0,66,48,.10);padding:18px;display:flex;flex-direction:column;align-items:center}
.senal{width:min(62vw,230px);height:min(62vw,230px);margin:6px 0 10px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 3px 4px rgba(0,0,0,.15))}
.senal img{max-width:100%;max-height:100%}
.op .mini img,.fila-sen img,.fallo img{width:100%;height:100%;object-fit:contain}
.confeti{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:cae linear forwards;z-index:9}
@keyframes cae{to{transform:translateY(105vh) rotate(720deg)}}
.preg{font:700 18px Aleo,Georgia,serif;color:var(--verde);text-align:center;margin:4px 0 2px}
.opciones{display:grid;gap:10px;margin-top:14px;width:100%}
.opciones.tipos{grid-template-columns:1fr}
.op{border:0;border-radius:14px;padding:14px 14px;font:600 16px "Helvetica Neue",Arial,sans-serif;background:#eef4f1;color:var(--texto);text-align:left;display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .08s,background .2s}
.op:active{transform:scale(.98)}
.op .mini{width:30px;height:30px;flex:none}
.op:disabled{cursor:default;opacity:1;color:var(--texto)}
.op.ok,.op.ok:disabled{background:var(--ok);color:#fff}
.op.mal,.op.mal:disabled{background:var(--mal);color:#fff}
.explica{margin-top:14px;width:100%;border-radius:14px;padding:12px 14px;font-size:15px;display:none}
.explica.ok{display:block;background:#e3f4ea;color:#0b5a2f}
.explica.mal{display:block;background:#fde8e3;color:#8c2512}
.explica b{display:block;font:800 16px Aleo,Georgia,serif;margin-bottom:2px}
.sig{margin-top:12px;width:100%;border:0;border-radius:14px;padding:14px;font:800 17px Aleo,Georgia,serif;background:var(--verde);color:#fff;cursor:pointer;display:none}
.puntos-flota{position:fixed;left:50%;top:38%;transform:translate(-50%,0);font:800 34px Aleo,Georgia,serif;color:var(--ok);pointer-events:none;animation:sube .9s ease-out forwards}
@keyframes sube{to{transform:translate(-50%,-70px);opacity:0}}
.sacude{animation:sacude .35s}
@keyframes sacude{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
/* portada */
.portada{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px}
.portada h1{font-size:32px;color:var(--verde);margin:0;line-height:1.1}
.portada p{color:var(--gris);margin:0}
.fila-sen{display:flex;justify-content:center;gap:8px;margin:6px 0}
.fila-sen img{width:52px;height:52px}
.nivel{border:0;border-radius:18px;padding:16px;text-align:left;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.07);cursor:pointer;display:flex;gap:14px;align-items:center}
.nivel .n{flex:none;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 20px Aleo,Georgia,serif;color:#fff}
.nivel b{display:block;font:800 17px Aleo,Georgia,serif;color:var(--verde)}
.nivel span{font-size:14px;color:var(--gris)}
.record{font-size:13px;color:var(--gris)}
/* final */
.final{text-align:center}
.final .gran{font:800 56px Aleo,Georgia,serif;color:var(--verde);margin:4px 0}
.estrellas{font-size:34px;letter-spacing:4px;color:var(--amarillo);text-shadow:0 1px 0 #c9a400}
.fallos{text-align:left;margin-top:16px}
.fallo{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:10px;margin-bottom:8px}
.fallo img{width:54px;height:54px;flex:none}
.fallo b{display:block;color:var(--verde)}
.fallo small{color:var(--gris)}
.btns{display:grid;gap:10px;margin-top:16px}
.btn{border:0;border-radius:14px;padding:14px;font:800 17px Aleo,Georgia,serif;cursor:pointer}
.btn.p{background:var(--verde);color:#fff}
.btn.s{background:#e3ece8;color:var(--verde)}
.pie{text-align:center;font-size:12px;color:var(--gris);margin-top:auto;padding-top:14px}
.oficial{background:#fff;border:2px solid var(--verde);border-radius:16px;padding:14px;margin:14px 0;text-align:left;display:grid;gap:8px}
.oficial label span,.oficial small{font-size:13px;opacity:.75}
.oficial input{font:700 20px/1.2 "Helvetica Neue",Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;padding:10px 12px;border:2px solid #cfd8d3;border-radius:10px;width:100%;box-sizing:border-box}
.oficial input.error{border-color:#c0392b;background:#fdecea}
.oficial .btn[disabled]{opacity:.5}
.entreno{color:var(--verde);font-size:18px;margin:6px 0 4px;text-align:left}
.aviso-of{background:#fff8d6;border:2px solid #fcd100;border-radius:14px;padding:12px;margin:14px 0;line-height:1.5}
.situ{font-size:17px;line-height:1.45;text-align:center;margin:8px 4px 4px;color:var(--texto)}
.opciones.imgs{grid-template-columns:1fr 1fr}
.opciones.imgs .op{justify-content:center;padding:12px;aspect-ratio:1}
.opciones.imgs .op img{width:100%;height:100%;object-fit:contain}
#envio{margin-top:8px;font-weight:700;color:var(--verde)}

/* ===== propio de «Serpiente PRL» ===== */
.heroe{position:relative;border-radius:24px;padding:22px 18px 18px;text-align:left;color:#fff;overflow:hidden;
 background:radial-gradient(circle at 85% 10%,rgba(252,209,0,.28),transparent 45%),linear-gradient(160deg,#0b5a40,#062a1f 70%);box-shadow:0 14px 30px rgba(0,66,48,.35)}
.heroe .hm{font:700 12px "Helvetica Neue",Arial;letter-spacing:.14em;text-transform:uppercase;color:#a8e6cc}
.heroe h1{color:#fff;font-size:40px;line-height:1;margin:8px 0 4px}
.heroe h1 span{color:#fcd100}
/* 18-11-2026 (informe): el foco se ve también sobre fondo claro (doble anillo) y los botones pequeños llegan a 44 px */
button:focus-visible,input:focus-visible{outline:3px solid #fcd100;outline-offset:2px;box-shadow:0 0 0 6px #004230}
.opc{min-height:44px}.cierre-btns .btn{min-height:44px}
.heroe canvas{width:100%;height:70px;display:block;margin:4px 0 6px}
/* 17-11-2026 (José): Alba con su bocadillo en la portada y al empezar cada nivel; nada más durante la partida */
/* la protagonista, en su tarjeta debajo del héroe (José, 17-11-2026: nada de mezclarla con el recuadro verde) */
.quien{display:flex;gap:14px;align-items:center;background:#fff;border-radius:16px;padding:14px 16px;text-align:left;box-shadow:0 3px 12px rgba(0,66,48,.08)}
.quien img{flex:none;width:64px;height:64px;border-radius:50%;object-fit:cover;background:#e9e2d6;box-shadow:0 0 0 3px #fff,0 0 0 5px #fcd100}
.quien b{display:block;font:800 17px Aleo,Georgia,serif;color:#004230}
.quien small{display:block;font-size:13px;color:#5b6b70;margin:1px 0 5px}
.quien p{margin:0;font-size:15px;line-height:1.4;color:#1d2a30}
.ciclos{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;font:700 13px "Helvetica Neue",Arial,sans-serif;color:#5b6b70}
.ciclos span{flex-basis:100%}.ciclos button{min-width:46px;min-height:36px;padding:0 8px;border:2px solid #cfd8d3;border-radius:99px;background:#fff;color:#004230;font:800 13px "Helvetica Neue",Arial,sans-serif;cursor:pointer}
.ciclos button[aria-pressed="true"]{background:#004230;border-color:#004230;color:#fff}
.velo>div.vhabla{max-width:min(340px,calc(100% - 16px));padding:12px 12px 14px}
.vhabla .vpres{margin:6px 0 8px}
.vhabla .vctl{display:block;font:600 13.5px/1.35 "Helvetica Neue",Arial,sans-serif;color:#cfe9de;margin-top:2px}
.vhabla .vya{display:block;font:800 17px Aleo,Georgia,serif;color:#fcd100;margin-top:8px}
#tutoCierre{max-width:min(400px,calc(100% - 30px))}#tutoCierre .pres-globo{font-size:17px;line-height:1.38}#tutoCierre .pres-globo b{font-size:15px}
@media (min-width:700px){#tutoCierre{max-width:min(480px,calc(100% - 16px))}#tutoCierre .pres-globo{font-size:20px}#tutoCierre .pres-globo b{font-size:17px}}
.tuto-alba .tuto-sigue{display:block;margin-top:3px;font-weight:800;color:#c24400}
.cierre-btns{display:flex;flex-direction:column;gap:8px;margin-top:10px;pointer-events:auto}.cierre-btns .btn{padding:11px;font-size:16px}.cierre-btns .btn.p{background:#fcd100;color:#004230}
.vhabla .tuto-ok{display:inline-block;background:#1d7a55;color:#fff;border-radius:99px;padding:3px 11px;font:800 13px "Helvetica Neue",Arial,sans-serif;margin-bottom:8px}
html,body{overscroll-behavior:none}   /* 18-11-2026: tirar hacia abajo no recarga (se perdía la partida oficial) */
.nivel{transition:transform .12s,box-shadow .12s}.nivel:active{transform:scale(.98)}
/* 22-11-2026 (como en Señales, el Muro y la nómina): casilla «Más tiempo para leer» */
label.lento{display:flex;gap:10px;align-items:flex-start;text-align:left;margin:0 0 8px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.7);font-size:14px;line-height:1.35;color:var(--gris);cursor:pointer}
label.lento b{color:var(--verde)}
label.lento input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--verde)}

.juego{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#123a2e 0%,#05150f 75%);color:#fff;display:flex;flex-direction:column;align-items:center;
 touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;z-index:5}
.juego .arriba{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;padding:12px 14px 0;gap:8px}
.juego .pill{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;font-variant-numeric:tabular-nums}
.portada .oficial{margin:0}   /* 18-11-2026: la portada ya separa con su hueco (antes, hueco doble) */
.juego .pill.vidas{color:#ff7a68}   /* 18-11-2026: antes salían blancas (otra regla pisaba el rojo) */
.juego .ctl{display:flex;gap:6px}.juego .ctl button{width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font:800 13px "Helvetica Neue",Arial,sans-serif;display:grid;place-items:center;cursor:pointer;padding:0}
.juego .ctl .bzu{display:none;width:auto;padding:0 12px;border-radius:99px;font:800 13px "Helvetica Neue",Arial,sans-serif}
.juego .ctl .bzu[aria-pressed="true"]{background:#fcd100;color:#004230}
.juego .ctl button:focus-visible{outline:3px solid #fcd100;outline-offset:2px}
.menu-pausa .cierre-btns{margin-top:10px}
/* 18-11-2026 (informe; José, 18-11: en el móvil solo en vertical): con el móvil girado el tablero quedaba de 6 px por casilla: se pide girarlo y la partida se pausa */
.giro{display:none}
@media (orientation:landscape) and (max-height:500px) and (pointer:coarse){.juego .giro{display:flex;position:fixed;inset:0;z-index:30;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#0d2a20;color:#fff;font:800 20px Aleo,Georgia,serif;text-align:center;padding:20px}.giro span{font-size:46px}}
.juego .crono{font:800 22px Aleo,Georgia,serif;letter-spacing:1px;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(125,255,181,.4)}
.juego .crono.poco{color:#ff8a5c;animation:late .6s infinite}
@keyframes late{50%{transform:scale(1.08)}}
.meta{width:calc(100% - 28px);max-width:492px;height:7px;border-radius:99px;background:rgba(255,255,255,.1);margin-top:8px;overflow:hidden}
.meta i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2fd47a,#fcd100);transition:width .3s}
.consigna{width:calc(100% - 28px);max-width:492px;margin-top:8px;border-radius:14px;padding:8px 12px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.35);
 transition:background .3s}
.consigna small{display:block;font:700 11.5px "Helvetica Neue",Arial;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.consigna b{display:block;font:800 21px/1.15 Aleo,Georgia,serif}
.consigna.nueva{animation:nueva .5s}
@keyframes nueva{30%{transform:scale(1.06);filter:brightness(1.3)}}
.tablero{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding:8px 10px 0;position:relative}
.tablero canvas{display:block;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 0 0 2px rgba(125,255,181,.25)}
/* el puesto de trabajo del ciclo, desenfocado y oscuro detrás de todo (José, 17-11-2026: sí le gustaba; no se mueve, no gasta al jugar) */
.juego .ambiente{position:absolute;inset:-30px;background:center/cover no-repeat;filter:blur(4px);z-index:-1;pointer-events:none}   /* la imagen llega ya desenfocada y oscura: solo suaviza el aumento */
.juego.elige{justify-content:center;gap:10px;padding:20px 16px calc(24px + env(safe-area-inset-bottom))}
.elige-t{font:800 30px Aleo,Georgia,serif;color:#fff;margin:0 0 6px;text-align:center}
.elige-fila{display:flex;gap:12px;justify-content:center;width:100%;max-width:440px;height:min(56vh,440px)}
.elige-s{flex:1;border:0;background:none;padding:0;cursor:pointer;border-radius:22px;transition:transform .15s,opacity .35s}
.elige-s canvas{width:100%;height:100%;display:block}
.elige-s:hover,.elige-s:focus-visible{transform:translateY(-4px);outline:none;background:rgba(255,255,255,.05)}
.elige-s:focus-visible{box-shadow:0 0 0 3px #fcd100,0 0 0 6px #004230;border-radius:16px}
.elige-s.sale{animation:sale .8s cubic-bezier(.45,-.35,.6,.1) forwards}
@keyframes sale{0%{transform:translateY(0) scaleY(1)}22%{transform:translateY(14px) scaleY(.9)}100%{transform:translateY(-130vh) scaleY(1.08)}}
.elige-s.fuera,.elige-cartel.fuera{opacity:0;transform:translateY(16px)}
.elige-cartel{margin-top:14px;background:#fffaf0;color:#004230;font:800 24px Aleo,Georgia,serif;padding:14px 34px;border-radius:18px;
 box-shadow:0 0 0 4px #ff9a3c,0 8px 22px rgba(0,0,0,.35);transition:opacity .3s,transform .3s}
@media (prefers-reduced-motion:reduce){.elige-s.sale{animation:none;opacity:0}}
/* tutorial completo (17-11-2026) */
.velo.velo-tuto{align-items:flex-start;justify-content:flex-end;padding:10px}
.tuto-alba{width:min(620px,calc(100% - 28px));height:140px;margin:8px auto 0;display:flex;align-items:center;flex:none}
.tuto-alba>.pres,.tuto-alba>.tuto-linea{width:100%}
.tuto-alba .pres-cara{width:72px;height:72px}
.tuto-alba .pres-globo{font-size:15px!important;line-height:1.35}
@media (min-width:700px){.tuto-alba{width:min(1040px,calc(100% - 48px));height:136px}.tuto-alba .pres-cara{width:108px;height:108px}.tuto-alba .pres-globo{font-size:22px!important;padding:16px 20px}.tuto-alba .pres-globo b:first-child{font-size:21px}.tuto-gesto small{font-size:16px}}
.tuto-gesto{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;z-index:2}
.tuto-gesto small{white-space:nowrap;font:700 14px "Helvetica Neue",Arial,sans-serif;color:#e8f3ee;background:rgba(3,16,12,.7);padding:5px 12px;border-radius:99px}
.teclas{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,46px);gap:7px}
.teclas .k{display:flex;align-items:center;justify-content:center;border-radius:11px;background:linear-gradient(#ffffff,#dfe7e3);color:#2c4a3f;font:800 18px "Helvetica Neue",Arial,sans-serif;
 box-shadow:inset 0 -3px 0 rgba(0,0,0,.08),0 4px 0 #8fa59b,0 8px 14px rgba(0,0,0,.35)}
.teclas .k-ar{grid-column:2;grid-row:1;background:linear-gradient(#fff6c2,#fcd100);color:#004230;animation:tecla 1.2s ease-in-out infinite}
.teclas .k-iz{grid-column:1;grid-row:2}.teclas .k-ab{grid-column:2;grid-row:2}.teclas .k-de{grid-column:3;grid-row:2}
@keyframes tecla{0%,45%,100%{transform:translateY(0);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08),0 4px 0 #b08e00,0 8px 14px rgba(0,0,0,.35),0 0 0 0 rgba(252,209,0,.6)}
 22%{transform:translateY(3px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.08),0 1px 0 #b08e00,0 3px 6px rgba(0,0,0,.3),0 0 0 10px rgba(252,209,0,0)}}
.dedo{position:relative;width:46px;height:120px}
.dedo svg{position:absolute;left:0;bottom:0;width:46px;height:60px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4));animation:dedo 1.5s cubic-bezier(.5,0,.3,1) infinite}
.dedo .estela{position:absolute;left:17px;width:12px;border-radius:99px;background:linear-gradient(rgba(252,209,0,0),rgba(252,209,0,.85));bottom:52px;height:0;animation:estela 1.5s cubic-bezier(.5,0,.3,1) infinite}
@keyframes dedo{0%{transform:translateY(0);opacity:0}12%{opacity:1}70%{transform:translateY(-58px);opacity:1}100%{transform:translateY(-58px);opacity:0}}
@keyframes estela{0%,12%{height:0;opacity:1;transform:translateY(0)}70%{height:58px;opacity:1;transform:translateY(-58px)}100%{height:58px;opacity:0;transform:translateY(-58px)}}
@media (prefers-reduced-motion:reduce){.teclas .k-ar,.dedo svg,.dedo .estela{animation:none}.dedo .estela{height:40px}}
.tuto-alba .pres-globo{font-size:15px;font-weight:600}
.tuto-alba .pres-txt b{display:inline;font:inherit;font-weight:800;color:#c24400;margin:0}   /* la negrita del texto, en línea (no como el nombre) */
.tuto-linea{background:rgba(3,16,12,.88);border-radius:12px;padding:8px 12px;font:600 15px/1.35 "Helvetica Neue",Arial,sans-serif;color:#fff}
.tt-cab{display:flex;align-items:center;justify-content:center;gap:8px;font:800 15px Aleo,Georgia,serif;color:#fff;margin-bottom:6px}
.tt-cab img{width:40px;height:40px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px #fff,0 0 0 4px #fcd100}
.velo>div.tuto-tarjeta{max-width:min(400px,calc(100% - 16px));text-align:left;font-weight:600;font-size:16.5px;line-height:1.4}
@media (min-width:700px){.velo>div.tuto-tarjeta{max-width:min(520px,calc(100% - 20px));font-size:19px}}   /* el texto que explica, más grande (José, 17-11-2026) */
.tuto-tarjeta>b{display:block;text-align:center}
.tuto-tarjeta .tl{display:block;margin:10px 0 0;padding-left:16px;position:relative}
.tuto-tarjeta .tes{display:grid;gap:4px;margin:6px 0 0 16px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.06)}
.tuto-tarjeta .tes>span{display:grid;grid-template-columns:5.2em 1fr;align-items:baseline}
.tuto-tarjeta .tes i{font-style:normal;color:#fcd100;letter-spacing:1px}
.tuto-tarjeta .tes.dos{grid-template-columns:1fr 1fr;column-gap:12px}

  };
  const svg = k => `<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24">${P[k]}</svg>`;
  const url = k => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg(k));
  const img = {}, lienzo = {};
  if (typeof Image !== 'undefined') for (const k in P) { const i = new Image(); i.decoding = 'async'; i.src = url(k); img[k] = i }
  /* clave del pictograma de una ficha: por su emoji; si no está, el genérico (los daños llevan tirita) */
  const clave = (emoji, dano) => DE[emoji] || (dano ? 'tirita' : 'alerta');
  /* dibuja el pictograma centrado en (x, y) con lado «tam» (px CSS). Devuelve false si la imagen aún no ha cargado. */
  function pinta(c, k, x, y, tam) {

/* ===== Partida oficial: común a todos los juegos (fase 2, 17-11-2026) =====
   Antes estaba copiado en cada plantilla; cada arreglo había que hacerlo siete veces. Los montar_*.py lo meten donde la
   plantilla tiene la marca de oficial (comun_montar.py). Cada juego define antes, o después, sus propios datos:
   JUEGO, INTENTOS, CLAVE_OF, CLAVE_MEJOR, CIERRES, DIAS, MESES y arrancaOficial(código, intento); y si quiere,
   OFI_ABAJO (por defecto «los niveles de abajo») y OFI_AVISO() (una frase más antes de «¿Empezamos?»). */

const ls={get:(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const RX_COD=/^(1HIG|1IFC|1ITE|1STI|[12]TEST)-\d{1,2}$/;   /* solo los grupos reales (16-11-2026: alguien jugó como 1HBD en vez de 1HIG y quedó fuera de su grupo) */

const normCod=c=>{const m=/^([12][A-Z]{2,5})-0*(\d{1,2})$/.exec(String(c||'').toUpperCase().replace(/\s+/g,''));return m&&RX_COD.test(m[1]+'-'+m[2])?m[1]+'-'+m[2]:''};
/* el código tal como se guarda y se envía: siempre con dos cifras (17-11-2026: 1HIG-7 y 1HIG-07 salían como dos códigos) */
const codOficial=c=>normCod(c)?normCod(c).replace(/-(\d)$/,'-0$1'):String(c||'').trim().toUpperCase().replace(/\s+/g,'');

/* Apertura y cierre de cada grupo (José, 18-11-2026: «apertura y cierre en todos los juegos»). Cada juego pone APERTURAS y
   CIERRES ({HIG:'2026-12-03T00:00:00',…}); sin apertura, la oficial está abierta; sin cierre, no caduca. Aquí solo se avisa

const fechasDe_=n=>{try{return (n==='a'?APERTURAS:CIERRES)||{}}catch(e){return {}}};   // un juego sin APERTURAS no se rompe

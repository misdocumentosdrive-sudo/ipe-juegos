<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Serpiente PRL · IPE I</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aleo:wght@600;800&display=swap" rel="stylesheet">
<style>

:root{--verde:#004230;--verde2:#0d6b4f;--naranja:#ff5900;--amarillo:#fcd100;--fondo:#f4f8f6;--texto:#1d2a30;--gris:#5b6b70;--ok:#1a8a4a;--mal:#d33a1f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--fondo);color:var(--texto);font:16px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:520px;min-height:100%;display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
h1,h2,.serif{font-family:Aleo,Georgia,serif}
.cab{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.marca{font:800 13px Aleo,Georgia,serif;color:var(--verde);letter-spacing:.3px}
.pill{background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.vidas{color:var(--mal);letter-spacing:2px}
.barra{height:8px;background:#dde7e2;border-radius:99px;overflow:hidden;margin:6px 0 14px}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--verde2),var(--verde));width:0;transition:width .3s}
.tiempo{height:5px;background:#eadfcf;border-radius:99px;overflow:hidden;margin:-8px 0 12px}
.tiempo i{display:block;height:100%;background:var(--naranja);width:100%}
.tarjeta{background:#fff;border-radius:22px;box-shadow:0 6px 20px rgba(0,66,48,.10);padding:18px;display:flex;flex-direction:column;align-items:center}
.senal{width:min(62vw,230px);height:min(62vw,230px);margin:6px 0 10px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 3px 4px rgba(0,0,0,.15))}
.senal img{max-width:100%;max-height:100%}
.op .mini img,.fila-sen img,.fallo img{width:100%;height:100%;object-fit:contain}
.confeti{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:cae linear forwards;z-index:9}
@keyframes cae{to{transform:translateY(105vh) rotate(720deg)}}
.preg{font:700 18px Aleo,Georgia,serif;color:var(--verde);text-align:center;margin:4px 0 2px}
.opciones{display:grid;gap:10px;margin-top:14px;width:100%}
.opciones.tipos{grid-template-columns:1fr}
.op{border:0;border-radius:14px;padding:14px 14px;font:600 16px "Helvetica Neue",Arial,sans-serif;background:#eef4f1;color:var(--texto);text-align:left;display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .08s,background .2s}
.op:active{transform:scale(.98)}
.op .mini{width:30px;height:30px;flex:none}
.op:disabled{cursor:default;opacity:1;color:var(--texto)}
.op.ok,.op.ok:disabled{background:var(--ok);color:#fff}
.op.mal,.op.mal:disabled{background:var(--mal);color:#fff}
.explica{margin-top:14px;width:100%;border-radius:14px;padding:12px 14px;font-size:15px;display:none}
.explica.ok{display:block;background:#e3f4ea;color:#0b5a2f}
.explica.mal{display:block;background:#fde8e3;color:#8c2512}
.explica b{display:block;font:800 16px Aleo,Georgia,serif;margin-bottom:2px}
.sig{margin-top:12px;width:100%;border:0;border-radius:14px;padding:14px;font:800 17px Aleo,Georgia,serif;background:var(--verde);color:#fff;cursor:pointer;display:none}
.puntos-flota{position:fixed;left:50%;top:38%;transform:translate(-50%,0);font:800 34px Aleo,Georgia,serif;color:var(--ok);pointer-events:none;animation:sube .9s ease-out forwards}
@keyframes sube{to{transform:translate(-50%,-70px);opacity:0}}
.sacude{animation:sacude .35s}
@keyframes sacude{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
/* portada */
.portada{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px}
.portada h1{font-size:32px;color:var(--verde);margin:0;line-height:1.1}
.portada p{color:var(--gris);margin:0}
.fila-sen{display:flex;justify-content:center;gap:8px;margin:6px 0}
.fila-sen img{width:52px;height:52px}
.nivel{border:0;border-radius:18px;padding:16px;text-align:left;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.07);cursor:pointer;display:flex;gap:14px;align-items:center}
.nivel .n{flex:none;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 20px Aleo,Georgia,serif;color:#fff}
.nivel b{display:block;font:800 17px Aleo,Georgia,serif;color:var(--verde)}
.nivel span{font-size:14px;color:var(--gris)}
.record{font-size:13px;color:var(--gris)}
/* final */
.final{text-align:center}
.final .gran{font:800 56px Aleo,Georgia,serif;color:var(--verde);margin:4px 0}
.estrellas{font-size:34px;letter-spacing:4px;color:var(--amarillo);text-shadow:0 1px 0 #c9a400}
.fallos{text-align:left;margin-top:16px}
.fallo{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:10px;margin-bottom:8px}
.fallo img{width:54px;height:54px;flex:none}
.fallo b{display:block;color:var(--verde)}
.fallo small{color:var(--gris)}
.btns{display:grid;gap:10px;margin-top:16px}
.btn{border:0;border-radius:14px;padding:14px;font:800 17px Aleo,Georgia,serif;cursor:pointer}
.btn.p{background:var(--verde);color:#fff}
.btn.s{background:#e3ece8;color:var(--verde)}
.pie{text-align:center;font-size:12px;color:var(--gris);margin-top:auto;padding-top:14px}
.oficial{background:#fff;border:2px solid var(--verde);border-radius:16px;padding:14px;margin:14px 0;text-align:left;display:grid;gap:8px}
.oficial label span,.oficial small{font-size:13px;opacity:.75}
.oficial input{font:700 20px/1.2 inherit;letter-spacing:2px;text-transform:uppercase;padding:10px 12px;border:2px solid #cfd8d3;border-radius:10px;width:100%;box-sizing:border-box}
.oficial input.error{border-color:#c0392b;background:#fdecea}
.oficial .btn[disabled]{opacity:.5}
.entreno{color:var(--verde);font-size:18px;margin:6px 0 4px;text-align:left}
.aviso-of{background:#fff8d6;border:2px solid #fcd100;border-radius:14px;padding:12px;margin:14px 0;line-height:1.5}
.situ{font-size:17px;line-height:1.45;text-align:center;margin:8px 4px 4px;color:var(--texto)}
.opciones.imgs{grid-template-columns:1fr 1fr}
.opciones.imgs .op{justify-content:center;padding:12px;aspect-ratio:1}
.opciones.imgs .op img{width:100%;height:100%;object-fit:contain}
#envio{margin-top:8px;font-weight:700;color:var(--verde)}

/* ===== propio de «Serpiente PRL» ===== */
.heroe{position:relative;border-radius:24px;padding:22px 18px 18px;text-align:left;color:#fff;overflow:hidden;
 background:radial-gradient(circle at 85% 10%,rgba(252,209,0,.28),transparent 45%),linear-gradient(160deg,#0b5a40,#062a1f 70%);box-shadow:0 14px 30px rgba(0,66,48,.35)}
.heroe .hm{font:700 12px "Helvetica Neue",Arial;letter-spacing:.14em;text-transform:uppercase;color:#a8e6cc}
.heroe h1{color:#fff;font-size:40px;line-height:1;margin:8px 0 4px}
.heroe h1 span{color:#fcd100}
.heroe p{color:#d8efe6;font-size:14.5px;line-height:1.45;margin:6px 0 10px}
.heroe canvas{width:100%;height:70px;display:block;margin:4px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font:700 12px "Helvetica Neue",Arial;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 10px}
.nivel .ico{font-size:26px;flex:none}
.nivel{transition:transform .12s,box-shadow .12s}.nivel:active{transform:scale(.98)}

.juego{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#123a2e 0%,#05150f 75%);color:#fff;display:flex;flex-direction:column;align-items:center;
 touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;z-index:5}
.juego .arriba{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;padding:12px 14px 0;gap:8px}
.juego .pill{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;font-variant-numeric:tabular-nums}
.juego .crono{font:800 22px Aleo,Georgia,serif;letter-spacing:1px;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(125,255,181,.4)}
.juego .crono.poco{color:#ff8a5c;animation:late .6s infinite}
@keyframes late{50%{transform:scale(1.08)}}
.meta{width:calc(100% - 28px);max-width:492px;height:7px;border-radius:99px;background:rgba(255,255,255,.1);margin-top:8px;overflow:hidden}
.meta i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2fd47a,#fcd100);transition:width .3s}
.consigna{width:calc(100% - 28px);max-width:492px;margin-top:8px;border-radius:14px;padding:8px 12px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.35);
 transition:background .3s}
.consigna small{display:block;font:700 11.5px "Helvetica Neue",Arial;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.consigna b{display:block;font:800 21px/1.15 Aleo,Georgia,serif}
.consigna.nueva{animation:nueva .5s}
@keyframes nueva{30%{transform:scale(1.06);filter:brightness(1.3)}}
.tablero{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding:8px 10px 0;position:relative}
.tablero canvas{display:block;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.5),inset 0 0 0 2px rgba(125,255,181,.25)}
.velo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.velo div{background:rgba(3,16,12,.82);border:1px solid rgba(125,255,181,.3);border-radius:16px;padding:14px 18px;text-align:center;font:700 16px/1.4 "Helvetica Neue",Arial;max-width:300px}
.velo b{display:block;font:800 22px Aleo,Georgia,serif;color:#fcd100;margin-bottom:4px}
.mando{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,50px);gap:6px;justify-content:center;padding:8px 0 calc(10px + env(safe-area-inset-bottom))}
.mando button{border:0;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-size:22px;cursor:pointer;touch-action:none}
.mando button:active{background:rgba(252,209,0,.45)}
.mando .ar{grid-column:2;grid-row:1}.mando .iz{grid-column:1;grid-row:2}.mando .ab{grid-column:2;grid-row:2}.mando .de{grid-column:3;grid-row:2}
.destello{position:fixed;inset:0;pointer-events:none;z-index:6;animation:destello .25s ease-out forwards}
@keyframes destello{from{opacity:.18}to{opacity:0}}
.juego .puntos-flota{z-index:9}
/* Tablets y ordenadores (José, 9-11-2026): el tablero crece con la pantalla y, con ratón, sin botones en pantalla */
@media (min-width:700px){
 .juego .arriba{max-width:none;padding:16px 24px 0}
 .meta,.consigna{max-width:none;width:calc(100% - 48px)}
 .juego .pill{font-size:17px;padding:8px 16px}
 .juego .crono{font-size:28px}
 .consigna{padding:10px 16px;min-height:66px}   /* alto fijo: el tablero se mide antes de escribir la consigna */
 .consigna small{font-size:13px}
 .consigna b{font-size:26px}
 .velo div{max-width:420px;font-size:19px;padding:20px 26px}
 .velo b{font-size:28px}
 .mando{grid-template-columns:repeat(3,76px);grid-template-rows:repeat(2,58px)}
}
@media (hover:hover) and (pointer:fine){
 .mando{display:none}
 .tablero{padding-bottom:16px}
}
</style>
</head>

  if(st.snake.some(p=>p.x===x&&p.y===y))continue;
  if(Math.abs(x-h.x)+Math.abs(y-h.y)<4)continue;
  if(st.fichas.some(f=>Math.abs(f.x-x)<4&&Math.abs(f.y-y)<3))continue;
  if(x===0||x===COLS-1||y===st.rows-1)if(n<200)continue;
  return {x,y};
 }
 return null;
}

/* ===== Bucle ===== */
function bucle(now){
 if(st.empezado&&!st.pausa&&now-st.tPaso>=st.vel){st.tPaso=now;paso();}
 dibuja(now);
 if(!st.fin)st.raf=requestAnimationFrame(bucle);
}
function paso(){
 if(st.cola.length)st.dir=st.cola.shift();
 const h=st.snake[0],n={x:h.x+st.dir.x,y:h.y+st.dir.y};
 st.prev=st.snake.map(p=>({...p}));
 const cuerpo=st.crece>0?st.snake:st.snake.slice(0,-1);
 if(n.x<0||n.y<0||n.x>=COLS||n.y>=st.rows||cuerpo.some(p=>p.x===n.x&&p.y===n.y))return choque();
 st.snake.unshift(n);
 if(st.crece>0)st.crece--;else st.snake.pop();
 const k=st.fichas.findIndex(f=>f.x===n.x&&f.y===n.y);
 if(k>=0)come(st.fichas[k]);
}
function come(f){
 const l=st.l;
 st.fichas=[];
 if(f.ok){
  st.aciertos++;st.racha++;
  const g=Math.round(100*(1+Math.min(st.racha-1,4)*.25));
  st.pts+=g;flotaEn(f,'+'+g,'#7dffb5');chispas(f,'#7dffb5');ñam(st.racha);
  st.crece+=1;st.vel=Math.max(l.vel[1],st.vel-7);
  if(l.modo==='grupo')st.usados.add(f.t);
  $('#me').style.width=Math.min(100,st.aciertos/META*100)+'%';
  if(st.aciertos>=META)return termina();
  if(++st.enObj>=l.cambio)nuevoObjetivo();else ponFichas();
 }else{
  st.racha=0;st.vidas--;
  const r=Math.min(RESTA,st.pts);st.pts-=r;
  flotaEn(f,r?'−'+r:'✗','#ff6b4a');chispas(f,'#ff6b4a');fallo();sacude();destello('#d33a1f');
  st.fallos.push({f,obj:st.obj});
  const quita=Math.min(2,st.snake.length-3);if(quita>0){st.snake.splice(-quita);st.prev.splice(-quita)}
  if(st.vidas<=0)return termina();
  ponFichas();
 }
 pintaMarcador();
}
function choque(){
 st.racha=0;st.vidas--;fallo();sacude();destello('#d33a1f');
 st.choques=(st.choques||0)+1;
 pintaMarcador();
 if(st.vidas<=0)return termina();
 st.pausa=true;const tp=Date.now();
 $('#velo').innerHTML='<div><b>¡Choque!</b>Pierdes una vida. Sigues en un momento…</div>';
 st.tReanuda=setTimeout(()=>{
  const c=Math.floor(st.rows/2),largo=Math.max(4,Math.min(st.snake.length,7));
  st.snake=Array.from({length:largo},(_,i)=>({x:largo-i,y:c}));
  st.prev=st.snake.map(p=>({...p}));st.dir={x:1,y:0};st.cola=[];
  st.fichas=[];ponFichas();
  $('#velo').innerHTML='';st.pausado=(st.pausado||0)+(Date.now()-tp);st.pausa=false;st.tPaso=performance.now();
 },1100);
}
function pintaMarcador(){
 const p=$('#pts');if(p)p.textContent=st.pts+' pts';
 const v=$('#vi');if(v)v.textContent='♥'.repeat(Math.max(0,st.vidas))+'♡'.repeat(3-Math.max(0,st.vidas));
}
function sacude(){const c=$('#cv');if(!c)return;c.classList.remove('sacude');void c.offsetWidth;c.classList.add('sacude')}
function destello(col){const d=document.createElement('div');d.className='destello';d.style.background=col;document.body.appendChild(d);setTimeout(()=>d.remove(),260)}
function aPantalla(f){const r=$('#cv').getBoundingClientRect();return {x:r.left+(f.x+.5)*st.cel,y:r.top+(f.y+.5)*st.cel}}
function flotaEn(f,txt,col){const p=aPantalla(f),d=document.createElement('div');d.className='puntos-flota';d.style.cssText=`left:${p.x}px;top:${p.y-20}px;color:${col};font-size:26px;z-index:9`;d.textContent=txt;document.body.appendChild(d);setTimeout(()=>d.remove(),900)}
function chispas(f,col){st.chispas=(st.chispas||[]).concat(Array.from({length:14},()=>({x:(f.x+.5)*st.cel,y:(f.y+.5)*st.cel,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,v:1,col})))}

/* ===== Dibujo ===== */
function colorCuerpo(i,n){const t=n>1?i/(n-1):0;const a=[252,209,0],b=[47,180,110];return `rgb(${a.map((v,k)=>Math.round(v+(b[k]-v)*t)).join(',')})`}
function ojos(c,p,d,r){
 const px=-d.y,py=d.x;
 [[1],[-1]].forEach(([s])=>{const ex=p.x+d.x*r*.35+px*r*.42*s,ey=p.y+d.y*r*.35+py*r*.42*s;
  c.fillStyle='#fff';c.beginPath();c.arc(ex,ey,r*.28,0,7);c.fill();c.fillStyle='#10241c';c.beginPath();c.arc(ex+d.x*r*.1,ey+d.y*r*.1,r*.14,0,7);c.fill()});
}
function etiqueta(c,txt,cx,cy,arriba){
 const s=st.cel,fs=Math.max(10,Math.round(s*.36)),maxW=s*4.2;
 c.font=`700 ${fs}px "Helvetica Neue",Arial,sans-serif`;
 const pal=txt.split(' '),lin=[];let a='';
 for(const w of pal){const p=a?a+' '+w:w;if(c.measureText(p).width>maxW&&a){lin.push(a);a=w}else a=p}lin.push(a);
 const w=Math.max(...lin.map(x=>c.measureText(x).width))+10,h=lin.length*(fs+2)+6;
 let x=Math.max(2,Math.min(st.W-w-2,cx-w/2)),y=arriba?cy-s*.62-h:cy+s*.62;
 if(y<2)y=cy+s*.62;if(y+h>st.H-2)y=cy-s*.62-h;
 c.fillStyle='rgba(3,16,12,.82)';c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=1;
 c.beginPath();c.roundRect?c.roundRect(x,y,w,h,7):c.rect(x,y,w,h);c.fill();c.stroke();
 c.fillStyle='#fff';c.textAlign='center';c.textBaseline='top';
 lin.forEach((t,i)=>c.fillText(t,x+w/2,y+4+i*(fs+2)));
}
function dibuja(now){
 const c=st.ctx,s=st.cel;if(!c)return;
 c.clearRect(0,0,st.W,st.H);
 c.fillStyle='#0b231b';c.fillRect(0,0,st.W,st.H);
 for(let y=0;y<st.rows;y++)for(let x=0;x<COLS;x++)if((x+y)%2){c.fillStyle='rgba(255,255,255,.025)';c.fillRect(x*s,y*s,s,s)}
 // fichas
 st.fichas.forEach(f=>{
  const cx=(f.x+.5)*s,cy=(f.y+.5)*s,k=Math.min(1,(now-f.nace)/250),pul=1+Math.sin(now/260+f.x)*.05;
  c.save();c.translate(cx,cy);c.scale(k*pul,k*pul);
  c.fillStyle='rgba(255,255,255,.95)';c.shadowColor='rgba(252,209,0,.55)';c.shadowBlur=12;
  c.beginPath();c.arc(0,0,s*.47,0,7);c.fill();c.shadowBlur=0;
  c.font=`${Math.round(s*.6)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(f.i,0,s*.04);
  c.restore();
 });
 // serpiente (posiciones suavizadas entre paso y paso)
 const fr=st.pausa||!st.empezado?1:Math.min(1,(now-st.tPaso)/st.vel);
 const pos=st.snake.map((p,i)=>{const o=st.prev[i]||p;return {x:(o.x+(p.x-o.x)*fr+.5)*s,y:(o.y+(p.y-o.y)*fr+.5)*s}});
 const n=pos.length;
 for(let i=n-1;i>=0;i--){
  const p=pos[i],r=i?s*.4*(1-i/n*.3):s*.48;
  if(i<n-1){const q=pos[i+1];c.fillStyle=colorCuerpo(i,n);c.beginPath();c.arc((p.x+q.x)/2,(p.y+q.y)/2,r*.95,0,7);c.fill()}
  c.fillStyle=colorCuerpo(i,n);c.beginPath();c.arc(p.x,p.y,r,0,7);c.fill();
  if(i%2===0&&i){c.fillStyle='rgba(0,0,0,.12)';c.beginPath();c.arc(p.x,p.y,r*.45,0,7);c.fill()}
 }
 if(n){ojos(c,pos[0],st.dir,s*.48);}
 // etiquetas encima de todo
 st.fichas.forEach(f=>{if(now-f.nace>120)etiqueta(c,f.t,(f.x+.5)*s,(f.y+.5)*s,f.y>1)});
 // chispas
 if(st.chispas&&st.chispas.length){st.chispas.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.v-=.035;c.globalAlpha=Math.max(0,p.v);c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,3,0,7);c.fill()});c.globalAlpha=1;st.chispas=st.chispas.filter(p=>p.v>0)}
}

/* ===== Final de cada nivel y partida oficial ===== */
function termina(){
 if(st.fin)return;st.fin=true;st.pausa=true;
 clearInterval(st.reloj);clearTimeout(st.tReanuda);document.onkeydown=null;
 const meta=st.aciertos>=META;
 if(meta){const b=st.t*5;st.pts+=b;st.bonus=b}
 st.est=meta&&st.vidas>=2?3:st.aciertos>=8?2:st.aciertos>=4?1:0;
 st.resumen=`${st.aciertos} de ${META} fichas buenas${st.vidas<=0?' · sin vidas':st.t<=0&&!meta?' · se acabó el tiempo':''}`;
 if(meta)fanfarria();
 setTimeout(final,meta?700:900);
}
function repaso(){
 const vistos=new Set(),out=[];
 for(const {f,obj} of st.fallos){
  if(vistos.has(f.t))continue;vistos.add(f.t);
  if(st.l.modo==='grupo'){const G=GRUPOS[f.g];out.push({b:`«${f.t}» → ${G.t}`,e:`${f.nota?f.nota+" ":""}${G.e} Te pedían: ${GRUPOS[obj].t}.`})}
  else{const o=out.find(x=>x.f===obj.f),txt=`«${f.t}» suele venir de «${f.par.f}».`;
   if(o)o.e+=' '+txt;else out.push({f:obj.f,b:`${obj.f} → ${obj.d}`,e:`No era: ${txt}`})}
 }
 return out;
}
function final(){
 cancelAnimationFrame(st.raf||0);
 const l=st.l,est=st.est;
 const antes=rec(l.n);guarda(l.n,st.pts);
 const rep=repaso();
 if(est===3)for(let n=0;n<70;n++){const c=document.createElement('i');c.className='confeti';c.style.left=Math.random()*100+'vw';c.style.background=['#004230','#ff5900','#fcd100','#2f8a5b'][n%4];c.style.animationDuration=(1.6+Math.random()*1.6)+'s';c.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4000)}
 app.innerHTML=`<div class="final">
  <div class="marca">Nivel ${l.n} · ${l.titulo}</div>
  <div class="estrellas">${'★'.repeat(est)}${'☆'.repeat(3-est)}</div>
  <div class="gran">${st.pts}</div><div>puntos · ${st.resumen}${st.bonus?` · +${st.bonus} por el tiempo que te sobró`:''}</div>
  <p style="color:var(--gris);font-size:14px;margin:8px 0 0">3 estrellas: las ${META} fichas sin perder más de una vida · 2: al menos 8 · 1: al menos 4</p>
  ${st.pts>antes?'<p style="color:var(--ok);font-weight:700">¡Nuevo récord!</p>':''}
  ${rep.length?`<div class="fallos"><h2 class="serif" style="color:var(--verde);font-size:19px;margin:8px 0">Repasa</h2>${rep.map(s=>`<div class="fallo"><div><b>${s.b}</b><small>${s.e}</small></div></div>`).join('')}</div>`:''}
  ${st.oficial?bloqueOficial(est):''}
  <div class="btns" ${st.oficial?'style="display:none"':''}><button class="btn p" id="otra">Jugar otra vez</button>${l.n<ULT?`<button class="btn s" id="sigui">Siguiente nivel</button>`:''}<button class="btn s" id="menu">Volver al menú</button></div>
 </div>`;
 window.scrollTo(0,0);
 if(st.oficial)return finOficial();
 $('#otra').onclick=()=>empieza(l.n);
 $('#menu').onclick=portada;
 if($('#sigui'))$('#sigui').onclick=()=>empieza(l.n+1);
}
function bloqueOficial(est){
 const o=st.oficial;o.est[st.l.n-1]=est;o.pts+=st.pts;
 if(st.l.n<ULT)return `<div class="aviso-of">Partida oficial · intento ${o.intento} de ${INTENTOS}</div><div class="btns"><button class="btn p" id="ofsig">Seguir al nivel ${st.l.n+1}</button></div>`;
 const m=Math.min(...o.est);
 return `<div class="aviso-of"><b>Partida oficial terminada</b><br>Estrellas: ${o.est.map((e,i)=>'N'+(i+1)+' '+'★'.repeat(e)+'☆'.repeat(3-e)).join(' · ')}<br>Subida de nota: <b>+${extraDe(m)}</b> en el criterio de factores de riesgo y daños (cuenta tu mejor intento)<div id="envio">Enviando resultado…</div></div><div class="aviso-of" id="puesto">Consultando tu puesto en la clasificación…</div><div class="btns"><button class="btn p" id="ofmenu">Volver al menú</button></div>`;
}
function finOficial(){
 const o=st.oficial;
 if(st.l.n<ULT){$('#ofsig').onclick=()=>empieza(st.l.n+1,o);return}
 $('#ofmenu').onclick=portada;
 const m=Math.min(...o.est);
 const antes=+ls.get(PREF+'_mejor',0), mejor=Math.max(antes,o.pts);ls.set(PREF+'_mejor',mejor);
 if(!antes)ls.set(PREF+'_primer_envio',Date.now());
 puesto(o.codigo,mejor,recien()).then(r=>{const d=$('#puesto');if(d)d.innerHTML=textoPuesto(r,mejor)});
 envia({codigo:o.codigo,intento:o.intento,est:o.est,puntos:o.pts,extra:extraDe(m)}).then(ok=>{
  $('#envio').textContent=ok?'✔ Resultado enviado a tu profesor.':'No se ha podido enviar. Haz una captura de esta pantalla y enséñasela a tu profesor.';
 });
}
window.addEventListener('resize',()=>{if(st.ctx&&!st.fin&&$('#cv'))medir(true)});
portada();
</script>
<style>
#pcomp{position:fixed;right:14px;bottom:14px;z-index:20;border:0;border-radius:999px;padding:10px 16px;font:700 14px "Helvetica Neue",Arial,sans-serif;
 background:rgba(0,66,48,.88);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;display:none}
</style>
<button id="pcomp" type="button">⛶ Pantalla completa</button>
<script>
/* Tablets y ordenadores (José, 9-11-2026): cada pantalla se escala para llenar la pantalla, como en el móvil,
   y un botón pone el navegador a pantalla completa. En el móvil no cambia nada. */
(function(){
 const app=document.getElementById('app'),btn=document.getElementById('pcomp');
 let midiendo=false;
 function ajusta(){
  if(midiendo)return;midiendo=true;
  const fija=app.querySelector('.rcp,.juego');           // pantallas de juego a pantalla completa: sin escalar
  btn.style.visibility=fija?'hidden':'';                 // el botón no tapa el tablero mientras se juega
  if(innerWidth<700||fija){app.style.zoom='';app.style.minHeight='';midiendo=false;return}
  app.style.zoom='1';app.style.minHeight='0';
  const t=app.getBoundingClientRect().top,h=Math.max(...[...app.children].map(c=>c.getBoundingClientRect().bottom))-t+16,w=540;
  const z=Math.max(1,Math.min(innerWidth/w,(innerHeight-8)/h,2.4));
  app.style.zoom=z.toFixed(3);
  midiendo=false;
 }
 new MutationObserver(()=>requestAnimationFrame(ajusta)).observe(app,{childList:true,subtree:true});
 addEventListener('resize',ajusta);ajusta();
 const fs=document.documentElement;
 function boton(){
  const puede=(document.fullscreenEnabled||document.webkitFullscreenEnabled)&&innerWidth>=700;
  btn.style.display=puede&&!(document.fullscreenElement||document.webkitFullscreenElement)?'block':'none';
 }
 btn.onclick=()=>{(fs.requestFullscreen||fs.webkitRequestFullscreen).call(fs)};
 document.addEventListener('fullscreenchange',()=>{boton();setTimeout(ajusta,150)});
 document.addEventListener('webkitfullscreenchange',()=>{boton();setTimeout(ajusta,150)});
 addEventListener('resize',boton);boton();
})();
</script>

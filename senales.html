<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Detective de señales · IPE I</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aleo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--verde:#004230;--verde2:#0d6b4f;--naranja:#ff5900;--amarillo:#fcd100;--fondo:#f4f8f6;--texto:#1d2a30;--gris:#5b6b70;--ok:#1a8a4a;--mal:#d33a1f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--fondo);color:var(--texto);font:16px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:520px;min-height:100%;display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
h1,h2,.serif{font-family:Aleo,Georgia,serif}
.cab{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.marca{font:800 13px Aleo,Georgia,serif;color:var(--verde);letter-spacing:.3px}
.pill{background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.vidas{color:var(--mal);letter-spacing:2px}
.barra{height:8px;background:#dde7e2;border-radius:99px;overflow:hidden;margin:6px 0 14px}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--verde2),var(--verde));width:0;transition:width .3s}
.tiempo{height:5px;background:#eadfcf;border-radius:99px;overflow:hidden;margin:-8px 0 12px}
.tiempo i{display:block;height:100%;background:var(--naranja);width:100%}
.tarjeta{background:#fff;border-radius:22px;box-shadow:0 6px 20px rgba(0,66,48,.10);padding:18px;display:flex;flex-direction:column;align-items:center}
.senal{width:min(62vw,230px);height:min(62vw,230px);margin:6px 0 10px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 3px 4px rgba(0,0,0,.15))}
.senal img{max-width:100%;max-height:100%}
.op .mini img,.fila-sen img,.fallo img{width:100%;height:100%;object-fit:contain}
.confeti{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:cae linear forwards;z-index:9}
@keyframes cae{to{transform:translateY(105vh) rotate(720deg)}}
.preg{font:700 18px Aleo,Georgia,serif;color:var(--verde);text-align:center;margin:4px 0 2px}
.opciones{display:grid;gap:10px;margin-top:14px;width:100%}
.opciones.tipos{grid-template-columns:1fr}
.op{border:0;border-radius:14px;padding:14px 14px;font:600 16px "Helvetica Neue",Arial,sans-serif;background:#eef4f1;color:var(--texto);text-align:left;display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .08s,background .2s}
.op:active{transform:scale(.98)}
.op .mini{width:30px;height:30px;flex:none}
.op:disabled{cursor:default;opacity:1;color:var(--texto)}
.op.ok,.op.ok:disabled{background:var(--ok);color:#fff}
.op.mal,.op.mal:disabled{background:var(--mal);color:#fff}
.explica{margin-top:14px;width:100%;border-radius:14px;padding:12px 14px;font-size:15px;display:none}
.explica.ok{display:block;background:#e3f4ea;color:#0b5a2f}
.explica.mal{display:block;background:#fde8e3;color:#8c2512}
.explica b{display:block;font:800 16px Aleo,Georgia,serif;margin-bottom:2px}
.sig{margin-top:12px;width:100%;border:0;border-radius:14px;padding:14px;font:800 17px Aleo,Georgia,serif;background:var(--verde);color:#fff;cursor:pointer;display:none}
.puntos-flota{position:fixed;left:50%;top:38%;transform:translate(-50%,0);font:800 34px Aleo,Georgia,serif;color:var(--ok);pointer-events:none;animation:sube .9s ease-out forwards}
@keyframes sube{to{transform:translate(-50%,-70px);opacity:0}}
.sacude{animation:sacude .35s}
@keyframes sacude{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
/* portada */
.portada{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px}
.portada h1{font-size:32px;color:var(--verde);margin:0;line-height:1.1}
.portada p{color:var(--gris);margin:0}
.fila-sen{display:flex;justify-content:center;gap:8px;margin:6px 0}
.fila-sen img{width:52px;height:52px}
.nivel{border:0;border-radius:18px;padding:16px;text-align:left;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.07);cursor:pointer;display:flex;gap:14px;align-items:center}
.nivel .n{flex:none;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 20px Aleo,Georgia,serif;color:#fff}
.nivel b{display:block;font:800 17px Aleo,Georgia,serif;color:var(--verde)}
.nivel span{font-size:14px;color:var(--gris)}
.record{font-size:13px;color:var(--gris)}
/* final */
.final{text-align:center}
.final .gran{font:800 56px Aleo,Georgia,serif;color:var(--verde);margin:4px 0}
.estrellas{font-size:34px;letter-spacing:4px;color:var(--amarillo);text-shadow:0 1px 0 #c9a400}
.fallos{text-align:left;margin-top:16px}
.fallo{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:10px;margin-bottom:8px}
.fallo img{width:54px;height:54px;flex:none}
.fallo b{display:block;color:var(--verde)}
.fallo small{color:var(--gris)}
.btns{display:grid;gap:10px;margin-top:16px}
.btn{border:0;border-radius:14px;padding:14px;font:800 17px Aleo,Georgia,serif;cursor:pointer}
.btn.p{background:var(--verde);color:#fff}
.btn.s{background:#e3ece8;color:var(--verde)}
.pie{text-align:center;font-size:12px;color:var(--gris);margin-top:auto;padding-top:14px}
.oficial{background:#fff;border:2px solid var(--verde);border-radius:16px;padding:14px;margin:14px 0;text-align:left;display:grid;gap:8px}
.oficial label span,.oficial small{font-size:13px;opacity:.75}
.oficial input{font:700 20px/1.2 inherit;letter-spacing:2px;text-transform:uppercase;padding:10px 12px;border:2px solid #cfd8d3;border-radius:10px;width:100%;box-sizing:border-box}
.oficial input.error{border-color:#c0392b;background:#fdecea}
.oficial .btn[disabled]{opacity:.5}
.entreno{color:var(--verde);font-size:18px;margin:6px 0 4px;text-align:left}
.aviso-of{background:#fff8d6;border:2px solid #fcd100;border-radius:14px;padding:12px;margin:14px 0;line-height:1.5}
.situ{font-size:17px;line-height:1.45;text-align:center;margin:8px 4px 4px;color:var(--texto)}
.opciones.imgs{grid-template-columns:1fr 1fr}
.opciones.imgs .op{justify-content:center;padding:12px;aspect-ratio:1}
.opciones.imgs .op img{width:100%;height:100%;object-fit:contain}
#envio{margin-top:8px;font-weight:700;color:var(--verde)}

/* Tablets y ordenadores (José, 9-11-2026): en pantallas grandes, todo más grande (en el móvil, igual que antes) */
</style>

const RANKING='https://docs.google.com/spreadsheets/d/e/2PACX-1vR2cIxoYCpfiDMB0VZ3aItkmhC94xzF-Yue0JJ-DKumX5zx5oHSCCVF2esZ5qoJUclpaxrSheyDKHSu/pub?gid=1235634482&single=true&output=csv';

const grupoDe=c=>(/^[12]([A-Z]{2,5})-/.exec(c||'')||[])[1]||'';

const CIERRES={HIG:'2026-11-20T23:59:59',IFC:'2026-11-20T23:59:59',ITE:'2026-11-20T23:59:59',STI:'2026-11-20T23:59:59'};

function plazo(c){const l=CIERRES[grupoDe(c)];return l?new Date(l):null}
function textoPlazo(c){const f=plazo(c);if(!f)return '';
 const fecha=`el ${DIAS[f.getDay()]} ${f.getDate()} de ${MESES[f.getMonth()]} a las ${String(f.getHours()).padStart(2,'0')}:${String(f.getMinutes()).padStart(2,'0')}`;
 return new Date()>f?`⏰ El plazo de tu grupo terminó ${fecha}. Puedes seguir entrenando, pero la partida oficial ya no cuenta para nota.`:`⏰ Plazo de tu grupo: hasta ${fecha}.`}
const $cod0=()=>(ls.get('ipe_codigo',ls.get('senales_codigo',''))||'').toUpperCase();
async function puesto(codigo,pts,nuevo){
 try{
  const txt=await fetch(RANKING+'&t='+Date.now()).then(r=>r.text());
  const g=grupoDe(codigo);
  const lista=txt.split(/\r?\n/).slice(1).map(l=>l.split(',')).filter(f=>f[0]===g&&(!f[2]||f[2].trim()===JUEGO)).map(f=>+f[1]||0);
  const pos=1+lista.filter(x=>x>pts).length, total=Math.max(lista.length+(nuevo?1:0),pos);
  return {pos,total};
 }catch(e){return null}
}

 if(!r)return 'No se ha podido consultar la clasificación. Inténtalo más tarde desde el menú.';

 return `🏆 Vas <b>${r.pos}.º de ${r.total}</b> en tu grupo con tu mejor partida (${pts} puntos).${podio}<br><small>Clasificación provisional: se actualiza cada pocos minutos.</small>`;
}

/* Resultados sin conexión (José, 9-11-2026): si no hay red, el resultado se guarda en el dispositivo y se envía solo

const COLA='cola_envios_'+JUEGO;
function manda(txt){const f=new URLSearchParams();f.append(FORM.campo,txt);return fetch(FORM.url,{method:'POST',mode:'no-cors',body:f}).then(()=>true).catch(()=>false)}
function enCola(){try{return JSON.parse(localStorage.getItem(COLA)||'[]')}catch(e){return[]}}
function guardaCola(c){try{localStorage.setItem(COLA,JSON.stringify(c))}catch(e){}}
async function vaciaCola(){
 const c=enCola();if(!c.length||!FORM.url)return;

}

 const l=[...new Set((d.fallos||[]).map(x=>String(x).replace(/[|\n\r]/g,' ').replace(/\s+/g,' ').trim().slice(0,60)).filter(Boolean))].slice(0,25);
 return l.length?' | fallos: '+l.join('; '):'';
}
const ahora=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`};

 if(!FORM.url)return Promise.resolve(false);
 const txt=`${JUEGO} | ${d.codigo} | intento ${d.intento} | jugada ${ahora()} | N1 ${d.n1} | N2 ${d.n2} | N3 ${d.n3}${fallosTxt(d)} | ${d.puntos} pts | +${d.extra}`;
 return manda(txt).then(ok=>{if(!ok){const c=enCola();c.push(txt);guardaCola(c)}return ok});
}
let st={};

const guarda=(n,p)=>{try{if(p>rec(n))localStorage.setItem('senales_record_'+n,p)}catch(e){}};

 app.querySelectorAll('.nivel').forEach(b=>b.onclick=()=>empieza(+b.dataset.n));

  if(!confirm('Vas a gastar el intento '+(usados()+1)+' de '+INTENTOS+' con el código '+c+'.\n\nOjo: solo valen tus 3 primeras partidas oficiales en total, aunque juegues en otro dispositivo o sin internet. ¿Empezamos?'))return;

function empieza(n,oficial){
 const l=NIVELES[n-1];
 let lista=baraja(SEN);
 while(lista.length<l.preg)lista=lista.concat(baraja(SEN));
 lista=lista.slice(0,l.preg);
 if(l.modo==='tipo'){const k=new Set(baraja([...lista.keys()]).slice(0,TRAMPAS));lista=lista.map((s,i)=>k.has(i)?{...s,trampa:true}:s)}
 if(l.modo==='sit')lista=situaciones().map(([texto,cod,excl])=>({...SEN.find(s=>s.cod===cod),texto,excl}));
 st={l,lista,i:0,pts:0,racha:0,vidas:3,aciertos:0,fallos:[],oficial:oficial||null};
 pregunta();
}

function pregunta(){
 clearInterval(st.reloj);
 if(st.i>=st.lista.length||st.vidas<=0)return final();
 const s=st.lista[st.i], modo=st.l.modo;
 let ops;
 if(modo==='tipo') ops=Object.keys(TIPOS).map(k=>({k,txt:TIPOS[k].n})).concat([{k:'trampa',txt:'Señal mal hecha: no existe'}]);
 else if(modo==='sig'){
  /* señales que se parecen tanto que las dos respuestas valdrían: nunca juntas (revisión 6-11-2026) */
  const PAR={P002:'P003',P003:'P002',M016:'M017',M017:'M016',M004:'M013',M013:'M004',M010:'M015',M015:'M010',E003:'E009',E009:'E003',E011:'E012',E012:'E011'};
  const otros=baraja(SEN.filter(x=>x.sig!==s.sig&&x.tipo===s.tipo&&x.cod!==PAR[s.cod])).concat(baraja(SEN.filter(x=>x.tipo!==s.tipo))).slice(0,3);
  ops=baraja([s,...otros]).map(x=>({k:x.sig,txt:x.sig}));
 }else{
  const fuera=x=>x.cod!==s.cod&&!s.excl.includes(x.cod);
  const otros=baraja(SEN.filter(x=>fuera(x)&&x.tipo===s.tipo)).slice(0,1).concat(baraja(SEN.filter(x=>fuera(x)&&x.tipo!==s.tipo)).slice(0,2));
  ops=baraja([s,...otros]).map(x=>({k:x.cod,img:x.svg}));
 }
 const correcta=modo==='tipo'?(s.trampa?'trampa':s.tipo):modo==='sig'?s.sig:s.cod;
 const COLOR={prohibicion:'rojo y blanco',obligacion:'azul',advertencia:'amarillo',salvamento:'verde',incendios:'rojo'};
 const ayuda=modo==='tipo'&&window.AYUDA_COLOR?`<div class="libro" style="text-align:center;font-size:15px">Color de la señal: ${s.trampa?'morado':COLOR[s.tipo]}</div>`:'';
 const dibujo=s.trampa?`<div class="senal" style="filter:hue-rotate(${GIRO[s.tipo]}deg) drop-shadow(0 3px 4px rgba(0,0,0,.15))">${s.svg}</div>${ayuda}`:`<div class="senal">${s.svg}</div>${ayuda}`;
 app.innerHTML=`<div class="cab"><span class="pill">${st.pts} pts</span><span class="pill">${st.racha>1?'🔥 x'+st.racha:'Señal '+(st.i+1)+'/'+st.lista.length}</span><span class="pill vidas">${'♥'.repeat(st.vidas)}${'♡'.repeat(3-st.vidas)}</span></div>
  <div class="barra"><i style="width:${st.i/st.lista.length*100}%"></i></div>
  <div class="tiempo"><i id="t"></i></div>
  <div class="tarjeta" id="tj">
   ${modo==='sit'?`<div class="preg">¿Qué señal pondrías?</div><div class="situ">${s.texto}</div>`:`<div class="preg">${modo==='tipo'?'¿Qué tipo de señal es?':'¿Qué significa esta señal?'}</div>${dibujo}`}
   <div class="opciones ${modo==='tipo'?'tipos':modo==='sit'?'imgs':''}">${ops.map(o=>`<button class="op" data-k="${o.k}">${o.img?o.img:o.txt}</button>`).join('')}</div>
   <div class="explica" id="ex" role="status" aria-live="polite"></div>
   <button class="sig" id="sig">Siguiente</button>
  </div>`;
 const T=st.l.t*1000, t0=Date.now(), barra=$('#t');
 st.reloj=setInterval(()=>{const q=1-(Date.now()-t0)/T;barra.style.width=Math.max(0,q*100)+'%';if(q<=0)responde(null)},50);
 const responde=k=>{
  clearInterval(st.reloj);
  const ok=k===correcta, seg=(Date.now()-t0)/1000;
  app.querySelectorAll('.op').forEach(b=>{b.disabled=true;if(b.dataset.k===correcta)b.classList.add('ok');else if(b.dataset.k===k)b.classList.add('mal')});

   st.racha++;st.aciertos++;

  }else{
   st.racha=0;st.vidas--;st.fallos.push(s);
   const resta=Math.min(RESTA,st.pts);st.pts-=resta;
   if(resta){const f=document.createElement('div');f.className='puntos-flota';f.style.color='var(--mal)';f.textContent='−'+resta;document.body.appendChild(f);setTimeout(()=>f.remove(),900)}
   $('#tj').classList.add('sacude');
   const cab=k===null?'¡Se acabó el tiempo!':'No es correcto';
   ex.className='explica mal';ex.innerHTML=s.trampa?`<b>${cab}: era una trampa</b>${trampaTxt(s)}`:`<b>${cab}</b>${modo==='sit'?'La señal adecuada es':'Es una señal de <b style="display:inline;font-size:15px">'+TIPOS[s.tipo].n.toLowerCase()+'</b>:'} «${s.sig}». ${s.exp} ${TIPOS[s.tipo].d}`;
  }
  const pp=document.querySelector('.cab .pill');if(pp)pp.textContent=st.pts+' pts';
  const b=$('#sig');b.style.display='block';setTimeout(()=>b.scrollIntoView({behavior:'smooth',block:'end'}),150);b.textContent=(st.vidas<=0||st.i+1>=st.lista.length)?'Ver resultado':'Siguiente';
  b.onclick=()=>{st.i++;pregunta()};
 };
 app.querySelectorAll('.op').forEach(b=>b.onclick=()=>responde(b.dataset.k));
}

function final(){
 clearInterval(st.reloj);
 const total=st.lista.length, r=st.aciertos/total, est=st.vidas<=0?0:r>=.95?3:r>=.75?2:r>=.5?1:0;
 const antes=rec(st.l.n); guarda(st.l.n,st.pts);
 const unicos=[...new Map(st.fallos.map(s=>[s.id+(s.trampa?'t':''),s])).values()];
 if(est===3)for(let n=0;n<70;n++){const c=document.createElement('i');c.className='confeti';c.style.left=Math.random()*100+'vw';c.style.background=['#004230','#ff5900','#fcd100','#2f8a5b'][n%4];c.style.animationDuration=(1.6+Math.random()*1.6)+'s';c.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4000)}
 app.innerHTML=`<div class="final">
  <div class="marca">Nivel ${st.l.n} · ${st.l.titulo}</div>
  <div class="estrellas">${'★'.repeat(est)}${'☆'.repeat(3-est)}</div>
  <div class="gran">${st.pts}</div><div>puntos · ${st.aciertos} de ${total} aciertos${st.vidas<=0?' · sin vidas':''}</div>
  ${st.pts>antes?'<p style="color:var(--ok);font-weight:700">¡Nuevo récord!</p>':''}
  ${unicos.length?`<div class="fallos"><h2 class="serif" style="color:var(--verde);font-size:19px;margin:8px 0">Repasa estas señales</h2><p class="libro">${libro(2,'2.2.3')}</p>${unicos.map(s=>s.trampa?`<div class="fallo"><span style="filter:hue-rotate(${GIRO[s.tipo]}deg);display:contents">${s.svg}</span><div><b>Señal trampa</b><small>${trampaTxt(s)}</small></div></div>`:`<div class="fallo">${s.svg}<div><b>${s.sig}</b><small>${TIPOS[s.tipo].n}. ${s.exp}</small></div></div>`).join('')}</div>`:'<p style="margin-top:14px">¡Ni un fallo! Ya eres detective de señales.</p>'}
  ${st.oficial?bloqueOficial(est):''}
  <div class="btns" ${st.oficial?'style="display:none"':''}><button class="btn p" id="otra">Jugar otra vez</button>${st.l.n<3?`<button class="btn s" id="sigui">Siguiente nivel</button>`:''}<button class="btn s" id="menu">Volver al menú</button></div>
 </div>`;
 if(st.oficial)return finOficial();
 $('#otra').onclick=()=>empieza(st.l.n);
 $('#menu').onclick=portada;
 if($('#sigui'))$('#sigui').onclick=()=>empieza(st.l.n+1);
}
function bloqueOficial(est){
 const o=st.oficial; o.est[st.l.n-1]=est;o.fallos=(o.fallos||[]).concat(st.fallos.map(x=>`N${st.l.n} ${x.trampa?'trampa '+x.cod:(x.texto?'situación «'+x.texto.slice(0,40)+'» → '+x.cod:x.cod+' '+x.sig)}`)); o.pts+=st.pts;
 if(st.l.n<3)return `<div class="aviso-of">Partida oficial · intento ${o.intento} de ${INTENTOS}</div><div class="btns"><button class="btn p" id="ofsig">Seguir al nivel ${st.l.n+1}</button></div>`;
 const m=Math.min(...o.est);
 return `<div class="aviso-of"><b>Partida oficial terminada</b><br>Estrellas: ${o.est.map((e,i)=>'N'+(i+1)+' '+'★'.repeat(e)+'☆'.repeat(3-e)).join(' · ')}<br>Subida de nota: <b>+${extraDe(m)}</b> en el criterio de señalización (cuenta tu mejor intento)<div id="envio">Enviando resultado…</div></div><div class="aviso-of" id="puesto">Consultando tu puesto en la clasificación…</div><div class="btns"><button class="btn p" id="ofmenu">Volver al menú</button></div>`;
}
function finOficial(){
 const o=st.oficial;
 if(st.l.n<3){$('#ofsig').onclick=()=>empieza(st.l.n+1,o);return}
 $('#ofmenu').onclick=portada;
 const m=Math.min(...o.est);
 const antes=+ls.get('senales_mejor',0), mejor=Math.max(antes,o.pts); ls.set('senales_mejor',mejor);
 if(!antes)ls.set('senales_primer_envio',Date.now());
 puesto(o.codigo,mejor,recien()).then(r=>{const d=$('#puesto');if(d)d.innerHTML=textoPuesto(r,mejor)});
 envia({codigo:o.codigo,intento:o.intento,fallos:o.fallos,n1:o.est[0],n2:o.est[1],n3:o.est[2],puntos:o.pts,extra:extraDe(m)}).then(ok=>{
  $('#envio').textContent=ok?'✔ Resultado enviado a tu profesor.':'Sin conexión: tu resultado queda guardado en este dispositivo y se enviará solo en cuanto vuelva internet (abre el juego otra vez si hace falta).';
 });
}

<style>
#pcomp{position:fixed;right:14px;bottom:14px;z-index:20;border:0;border-radius:999px;padding:10px 16px;font:700 14px "Helvetica Neue",Arial,sans-serif;
 background:rgba(0,66,48,.88);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;display:none}

<button id="pcomp" type="button">⛶ Pantalla completa</button>
<script>
/* Tablets y ordenadores (José, 9-11-2026): cada pantalla se escala para llenar la pantalla, como en el móvil,
   y un botón pone el navegador a pantalla completa. En el móvil no cambia nada. */
(function(){
 const app=document.getElementById('app'),btn=document.getElementById('pcomp');
 let midiendo=false;
 function ajusta(){
  if(midiendo)return;midiendo=true;
  const fija=app.querySelector('.rcp,.juego');           // pantallas de juego a pantalla completa: sin escalar
  btn.style.visibility=fija?'hidden':'';                 // el botón no tapa el tablero mientras se juega
  if(innerWidth<700||fija){app.style.zoom='';app.style.minHeight='';app.style.maxWidth='';midiendo=false;return}
  app.style.zoom='1';app.style.minHeight='0';app.style.maxWidth='';
  const alto=()=>{const t=app.getBoundingClientRect().top;return Math.max(...[...app.children].map(c=>c.getBoundingClientRect().bottom))-t+16};
  const H=innerHeight-8,zw=innerWidth/540,zMin=innerWidth>=1000?1.35:1.15;
  let z=H/alto();
  if(z>=zw){z=zw}                                   // vertical: llena el ancho, como en el móvil
  else if(z<1){z=zMin;app.style.maxWidth=Math.floor(innerWidth/z)+'px'}   // pantalla larga: grande y con rueda
  else{                                             // apaisada: la columna llena todo el ancho y el contenido, todo el alto
   for(let k=0;k<3;k++){app.style.maxWidth=Math.floor(innerWidth/z)+'px';z=Math.min(2.4,H/alto())}
   z=Math.max(1,z);app.style.maxWidth=Math.floor(innerWidth/z)+'px';
  }
  app.style.zoom=Math.max(1,Math.min(z,2.4)).toFixed(3);
  midiendo=false;
 }
 new MutationObserver(()=>requestAnimationFrame(ajusta)).observe(app,{childList:true,subtree:true});
 addEventListener('resize',ajusta);ajusta();
 const fs=document.documentElement;
 function boton(){
  const puede=(document.fullscreenEnabled||document.webkitFullscreenEnabled)&&innerWidth>=700;
  btn.style.display=puede&&!(document.fullscreenElement||document.webkitFullscreenElement)?'block':'none';
 }
 const pide=()=>{try{const r=(fs.requestFullscreen||fs.webkitRequestFullscreen).call(fs);if(r&&r.catch)r.catch(()=>{})}catch(e){}};
 btn.onclick=()=>{salio=false;pide()};
 // automático (José, 9-11-2026): en tablet u ordenador, el primer toque o clic pone la pantalla completa.
 // El navegador no deja hacerlo sin un toque; si la persona sale con Esc, no se vuelve a forzar (queda el botón).
 let salio=false;
 function auto(e){
  if(e&&e.target&&e.target.closest&&e.target.closest('#pcomp'))return;   // el botón ya lo pide
  if(salio||innerWidth<700||!(document.fullscreenEnabled||document.webkitFullscreenEnabled))return;
  if(document.fullscreenElement||document.webkitFullscreenElement)return;
  pide();
 }
 document.addEventListener('click',auto,true);document.addEventListener('touchend',auto,true);
 const sale=()=>{if(!(document.fullscreenElement||document.webkitFullscreenElement))salio=true};
 document.addEventListener('fullscreenchange',sale);document.addEventListener('webkitfullscreenchange',sale);
 document.addEventListener('fullscreenchange',()=>{boton();setTimeout(ajusta,150)});
 document.addEventListener('webkitfullscreenchange',()=>{boton();setTimeout(ajusta,150)});
 addEventListener('resize',boton);boton();
})();
</script>
<script>
/* Generado por herramientas/juegos_paginas.py: no tocar a mano. */
const PAGINAS={"UD1": {"HIG": {"1.2": 6, "1.3": 9, "1.3.1": 9, "1.3.2": 10, "1.3.3": 12}, "IFC": {"1.2": 6, "1.3": 9, "1.3.1": 9, "1.3.2": 10, "1.3.3": 12}, "ITE": {"1.2": 6, "1.3": 9, "1.3.1": 9, "1.3.2": 10, "1.3.3": 12}, "STI": {"1.2": 6, "1.3": 9, "1.3.1": 9, "1.3.2": 10, "1.3.3": 12}}, "UD2": {"HIG": {"2.2.3": 9}, "IFC": {"2.2.3": 9}, "ITE": {"2.2.3": 9}, "STI": {"2.2.3": 9}}, "UD3": {"HIG": {"3.6": 17, "3.6.1": 18, "PLS": 20}, "IFC": {}, "ITE": {"3.6": 17, "3.6.1": 17, "PLS": 19}, "STI": {"3.6": 17, "3.6.1": 18, "PLS": 20}}};
/* ===== Común a los tres juegos (José, 9-11-2026): libro, sonido sí/no, accesibilidad e instalable =====
   Lo meten los montar_*.py antes de </body>, junto con PAGINAS (paginas_libro.js). */

/* «Repasa» con la página del libro de tu ciclo (sale del código de lista; sin código, solo el apartado). */
function libro(ud, ap, txt) {
  let c = '';
  try { c = (/^[12]([A-Z]{2,5})-/.exec((localStorage.getItem('ipe_codigo') || '').toUpperCase()) || [])[1] || '' } catch (e) {}
  const p = (((typeof PAGINAS !== 'undefined' && PAGINAS['UD' + ud]) || {})[c] || {})[ap];
  return `📖 En el libro: UD ${ud}, apartado ${txt || ap}${p ? `, página ${p}` : ''}`;
}

(function () {
  const L = {
    get: (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v } catch (e) { return d } },
    set: (k, v) => { try { localStorage.setItem(k, v) } catch (e) {} }
  };
  const app = document.getElementById('app');
  const css = document.createElement('style');
  css.textContent = `
.libro{display:block;margin-top:5px;color:#004230;font-weight:700;font-size:13px}
p.libro{margin:0 0 8px}
.opcs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0 4px}
.opc{border:0;border-radius:999px;padding:10px 16px;font:700 14px "Helvetica Neue",Arial,sans-serif;background:#004230;color:#fff;cursor:pointer}
.opc[aria-pressed="false"]{background:#5b6b70}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #fcd100;outline-offset:2px}
.op.ok::after{content:"✓";margin-left:auto;font-size:20px;font-weight:900}
.op.mal::after{content:"✗";margin-left:auto;font-size:20px;font-weight:900}
@media (prefers-reduced-motion:reduce){.confeti{display:none}.sacude{animation:none}*{scroll-behavior:auto!important}}`;
  document.head.appendChild(css);

  /* Botones de opciones: al final de la portada, para no tapar nada mientras se juega. */
  const caja = document.createElement('div');
  caja.className = 'opcs';
  function boton(texto, activo, alCambiar) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'opc';
    const pinta = v => { b.setAttribute('aria-pressed', v ? 'true' : 'false'); b.textContent = texto(v) };
    let v = activo; pinta(v);
    b.onclick = e => { e.stopPropagation(); v = !v; pinta(v); alCambiar(v) };
    caja.appendChild(b);
    return b;
  }
  const muestra = () => { const p = app && app.querySelector('.portada'); if (p && caja.children.length && caja.parentNode !== p) p.appendChild(caja) };
  if (app) new MutationObserver(muestra).observe(app, { childList: true });

  /* Sonido sí/no (serpiente y auxilios tienen sonido; señales no). */
  if (typeof actx !== 'undefined') {
    const aplica = () => {
      try {
        if (window.SILENCIO) { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); actx.suspend() }
        else if (actx && actx.state === 'suspended') actx.resume();
      } catch (e) {}
    };
    window.SILENCIO = L.get('ipe_silencio', '0') === '1';
    boton(v => v ? '🔊 Sonido' : '🔇 Sin sonido', !window.SILENCIO, v => { window.SILENCIO = !v; L.set('ipe_silencio', v ? '0' : '1'); aplica() });
    aplica();
    /* si el juego crea el sonido después, se vuelve a silenciar */
    document.addEventListener('click', () => setTimeout(aplica, 0), true);
    document.addEventListener('touchend', () => setTimeout(aplica, 0), true);
  }

  /* Ayuda de colores para daltonismo (solo señales: escribe el color de la señal en el nivel 1). */
  if (typeof GIRO !== 'undefined') {
    window.AYUDA_COLOR = L.get('ipe_ayuda_color', '0') === '1';
    boton(v => v ? '👁 Ayuda de colores: sí' : '👁 Ayuda de colores: no', window.AYUDA_COLOR,
      v => { window.AYUDA_COLOR = v; L.set('ipe_ayuda_color', v ? '1' : '0') });
  }
  muestra();

  /* Instalable y sin conexión: el service worker guarda el juego para abrirlo sin internet. */
  if ('serviceWorker' in navigator && location.protocol === 'https:')
    navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>

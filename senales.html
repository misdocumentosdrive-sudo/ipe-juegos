<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Detective de señales · IPE I</title>
<style>@font-face{font-family:"Aleo";src:url(aleo.woff2?v=d7c8feba) format("woff2"),url(aleo.ttf?v=fed0d713) format("truetype");font-weight:100 900;font-style:normal;font-display:swap}</style>
<style>
:root{--verde:#004230;--verde2:#0d6b4f;--naranja:#ff5900;--amarillo:#fcd100;--fondo:#f4f8f6;--texto:#1d2a30;--gris:#5b6b70;--ok:#178045;--mal:#d33a1f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--fondo);color:var(--texto);font:16px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:520px;min-height:100%;display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
h1,h2,.serif{font-family:Aleo,Georgia,serif}
.cab{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.marca{font:800 13px Aleo,Georgia,serif;color:var(--verde);letter-spacing:.3px}
.pill{background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.vidas{color:var(--mal);letter-spacing:2px}
/* fase 5, 17-11-2026: progreso y racha en la misma fila; el reloj se anima con CSS (scaleX), en rojo y palpitando los 3 últimos segundos */
.estado{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.barra{flex:1;height:8px;background:#dde7e2;border-radius:99px;overflow:hidden}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--verde2),var(--verde));width:0;transition:width .3s}
.racha{flex:none;min-width:66px;text-align:center;font:800 14px/1.2 Aleo,Georgia,serif;color:var(--gris);background:#e3ece8;border-radius:999px;padding:4px 10px;transition:background .2s,color .2s}
.racha.on{background:var(--amarillo);color:var(--verde)}
.tiempo{height:5px;background:#eadfcf;border-radius:99px;overflow:hidden;margin:-8px 0 12px}
.tiempo i{display:block;height:100%;background:var(--naranja);transform-origin:left center;transform:scaleX(1);will-change:transform}
.tiempo.urgente i{background:var(--mal)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){
 .tiempo.urgente{animation:palpita .5s ease-in-out infinite alternate}
 .tiempo.quieto{animation-play-state:paused}
 .racha.pop{animation:pop .4s cubic-bezier(.3,1.8,.5,1)}
 .tarjeta.entra{animation:entra .24s ease-out both}
 .tarjeta.entra .senal{animation:sella .5s cubic-bezier(.25,1.6,.45,1) .08s both}
 .fam{animation:entra .3s ease-out both}
 .estrellas.revela span{opacity:0;transform:scale(0)}
 .estrellas.revela span.ve{animation:estrella .5s cubic-bezier(.3,1.8,.5,1) forwards}
}
@keyframes palpita{to{transform:scaleY(2.2)}}
@keyframes pop{40%{transform:scale(1.35)}}
@keyframes entra{from{transform:translateX(40px);opacity:0}}
@keyframes sella{0%{transform:scale(1.5) rotate(-8deg);opacity:0}55%{opacity:1}100%{transform:none}}
@keyframes estrella{0%{opacity:0;transform:scale(0) rotate(-40deg)}100%{opacity:1;transform:none}}
/* tutorial de la primera vez */
.tuto{display:flex;flex-direction:column;gap:10px}
.tuto h2{margin:0;color:var(--verde);font-size:23px}
.tuto>p{margin:0;color:var(--gris);font-size:15px}
.familias{display:grid;gap:8px}
.fam{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:8px 12px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.fam .mini{width:46px;height:46px;flex:none}
.fam .mini img{width:100%;height:100%;object-fit:contain}
.fam b{display:block;font:800 16px Aleo,Georgia,serif;color:var(--verde)}
.fam small{color:var(--gris);font-size:13.5px}
.saltar{background:none;border:0;color:var(--verde);font:700 15px "Helvetica Neue",Arial,sans-serif;text-decoration:underline;padding:8px 4px;min-height:44px;cursor:pointer}
.tarjeta{position:relative;background:#fff;border-radius:22px;box-shadow:0 6px 20px rgba(0,66,48,.10);padding:18px;display:flex;flex-direction:column;align-items:center}
.senal{width:min(62vw,230px);height:min(62vw,230px);margin:6px 0 10px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 3px 4px rgba(0,0,0,.15))}
.senal img{max-width:100%;max-height:100%}
.op .mini img,.fila-sen img,.fallo img{width:100%;height:100%;object-fit:contain}
.confeti{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:cae linear forwards;z-index:9}
@keyframes cae{to{transform:translateY(105vh) rotate(720deg)}}
.preg{font:700 18px Aleo,Georgia,serif;color:var(--verde);text-align:center;margin:4px 0 2px}
.opciones{display:grid;gap:10px;margin-top:14px;width:100%}
.opciones.tipos{grid-template-columns:1fr}
.op{border:0;border-radius:14px;padding:14px 14px;font:600 16px "Helvetica Neue",Arial,sans-serif;background:#eef4f1;color:var(--texto);text-align:left;display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .08s,background .2s}
.op:active{transform:scale(.98)}
.op .mini{width:30px;height:30px;flex:none}
.op:disabled{cursor:default;opacity:1;color:var(--texto)}
.op.ok,.op.ok:disabled{background:var(--ok);color:#fff}
.op.mal,.op.mal:disabled{background:var(--mal);color:#fff}
.explica{margin-top:14px;width:100%;border-radius:14px;padding:12px 14px;font-size:15px;display:none}
.explica.ok{display:block;background:#e3f4ea;color:#0b5a2f}
.explica.mal{display:block;background:#fde8e3;color:#8c2512}
.explica b{display:block;font:800 16px Aleo,Georgia,serif;margin-bottom:2px}
.sig{margin-top:12px;width:100%;border:0;border-radius:14px;padding:14px;font:800 17px Aleo,Georgia,serif;background:var(--verde);color:#fff;cursor:pointer;display:none}
.puntos-flota{position:fixed;left:50%;top:38%;transform:translate(-50%,0);font:800 34px Aleo,Georgia,serif;color:var(--ok);pointer-events:none;animation:sube .9s ease-out forwards}
@keyframes sube{to{transform:translate(-50%,-70px);opacity:0}}
.sacude{animation:sacude .35s}
@keyframes sacude{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
/* portada */
.portada{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px}
.portada>h1{font-size:32px;color:var(--verde);margin:0;line-height:1.1}
.portada>p{color:var(--gris);margin:0}
.fila-sen{display:flex;justify-content:center;gap:8px;margin:6px 0}
.fila-sen img{width:52px;height:52px}
.nivel{border:0;border-radius:18px;padding:16px;text-align:left;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.07);cursor:pointer;display:flex;gap:14px;align-items:center}
.nivel .n{flex:none;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 20px Aleo,Georgia,serif;color:#fff}
.nivel b{display:block;font:800 17px Aleo,Georgia,serif;color:var(--verde)}
.nivel span{font-size:14px;color:var(--gris)}
.record{font-size:13px;color:var(--gris)}
/* final */
.final{text-align:center}
.final .gran{font:800 56px Aleo,Georgia,serif;color:var(--verde);margin:4px 0}
.estrellas{font-size:34px;letter-spacing:4px;color:var(--amarillo);text-shadow:0 1px 0 #c9a400}
.estrellas span{display:inline-block}
.fallos{text-align:left;margin-top:16px}
.fallo{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:10px;margin-bottom:8px}
.fallo img{width:54px;height:54px;flex:none}
.fallo b{display:block;color:var(--verde)}
.fallo small{color:var(--gris)}
.btns{display:grid;gap:10px;margin-top:16px}
.btn{border:0;border-radius:14px;padding:14px;font:800 17px Aleo,Georgia,serif;cursor:pointer}
.btn.p{background:var(--verde);color:#fff}
.btn.s{background:#e3ece8;color:var(--verde)}
.pie{text-align:center;font-size:12px;color:var(--gris);margin-top:auto;padding-top:14px}
.oficial{background:#fff;border:2px solid var(--verde);border-radius:16px;padding:14px;margin:14px 0;text-align:left;display:grid;gap:8px}
.oficial label span,.oficial small{font-size:13px;opacity:.75}
.oficial input{font:700 20px/1.2 inherit;letter-spacing:2px;text-transform:uppercase;padding:10px 12px;border:2px solid #cfd8d3;border-radius:10px;width:100%;box-sizing:border-box}
.oficial input.error{border-color:#c0392b;background:#fdecea}
.oficial .btn[disabled]{opacity:.5}
.entreno{color:var(--verde);font-size:18px;margin:6px 0 4px;text-align:left}
.aviso-of{background:#fff8d6;border:2px solid #fcd100;border-radius:14px;padding:12px;margin:14px 0;line-height:1.5}
.situ{font-size:17px;line-height:1.45;text-align:center;margin:8px 4px 4px;color:var(--texto)}
.opciones.imgs{grid-template-columns:1fr 1fr}
.opciones.imgs .op{justify-content:center;padding:12px;aspect-ratio:1}
.opciones.imgs .op img{width:100%;height:100%;object-fit:contain}
#envio{margin-top:8px;font-weight:700;color:var(--verde)}
/* fase 6, 17-11-2026: Taller del rotulista */
.obra{width:min(56vw,210px);height:min(56vw,210px)}
.obra svg,.fam .mini svg{width:100%;height:100%}
.pic{color:var(--gris);font-size:14px;margin-top:2px}
.desc{font-size:13px;color:var(--gris);text-align:center;margin:0 0 8px}
.filas{width:100%;display:grid;gap:10px}
.fila{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.fila legend{font:800 14px Aleo,Georgia,serif;color:var(--verde);margin-bottom:4px;padding:0}
.chip{border:2px solid transparent;border-radius:999px;padding:8px 12px;min-height:44px;background:#eef4f1;color:var(--texto);font:600 15px "Helvetica Neue",Arial,sans-serif;display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--verde);background:#d4ebe0;font-weight:800}
.chip:disabled{cursor:default;opacity:.75}
.mues{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.35);flex:none}
.valida{width:100%;margin-top:14px}
.valida:disabled{opacity:.45;cursor:default}
.res{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.res li{display:flex;gap:8px;align-items:flex-start}
.explica .res b{display:inline;font:800 15px "Helvetica Neue",Arial,sans-serif;margin:0}
.compara{display:flex;gap:18px;justify-content:center;margin:10px 0 6px}
.compara figure{margin:0;text-align:center;font-size:12px;max-width:110px}
.compara svg,.compara img{width:84px;height:84px;display:block;margin:0 auto 4px}

/* Tablets y ordenadores (José, 9-11-2026): en pantallas grandes, todo más grande (en el móvil, igual que antes) */

/* ===== fase 7 (17-11-2026): universo plastilina. Relieve suave como en Auxilios (fase 5), la persona compañera del ciclo
   presenta cada pantalla y las señales cuelgan como placas (sombra y un brillo enmascarado con la propia señal: ni su forma ni
   sus colores cambian). ===== */
.tarjeta{border-radius:24px;box-shadow:0 10px 24px rgba(0,66,48,.12),0 2px 4px rgba(0,66,48,.06),inset 0 2px 0 rgba(255,255,255,.95),inset 0 -5px 0 rgba(0,66,48,.06)}
.op{box-shadow:inset 0 2px 0 rgba(255,255,255,.85),inset 0 -3px 0 rgba(0,66,48,.12),0 2px 5px rgba(0,66,48,.08);transition:transform .08s,box-shadow .08s,background .2s}
.op:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(0,66,48,.12),0 1px 2px rgba(0,66,48,.08)}
.op.ok,.op.mal{box-shadow:inset 0 2px 0 rgba(255,255,255,.25),inset 0 -3px 0 rgba(0,0,0,.18)}
.btn,.sig{box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset 0 -4px 0 rgba(0,0,0,.2),0 4px 10px rgba(0,66,48,.18);transition:transform .08s,box-shadow .08s}
.btn.s{box-shadow:inset 0 2px 0 rgba(255,255,255,.85),inset 0 -4px 0 rgba(0,66,48,.12),0 3px 8px rgba(0,66,48,.1)}
.btn:active:not([disabled]),.sig:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -1px 0 rgba(0,0,0,.2),0 1px 3px rgba(0,66,48,.18)}
.nivel{box-shadow:0 6px 14px rgba(0,66,48,.09),inset 0 2px 0 #fff,inset 0 -4px 0 rgba(0,66,48,.07);transition:transform .08s,box-shadow .08s}
.nivel:active{transform:translateY(2px);box-shadow:0 2px 5px rgba(0,66,48,.09),inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,66,48,.07)}
.nivel .n{box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.22)}
.pill{box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 rgba(0,66,48,.08),0 2px 4px rgba(0,66,48,.08)}
.racha{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 0 rgba(0,66,48,.1)}
.oficial{box-shadow:inset 0 2px 0 #fff,0 6px 14px rgba(0,66,48,.08)}
.fam,.fallo{box-shadow:0 4px 10px rgba(0,66,48,.07),inset 0 2px 0 #fff,inset 0 -3px 0 rgba(0,66,48,.06)}
.chip{box-shadow:inset 0 2px 0 rgba(255,255,255,.85),inset 0 -2px 0 rgba(0,66,48,.12),0 1px 3px rgba(0,66,48,.08)}
.explica{box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(0,0,0,.05)}
/* placas: la señal ocupa su caja (antes, la trampa «redonda» salía más pequeña que las demás) */
.senal img{width:100%;height:100%;object-fit:contain}
.senal{filter:drop-shadow(0 7px 6px rgba(0,30,20,.22)) drop-shadow(0 1px 1px rgba(0,0,0,.28))}
.placa{position:relative}
.placa:after{content:"";position:absolute;inset:0;pointer-events:none;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;
 background:linear-gradient(118deg,transparent 22%,rgba(255,255,255,.2) 30%,rgba(255,255,255,.06) 38%,transparent 44%) 0 0/100% 100% no-repeat}
.opciones.imgs .op img{filter:drop-shadow(0 3px 3px rgba(0,30,20,.25))}
@media (prefers-reduced-motion:no-preference){
 .tarjeta.entra .placa:after{background-size:300% 100%;animation:brillo 1.1s ease-out .45s both}
}
@keyframes brillo{from{background-position:100% 0}to{background-position:0 0}}
/* portada: la escena del puesto del ciclo, con la persona compañera que revisa la señalización contigo */
.heroe.escena{padding:0;background:#062a1f;display:flex;flex-direction:column}
.heroe .esc{position:relative;aspect-ratio:1024/571;background:#0b5a40 center/cover no-repeat}
.heroe .esc:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,42,31,0) 38%,rgba(6,42,31,.55) 70%,#062a1f 100%)}
.heroe .cuerpo{position:relative;margin-top:-86px;padding:0 18px 18px}
.heroe .fila-sen img{width:46px;height:46px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
.heroe .pres{margin:8px 0 6px}
.heroe .pres-globo{font-size:14.5px}
.ciclos{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:13px;color:var(--gris)}
.ciclos button{border:0;border-radius:999px;min-height:44px;padding:6px 14px;font:800 14px Aleo,Georgia,serif;background:#e3ece8;color:var(--verde);cursor:pointer;
 box-shadow:inset 0 2px 0 rgba(255,255,255,.85),inset 0 -3px 0 rgba(0,66,48,.12)}
.ciclos button[aria-pressed="true"]{background:var(--verde);color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset 0 -3px 0 rgba(0,0,0,.25)}
/* presentación de cada nivel */
.brief{display:flex;flex-direction:column;gap:12px}
.brief .esc{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:16/8;background:#0b5a40 center 35%/cover no-repeat;display:flex;align-items:flex-end;padding:14px;
 box-shadow:0 10px 24px rgba(0,66,48,.2),inset 0 2px 0 rgba(255,255,255,.25)}
.brief .esc:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,42,31,0) 30%,rgba(6,42,31,.88))}
.brief .esc>*{position:relative}
.brief .esc .n{flex:none;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 22px Aleo,Georgia,serif;color:#fff;margin-right:12px;
 box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.25),0 4px 10px rgba(0,0,0,.3)}
.brief .esc h2{margin:0;color:#fff;font-size:22px;line-height:1.15}
.brief .esc small{display:block;color:#a8e6cc;font:700 11.5px "Helvetica Neue",Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;margin-bottom:3px}
.reglas{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.reglas li{background:#fff;border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:700;color:var(--verde);box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 rgba(0,66,48,.08),0 2px 4px rgba(0,66,48,.08)}
/* reacción tras responder: compacta, debajo de las opciones (no tapa la señal ni las respuestas) */
.voz{width:100%;margin-top:12px}
.voz:empty{display:none}
.voz .pres-globo{font-size:14px}
.final .voz{margin:12px 0 4px}
/* nivel 3: la situación, sobre la escena del puesto (desenfocada y oscurecida) */
.tarjeta.sit{background:#0f2c23;overflow:hidden;isolation:isolate}
.tarjeta.sit:before{content:"";position:absolute;inset:-14px;z-index:-1;background:var(--esc) center 40%/cover no-repeat;filter:blur(5px) brightness(.5) saturate(.9);transform:scale(1.04)}
.tarjeta.sit:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(6,30,22,.15),rgba(6,30,22,.55))}
.tarjeta.sit .lugar{align-self:flex-start;font:700 11.5px "Helvetica Neue",Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#a8e6cc;margin:-2px 0 8px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.situ-card{width:100%;background:#fffaf0;border-radius:18px;padding:12px 14px 14px;text-align:center;
 box-shadow:0 10px 22px rgba(0,0,0,.35),inset 0 2px 0 #fff,inset 0 -4px 0 rgba(0,0,0,.07)}
.situ-card .preg{margin-top:0}
.situ-card .situ{margin:4px 2px 0}
.tarjeta.sit .opciones.imgs .op{background:#f4f1ea}
.tarjeta.sit .opciones.imgs .op.ok{background:var(--ok)}.tarjeta.sit .opciones.imgs .op.mal{background:var(--mal)}
/* Revisión de seguridad (gancho: solo aparece si hay escena y riesgos para el ciclo) */
.insp{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 10px 24px rgba(0,66,48,.18);cursor:crosshair;line-height:0}
.insp>img{width:100%;display:block;user-select:none;-webkit-user-select:none}
.zona{position:absolute;transform:translate(-50%,-50%);aspect-ratio:1;border-radius:50%;border:0;padding:0;background:transparent;cursor:pointer}
.zona:focus-visible{outline:3px solid var(--amarillo);outline-offset:2px}
.zona.ok,.zona.mal{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ok),0 6px 14px rgba(0,0,0,.35)}
.zona.mal{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--mal),0 6px 14px rgba(0,0,0,.35)}
.zona img{width:70%;height:70%;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.lupa{width:100%;aspect-ratio:16/9;border-radius:12px;margin-top:8px;background:#0b5a40 no-repeat;background-size:300% auto;box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
/* ===== 18-11-2026 (lo de Serpiente, adaptado): foco visible doble, pausa y sonido en el marcador, menú de pausa que tapa la
   pregunta, aviso de móvil girado y, en tableta u ordenador en horizontal, la pregunta en dos columnas (sin tener que bajar
   con el reloj en marcha). Contraste AA: --ok más oscuro (blanco sobre el verde de acierto, 4,4 → 5,0). ===== */
button:focus-visible,input:focus-visible{outline:3px solid var(--amarillo);outline-offset:2px;box-shadow:0 0 0 6px var(--verde)}
#app{overflow-x:clip;overflow-clip-margin:24px}   /* la entrada de cada tarjeta (desde la derecha y la placa a 1,5×) dejaba la página 40 px más ancha en el móvil */
.cab{gap:6px}
.cab .ctl{display:flex;gap:6px;flex:none}
.ctl button{width:44px;height:44px;border:0;border-radius:50%;padding:0;display:grid;place-items:center;background:#fff;color:var(--verde);font:800 14px "Helvetica Neue",Arial,sans-serif;cursor:pointer;
 box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 rgba(0,66,48,.08),0 2px 4px rgba(0,66,48,.08)}
.ctl button:active{transform:translateY(1px)}

/* ===== Tutorial jugable de la primera vez (fase 5, 17-11-2026): antes del nivel 1 de entrenamiento, nunca en la oficial.
   Las 5 familias con su forma y color y una señal de prueba sin reloj ni puntos (~15 s). Se puede saltar. */
const CLAVE_TUTO='senales_tutorial';
const FAMILIA={prohibicion:'Redonda · borde y banda rojos, fondo blanco. Prohíbe.',advertencia:'Triangular · fondo amarillo, borde negro. Avisa de un peligro.',
 obligacion:'Redonda · fondo azul, dibujo blanco. Obliga.',salvamento:'Cuadrada o rectangular · fondo verde. Salidas y socorro.',
 incendios:'Cuadrada o rectangular · fondo rojo. Equipos contra incendios.'};
function tutorial(){
 clearInterval(st.reloj);st.activa=false;window.scrollTo(0,0);
 const fin=()=>{ls.set(CLAVE_TUTO,'1');empieza(1,null,true)};   // el tutorial ya es su presentación
 const cab=`<div class="cab"><span class="marca">Antes de empezar · 15 segundos</span><button class="saltar" id="saltar" type="button">Saltar</button></div>`;
 app.innerHTML=`<div class="tuto">${cab}
  <h2 class="serif">Cinco familias de señales</h2>
  <div id="voz"></div>
  <div class="familias">${Object.keys(TIPOS).map((t,i)=>`<div class="fam" style="animation-delay:${i*70}ms"><span class="mini">${icono(t)}</span><span><b>${TIPOS[t].n}</b><small>${FAMILIA[t]}</small></span></div>`).join('')}</div>
  <p>Ojo: alguna señal estará mal hecha (una forma o un color que no le toca). Entonces, «Señal mal hecha».</p>
  <button class="btn p" id="probar" type="button">Probar con una señal</button></div>`;
 habla('#voz','Antes de la primera ronda, lo básico: la forma y el color te dicen el tipo de señal antes de mirar el dibujo.');   // fase 7
 $('#saltar').onclick=fin;
 $('#probar').onclick=()=>{
  const muestras=Object.values(MUESTRA), cand=SEN.filter(x=>!muestras.includes(x.cod)), s=cand[Math.floor(Math.random()*cand.length)]||SEN[0];
  const ops=Object.keys(TIPOS).map(k=>({k,txt:TIPOS[k].n})).concat([{k:'trampa',txt:'Señal mal hecha: no existe'}]);
  app.innerHTML=`<div class="tuto">${cab}
   <div class="tarjeta entra" id="tj"><div class="preg">Prueba: ¿qué tipo de señal es?</div>${placa(s.svg)}
    <small style="color:var(--gris)">Sin reloj y sin puntos</small>
    <div class="opciones tipos">${ops.map(o=>`<button class="op" data-k="${o.k}">${o.txt}</button>`).join('')}</div>
    <div class="explica" id="ex" role="status" aria-live="polite"></div>
    <button class="sig" id="sig">¡A jugar!</button></div></div>`;
  $('#saltar').onclick=fin;
  const pintada=performance.now();
  app.querySelectorAll('.op').forEach(b=>b.onclick=()=>{
   if(performance.now()-pintada<350)return;
   const k=b.dataset.k, ok=k===s.tipo;
   app.querySelectorAll('.op').forEach(x=>{x.disabled=true;if(x.dataset.k===s.tipo)x.classList.add('ok');else if(x.dataset.k===k)x.classList.add('mal')});
   if(ok)suena('acierto',1);else{suena('fallo');sacudirTj()}
   const ex=$('#ex');ex.className='explica '+(ok?'ok':'mal');
   ex.innerHTML=`<b>${ok?'¡Eso es!':'Casi: es de '+TIPOS[s.tipo].n.toLowerCase()} · ${s.sig}</b>${TIPOS[s.tipo].d}`;
   const g=$('#sig');g.style.display='block';g.onclick=fin;g.focus({preventScroll:true});
   setTimeout(()=>g.scrollIntoView({behavior:quieto()?'auto':'smooth',block:'nearest'}),150);
  });
 };
}
const sacudirTj=()=>{try{sacudir($('#tj'),8)}catch(e){}};
/* la tarjeta sale de lado y después entra la siguiente (con movimiento reducido, al momento) */
function sale(cb){
 const tj=$('#tj');
 if(!tj||quieto()||!tj.animate||document.hidden)return cb();
 let hecho=false;const fin=()=>{if(!hecho){hecho=true;cb()}};
 tj.animate([{transform:'none',opacity:1},{transform:'translateX(-48px)',opacity:0}],{duration:170,easing:'ease-in',fill:'forwards'}).onfinish=fin;
 setTimeout(fin,320);   // por si la animación no termina (pestaña en segundo plano)
}

function empieza(n,oficial,directo){   // directo: sin la presentación del nivel (tras el tutorial y en «Jugar otra vez»)
 if(n===1&&!oficial&&ls.get(CLAVE_TUTO,'')!=='1')return tutorial();
 const l=NIVELES[n-1];
 let lista=baraja(SEN);
 while(lista.length<l.preg)lista=lista.concat(baraja(SEN));
 lista=lista.slice(0,l.preg);
 if(l.modo==='tipo'){const k=new Set(baraja([...lista.keys()]).slice(0,TRAMPAS)),u=new Set();lista=lista.map((s,i)=>k.has(i)?haceTrampa(s,u):s)}
 if(l.modo==='sit')lista=situaciones().map(([texto,cod,excl])=>({...SEN.find(s=>s.cod===cod),texto,excl}));
 st={l,lista,i:0,pts:0,racha:0,vidas:3,aciertos:0,fallos:[],oficial:oficial||null};
 if(directo)return pregunta();
 briefing();
}
/* fase 7: presentación de cada nivel. La persona compañera cuenta la ronda (sin pistas); el reloj no corre hasta «Empezar». */
function briefing(){
 const l=st.l, of=!!st.oficial;
 clearInterval(st.reloj);st.activa=false;window.scrollTo(0,0);
 app.innerHTML=`<div class="brief">
  <div class="cab"><span class="marca">${of?`Partida oficial · nivel ${l.n} de 3`:`Entrenamiento · nivel ${l.n}`}</span>${of?'':'<button class="saltar" id="volver" type="button">Volver</button>'}</div>
  <div class="esc" style="background-image:url(${escena()})"><span class="n" style="background:${l.col}" aria-hidden="true">${l.n}</span><span><small>Ronda de revisión ${l.n}</small><h2 class="serif">${l.titulo}</h2></span></div>
  <div id="voz"></div>
  <ul class="reglas" aria-label="Reglas de la ronda"><li>${st.lista.length} ${l.modo==='sit'?'situaciones':'señales'}</li><li>${l.t} s cada una</li><li>3 vidas</li><li>Racha: hasta ×2</li></ul>
  <button class="btn p" id="vamos" type="button">Empezar la ronda</button></div>`;
 habla('#voz',briefTxt(l.n));
 if(!of)$('#volver').onclick=portada;
 const v=$('#vamos');v.onclick=()=>{v.onclick=null;suena('toque');pregunta()};v.focus({preventScroll:true});
}

function pregunta(){
 let teclado=false;try{teclado=document.activeElement.matches('#sig:focus-visible,#vamos:focus-visible')}catch(e){}   // 18-11-2026: quien juega con teclado sigue en las opciones
 clearInterval(st.reloj);st.activa=false;st.parado=0;quitaPausa();window.scrollTo(0,0);
 if(st.i>=st.lista.length||st.vidas<=0)return final();
 const s=st.lista[st.i], modo=st.l.modo;
 let ops;
 if(modo==='tipo') ops=Object.keys(TIPOS).map(k=>({k,txt:TIPOS[k].n})).concat([{k:'trampa',txt:'Señal mal hecha: no existe'}]);
 else if(modo==='sig'){
  ops=baraja([s,...distractores(s,[])]).map(x=>({k:x.sig,txt:x.sig}));
 }else{
  ops=baraja([s,...distractores(s,s.excl)]).map(x=>({k:x.cod,img:x.svg,nom:x.sig}));   // fase 4, 17-11-2026: antes, 1 del mismo tipo y 2 de otro (bastaba el color)
 }
 const correcta=modo==='tipo'?(s.trampa?'trampa':s.tipo):modo==='sig'?s.sig:s.cod;
 const COLOR={prohibicion:'rojo y blanco',obligacion:'azul',advertencia:'amarillo',salvamento:'verde',incendios:'rojo'};
 const ayuda=modo==='tipo'&&window.AYUDA_COLOR?`<div class="libro" style="text-align:center;font-size:15px">Color de la señal: ${s.trampa?s.trampa.c:COLOR[s.tipo]}</div>`:'';
 const dibujo=`${placa(s.svg)}${ayuda}`;   // fase 7: la señal, colgada como una placa
 /* fase 5: la racha tiene su contador (el multiplicador de los puntos) y el progreso no se pierde; vidas, progreso y reloj con nombre accesible */
 app.innerHTML=`<div class="cab"><span class="pill">${st.pts} pts</span><span class="pill"><span class="pal">Señal </span>${st.i+1}/${st.lista.length}</span><span class="pill vidas" role="img" aria-label="Vidas: ${st.vidas} de 3">${vidasHtml(st.vidas)}</span>${ctlHtml()}</div>
  <div class="estado"><div class="barra" role="progressbar" aria-label="Progreso del nivel" aria-valuemin="0" aria-valuemax="${st.lista.length}" aria-valuenow="${st.i}"><i style="width:${st.i/st.lista.length*100}%"></i></div>${rachaHtml()}</div>
  <div class="tiempo" role="progressbar" aria-label="Tiempo para responder" aria-valuemin="0" aria-valuemax="${st.l.t}" aria-valuenow="${st.l.t}" aria-valuetext="${st.l.t} segundos"><i id="t"></i></div>
  <div class="tarjeta entra${modo==='sit'?' sit':''} juega" id="tj"${modo==='sit'?` style="--esc:url(${escena()})"`:''}>
   ${modo==='sit'?`<div class="lugar">Revisión en ${attr(donde())}</div><div class="situ-card"><div class="preg">¿Qué señal pondrías?</div><div class="situ">${s.texto}</div></div>`:`<div class="preg">${modo==='tipo'?'¿Qué tipo de señal es?':'¿Qué significa esta señal?'}</div>${dibujo}`}
   <div class="opciones ${modo==='tipo'?'tipos':modo==='sit'?'imgs':''}">${ops.map(o=>`<button class="op" data-k="${o.k}"${o.nom?` aria-label="${attr(o.nom)}"`:''}>${o.img?o.img:o.txt}</button>`).join('')}</div>
   <div class="voz" id="voz"></div>
   <div class="explica" id="ex" role="status" aria-live="polite"></div>
   <button class="sig" id="sig" type="button">Siguiente</button>
  </div>`;
 controles();
 anuncia(`${modo==='sit'?'Situación':'Señal'} ${st.i+1} de ${st.lista.length}. ${modo==='sit'?'¿Qué señal pondrías? '+s.texto:modo==='tipo'?'¿Qué tipo de señal es?':'¿Qué significa esta señal?'}`);
 if(teclado){const o=app.querySelector('.op');if(o)o.focus({preventScroll:true})}
 /* fase 5: la barra la mueve el navegador (transición CSS); el intervalo solo cuenta los segundos, hace «tic» y acaba el tiempo */
 const T=st.l.t*1000, pintada=performance.now();st.t0=performance.now();st.T=T;st.seg=st.l.t;st.activa=true;
 barraT();
 st.reloj=setInterval(()=>{if(st.parado)return;const resto=T-(performance.now()-st.t0);segundos(resto);if(resto<=0)responde(null)},100);
 if(GIRADO.matches||document.hidden)pausa(true);   // 18-11-2026: si ya empieza con el móvil girado o la página oculta, empieza en pausa
 const responde=k=>{
  clearInterval(st.reloj);st.activa=false;
  barraT(performance.now());const tb=$('.tiempo');if(tb)tb.classList.remove('urgente');
  const ok=k===correcta, seg=(performance.now()-st.t0)/1000;
  app.querySelectorAll('.op').forEach(b=>{b.disabled=true;if(b.dataset.k===correcta)b.classList.add('ok');else if(b.dataset.k===k)b.classList.add('mal')});
  const ex=$('#ex');
  if(ok){
   st.racha++;st.aciertos++;
   const g=Math.round((100+Math.max(0,st.l.t-seg)*10)*(1+Math.min(st.racha-1,4)*.25));
   st.pts+=g;
   suena('acierto',st.racha);pintaRacha(true);
   if(st.racha===3||st.racha===5)setTimeout(()=>suena('premio'),170);   // racha ×1,5 y ×2 (el máximo)
   const f=document.createElement('div');f.className='puntos-flota';f.textContent='+'+g;document.body.appendChild(f);setTimeout(()=>f.remove(),900);
   ex.className='explica ok';ex.innerHTML=s.trampa?`<b>¡Bien visto! Es una trampa</b>${trampaTxt(s)}`:`<b>¡Correcto! ${s.sig}</b>${s.exp} ${TIPOS[s.tipo].d}`;
  }else{
   st.racha=0;st.vidas--;st.fallos.push(s);
   const resta=Math.min(RESTA,st.pts);st.pts-=resta;
   if(resta){const f=document.createElement('div');f.className='puntos-flota';f.style.color='var(--mal)';f.textContent='−'+resta;document.body.appendChild(f);setTimeout(()=>f.remove(),900)}
   suena('fallo');tiembla(90);sacudirTj();pintaRacha(false);
   const pv=$('.cab .vidas');if(pv){pv.innerHTML=vidasHtml(Math.max(0,st.vidas));pv.setAttribute('aria-label',`Vidas: ${Math.max(0,st.vidas)} de 3`)}
   const cab=k===null?'¡Se acabó el tiempo!':'No es correcto';
   ex.className='explica mal';ex.innerHTML=s.trampa?`<b>${cab}: era una trampa</b>${contraste(s,k,modo)}${trampaTxt(s)}`:`<b>${cab}</b>${contraste(s,k,modo)}${modo==='sit'?'La señal adecuada es':'Es una señal de <b style="display:inline;font-size:15px">'+TIPOS[s.tipo].n.toLowerCase()+'</b>:'} «${s.sig}». ${s.exp} ${TIPOS[s.tipo].d}`;
  }
  /* fase 7: la persona compañera reacciona (compacta, debajo de las opciones), solo después de responder */
  habla('#voz',ok?al(s.trampa?FRASE.trampa:st.racha>=3?FRASE.racha:FRASE.bien):al(k===null?FRASE.tiempo:FRASE.mal),ok?'bien':'mal',true);
  const pp=document.querySelector('.cab .pill');if(pp)pp.textContent=st.pts+' pts';
  const b=$('#sig');b.style.display='block';setTimeout(()=>b.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'nearest'}),150);b.textContent=(st.vidas<=0||st.i+1>=st.lista.length)?'Ver resultado':'Siguiente';
  b.onclick=()=>{b.onclick=null;sale(()=>{st.i++;pregunta()})};   // una sola vez aunque se toque dos veces durante la salida
 };
 app.querySelectorAll('.op').forEach(b=>b.onclick=()=>{if(performance.now()-pintada<350||st.parado)return;responde(b.dataset.k)});   // 17-11-2026: el segundo toque de «Siguiente» ya no responde la pregunta nueva
}
/* fase 5: barra del reloj con CSS. barraT() la pone donde toca según st.t0 y la lleva a 0 en el tiempo que queda;
   barraT(momento) la congela en ese momento (al responder y en la pausa). */
function barraT(congela){
 const b=$('#t');if(!b||!st.T)return;
 const q=Math.max(0,Math.min(1,1-((congela||performance.now())-st.t0)/st.T));
 b.style.setProperty('transition','none','important');b.style.transform=`scaleX(${q})`;
 if(congela)return;
 b.getBoundingClientRect();   // fija el punto de partida antes de animar
 b.style.setProperty('transition',`transform ${Math.round(q*st.T)}ms linear`,'important');b.style.transform='scaleX(0)';
}
function segundos(resto){
 const s=Math.max(0,Math.ceil(resto/1000)), t=$('.tiempo');
 if(s===st.seg||!t)return;st.seg=s;
 t.setAttribute('aria-valuenow',s);t.setAttribute('aria-valuetext',s===1?'1 segundo':s+' segundos');
 if(s>=1&&s<=3){t.classList.add('urgente');suena('tic')}
}
/* 18-11-2026 (como en Serpiente): pausa y sonido en el marcador; el anuncio lee el enunciado de cada pregunta */
const ctlHtml=()=>`<span class="ctl"><button type="button" id="bpa" aria-label="Pausa">❚❚</button><button type="button" id="bso"></button></span>`;
function controles(){
 const bp=$('#bpa'),bs=$('#bso');
 const pintaSon=()=>{if(!bs)return;bs.textContent=window.SILENCIO?'🔇':'🔊';bs.setAttribute('aria-label',window.SILENCIO?'Poner el sonido':'Quitar el sonido')};
 if(bp)bp.onclick=()=>pausa(false);
 if(bs){pintaSon();bs.onclick=()=>{window.SILENCIO=!window.SILENCIO;ls.set('ipe_silencio',window.SILENCIO?'1':'0');pintaSon();if(!window.SILENCIO)suena('toque')}}
}
function anuncia(t){const a=$('#anuncio');if(!a)return;a.textContent='';setTimeout(()=>{a.textContent=t},60)}
function rachaHtml(){return `<span class="racha${st.racha>1?' on':''}" id="racha"><span class="sr">Multiplicador de racha: </span><span aria-hidden="true">${st.racha>1?'🔥 ':''}</span>${multTxt(st.racha)}</span>`}
function pintaRacha(sube){
 const r=$('#racha');if(!r)return;
 r.outerHTML=rachaHtml();
 if(sube&&st.racha>1){const n=$('#racha');n.classList.add('pop');n.addEventListener('animationend',()=>n.classList.remove('pop'),{once:true})}
}
/* 17-11-2026: si la página se oculta (llamada, bloqueo, otra aplicación) se tapa la pregunta y el reloj se para.
   18-11-2026 (como en Serpiente): la pausa es un menú «Seguir / Salir al menú» que tapa toda la pantalla (la pregunta y las
   opciones no se pueden leer con el reloj parado) y deja el juego inerte. Se abre con ❚❚ del marcador, Esc o P, al ocultar la
   página, al perder el foco (blur, pagehide), al girar el móvil y con el «atrás» de la oficial (PAUSA_JUEGO, la llama oficial.js).

/* «Repasa» con la página del libro de tu ciclo (sale del código de lista; sin código, solo el apartado). */
function libro(ud, ap, txt) {
  let c = '';
  try { c = (/^[12]([A-Z]{2,5})-/.exec((localStorage.getItem('ipe_codigo') || '').toUpperCase()) || [])[1] || '' } catch (e) {}
  const p = (((typeof PAGINAS !== 'undefined' && PAGINAS['UD' + ud]) || {})[c] || {})[ap];
  return `📖 En el libro: UD ${ud}, apartado ${txt || ap}${p ? `, página ${p}` : ''}`;
}

/* Diálogo propio (fase 2, 17-11-2026): sustituye a alert y confirm del navegador, que en el móvil parecen un error y no
   llevan los colores del centro. dialogo(texto) avisa; dialogo(texto, {si, no}) pregunta y devuelve true o false. */
function dialogo(txt, op) {
  return new Promise(res => {
    const antes = document.activeElement;
    const fondo = document.createElement('div'); fondo.className = 'dlg-fondo';
    const caja = document.createElement('div'); caja.className = 'dlg';
    caja.setAttribute('role', op ? 'alertdialog' : 'dialog'); caja.setAttribute('aria-modal', 'true');
    const p = document.createElement('p'); p.id = 'dlg-txt'; p.textContent = txt; caja.setAttribute('aria-describedby', 'dlg-txt');
    const bs = document.createElement('div'); bs.className = 'dlg-btns';
    const boton = (texto, clase, v) => { const b = document.createElement('button'); b.type = 'button'; b.className = clase; b.textContent = texto; b.onclick = e => { e.stopPropagation(); fin(v) }; bs.appendChild(b); return b };
    const tecla = e => {
      e.stopPropagation();                                   // el juego no se entera de las teclas mientras está abierto
      if (e.key === 'Escape') { e.preventDefault(); fin(!op) }
      else if (e.key === 'Tab') { const l = [...bs.children], i = l.indexOf(document.activeElement); e.preventDefault(); l[(i + (e.shiftKey ? l.length - 1 : 1)) % l.length].focus() }
    };
    const fin = v => { document.removeEventListener('keydown', tecla, true); fondo.remove(); try { antes && antes.focus && antes.focus({ preventScroll: true }) } catch (e) {} res(v) };
    if (op) boton(op.no || 'No', 'no', false);
    const si = boton(op ? (op.si || 'Sí') : 'Entendido', 'si', true);
    caja.append(p, bs); fondo.appendChild(caja);
    ['pointerdown', 'touchstart', 'mousedown', 'click'].forEach(ev => fondo.addEventListener(ev, e => e.stopPropagation()));
    document.addEventListener('keydown', tecla, true);
    document.body.appendChild(fondo); si.focus({ preventScroll: true });
  });
}

/* ===== Sonido y respuesta física comunes (fase 5, 17-11-2026) =====
   Todo sintetizado con WebAudio (sin archivos). Un solo contexto: el «actx» del juego si lo declara (let actx=null) y,

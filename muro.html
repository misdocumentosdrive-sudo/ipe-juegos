<style>
:root{--verde:#004230;--verde2:#0d6b4f;--naranja:#ff5900;--amarillo:#fcd100;--fondo:#f4f8f6;--texto:#1d2a30;--gris:#5b6b70;--ok:#1a8a4a;--mal:#d33a1f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{background:var(--fondo);color:var(--texto);font:16px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:520px;min-height:100%;display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
h1,h2,.serif{font-family:Aleo,Georgia,serif}
.marca{font:800 13px Aleo,Georgia,serif;color:var(--verde);letter-spacing:.3px}
.pill{background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);white-space:nowrap}
.confeti{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:cae linear forwards;z-index:9}

.nivel{border:0;border-radius:18px;padding:16px;text-align:left;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.07);cursor:pointer;display:flex;gap:14px;align-items:center}

.nivel b{display:block;font:800 17px Aleo,Georgia,serif;color:var(--verde)}

.final{text-align:center}
.final .gran{font:800 56px Aleo,Georgia,serif;color:var(--verde);margin:4px 0}
.estrellas{font-size:34px;letter-spacing:4px;color:var(--amarillo);text-shadow:0 1px 0 #c9a400}

.btn.p{background:var(--verde);color:#fff}
.btn.s{background:#e3ece8;color:var(--verde)}
.pie{text-align:center;font-size:12px;color:var(--gris);margin-top:auto;padding-top:14px}
.oficial{background:#fff;border:2px solid var(--verde);border-radius:16px;padding:14px;margin:14px 0;text-align:left;display:grid;gap:8px}
.oficial label span,.oficial small{font-size:13px;opacity:.75}
.oficial input{font:700 20px/1.2 "Helvetica Neue",Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;padding:10px 12px;border:2px solid #cfd8d3;border-radius:10px;width:100%;box-sizing:border-box}
.oficial input.error{border-color:#c0392b;background:#fdecea}
.oficial .btn[disabled]{opacity:.5}
.entreno{color:var(--verde);font-size:18px;margin:6px 0 4px;text-align:left}
.aviso-of{background:#fff8d6;border:2px solid #fcd100;border-radius:14px;padding:12px;margin:14px 0;line-height:1.5}
#envio{margin-top:8px;font-weight:700;color:var(--verde)}
.libro{font-size:14px;color:var(--verde2)}
/* presentación del nivel */
.intro{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px}
.intro .drama{background:var(--verde);color:#fff;border-radius:18px;padding:16px 18px;font-size:16px;line-height:1.5}

.intro h1{color:var(--verde);margin:0;font-size:27px;line-height:1.15}
.reglas{background:#fff;border-radius:16px;padding:12px 16px;font-size:15px;line-height:1.45;box-shadow:0 3px 10px rgba(0,0,0,.06)}

.cats{display:grid;gap:6px;margin-top:8px}
.cat{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.cat i{font-style:normal;flex:none;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff}
.cat i .ico{width:18px;height:18px}
/* pantalla de juego */
#app.jugando{max-width:none;padding:8px 8px calc(8px + env(safe-area-inset-bottom));height:100%;min-height:0;background:#00281d}
.juego{flex:1;display:flex;flex-direction:column;min-height:0}
.hud{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;width:100%;margin:0 auto 6px}

.hud .pill.exp{background:rgba(194,68,0,.95)}   /* contraste AA con el texto blanco (antes 4,1:1) */
.hud button.pill{border:0;cursor:pointer;font:inherit;font-weight:700;min-width:44px;min-height:44px;font-size:18px;display:inline-flex;align-items:center;justify-content:center}

.reglas summary{cursor:pointer;font-weight:700;color:var(--verde);min-height:44px;display:flex;align-items:center}
#lienzo{display:block;touch-action:none;border-radius:14px;box-shadow:0 0 0 3px #d9a35f,0 0 0 6px #8a5a2e,0 1px 0 7px rgba(255,236,200,.25),0 10px 30px rgba(0,0,0,.45);cursor:none}   /* 22-11-2026 (lote 6): el muro dentro de un marco de obra de madera de plastilina */
/* 22-11-2026 (decisión 3 de José): casilla «Más tiempo para leer», como en la nómina */
label.lento{display:flex;gap:10px;align-items:flex-start;text-align:left;margin:0 0 4px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.7);font-size:14px;line-height:1.35;color:var(--gris);cursor:pointer}
label.lento b{color:var(--verde)}
label.lento input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--verde)}
.tarjeta{position:absolute;inset:0;display:flex;align-items:safe center;justify-content:center;padding:26px 12px 12px;overflow-y:auto;background:rgba(0,20,14,.55);backdrop-filter:blur(2px);z-index:5}
.ficha{position:relative;width:100%;max-width:460px;background:linear-gradient(#fdf8ec,#f2e5c8);border-radius:18px;padding:16px;margin:auto 0;
 box-shadow:inset 0 3px 0 rgba(255,255,255,.85),inset 0 -5px 0 rgba(120,80,20,.14),0 12px 40px rgba(0,0,0,.45);animation:abreCarpeta .3s cubic-bezier(.3,1.5,.5,1)}
/* 22-11-2026 (lote 6): el expediente es una carpeta de plastilina: pestaña naranja y se abre con un salto */
#tarjeta .ficha::before{content:'';position:absolute;left:18px;top:-13px;width:112px;height:24px;border-radius:12px 12px 4px 4px;z-index:-1;
 background:linear-gradient(#ff9a52,#e04e00);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 -1px 3px rgba(0,0,0,.2)}
@keyframes abreCarpeta{0%{transform:scale(.35) translateY(40px);opacity:0}100%{transform:none;opacity:1}}
/* respuestas: placas de plastilina en relieve del color de cada tipo (la placa crema da la forma y la luz) */
@media (max-width:400px){.resps.c4 .resp{padding:10px 11px;font-size:13.5px;gap:6px}.resps.c4 .resp .ico{width:18px;height:18px}}   /* 22-11-2026: a 360 px partía «Enfermedad» */
.resp kbd{position:absolute;left:8px;top:4px;font:700 10px "Helvetica Neue",Arial,sans-serif;opacity:.75;text-shadow:none}   /* 22-11-2026 (lote 7): las teclas 1-4 ya funcionaban, pero no se veían */
/* 22-11-2026 (José): rectangulares con las esquinas suaves (antes, cápsulas), como en Cada minuto cuenta y Señales. El color va en una capa
   con las mismas esquinas que la placa (ya no hace falta máscara) y la placa crema rectangular, estirada en 9 trozos, le pone la luz */
.resp .pl{position:absolute;inset:1px;z-index:-1;background:var(--c);border-radius:12px}
.resp .pl::after{content:'';position:absolute;inset:-1px;border:0 solid transparent;border-radius:13px;background:url(aux_rect_crema.webp) center/100% 100% no-repeat;border-image:url(aux_rect_crema.webp) 52 fill / 15px / 0 stretch;mix-blend-mode:multiply}
/* sello del expediente: «Cerrado» (verde) al acertar y «Revisar» (rojo) al fallar, con el lacre de la nómina */
.sello-f{position:absolute;right:6px;top:-36px;width:82px;height:82px;display:grid;place-items:center;transform:rotate(-12deg);pointer-events:none;z-index:2;animation:sella .32s cubic-bezier(.3,1.8,.5,1) both}
/* 22-11-2026: «CERRAD»: el sello asomaba 4 px por la derecha de la tarjeta (que recorta) y la palabra no cabía en el disco y tapaba el final del título del veredicto (ahora el título deja sitio al sello). Además, «.veredicto b» (16 px) pisaba la letra
   del sello: ahora la regla del sello pesa más */
.veredicto>b:first-child{display:block;padding-right:40px}
.sello-f img{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.sello-f.ok img{filter:hue-rotate(125deg) saturate(.85) brightness(.95) drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.veredicto .sello-f b{position:relative;margin:0;font:800 11px Aleo,Georgia,serif;letter-spacing:.3px;color:#fff6e8;text-transform:uppercase;text-shadow:0 -1px 0 rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.25)}
@media (prefers-reduced-motion:reduce){.ficha,.sello-f{animation:none}.reloj i::after{animation:none}}
@keyframes entra{from{transform:scale(.85);opacity:0}}
.ficha .eti{font:800 12px Aleo,Georgia,serif;letter-spacing:1.5px;color:#c24400;text-transform:uppercase}
.ficha .caso{font:600 18px/1.4 Aleo,Georgia,serif;color:var(--texto);margin:6px 0 10px}
.reloj{height:10px;background:rgba(90,58,20,.14);border-radius:99px;margin:2px 7px 14px 0;box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.reloj i{display:block;position:relative;height:100%;width:100%;border-radius:99px;background:repeating-linear-gradient(115deg,#8a5a2e 0 5px,#c29052 5px 9px);
 box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.25)}   /* 22-11-2026 (lote 6): el tiempo es una mecha que se consume */
.reloj i::after{content:'';position:absolute;right:-8px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;
 background:radial-gradient(circle,#fff8cc 0 22%,#ffc21a 42%,rgba(255,89,0,.55) 58%,rgba(255,89,0,0) 72%);animation:chispa .14s infinite alternate}
@keyframes chispa{from{transform:scale(.8)}to{transform:scale(1.18)}}
.resps{display:grid;gap:8px}
.resps.c4{grid-template-columns:repeat(2,minmax(0,1fr))}   /* 22-11-2026 (lote 1): con 1fr no encogían y a 360 px se salían 20 px de la ficha */
.resp{position:relative;isolation:isolate;min-width:0;min-height:56px;hyphens:manual;border:0;border-radius:13px;background:transparent!important;text-shadow:0 1px 0 rgba(0,0,0,.35);padding:12px 16px;font:700 15px "Helvetica Neue",Arial,sans-serif;color:#fff;cursor:pointer;display:flex;align-items:center;gap:8px;text-align:left;line-height:1.2}
.resp .ico{width:22px;height:22px}
.resp:disabled{cursor:default;opacity:.35}
.resp.bien{opacity:1;outline:3px solid #1a8a4a;outline-offset:2px}
.resp.elegida{opacity:1}
.resp.elegida:not(.bien){outline:3px solid var(--mal);outline-offset:2px}
.resp.elegida:not(.bien)::after{content:'✗';position:absolute;top:-9px;right:-6px;width:26px;height:26px;border-radius:50%;background:var(--mal);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:900;box-shadow:0 2px 5px rgba(0,0,0,.3)}
.resp.bien::after{content:'✓';position:absolute;top:-9px;right:-6px;width:26px;height:26px;border-radius:50%;background:#1a8a4a;color:#fff;display:grid;place-items:center;font-size:15px;font-weight:900;box-shadow:0 2px 5px rgba(0,0,0,.3)}   /* 22-11-2026 (lote 1): la marca, en la esquina; al lado del texto partía «Enfermedad profesional» en trozos */
.veredicto{position:relative;margin-top:12px;border-radius:12px;padding:10px 58px 10px 12px;font-size:15px;display:none}
.veredicto.ok{display:block;background:#e3f4ea;color:#0b5a2f}
.veredicto.mal{display:block;background:#fde8e3;color:#8c2512}
.veredicto b{display:block;font:800 16px Aleo,Georgia,serif;margin-bottom:2px}
.seguir{margin-top:10px;width:100%;border:0;border-radius:12px;padding:12px;font:800 16px Aleo,Georgia,serif;background:var(--verde);color:#fff;cursor:pointer;display:none}
.aviso-c{position:absolute;left:50%;top:65%;transform:translate(-50%,-50%);max-width:88%;padding:8px 18px 9px;border-radius:16px;text-align:center;pointer-events:none;z-index:4;
 background:linear-gradient(#fff6d2,#f0d27e);color:#5a3a00;font:800 19px/1.15 Aleo,Georgia,serif;
 box-shadow:inset 0 2px 0 rgba(255,255,255,.8),inset 0 -3px 0 rgba(120,80,0,.18),0 5px 12px rgba(0,0,0,.38)}   /* 22-11-2026 (lote 5): cinta de plastilina en la zona vacía, no encima del muro */
.aviso-c small{display:block;font:600 13.5px/1.25 "Helvetica Neue",Arial,sans-serif;color:#6b4a10;margin-top:3px}
.aviso-c .ico{width:18px;height:18px;vertical-align:-3px}
/* 22-11-2026 (lote 5): marcador de plastilina: corazones que se aplastan, chapa de racha y cifras que ruedan */
.hud .vidas{display:inline-flex;gap:2px;align-items:center}
.hud .cor{display:inline-block;width:18px;height:18px;color:#e2413b;filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
.hud .cor .ico{width:18px;height:18px}
.hud .cor.pierde{animation:aplasta .45s ease-in forwards}
@keyframes aplasta{40%{transform:scale(1.35,.55)}100%{transform:scale(1.6,0);opacity:0}}
.hud .pill.racha{background:#c24400;display:none;gap:3px;align-items:center}
.hud .pill.racha.si{display:inline-flex;animation:entra .25s ease-out}
.hud .pill.racha .ico{width:15px;height:15px}
/* presentación de una pantalla: frase, tres pictogramas y el botón a la vista */
.intro .frase{margin:2px 0 10px;font-size:16px;line-height:1.4}
.intro .pictos{display:flex;gap:8px;margin:0 0 12px}
.intro .pictos span{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:14px;background:#fff;font-size:12.5px;line-height:1.2;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.intro .pictos .ico{width:26px;height:26px;color:var(--naranja)}
.intro .tipos{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.intro .tipos span{display:inline-flex;gap:5px;align-items:center;padding:5px 10px 5px 6px;border-radius:99px;color:#fff;font-size:13px;font-weight:700}
.intro .tipos .ico{width:16px;height:16px}
.intro details.reglas>summary{cursor:pointer;font-weight:800;color:var(--verde)}
/* final: estrellas que caen, puntos que ruedan y el sello del muro */
.final .estrellas span{display:inline-block}
.final .estrellas span:not(.cae){color:#8a7a55;text-shadow:none}   /* 22-11-2026 (lote 7): la vacía tenía 1,37:1 */
.final .estrellas span.cae{animation:caeEst .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes caeEst{0%{transform:translateY(-40px) scale(1.4);opacity:0}100%{transform:none;opacity:1}}
.sello-m{display:inline-block;margin:6px 0 2px;padding:6px 14px;border-radius:12px;border:3px solid currentColor;font:800 15px Aleo,Georgia,serif;letter-spacing:2px;text-transform:uppercase;transform:rotate(-6deg);
 color:#1f7a4a;background:rgba(31,122,74,.08);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(0,0,0,.08);animation:sella .35s cubic-bezier(.3,1.8,.5,1) .9s both}
.sello-m.mal{color:#8c2512;background:rgba(140,37,18,.07)}
@keyframes sella{0%{transform:rotate(-6deg) scale(2.2);opacity:0}100%{transform:rotate(-6deg) scale(1);opacity:1}}
.archivo{margin:2px 0 8px;padding:10px 14px;border-radius:14px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);font-size:14px}
.archivo .barra{height:8px;border-radius:99px;background:#eadfcf;overflow:hidden;margin-top:6px}
.archivo .barra i{display:block;height:100%;background:linear-gradient(90deg,#2f8a5b,#0d6b4f);border-radius:99px}
@media (prefers-reduced-motion:reduce){.hud .cor.pierde,.final .estrellas span.cae,.sello-m{animation:none}}
html,body{overscroll-behavior:none}
/* 18-11-2026 (como en Serpiente): un solo menú de pausa; con un expediente abierto lo tapa entero (reloj parado = no se lee) */
.tarjeta.velo{z-index:6}
.tarjeta.tapa{background:#0b1f19;backdrop-filter:none}
/* foco visible también sobre fondo claro (doble anillo) y botones táctiles de 44 px como mínimo */
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #fcd100;outline-offset:2px;box-shadow:0 0 0 6px #004230}
.hud .ctl{display:flex;gap:6px}
.hud .ctl .ico{width:22px;height:22px}
/* 22-11-2026 (José): el marcador, con las mismas placas de plastilina rectangulares que Cada minuto cuenta y Señales (antes, cápsulas lisas
   translúcidas): marrón; expedientes y racha, naranja. Se estiran en 9 trozos (las esquinas no se deforman) con la misma placa
   entera debajo (tapa las rendijas de las escalas fraccionarias) */
.hud .pill,.hud .pill.exp,.hud .pill.racha{border:0 solid transparent;border-radius:13px;background:var(--placa,url(aux_rect_marron.webp)) center/100% 100% no-repeat;box-shadow:none;border-image:var(--placa,url(aux_rect_marron.webp)) 52 fill / 15px / 0 stretch!important;
 color:#fbf6ec;text-shadow:0 -1px 0 rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.18);filter:drop-shadow(0 3px 3px rgba(0,0,0,.38));padding:7px 10px}
.hud .pill.exp,.hud .pill.racha{--placa:url(aux_rect_naranja.webp);color:#fff;text-shadow:0 -1px 0 rgba(0,0,0,.45)}
@media (max-width:440px){.hud{gap:4px}.hud .pill,.hud .pill.exp,.hud .pill.racha{padding:6px 8px}.hud .ctl{gap:4px}}
@media (max-width:380px){.hud{gap:3px}.hud .pill,.hud .pill.exp,.hud .pill.racha{padding:5px 5px;font-size:12px}.hud .ctl{gap:3px}.hud .cor,.hud .cor .ico{width:15px;height:15px}.hud .pill.racha .ico{width:13px;height:13px}}
/* 22-11-2026: con la racha a la vista («×1,5»), el marcador partía en dos filas en el móvil y el ordenador (placas más anchas que las
   cápsulas lisas). Ahora cabe en una fila de 320 px en adelante con las cinco piezas y 4 vidas */

/* 22-11-2026 (revisión total, lote 1): sorteo con mínimos y máximos por tipo. Antes era al azar y el accidente de trabajo dominaba
   las bolsas: pulsando siempre «Accidente de trabajo» el 83 % de las partidas sacaba +0,10, y en el nivel 3 de IFC e ITE la mitad
   no tenía ninguna patología inespecífica (lo nuevo del nivel). Primero se fija cuántos de cada tipo (dentro de su margen) y luego
   se eligen los casos como antes: 3 del sector, dos parejas del mismo riesgo y el resto de la bolsa común, sin pasar de su tipo */
const CUPOS={1:{at:[3,5],nl:[3,5]},2:{at:[2,3],ep:[2,3],nl:[2,3]},3:{at:[2,3],in:[2,2],ep:[1,2],nl:[2,2]}};
function cupoDe(n){
 const C=CUPOS[n], ks=Object.keys(C);
 for(let i=0;i<200;i++){const t={};ks.forEach(k=>t[k]=C[k][0]+Math.floor(Math.random()*(C[k][1]-C[k][0]+1)));
  if(ks.reduce((s,k)=>s+t[k],0)===EXPEDIENTES)return t}
 const t={};ks.forEach(k=>t[k]=C[k][0]);let sobra=EXPEDIENTES-ks.reduce((s,k)=>s+t[k],0);   // no pasa con los márgenes de ahora
 for(const k of baraja(ks))while(sobra>0&&t[k]<C[k][1]){t[k]++;sobra--}
 return t;
}
function casosDe(n){
 const b=CASOS[n], c=ciclo(), t=cupoDe(n), cabe=x=>(t[x[1]]||0)>0, toma=(l,x)=>{l.push(x);t[x[1]]--};
 const sec=c&&b[c]?b[c]:baraja([].concat(...['HIG','IFC','ITE','STI'].map(k=>b[k]))).slice(0,3);
 const com=baraja(b.comun), eleg=[];
 for(const x of baraja(sec)){if(eleg.length>=3)break;if(cabe(x))toma(eleg,x)}
 /* fase 6, 17-11-2026: dos factores salen con dos expedientes cada uno, así se ve que el mismo riesgo da daños distintos y las
    manchas de ladrillos son más grandes. 22-11-2026: la pareja se elige al azar entre las que caben en el cupo */
 let parejas=0;
 for(const fa of baraja(Object.keys(FACTORES))){if(parejas>=2)break;
  const de=com.filter(x=>x[4]===fa&&!eleg.includes(x));
  for(let i=0;i<de.length&&parejas<2;i++)for(let j=i+1;j<de.length;j++){const [p,q]=[de[i],de[j]];
   if(p[1]===q[1]?(t[p[1]]||0)>=2:cabe(p)&&cabe(q)){toma(eleg,p);toma(eleg,q);parejas++;i=de.length;break}}}
 for(const x of com){if(eleg.length>=EXPEDIENTES)break;if(!eleg.includes(x)&&cabe(x))toma(eleg,x)}
 for(const x of baraja(sec.concat(com))){if(eleg.length>=EXPEDIENTES)break;if(!eleg.includes(x))eleg.push(x)}   // por si faltasen casos de un tipo
 return baraja(eleg).slice(0,EXPEDIENTES).map(([texto,r,ex,ap,fa])=>({texto,r,ex,ap,fa}));
}

/* ===== Motor ===== */
/* Fase 5, 17-11-2026 (sensación de juego):
   · CAMPO LÓGICO FIJO de 360×640 para todos los dispositivos (antes el ancho, el alto y las columnas dependían de la pantalla:
     el ranking dependía del móvil). Se escala a la pantalla y sobran bandas a los lados o arriba y abajo.
   · FÍSICA DE PASO FIJO a 120 Hz con acumulador: la misma partida a 30, 60 o 120 fotogramas por segundo.
   · CONTROL RELATIVO: la pala sigue el desplazamiento del dedo desde cualquier punto de la mitad inferior (no se coloca bajo
     el dedo, que tapaba la bola). El ratón y las flechas siguen igual. Un toque corto lanza la bola. */
const CW=360, CH=640, PASO=1/120, COLS=8, BW=(CW-2*12-(COLS-1)*5)/COLS, BH=30, TOP=84;
const SENS=1.25;                                  /* el dedo recorre menos que la pala: 1 cm de dedo ≈ 1,25 cm de pala */
const AYUDA=15*Math.PI/180, AMIN=Math.asin(.3);   /* ayuda de puntería ≤15° · la bola nunca sale a menos de ~17° de la horizontal */
/* tutorial jugable (la primera vez, solo en entrenamiento) y sorpresas ya explicadas */

function parar(){cancelAnimationFrame(raf);raf=0;clearInterval(st.reloj);if(st.obs)st.obs.disconnect();removeEventListener('keydown',tecla);removeEventListener('keyup',teclaUp);if(st.pm){removeEventListener('pointermove',st.pm);removeEventListener('pointerdown',st.pd);removeEventListener('pointerup',st.pu);removeEventListener('pointercancel',st.pu)}document.removeEventListener('visibilitychange',oculta);removeEventListener('blur',oculta);removeEventListener('pagehide',oculta)}

/* El muro: igual en todos los dispositivos (8 columnas, ladrillos de 30 de alto con su pictograma) */
function montaMuro(l,n,casos){
 const filas=l.filas, ladr=[];   /* filas completas (José, 13-11-2026) */
 /* nivel 3 en forma de rombo con «núcleo duro» (José, 13-11-2026): borde de 1 golpe, interior gris (2), corazón gris oscuro (3) */
 const anchos=l.forma==='rombo'?[2,4,6,8,6,4,2]:Array(filas).fill(COLS);
 const medio=(anchos.length-1)/2;
 anchos.forEach((w,f)=>{const c0=(COLS-w)/2;for(let c=c0;c<c0+w;c++){
  const L={x:12+c*(BW+5),y:TOP+f*(BH+5),w:BW,h:BH,f,c,vida:1,fa:'',exp:false,vivo:true};
  if(l.forma==='rombo'){const borde=c===c0||c===c0+w-1||f===0||f===anchos.length-1;
   if(!borde){L.duro=true;L.vida=(Math.abs(f-medio)<=1&&Math.abs(c+.5-COLS/2)<=1)?3:2}}
  ladr.push(L)}});
 /* expedientes: repartidos por el muro, nunca en un ladrillo duro */
 const cand=baraja(ladr.filter(b=>!b.duro));
 /* 22-11-2026 (revisión total, decisión 5 de José): uno de los expedientes, siempre en la fila de abajo (en el nivel 2 el primero
    llegaba a los ~23 s): la primera carpeta cae enseguida */
 const abajo=Math.max(...cand.map(b=>b.f)), elegidos=[cand.find(b=>b.f===abajo)];for(const b of cand){if(elegidos.length>=EXPEDIENTES)break;if(elegidos.every(e=>Math.abs(e.x-b.x)+Math.abs(e.y-b.y)>BW*1.2))elegidos.push(b)}
 for(const b of cand){if(elegidos.length>=EXPEDIENTES)break;if(!elegidos.includes(b))elegidos.push(b)}
 /* fase 6, 17-11-2026 («el ladrillo es la causa»): cada expediente va en un ladrillo de su factor de riesgo y los demás
    ladrillos toman el factor del expediente más cercano, así que cada riesgo forma una mancha de ladrillos vecinos */
 const fas=casos&&casos.length?casos.map(x=>x.fa):baraja(Object.keys(FACTORES)).slice(0,EXPEDIENTES);
 elegidos.forEach((b,i)=>{b.exp=true;b.fa=fas[i%fas.length];if(casos&&casos[i])b.caso=casos[i]});
 const orden=baraja(elegidos);
 for(const b of ladr)if(!b.exp){let m=orden[0],dm=1e9;
  for(const e of orden){const df=Math.abs(e.f-b.f),dc=Math.abs(e.c-b.c),d=Math.max(df,dc)+(df+dc)*.01;if(d<dm){dm=d;m=e}}
  b.fa=m.fa}
 /* sorpresas escondidas (no se ven hasta romper el ladrillo): 3 en el nivel 1 y 4 en los demás, de tipos distintos */
 const tipos=baraja(Object.keys(SORPRESAS)).slice(0,n===1?3:4);
 baraja(ladr.filter(b=>!b.exp&&b.vida===1)).slice(0,tipos.length).forEach((b,k)=>b.sorpresa=tipos[k]);
 return ladr;
}

 st.fondo=pintaFondo(W,H);
 nuevaBola();

 /* mando */

@media (prefers-reduced-motion:reduce){.confeti{display:none}.sacude{animation:none}*{scroll-behavior:auto!important}
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
button,a,input,.op,.resp{touch-action:manipulation}
.dlg-fondo{position:fixed;inset:0;z-index:1000;background:rgba(0,30,22,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.dlg{background:#fff;color:#1d2a30;border-radius:18px;max-width:420px;width:100%;padding:22px 20px 18px;box-shadow:0 18px 50px rgba(0,0,0,.35);font:16px/1.5 "Helvetica Neue",Arial,sans-serif;text-align:left}
.dlg p{white-space:pre-line;margin:0 0 18px}
.dlg-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.dlg button{border:0;border-radius:12px;padding:12px 18px;min-height:44px;font:700 16px Aleo,Georgia,serif;cursor:pointer;background:#004230;color:#fff}
.dlg button.no{background:#e3efe9;color:#004230}
/* portada común de la colección (fase 2): la tarjeta oscura de Serpiente, Auxilios y Aventura, para todos */
:where(.heroe){position:relative;border-radius:24px;padding:22px 18px 18px;text-align:left;color:#fff;overflow:hidden;background:radial-gradient(circle at 85% 10%,var(--brillo,rgba(252,209,0,.28)),transparent 45%),linear-gradient(160deg,#0b5a40,#062a1f 70%);box-shadow:0 14px 30px rgba(0,66,48,.35)}
:where(.heroe) .hm{font:700 12px "Helvetica Neue",Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#a8e6cc}
:where(.heroe) h1{color:#fff;font-size:40px;line-height:1;margin:8px 0 4px}
:where(.heroe h1) span{color:#fcd100}
:where(.heroe) p{color:#d8efe6;font-size:14.5px;line-height:1.45;margin:6px 0 10px}
:where(.heroe) .chips{display:flex;flex-wrap:wrap;gap:6px}
:where(.heroe .chips) span{font:700 12px "Helvetica Neue",Arial,sans-serif;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 10px;color:#fff}`;
  document.head.appendChild(css);

  /* Botones de opciones: al final de la portada, para no tapar nada mientras se juega. */
  const caja = document.createElement('div');
  caja.className = 'opcs';
  /* lee (opcional): de dónde sale el estado real. 18-11-2026: el sonido también se cambia desde el marcador de los juegos; al
     volver a la portada, el botón se repinta con el estado real (antes enseñaba el antiguo y el primer toque no hacía nada) */
  function boton(texto, activo, alCambiar, lee) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'opc';
    const pinta = v => { b.setAttribute('aria-pressed', v ? 'true' : 'false'); b.textContent = texto(v) };
    let v = activo; pinta(v);
    b.sync = () => { if (lee) { v = lee(); pinta(v) } };
    b.onclick = e => { e.stopPropagation(); b.sync(); v = !v; pinta(v); alCambiar(v) };
    caja.appendChild(b);
    return b;
  }
  const muestra = () => { const p = app && app.querySelector('.portada'); [...caja.children].forEach(b => b.sync && b.sync()); if (p && caja.children.length && caja.parentNode !== p) p.appendChild(caja) };
  if (app) new MutationObserver(muestra).observe(app, { childList: true });

  /* Sonido sí/no: en todos los juegos desde la fase 5 (también quita la vibración). */
  {
    const aplica = () => {
      try {
        const c = typeof actx !== 'undefined' && actx ? actx : AUDIO.ctx;
        if (window.SILENCIO) { if (c) c.suspend(); try { window.speechSynthesis && speechSynthesis.cancel() } catch (e) {} }
        else if (c && c.state === 'suspended') c.resume();
      } catch (e) {}
    };
    window.SILENCIO = L.get('ipe_silencio', '0') === '1';
    boton(v => v ? '🔊 Sonido y vibración' : '🔇 Sin sonido ni vibración', !window.SILENCIO, v => { window.SILENCIO = !v; L.set('ipe_silencio', v ? '0' : '1'); aplica() }, () => !window.SILENCIO);
    aplica();
    /* si el juego crea el sonido después, se vuelve a silenciar */
    document.addEventListener('click', () => setTimeout(aplica, 0), true);
    document.addEventListener('touchend', () => setTimeout(aplica, 0), true);
  }

  /* Ayuda de colores para daltonismo (solo señales: escribe el color de la señal en el nivel 1). */
  if (typeof GIRO !== 'undefined') {
    window.AYUDA_COLOR = L.get('ipe_ayuda_color', '0') === '1';
    boton(v => v ? '👁 Ayuda de colores: sí' : '👁 Ayuda de colores: no', window.AYUDA_COLOR,
      v => { window.AYUDA_COLOR = v; L.set('ipe_ayuda_color', v ? '1' : '0') });
  }
  muestra();

  /* Instalable (solo en línea desde el 9-11-2026: sw.js no guarda copias, siempre carga de internet). */
  if ('serviceWorker' in navigator && location.protocol === 'https:')
    navigator.serviceWorker.register('sw.js').catch(() => {});
})();

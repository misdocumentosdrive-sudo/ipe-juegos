<title>Muro de daños · IPE I</title>
<style>@font-face{font-family:"Aleo";src:url(aleo.woff2?v=d7c8feba) format("woff2"),url(aleo.ttf?v=fed0d713) format("truetype");font-weight:100 900;font-style:normal;font-display:swap}</style>
<style>
:root{--verde:#004230;--verde2:#0d6b4f;--naranja:#ff5900;--amarillo:#fcd100;--fondo:#f4f8f6;--texto:#1d2a30;--gris:#5b6b70;--ok:#1a8a4a;--mal:#d33a1f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--fondo);color:var(--texto);font:16px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:520px;min-height:100%;display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
h1,h2,.serif{font-family:Aleo,Georgia,serif}
.marca{font:800 13px Aleo,Georgia,serif;color:var(--verde);letter-spacing:.3px}
.pill{background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);white-space:nowrap}
.confeti{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:cae linear forwards;z-index:9}
@keyframes cae{to{transform:translateY(105vh) rotate(720deg)}}
.portada{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px}
.portada>h1{font-size:34px;color:var(--verde);margin:0;line-height:1.1}
.portada>p{color:var(--gris);margin:0}
.muestra{display:flex;justify-content:center;gap:5px;margin:4px 0}
.muestra i{display:block;width:44px;height:20px;border-radius:5px;background:linear-gradient(#3d8a70,#2f6c5a);box-shadow:inset 0 3px 0 rgba(255,255,255,.18)}
.muestra i.x{background:linear-gradient(#ff7a33,#e04e00);display:flex;align-items:center;justify-content:center;color:#fff}
.muestra i.x .ico{width:14px;height:14px}
.ico{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none;display:inline-block}
.nivel{border:0;border-radius:18px;padding:16px;text-align:left;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.07);cursor:pointer;display:flex;gap:14px;align-items:center}
.nivel .n{flex:none;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 20px Aleo,Georgia,serif;color:#fff}
.nivel b{display:block;font:800 17px Aleo,Georgia,serif;color:var(--verde)}
.nivel span{font-size:14px;color:var(--gris)}
.record{font-size:13px;color:var(--gris)}
.final{text-align:center}
.final .gran{font:800 56px Aleo,Georgia,serif;color:var(--verde);margin:4px 0}
.estrellas{font-size:34px;letter-spacing:4px;color:var(--amarillo);text-shadow:0 1px 0 #c9a400}
.fallos{text-align:left;margin-top:16px}
.fallo{background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.fallo b{display:block;color:var(--verde);margin-top:4px}
.fallo small{color:var(--gris)}
.btns{display:grid;gap:10px;margin-top:16px}
.btn{border:0;border-radius:14px;padding:14px;font:800 17px Aleo,Georgia,serif;cursor:pointer}
.btn.p{background:var(--verde);color:#fff}
.btn.s{background:#e3ece8;color:var(--verde)}
.pie{text-align:center;font-size:12px;color:var(--gris);margin-top:auto;padding-top:14px}
.oficial{background:#fff;border:2px solid var(--verde);border-radius:16px;padding:14px;margin:14px 0;text-align:left;display:grid;gap:8px}
.oficial label span,.oficial small{font-size:13px;opacity:.75}
.oficial input{font:700 20px/1.2 inherit;letter-spacing:2px;text-transform:uppercase;padding:10px 12px;border:2px solid #cfd8d3;border-radius:10px;width:100%;box-sizing:border-box}
.oficial input.error{border-color:#c0392b;background:#fdecea}
.oficial .btn[disabled]{opacity:.5}
.entreno{color:var(--verde);font-size:18px;margin:6px 0 4px;text-align:left}
.aviso-of{background:#fff8d6;border:2px solid #fcd100;border-radius:14px;padding:12px;margin:14px 0;line-height:1.5}
#envio{margin-top:8px;font-weight:700;color:var(--verde)}
.libro{font-size:14px;color:var(--verde2)}
/* presentación del nivel */
.intro{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px}
.intro .drama{background:var(--verde);color:#fff;border-radius:18px;padding:16px 18px;font-size:16px;line-height:1.5}
.intro .drama b{color:var(--amarillo)}
.intro h1{color:var(--verde);margin:0;font-size:27px;line-height:1.15}
.reglas{background:#fff;border-radius:16px;padding:12px 16px;font-size:15px;line-height:1.45;box-shadow:0 3px 10px rgba(0,0,0,.06)}
.reglas ul{margin:6px 0 0;padding-left:20px}
.cats{display:grid;gap:6px;margin-top:8px}
.cat{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.cat i{font-style:normal;flex:none;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff}
.cat i .ico{width:18px;height:18px}
/* pantalla de juego */
#app.jugando{max-width:none;padding:8px 8px calc(8px + env(safe-area-inset-bottom));height:100%;min-height:0;background:#00281d}
.juego{flex:1;display:flex;flex-direction:column;min-height:0}
.hud{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.hud .pill{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;font-size:13px;padding:5px 10px}
.hud .pill.exp{background:rgba(194,68,0,.95)}   /* contraste AA con el texto blanco (antes 4,1:1) */
.hud button.pill{border:0;cursor:pointer;font:inherit;font-weight:700;min-width:44px;min-height:44px;font-size:18px;display:inline-flex;align-items:center;justify-content:center}
.marco{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
.saltar{position:absolute;top:6px;right:6px;z-index:4;min-height:44px;border:0;border-radius:999px;padding:8px 14px;background:rgba(0,0,0,.45);color:#fff;font:700 13px "Helvetica Neue",Arial,sans-serif;cursor:pointer}
.tuto-msg{background:#fff8d6;border-radius:10px;padding:8px 10px;margin:8px 0 0;font-size:14px;line-height:1.4;color:#1d2a30}
.tuto-msg .ico{color:#c24400}
.reglas .cortas{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.reglas .cortas li{display:flex;gap:8px;align-items:flex-start}
.reglas .cortas .ico{color:#c24400;margin-top:2px}
.reglas details{margin-top:8px;font-size:14px}
.reglas summary{cursor:pointer;font-weight:700;color:var(--verde);min-height:44px;display:flex;align-items:center}
#lienzo{display:block;touch-action:none;border-radius:14px;box-shadow:0 0 0 2px rgba(252,209,0,.25),0 10px 30px rgba(0,0,0,.45);cursor:none}
.tarjeta{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(0,20,14,.55);backdrop-filter:blur(2px);z-index:5}
.ficha{width:100%;max-width:460px;background:#fbf6ea;border-radius:18px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.45);border-top:8px solid var(--naranja);animation:entra .25s ease-out}
@keyframes entra{from{transform:scale(.85);opacity:0}}
.ficha .eti{font:800 12px Aleo,Georgia,serif;letter-spacing:1.5px;color:#c24400;text-transform:uppercase}
.ficha .caso{font:600 18px/1.4 Aleo,Georgia,serif;color:var(--texto);margin:6px 0 10px}
.reloj{height:6px;background:#eadfcf;border-radius:99px;overflow:hidden;margin-bottom:12px}
.reloj i{display:block;height:100%;background:var(--naranja);width:100%}
.resps{display:grid;gap:8px}
.resps.c4{grid-template-columns:1fr 1fr}
.resp{border:0;border-radius:12px;padding:12px 10px;font:700 15px "Helvetica Neue",Arial,sans-serif;color:#fff;cursor:pointer;display:flex;align-items:center;gap:8px;text-align:left;line-height:1.2}
.resp .ico{width:22px;height:22px}
.resp:disabled{cursor:default;opacity:.35}
.resp.bien{opacity:1;outline:3px solid #1a8a4a;outline-offset:2px}
.resp.elegida{opacity:1}
.resp.elegida:not(.bien){outline:3px solid var(--mal);outline-offset:2px}
.resp.elegida:not(.bien)::after{content:'✗';margin-left:auto;font-size:20px;font-weight:900}
.resp.bien::after{content:'✓';margin-left:auto;font-size:20px;font-weight:900}
.veredicto{margin-top:12px;border-radius:12px;padding:10px 12px;font-size:15px;display:none}
.veredicto.ok{display:block;background:#e3f4ea;color:#0b5a2f}
.veredicto.mal{display:block;background:#fde8e3;color:#8c2512}
.veredicto b{display:block;font:800 16px Aleo,Georgia,serif;margin-bottom:2px}
.seguir{margin-top:10px;width:100%;border:0;border-radius:12px;padding:12px;font:800 16px Aleo,Georgia,serif;background:var(--verde);color:#fff;cursor:pointer;display:none}
.aviso-c{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);color:#fff;font:800 24px Aleo,Georgia,serif;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,.6);pointer-events:none;z-index:4;white-space:nowrap}
.aviso-c small{display:block;font:600 14px "Helvetica Neue",Arial,sans-serif;opacity:.9;margin-top:4px}
html,body{overscroll-behavior:none}
/* 18-11-2026 (como en Serpiente): un solo menú de pausa; con un expediente abierto lo tapa entero (reloj parado = no se lee) */
.tarjeta.velo{z-index:6}
.tarjeta.tapa{background:#0b1f19;backdrop-filter:none}
/* foco visible también sobre fondo claro (doble anillo) y botones táctiles de 44 px como mínimo */
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #fcd100;outline-offset:2px;box-shadow:0 0 0 6px #004230}
.hud{width:100%;margin:0 auto 6px}
.hud .ctl{display:flex;gap:6px}
.hud .ctl .ico{width:22px;height:22px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* móvil girado: el campo es vertical; se pide girarlo y la partida se pausa */
.giro{display:none}
@media (orientation:landscape) and (max-height:500px) and (pointer:coarse){.juego .giro{display:flex;position:fixed;inset:0;z-index:30;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#0d2a20;color:#fff;font:800 20px Aleo,Georgia,serif;text-align:center;padding:20px}.giro span{font-size:46px}}
/* fase 6, 17-11-2026: factores de riesgo («el ladrillo es la causa») */
.fac{flex:none;width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-style:normal}
.fac .ico{width:15px;height:15px}
.fac.claro{color:#004230}
.facs{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:8px;font-size:13px}
.facs span{display:flex;gap:6px;align-items:center;line-height:1.2}
.ficha .riesgo{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--gris);margin-top:6px}
.ficha .riesgo b{color:var(--texto)}
.riesgos{text-align:left;margin-top:16px;background:#fff;border-radius:14px;padding:12px}
.riesgos h2{color:var(--verde);font-size:19px;margin:0 0 8px}
.riesgos .rg{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin-bottom:8px;line-height:1.35}
.riesgos small,.fallos h3 small{color:var(--gris)}
.fallos h3{display:flex;gap:8px;align-items:center;font:800 15px Aleo,Georgia,serif;color:var(--verde);margin:12px 0 6px}
/* arte, 17-11-2026: universo plastilina (escena del puesto detrás y la persona compañera del ciclo, que repasa contigo los expedientes) */
.heroe.escena{background:linear-gradient(180deg,rgba(0,40,29,.7) 0%,rgba(0,34,25,.86) 48%,rgba(0,24,17,.96) 100%),var(--escena) center 35%/cover no-repeat,#062a1f}
.heroe.escena h1,.heroe.escena .hm,.heroe.escena>p,.escena-n .drama{text-shadow:0 1px 3px rgba(0,0,0,.55)}
.heroe .narra{margin:12px 0 4px}
.escena-n{position:relative;border-radius:20px;overflow:hidden;padding:56px 12px 12px;background:linear-gradient(180deg,rgba(0,40,29,.12) 0%,rgba(0,32,23,.78) 58%,rgba(0,24,17,.94) 100%),var(--escena) center 30%/cover no-repeat,#0b5a40;box-shadow:0 10px 26px rgba(0,66,48,.3)}
.escena-n .drama{background:none;padding:0}
.escena-n .drama strong{color:var(--amarillo)}
.final .escena-n{margin:12px 0 4px;text-align:left}
.pres-globo b small{font:600 12px "Helvetica Neue",Arial,sans-serif;color:var(--gris)}
.pres-txt strong{color:#c24400;font-weight:800}
.pres-txt .fac{width:20px;height:20px;vertical-align:-5px;margin-right:3px}
.ficha .narra{margin:8px 0 2px}
.ficha .narra .pres-globo{background:#fff;font-size:14.5px}
.ficha .narra .pres-globo:before{border-right-color:#fff}
.tarjeta{overflow-y:auto;align-items:safe center}
.ficha{margin:auto 0}
#app.jugando{background:linear-gradient(rgba(0,30,22,.86),rgba(0,18,13,.94)),var(--escena,none) center/cover no-repeat,#00281d}
.muestra i{border-radius:8px;box-shadow:inset 0 3px 2px rgba(255,244,220,.35),inset 0 -3px 3px rgba(0,0,0,.22),0 3px 5px rgba(0,0,0,.35)}
</style>

/* Fase 5, 17-11-2026 (sensación de juego):
   · CAMPO LÓGICO FIJO de 360×640 para todos los dispositivos (antes el ancho, el alto y las columnas dependían de la pantalla:
     el ranking dependía del móvil). Se escala a la pantalla y sobran bandas a los lados o arriba y abajo.
   · FÍSICA DE PASO FIJO a 120 Hz con acumulador: la misma partida a 30, 60 o 120 fotogramas por segundo.
   · CONTROL RELATIVO: la pala sigue el desplazamiento del dedo desde cualquier punto de la mitad inferior (no se coloca bajo

const CW=360, CH=640, PASO=1/120, COLS=8, BW=(CW-2*12-(COLS-1)*5)/COLS, BH=30, TOP=84;
const SENS=1.25;                                  /* el dedo recorre menos que la pala: 1 cm de dedo ≈ 1,25 cm de pala */

/* tutorial jugable (la primera vez, solo en entrenamiento) y sorpresas ya explicadas */
const TUTO='muro_tutorial', VISTAS='muro_vistas';
const vistas=()=>{try{return JSON.parse(ls.get(VISTAS,'{}'))||{}}catch(e){return {}}};
const marcaVista=k=>{const v=vistas();if(v[k])return false;v[k]=1;ls.set(VISTAS,JSON.stringify(v));return true};

/* El muro: igual en todos los dispositivos (8 columnas, ladrillos de 30 de alto con su pictograma) */
function montaMuro(l,n,casos){
 const filas=l.filas, ladr=[];   /* filas completas (José, 13-11-2026) */
 /* nivel 3 en forma de rombo con «núcleo duro» (José, 13-11-2026): borde de 1 golpe, interior gris (2), corazón gris oscuro (3) */
 const anchos=l.forma==='rombo'?[2,4,6,8,6,4,2]:Array(filas).fill(COLS);
 const medio=(anchos.length-1)/2;
 anchos.forEach((w,f)=>{const c0=(COLS-w)/2;for(let c=c0;c<c0+w;c++){
  const L={x:12+c*(BW+5),y:TOP+f*(BH+5),w:BW,h:BH,f,c,vida:1,fa:'',exp:false,vivo:true};
  if(l.forma==='rombo'){const borde=c===c0||c===c0+w-1||f===0||f===anchos.length-1;
   if(!borde){L.duro=true;L.vida=(Math.abs(f-medio)<=1&&Math.abs(c+.5-COLS/2)<=1)?3:2}}
  ladr.push(L)}});
 /* nivel 3 sin rombo (por si vuelve): ladrillos de varios golpes según el color: gris = 2 golpes, gris oscuro = 3 */
 if(l.duros&&l.forma!=='rombo'){
  ladr.filter(b=>b.f<=1).forEach(b=>{b.vida=2;b.duro=true});
  baraja(ladr.filter(b=>b.f<=1)).slice(0,Math.round(COLS*.6)).forEach(b=>{b.vida=3});
  baraja(ladr.filter(b=>b.f===2)).slice(0,Math.round(COLS*.3)).forEach(b=>{b.vida=2;b.duro=true});
 }
 /* expedientes: repartidos por el muro, nunca en un ladrillo duro */
 const cand=baraja(ladr.filter(b=>!b.duro));
 const elegidos=[];for(const b of cand){if(elegidos.length>=EXPEDIENTES)break;if(elegidos.every(e=>Math.abs(e.x-b.x)+Math.abs(e.y-b.y)>BW*1.2))elegidos.push(b)}
 for(const b of cand){if(elegidos.length>=EXPEDIENTES)break;if(!elegidos.includes(b))elegidos.push(b)}
 /* fase 6, 17-11-2026 («el ladrillo es la causa»): cada expediente va en un ladrillo de su factor de riesgo y los demás
    ladrillos toman el factor del expediente más cercano, así que cada riesgo forma una mancha de ladrillos vecinos */
 const fas=casos&&casos.length?casos.map(x=>x.fa):baraja(Object.keys(FACTORES)).slice(0,EXPEDIENTES);
 elegidos.forEach((b,i)=>{b.exp=true;b.fa=fas[i%fas.length];if(casos&&casos[i])b.caso=casos[i]});
 const orden=baraja(elegidos);
 for(const b of ladr)if(!b.exp){let m=orden[0],dm=1e9;
  for(const e of orden){const df=Math.abs(e.f-b.f),dc=Math.abs(e.c-b.c),d=Math.max(df,dc)+(df+dc)*.01;if(d<dm){dm=d;m=e}}
  b.fa=m.fa}
 /* sorpresas escondidas (no se ven hasta romper el ladrillo): 3 en el nivel 1 y 4 en los demás, de tipos distintos */
 const tipos=baraja(Object.keys(SORPRESAS)).slice(0,n===1?3:4);
 baraja(ladr.filter(b=>!b.exp&&b.vida===1)).slice(0,tipos.length).forEach((b,k)=>b.sorpresa=tipos[k]);
 return ladr;
}

function ajustaLienzo(){

 let dpr=Math.min(devicePixelRatio||1,2);if(cw*ch*dpr*dpr>2.2e6)dpr=Math.max(1,Math.sqrt(2.2e6/(cw*ch)));

 {const h=$('#hud');if(h)h.style.maxWidth=Math.max(cw,340)+'px'}   /* tableta u ordenador en horizontal: el marcador, encima del campo y no en las esquinas */
 st.cv.width=Math.round(cw*dpr);st.cv.height=Math.round(ch*dpr);
 st.ctx.setTransform(k*dpr,0,0,k*dpr,0,0);st.esc=k;st.k2=k*dpr;

function cicloJugador() {
  try {
    const m = /^[12]([A-Z]{2,5})-/.exec((localStorage.getItem('ipe_codigo') || '').toUpperCase());
    if (m && ELENCO[m[1]]) return m[1];
    const e = localStorage.getItem('ipe_ciclo_elegido');
    if (e && ELENCO[e]) return e;
    let f = localStorage.getItem('ipe_ciclo_dispositivo');
    if (!f || !ELENCO[f]) { f = Object.keys(ELENCO)[Math.floor(Math.random() * 4)]; localStorage.setItem('ipe_ciclo_dispositivo', f) }
    return f;
  } catch (e) { return 'HIG' }
}

const gestoDe = (cara, animo) => { const g = cara.replace(/\.jpg$/, '_' + animo + '.jpg');
  return typeof ELENCO_GESTOS !== 'undefined' && ELENCO_GESTOS.indexOf(g) >= 0 ? g : cara };

function personaje(ciclo, quien) {
  const c = ELENCO[ciclo] || ELENCO.HIG, k = ELENCO[ciclo] ? ciclo : 'HIG', vet = quien === 'vet';
  return { nombre: vet ? c.vet : c.prota, ella: vet ? c.vetElla : c.ella, cara: `elenco_${vet ? 'vet' : 'prota'}_${k}.jpg`,
    edad: vet ? c.vetEdad : c.edad, de: vet ? c.vetDe : c.de, puesto: vet ? c.vetPuesto : c.puesto,
    lugar: vet ? c.vetLugar : c.lugar, empresa: vet ? c.vetLugar : c.lugar, sector: c.sector, visita: vet ? c.vetVisita : '' };
}

function presenta(cont, op) {
  if (!cont) return null;

/* «Repasa» con la página del libro de tu ciclo (sale del código de lista; sin código, solo el apartado). */

/* Diálogo propio (fase 2, 17-11-2026): sustituye a alert y confirm del navegador, que en el móvil parecen un error y no
   llevan los colores del centro. dialogo(texto) avisa; dialogo(texto, {si, no}) pregunta y devuelve true o false. */
function dialogo(txt, op) {
  return new Promise(res => {
    const antes = document.activeElement;
    const fondo = document.createElement('div'); fondo.className = 'dlg-fondo';
    const caja = document.createElement('div'); caja.className = 'dlg';
    caja.setAttribute('role', op ? 'alertdialog' : 'dialog'); caja.setAttribute('aria-modal', 'true');
    const p = document.createElement('p'); p.id = 'dlg-txt'; p.textContent = txt; caja.setAttribute('aria-describedby', 'dlg-txt');
    const bs = document.createElement('div'); bs.className = 'dlg-btns';
    const boton = (texto, clase, v) => { const b = document.createElement('button'); b.type = 'button'; b.className = clase; b.textContent = texto; b.onclick = e => { e.stopPropagation(); fin(v) }; bs.appendChild(b); return b };
    const tecla = e => {
      e.stopPropagation();                                   // el juego no se entera de las teclas mientras está abierto
      if (e.key === 'Escape') { e.preventDefault(); fin(!op) }
      else if (e.key === 'Tab') { const l = [...bs.children], i = l.indexOf(document.activeElement); e.preventDefault(); l[(i + (e.shiftKey ? l.length - 1 : 1)) % l.length].focus() }
    };
    const fin = v => { document.removeEventListener('keydown', tecla, true); fondo.remove(); try { antes && antes.focus && antes.focus({ preventScroll: true }) } catch (e) {} res(v) };
    if (op) boton(op.no || 'No', 'no', false);
    const si = boton(op ? (op.si || 'Sí') : 'Entendido', 'si', true);
    caja.append(p, bs); fondo.appendChild(caja);
    ['pointerdown', 'touchstart', 'mousedown', 'click'].forEach(ev => fondo.addEventListener(ev, e => e.stopPropagation()));
    document.addEventListener('keydown', tecla, true);
    document.body.appendChild(fondo); si.focus({ preventScroll: true });
  });
}

/* ===== Sonido y respuesta física comunes (fase 5, 17-11-2026) =====
   Todo sintetizado con WebAudio (sin archivos). Un solo contexto: el «actx» del juego si lo declara (let actx=null) y,
   si no, uno propio. Pasa por un volumen general y un compresor para que nada sature. Respeta «Sin sonido» (SILENCIO),
   que también quita la vibración. Se desbloquea con el primer toque (iOS).
   sfx('toque'|'acierto'|'fallo'|'tic'|'golpe'|'rompe'|'premio'|'fanfarria'|'alarma'|'barrido'|'paso', n) · vibrar(ms o patrón)
   sacudir(elemento, px) · parada(ms) → promesa (pausa de impacto; el juego decide qué congela) */
const AUDIO = { ctx: null, maestro: null, ruido: null };
function audio() {
  try {
    let c = typeof actx !== 'undefined' ? actx : AUDIO.ctx;
    if (!c) { c = new (window.AudioContext || window.webkitAudioContext)(); if (typeof actx !== 'undefined') actx = c; }
    AUDIO.ctx = c;
    if (!AUDIO.maestro || AUDIO.maestro.context !== c) {
      const comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
      AUDIO.maestro = c.createGain(); AUDIO.maestro.gain.value = .8; AUDIO.maestro.connect(comp).connect(c.destination);
      const b = c.createBuffer(1, c.sampleRate * .5, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      AUDIO.ruido = b;
    }
    if (c.state === 'suspended' && !window.SILENCIO) c.resume();
    return c;
  } catch (e) { return null }
}
function nota(f, dur, tipo = 'sine', vol = .2, d = 0, hasta = 0) {
  const c = audio(); if (!c || window.SILENCIO) return;
  const t0 = c.currentTime + d, o = c.createOscillator(), g = c.createGain();
  o.type = tipo; o.frequency.setValueAtTime(f, t0); if (hasta) o.frequency.exponentialRampToValueAtTime(hasta, t0 + dur);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .012); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g).connect(AUDIO.maestro); o.start(t0); o.stop(t0 + dur + .03);
}
function ruido(dur, vol = .2, filtro = 1200, d = 0, q = 1) {
  const c = audio(); if (!c || window.SILENCIO) return;
  const t0 = c.currentTime + d, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = AUDIO.ruido; f.type = 'bandpass'; f.frequency.value = filtro; f.Q.value = q;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  s.connect(f).connect(g).connect(AUDIO.maestro); s.start(t0); s.stop(t0 + dur + .02);
}
const PENTA = [0, 2, 4, 7, 9];
const escala = n => 523.25 * Math.pow(2, (PENTA[n % 5] + 12 * Math.floor(n / 5)) / 12);   // do pentatónico que sube con n
function sfx(nombre, n = 0) {
  switch (nombre) {
    case 'toque': nota(1400, .035, 'triangle', .12); break;
    case 'paso': nota(320 + n * 6, .03, 'sine', .05); break;
    case 'tic': nota(1000, .03, 'square', .07); break;
    case 'acierto': { const b = escala(Math.min(n, 9)); nota(b, .12, 'triangle', .22); nota(b * 1.5, .16, 'triangle', .2, .07); break }
    case 'fallo': nota(220, .16, 'square', .14); nota(155, .2, 'square', .14, .12); break;
    case 'golpe': nota(160, .09, 'sine', .3, 0, 60); ruido(.05, .12, 900); break;
    case 'rompe': ruido(.09, .22, 1800 + Math.min(n, 12) * 180, 0, 2); nota(escala(Math.min(n, 12)), .07, 'triangle', .1); break;
    case 'premio': [0, 2, 4].forEach((k, i) => nota(escala(k + 5), .14, 'sine', .18, i * .07)); break;
    case 'fanfarria': [523, 659, 784, 1047].forEach((f, i) => nota(f, .22, 'triangle', .2, i * .11)); break;
    case 'alarma': nota(880, .12, 'square', .1); nota(880, .12, 'square', .1, .2); break;
    case 'barrido': ruido(.25, .08, 600, 0, .7); break;
  }
}
function vibrar(p) { try { if (!window.SILENCIO && navigator.vibrate) navigator.vibrate(p) } catch (e) {} }

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cada minuto cuenta · IPE I</title>
<style>@font-face{font-family:"Aleo";src:url(aleo.woff2?v=d7c8feba) format("woff2"),url(aleo.ttf?v=fed0d713) format("truetype");font-weight:100 900;font-style:normal;font-display:swap}</style>
<style>

:root{--verde:#004230;--verde2:#0d6b4f;--naranja:#ff5900;--amarillo:#fcd100;--fondo:#f4f8f6;--texto:#1d2a30;--gris:#5b6b70;--ok:#178045;--mal:#d33a1f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--fondo);color:var(--texto);font:16px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:520px;min-height:100%;display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
h1,h2,.serif{font-family:Aleo,Georgia,serif}
.cab{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.marca{font:800 13px Aleo,Georgia,serif;color:var(--verde);letter-spacing:.3px}
.pill{background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.vidas{color:var(--mal);letter-spacing:2px}
.barra{height:8px;background:#dde7e2;border-radius:99px;overflow:hidden;margin:6px 0 14px}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--verde2),var(--verde));width:0;transition:width .3s}
.tiempo{height:5px;background:#eadfcf;border-radius:99px;overflow:hidden;margin:-8px 0 12px}
.tiempo i{display:block;height:100%;background:var(--naranja);width:100%}
.tarjeta{background:#fff;border-radius:22px;box-shadow:0 6px 20px rgba(0,66,48,.10);padding:18px;display:flex;flex-direction:column;align-items:center}
.senal{width:min(62vw,230px);height:min(62vw,230px);margin:6px 0 10px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 3px 4px rgba(0,0,0,.15))}
.senal img{max-width:100%;max-height:100%}
.op .mini img,.fila-sen img,.fallo img{width:100%;height:100%;object-fit:contain}
.confeti{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:cae linear forwards;z-index:9}
@keyframes cae{to{transform:translateY(105vh) rotate(720deg)}}
.preg{font:700 18px Aleo,Georgia,serif;color:var(--verde);text-align:center;margin:4px 0 2px}
.opciones{display:grid;gap:10px;margin-top:14px;width:100%}
.opciones.tipos{grid-template-columns:1fr}
.op{border:0;border-radius:14px;padding:14px 14px;font:600 16px "Helvetica Neue",Arial,sans-serif;background:#eef4f1;color:var(--texto);text-align:left;display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .08s,background .2s}
.op:active{transform:scale(.98)}
.op .mini{width:30px;height:30px;flex:none}
.op:disabled{cursor:default;opacity:1;color:var(--texto)}
.op.ok,.op.ok:disabled{background:var(--ok);color:#fff}
.op.mal,.op.mal:disabled{background:var(--mal);color:#fff}
.explica{margin-top:14px;width:100%;border-radius:14px;padding:12px 14px;font-size:15px;display:none}
.explica.ok{display:block;background:#e3f4ea;color:#0b5a2f}
.explica.mal{display:block;background:#fde8e3;color:#8c2512}
.explica b{display:block;font:800 16px Aleo,Georgia,serif;margin-bottom:2px}
.sig{margin-top:12px;width:100%;border:0;border-radius:14px;padding:14px;font:800 17px Aleo,Georgia,serif;background:var(--verde);color:#fff;cursor:pointer;display:none}
.puntos-flota{position:fixed;left:50%;top:38%;transform:translate(-50%,0);font:800 34px Aleo,Georgia,serif;color:var(--ok);pointer-events:none;animation:sube .9s ease-out forwards}
@keyframes sube{to{transform:translate(-50%,-70px);opacity:0}}
.sacude{animation:sacude .35s}
@keyframes sacude{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
/* portada */
.portada{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px}
.portada h1{font-size:32px;color:var(--verde);margin:0;line-height:1.1}
.portada p{color:var(--gris);margin:0}
.fila-sen{display:flex;justify-content:center;gap:8px;margin:6px 0}
.fila-sen img{width:52px;height:52px}
.nivel{border:0;border-radius:18px;padding:16px;text-align:left;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.07);cursor:pointer;display:flex;gap:14px;align-items:center}
.nivel .n{flex:none;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 20px Aleo,Georgia,serif;color:#fff}
.nivel b{display:block;font:800 17px Aleo,Georgia,serif;color:var(--verde)}
.nivel span{font-size:14px;color:var(--gris)}
.record{font-size:13px;color:var(--gris)}
/* final */
.final{text-align:center}
.final .gran{font:800 56px Aleo,Georgia,serif;color:var(--verde);margin:4px 0}
.estrellas{font-size:34px;letter-spacing:4px;color:var(--amarillo);text-shadow:0 1px 0 #c9a400}
.fallos{text-align:left;margin-top:16px}
.fallo{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:10px;margin-bottom:8px}
.fallo img{width:54px;height:54px;flex:none}
.fallo b{display:block;color:var(--verde)}
.fallo small{color:var(--gris)}
.btns{display:grid;gap:10px;margin-top:16px}
.btn{border:0;border-radius:14px;padding:14px;font:800 17px Aleo,Georgia,serif;cursor:pointer}
.btn.p{background:var(--verde);color:#fff}
.btn.s{background:#e3ece8;color:var(--verde)}
.pie{text-align:center;font-size:12px;color:var(--gris);margin-top:auto;padding-top:14px}
.oficial{background:#fff;border:2px solid var(--verde);border-radius:16px;padding:14px;margin:14px 0;text-align:left;display:grid;gap:8px}
.oficial label span,.oficial small{font-size:13px;opacity:.75}
.oficial input{font:700 20px/1.2 inherit;letter-spacing:2px;text-transform:uppercase;padding:10px 12px;border:2px solid #cfd8d3;border-radius:10px;width:100%;box-sizing:border-box}
.oficial input.error{border-color:#c0392b;background:#fdecea}
.oficial .btn[disabled]{opacity:.5}
.entreno{color:var(--verde);font-size:18px;margin:6px 0 4px;text-align:left}
.aviso-of{background:#fff8d6;border:2px solid #fcd100;border-radius:14px;padding:12px;margin:14px 0;line-height:1.5}
.situ{font-size:17px;line-height:1.45;text-align:center;margin:8px 4px 4px;color:var(--texto)}
.opciones.imgs{grid-template-columns:1fr 1fr}
.opciones.imgs .op{justify-content:center;padding:12px;aspect-ratio:1}
.opciones.imgs .op img{width:100%;height:100%;object-fit:contain}
#envio{margin-top:8px;font-weight:700;color:var(--verde)}

/* ===== propio de «Cada minuto cuenta» ===== */
.grafica{background:#fff;border-radius:16px;padding:10px 10px 6px;margin-top:14px;box-shadow:0 2px 10px rgba(0,66,48,.08)}
.grafica h2{color:var(--verde);font-size:17px;margin:2px 4px 6px;text-align:left}
.grafica svg{width:100%;display:block}
.grafica .ley{margin:4px 4px 2px;font-size:12.5px;line-height:1.5;color:var(--gris);text-align:left}
.grafica .ley span{font-weight:700;margin-right:6px;white-space:nowrap}
.chips112{display:grid;gap:8px;margin-top:12px;width:100%}
.chip112{border:2px dashed #b9cdc4;background:#f4f9f6;border-radius:12px;padding:10px 12px;text-align:left;font:600 14.5px/1.3 "Helvetica Neue",Arial;color:var(--texto);cursor:pointer}
.chip112 small{display:block;font-weight:400;color:var(--gris);font-size:13px}
.chip112.usada{opacity:.35;pointer-events:none}
.llamada{width:100%;min-height:54px;margin-top:10px;border-radius:12px;background:#0f2f25;color:#dff3ea;padding:10px 12px;font-size:14px;line-height:1.45;text-align:left}
.llamada b{color:#7dffb5}
.icoesc{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;margin:-4px auto 6px;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.heroe{position:relative;border-radius:24px;padding:22px 18px 18px;text-align:left;color:#fff;overflow:hidden;
 background:radial-gradient(circle at 85% 10%,rgba(255,89,0,.35),transparent 45%),linear-gradient(160deg,#0b5a40,#062a1f 70%);box-shadow:0 14px 30px rgba(0,66,48,.35)}
.heroe .hm{font:700 12px "Helvetica Neue",Arial;letter-spacing:.14em;text-transform:uppercase;color:#a8e6cc}
.heroe h1{color:#fff;font-size:40px;line-height:1;margin:8px 0 4px}
.heroe h1 span{color:#fcd100}
.heroe p{color:#d8efe6;font-size:14.5px;line-height:1.45;margin:6px 0 10px}
.hecg{width:100%;height:54px;display:block}
.hecg path{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
/* fase 5: antes solo había el trazo animado (dasharray) y, al empezar y al acabar cada pasada, se veía un guion suelto
   que parecía un icono sin cargar. Ahora la línea completa está siempre (tenue) y por encima corre el barrido. */
.hecg .base{stroke:rgba(125,255,181,.3)}
.hecg .trazo{stroke:#7dffb5;stroke-dasharray:90 410;stroke-dashoffset:90;animation:traza 2.4s linear infinite}
@keyframes traza{to{stroke-dashoffset:-410}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font:700 12px "Helvetica Neue",Arial;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 10px}
.nivel .ico{flex:none;width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:var(--verde);background:#eef4f1;box-shadow:inset 0 2px 0 #fff,inset 0 -3px 0 rgba(0,66,48,.1)}
.nivel .ico .pic{width:28px;height:28px}
.nivel{transition:transform .1s,box-shadow .1s}.nivel:active{transform:translateY(2px)}

.escena{font-size:16px;line-height:1.45;text-align:center;margin:8px 4px 4px}
.opciones.textos .op{font-weight:600;font-size:15px;line-height:1.3}
.rcp{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#16332a 0%,#071a14 70%);color:#fff;display:flex;flex-direction:column;align-items:center;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;z-index:5}
.rcp.pls{background:radial-gradient(circle at 50% 35%,#16304a 0%,#08162a 70%)}
.rcp .arriba{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;padding:12px 14px 0;gap:8px}
.rcp .pill{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}
.rcp .crono{font:800 22px Aleo,Georgia,serif;letter-spacing:1px}
.monitor{width:calc(100% - 28px);max-width:492px;margin-top:8px;border-radius:14px;background:#03100c;border:1px solid rgba(125,255,181,.25);box-shadow:inset 0 0 24px rgba(47,212,122,.08),0 6px 20px rgba(0,0,0,.4);position:relative;overflow:hidden;
 background-image:linear-gradient(rgba(125,255,181,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(125,255,181,.07) 1px,transparent 1px);background-size:14px 14px}
.monitor .ecg{width:100%;height:58px;display:block}   /* fase 5: lienzo a 30 fps, sin filtros (antes, polilínea SVG + drop-shadow en cada fotograma) */
.monitor .et{position:absolute;left:10px;top:6px;font:700 10px "Helvetica Neue",Arial;letter-spacing:.12em;color:#7dffb5;opacity:.8}
.monitor .corazon{position:absolute;right:10px;top:5px;width:22px;height:22px}.monitor .corazon .pic{width:22px;height:22px;display:block}
.latido{animation:latido .25s ease-out}
@keyframes latido{40%{transform:scale(1.35)}}
.rcp .msg{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:12px;margin:8px 14px 0;padding:8px 12px;width:calc(100% - 28px);max-width:492px;font-weight:600}
.rcp .msg b{color:#7dffb5}
.rcp .arriba .crono{font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(125,255,181,.4)}
.rcp .cuenta,.rcp .bpm{font-variant-numeric:tabular-nums}
.rcp .botones .btn{border-radius:16px}
.rcp .abajo{background:linear-gradient(180deg,rgba(3,16,12,0),rgba(3,16,12,.85) 30%)}
.rcp .msg{min-height:44px;max-width:480px;text-align:center;font:700 16px/1.3 "Helvetica Neue",Arial,sans-serif;padding:4px 14px;color:#dff3ea}
.rcp .cuerpo{flex:1;width:100%;max-width:420px;min-height:0;position:relative}
.rcp .cuerpo svg{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 24px rgba(0,0,0,.5));will-change:transform}
.asa{animation:asa 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes asa{50%{transform:scale(1.18)}}
.rcp .abajo{width:100%;max-width:520px;padding:6px 14px calc(14px + env(safe-area-inset-bottom));display:grid;gap:8px}
.rcp .marcador{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rcp .cuenta{font:800 34px Aleo,Georgia,serif;min-width:92px}
.rcp .cuenta small{font-size:15px;opacity:.7}
.rcp .gauge{width:150px;height:84px}
.rcp .bpm{font:800 24px Aleo,Georgia,serif;text-align:right;min-width:86px}
.rcp .bpm small{display:block;font:600 11px "Helvetica Neue",Arial;opacity:.75}
.rcp .botones{display:flex;gap:8px}
.rcp .botones .btn{flex:1;font-size:16px;padding:13px 8px}
.rcp .btn.vent{background:#2e7fd6;color:#fff}
.rcp .btn.rel{background:#fcd100;color:#3a2f00}
.rcp .btn.alarma{background:#c24400;color:#fff;animation:late .6s infinite}
.rcp .btn[disabled]{opacity:.28}
@keyframes late{50%{transform:scale(1.04);filter:brightness(1.25)}}
.rcp .combo{position:absolute;left:0;right:0;top:6%;text-align:center;font:800 26px Aleo,Georgia,serif;color:#7dffb5;text-shadow:0 0 14px rgba(125,255,181,.6);pointer-events:none;opacity:0;transition:opacity .2s;z-index:2}
.rcp .combo.rotulo{left:50%;right:auto;transform:translateX(-50%);white-space:nowrap;font-size:22px;color:#062a1f;text-shadow:none;background:#fcd100;border-radius:999px;padding:8px 18px;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -4px 0 rgba(0,0,0,.18),0 8px 20px rgba(0,0,0,.4)}
.onda{position:absolute;border:3px solid #7dffb5;border-radius:50%;pointer-events:none;animation:onda .55s ease-out forwards}
@keyframes onda{from{width:10px;height:10px;opacity:.9;transform:translate(-50%,-50%)}to{width:150px;height:150px;opacity:0;transform:translate(-50%,-50%)}}
/* fase 5: sin destellos a pantalla completa; solo un brillo local sobre el cuerpo (descarga del DEA) */
.brillo{position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(circle at 50% 38%,var(--c) 0,transparent 58%);animation:brillo .45s ease-out forwards}
@keyframes brillo{from{opacity:.6}to{opacity:0}}
.rcp .tarjeta-rcp{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:12px;display:grid;gap:8px}
.rcp .tarjeta-rcp .op{background:rgba(255,255,255,.92)}
.rcp .tarjeta-rcp p{margin:0;text-align:center;font-size:15px;line-height:1.4}

/* Tablets y ordenadores (José, 9-11-2026): en pantallas grandes, todo más grande (en el móvil, igual que antes) */
@media (min-width:760px){
 .rcp .arriba,.rcp .abajo{max-width:760px}
 .monitor,.rcp .msg{max-width:732px}
 .rcp .msg{font-size:19px}
 .rcp .cuerpo{max-width:640px}
 .rcp .cuenta{font-size:42px}.rcp .bpm{font-size:30px}
}
/* pausa (18-11-2026, como en «Serpiente PRL»): menú «Seguir / Salir al menú» que tapa la pregunta y el cuerpo con el reloj parado */
.pausa-j{position:fixed;inset:0;z-index:50;background:#0b1f19;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;font:700 18px/1.4 "Helvetica Neue",Arial,sans-serif}
.pausa-j b{font:800 30px Aleo,Georgia,serif;color:#fcd100}
.pausa-j .pausa-btns{display:grid;gap:10px;width:100%;max-width:300px;margin-top:10px}
.pausa-j .btn{min-height:48px}.pausa-j .btn.p{background:#fcd100;color:#004230}
.pausa-j small{max-width:300px;font:600 14px/1.4 "Helvetica Neue",Arial,sans-serif;color:#cfe9de}
/* ===== fase 5 (17-11-2026): pictogramas propios y relieve suave de plastilina, coherente con las ilustraciones ===== */
.pic{width:1em;height:1em;display:inline-block;vertical-align:-.15em;flex:none}
.icoesc{color:#fff;font-size:0}.icoesc .pic{width:28px;height:28px}
.btn .pic,.op .pic{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
.pill .pic{width:15px;height:15px;vertical-align:-2px;margin-right:2px;color:#c24400}
.rcp .msg .pic{width:18px;height:18px;vertical-align:-3px;color:#7dffb5;margin-right:4px}
.tarjeta{border-radius:24px;box-shadow:0 10px 24px rgba(0,66,48,.12),0 2px 4px rgba(0,66,48,.06),inset 0 2px 0 rgba(255,255,255,.95),inset 0 -5px 0 rgba(0,66,48,.06)}
.op{box-shadow:inset 0 2px 0 rgba(255,255,255,.85),inset 0 -3px 0 rgba(0,66,48,.12),0 2px 5px rgba(0,66,48,.08);transition:transform .08s,box-shadow .08s,background .2s}
.op:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(0,66,48,.12),0 1px 2px rgba(0,66,48,.08)}
.op.ok,.op.mal{box-shadow:inset 0 2px 0 rgba(255,255,255,.25),inset 0 -3px 0 rgba(0,0,0,.18)}
.btn,.sig{box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset 0 -4px 0 rgba(0,0,0,.2),0 4px 10px rgba(0,66,48,.18);transition:transform .08s,box-shadow .08s}
.btn.s{box-shadow:inset 0 2px 0 rgba(255,255,255,.85),inset 0 -4px 0 rgba(0,66,48,.12),0 3px 8px rgba(0,66,48,.1)}
.btn:active:not([disabled]),.sig:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -1px 0 rgba(0,0,0,.2),0 1px 3px rgba(0,66,48,.18)}
.nivel{box-shadow:0 6px 14px rgba(0,66,48,.09),inset 0 2px 0 #fff,inset 0 -4px 0 rgba(0,66,48,.07)}
.nivel .n{box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.22)}
.pill{box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 rgba(0,66,48,.08),0 2px 4px rgba(0,66,48,.08)}
.icoesc{box-shadow:inset 0 3px 0 rgba(255,255,255,.28),inset 0 -4px 0 rgba(0,0,0,.2),0 6px 14px rgba(0,0,0,.18)}
.chip112{box-shadow:0 2px 5px rgba(0,66,48,.06)}
.oficial{box-shadow:inset 0 2px 0 #fff,0 6px 14px rgba(0,66,48,.08)}
.rcp .pill{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -2px 0 rgba(0,0,0,.25)}
.rcp .botones .btn,.rcp .tarjeta-rcp .op{box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -4px 0 rgba(0,0,0,.25),0 6px 16px rgba(0,0,0,.35)}
.rcp .tarjeta-rcp{box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 8px 20px rgba(0,0,0,.3)}
.rcp .crono.urge{color:#fcd100}
/* salir de los niveles 3 y 4 */
.rcp .izq{display:flex;align-items:center;gap:8px}
.rcp .salir{flex:none;width:40px;height:40px;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;color:#fff;background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -2px 0 rgba(0,0,0,.25)}
.rcp .salir .pic{width:20px;height:20px}
/* compresión con cuerpo: sombra de las manos */
#sombraM{transform-box:fill-box;transform-origin:center}
/* tutorial jugable del nivel 4 */
.tuto{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px 14px;background:rgba(3,16,12,.86);border-radius:18px;text-align:center}
.tuto h3{margin:0;font:800 20px Aleo,Georgia,serif;color:#fcd100}
.tuto p{margin:0;font-size:15px;line-height:1.4;color:#dff3ea;max-width:330px}
.tuto .pad{width:min(150px,24vh);height:min(150px,24vh);border-radius:50%;border:0;padding:0;cursor:pointer;touch-action:none;will-change:transform;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#7dffb5;font:800 16px "Helvetica Neue",Arial,sans-serif;
 background:radial-gradient(circle at 40% 32%,#2d5e4c,#123a2d 70%);box-shadow:inset 0 4px 0 rgba(255,255,255,.16),inset 0 -8px 0 rgba(0,0,0,.32),0 0 0 3px #7dffb5,0 10px 24px rgba(0,0,0,.45)}
.tuto .pad .pic{width:44px;height:44px}
.tuto .fb{min-height:22px;font-weight:700}
.tuto .saltar{background:transparent;border:2px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:9px 18px;min-height:44px;font:700 14px "Helvetica Neue",Arial,sans-serif;cursor:pointer}
/* fase 6, 17-11-2026: entrenamiento «Compresión con profundidad» */
.rcp .cm{font:800 30px Aleo,Georgia,serif;text-align:center;font-variant-numeric:tabular-nums;min-width:96px}
.rcp .cm small{font-size:14px;opacity:.7;margin-left:3px}
.rcp .cm.ok{color:#7dffb5}.rcp .cm.poco{color:#ffb27a}.rcp .cm.mucho{color:#ff8a7a}
.tuto.tutop{border-radius:0;z-index:4;overflow:auto;justify-content:safe center;background:rgba(3,16,12,.95)}
.tutop ol{margin:0;padding:0 0 0 22px;text-align:left;max-width:360px;color:#dff3ea;font-size:14.5px;line-height:1.4}
.tutop ol li{margin-bottom:4px}
.tutop .btn{width:100%;max-width:360px}
.tutop .nota-p{font-size:12.5px;opacity:.78}
.modos{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:360px}
.modo{border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff;border-radius:14px;padding:10px 8px;min-height:44px;font:700 15px "Helvetica Neue",Arial,sans-serif;cursor:pointer}
.modo small{display:block;font-weight:400;font-size:12.5px;opacity:.8;margin-top:3px}
.modo[aria-pressed="true"]{border-color:#7dffb5;background:rgba(125,255,181,.16)}
.demo-p{width:84px;height:118px;flex:none}
.demo-dedo{animation:dedo 1.1s ease-in-out infinite}
@keyframes dedo{0%,100%{transform:translateY(0)}45%{transform:translateY(54px)}}
@media (prefers-reduced-motion:reduce){.demo-dedo{animation:none}}
.moneda{border-radius:50%;border:3px dashed #fcd100;background:rgba(252,209,0,.12);flex:none}
.tutop input[type=range]{width:100%;max-width:320px}
.pad-prof{width:100%;min-height:88px;border:0;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;touch-action:none;color:#062a1f;background:#7dffb5;font:800 18px "Helvetica Neue",Arial,sans-serif;
 box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -5px 0 rgba(0,0,0,.2),0 6px 16px rgba(0,0,0,.35)}
.pad-prof .pic{width:30px;height:30px}
.pad-prof.pulsado{background:#2fd47a;transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(0,0,0,.2)}
.evalp{margin-top:12px;display:grid;gap:8px;text-align:left}
.evalp p{margin:0;background:#fff;border-radius:14px;padding:10px 12px;font-size:14.5px;line-height:1.45;box-shadow:0 2px 10px rgba(0,66,48,.08)}
.evalp b{color:var(--verde)}
/* ===== Universo plastilina (arte, 17-11-2026): el reparto de la colección (elenco.js) entra en el juego =====
   Portada con el puesto de la persona protagonista de fondo; escenas narradas sobre el puesto desenfocado; la persona
   compañera de ciclo en la llamada al 112 y en la RCP; y la protagonista resume al final. */
.pres-globo .pres-txt b{display:inline;font:inherit;font-weight:800;color:#004230;margin:0}
/* portada: el puesto de fondo (con un acercamiento muy lento) y un velo verde para que el texto se lea */
.heroe .fondo{position:absolute;inset:0;z-index:0;background-image:var(--fondo,none);background-size:cover;background-position:center 30%;background-repeat:no-repeat;transform:scale(1.03)}
.heroe .fondo:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 8%,rgba(255,89,0,.3),transparent 45%),linear-gradient(180deg,rgba(6,42,31,.5) 0%,rgba(6,42,31,.74) 42%,rgba(6,42,31,.93) 100%)}
.heroe>:not(.fondo){position:relative;z-index:1}
.heroe .hpres{margin:4px 0 12px}
.heroe .hpres .pres-globo{background:rgba(255,250,240,.96)}
@media (prefers-reduced-motion:no-preference){.heroe .fondo{animation:acerca 26s ease-in-out infinite alternate}}
@keyframes acerca{to{transform:scale(1.12) translate(-2%,-1.5%)}}
/* niveles 1 y 2: cabecera de la escena (el puesto desenfocado y oscurecido) con la persona que narra */
.tarjeta.con-escena{overflow:hidden}
.escena-cab{position:relative;align-self:stretch;margin:-18px -18px 10px;padding:16px 12px 12px;min-height:92px;display:flex;align-items:flex-end;overflow:hidden;background:#123a2d}
.escena-cab .fondo{position:absolute;inset:-14px;background-image:var(--fondo,none);background-size:cover;background-position:center 40%;filter:blur(3px) brightness(.5) saturate(.85);transition:filter .5s}
.escena-cab.bien .fondo{filter:blur(3px) brightness(.55) saturate(1.1)}
.escena-cab.mal .fondo{filter:blur(3px) brightness(.4) saturate(.6)}
.escena-cab .slot{position:relative;z-index:1;width:100%}
.escena-cab .pres-globo{font-size:14.5px;line-height:1.42}
.tarjeta.con-escena .preg{font-size:17px;margin:0 0 2px}
.tarjeta.con-escena .escena{font-size:14.5px;margin:2px 4px 0;color:var(--gris)}
/* RCP: la persona compañera habla en la franja de mensajes, sin tapar el cuerpo ni los botones */
.rcp .msg.habla{background:none;border:0;padding:0;text-align:left;font:400 14px/1.35 "Helvetica Neue",Arial,sans-serif}
.rcp .msg.habla .pres{gap:8px}
.rcp .msg.habla .pres-cara{width:42px;height:42px;border-width:2px}
.rcp .msg.habla .pres-globo{padding:6px 10px;font-size:14px;line-height:1.35}
.rcp .msg.habla .pres-globo b{color:#004230;font-size:13px;margin:0}
.rcp .msg.habla .pres-txt b{color:#c24400;font-size:inherit}
@media (min-width:760px){.rcp .msg.habla .pres-globo{font-size:17px}.rcp .msg.habla .pres-cara{width:56px;height:56px}}
/* final: la protagonista resume */
.final .pres{margin:14px 0 4px}
/* ===== 18-11-2026: pausa y sonido en el marcador, móvil girado, tableta en horizontal y accesibilidad (como en «Serpiente PRL») ===== */
/* foco visible también sobre fondo claro (doble anillo); gana a las sombras de relieve de los botones */
button:focus-visible,input:focus-visible{outline:3px solid #fcd100;outline-offset:2px;box-shadow:0 0 0 6px #004230!important}
.ctl{display:flex;gap:6px;flex:none}
.ctl button{width:44px;height:44px;border:0;border-radius:50%;display:grid;place-items:center;padding:0;cursor:pointer;color:var(--verde);background:#fff;box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 rgba(0,66,48,.08),0 2px 4px rgba(0,66,48,.08)}
.ctl .pic{width:20px;height:20px}
.rcp .ctl button{color:#fff;background:rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -2px 0 rgba(0,0,0,.25)}
.cab{gap:6px}.cab .pill{padding:6px 10px}
.rcp .salir{width:44px;height:44px}
.rcp .arriba{gap:6px}.rcp .arriba .pill{white-space:nowrap}
@media (max-width:380px){.rcp .arriba{padding:10px 10px 0;gap:4px}.rcp .izq{gap:4px}.rcp .arriba .pill{padding:6px 8px;font-size:13px}.rcp .arriba .crono{font-size:20px;letter-spacing:0}.ctl{gap:4px}}
.rcp .btn.vent{background:#2a74c6}   /* contraste AA con el texto blanco (antes 4,1:1) */
/* RCP en un móvil de 360 px: el marcador se salía por la derecha y arrastraba el botón «¡Relevo!» fuera de la pantalla */
.rcp .abajo{grid-template-columns:minmax(0,1fr)}
@media (max-width:380px){.rcp .gauge{width:124px;height:70px}.rcp .cuenta{min-width:78px;font-size:30px}.rcp .bpm{min-width:72px;font-size:21px}}
/* móvil girado (apaisado y bajo): el cuerpo quedaba diminuto; se pide girarlo y la partida se pausa */
.giro{display:none}
@media (orientation:landscape) and (max-height:500px) and (pointer:coarse){body.en-juego .giro{display:flex;position:fixed;inset:0;z-index:60;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#0d2a20;color:#fff;font:800 20px Aleo,Georgia,serif;text-align:center;padding:20px}.giro span{font-size:46px}}
/* tableta (o portátil) en horizontal y baja: el cuerpo a la izquierda, a toda la altura; marcador, mensajes y botones a la derecha.
   En 1024 × 600 la figura pasaba de ≈ 160 px (RCP) y 260 px (PLS) a casi toda la altura: tocar y arrastrar, con precisión */
@media (orientation:landscape) and (min-width:800px) and (max-height:700px){
 .rcp{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,42%);grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"c a" "c m" "c s" "c b";align-items:start;justify-items:center}
 .rcp .arriba{grid-area:a;max-width:none}
 .rcp .monitor{grid-area:m;max-width:none}
 .rcp .msg{grid-area:s;max-width:none}
 .rcp .cuerpo{grid-area:c;max-width:none;align-self:stretch;justify-self:stretch;padding:12px 0 12px max(12px,env(safe-area-inset-left))}
 .rcp .abajo{grid-area:b;max-width:none}
}

<body>
<div id="app"></div>
<script>
/* «Cada minuto cuenta» · bancos de preguntas (José, 5-11-2026). Todo sale de la UD 3 del libro, apartado 3.6
   (ERC 2025): PAS, 112, valoración, SVB y RCP, lesiones, Heimlich y botiquín. s = sector ('' = común a todos).
   ok = la respuesta correcta; no = tres trampas; e = la explicación (lo que dice el libro).
   Fase 4, 17-11-2026: trampas con errores reales y de largo parecido a la correcta (antes la correcta era la más larga
   en 29 de 41); 10 escenas por sector (salen 3 al azar); columna, torniquete y Toxicológico cotejados con ERC 2025.
   ll = escena del 112 que ya trata la llamada por tarjetas: la llamada sale después (fase 4, 17-11-2026). */
const BANCOS = {
 pas: [
  {s:'',t:'Una compañera ha recibido una descarga y sigue tocando el cuadro eléctrico. ¿Qué haces primero?',ok:'Cortar la corriente antes de tocarla',no:['Tirar de su brazo con fuerza para separarla','Apartarla empujándola con una barra metálica','Tocarla un segundo para ver si da calambre'],e:'Proteger: si la tocas con corriente, serás otra víctima. Primero se corta la corriente.'},
  /* fase 4, 17-11-2026: fuera «¿Qué tienes que decir al 112?»: es la misma pregunta que la llamada por tarjetas */
  {s:'',ll:1,t:'Estás hablando con el 112. ¿Cuándo cuelgas?',ok:'Cuando te lo indiquen',no:['En cuanto hayas dado la dirección exacta','Al minuto, para dejar la línea libre','Cuando veas llegar la ambulancia a la puerta'],e:'No cuelgues hasta que te lo indiquen: pueden guiarte paso a paso para hacer la RCP. Pon el altavoz.'},
  {s:'',ll:1,t:'Tienes que socorrer y a la vez hablar con el 112. ¿Qué haces con el móvil?',ok:'Ponerlo en altavoz para tener las manos libres',no:['Sujetarlo entre el hombro y la oreja','Colgar y volver a llamar cuando hayas terminado','Seguir con el móvil en una mano y socorrer con la otra'],e:'Con el altavoz tienes las manos libres para socorrer mientras te guían.'},
  {s:'',t:'¿Qué significa el método PAS?',ok:'Proteger, Avisar y Socorrer',no:['Parar, Analizar y Salir','Prevenir, Ayudar y Sanar','Pedir ayuda, Atender y Señalizar'],e:'PAS: Proteger (que no haya más peligros), Avisar (112) y Socorrer.'},
  {s:'',t:'Hay humo en el almacén y una persona tirada en el suelo. ¿Qué haces?',ok:'No entrar sin protección y avisar al 112',no:['Entrar corriendo a sacarla antes de que sea tarde','Entrar agachado con un pañuelo mojado en la boca','Abrir y entrar a por ella aguantando la respiración'],e:'Primero, tu seguridad: si hay humo o gas, no entres sin protección.'},
  /* fase 4, 17-11-2026: ERC 2025, persona despierta con posible lesión de cuello: que lo mantenga quieto ella misma; sujetar la cabeza es para quien no responde */
  {s:'',t:'Una persona se ha caído de una escalera, está consciente y le duele el cuello.',ok:'Pedirle que no se mueva y llamar al 112',no:['Ayudarla a levantarse despacio','Sentarla apoyada en la pared para que respire mejor','Ponerle una chaqueta doblada bajo la cabeza'],e:'Posible lesión de columna: no se la mueve salvo peligro inmediato. Si está consciente, se le pide que mantenga el cuello quieto en la postura en que esté cómoda; nunca se la obliga a cambiar de postura.'},
  {s:'',t:'¿Le das agua a una persona herida grave que tiene mucha sed?',ok:'No: no se da de comer ni de beber',no:['Sí, agua con azúcar para que no se maree','Sí, pero solo a sorbos pequeños','Sí, si lo pide y está consciente'],e:'A una persona herida grave no se le da de comer ni de beber.'},
  {s:'',t:'¿Qué lleva el botiquín de la empresa para quien se hace daño?',ok:'Material de curas, pero ningún medicamento',no:['Analgésicos y antiinflamatorios para el dolor','Antibióticos en pastillas por si hay infección','Tranquilizantes por si alguien se pone nervioso'],e:'El botiquín de la empresa no lleva medicamentos: solo material de primeros auxilios.'},
  {s:'',t:'Hay varias personas heridas. ¿A quién atiendes primero?',ok:'A quien no responde o tiene una hemorragia grave',no:['A quien más grita, porque es quien peor lo pasa','A quien conoces, porque sabes cómo se llama','A la persona herida más cercana a la puerta'],e:'Quien grita respira. Primero, quien no responde o no respira con normalidad y las hemorragias graves.'},
  {s:'',t:'Ha habido un atropello en la puerta y siguen pasando coches. ¿Qué haces primero?',ok:'Señalizar la zona para que no haya otro atropello',no:['Arrodillarte a su lado en la calzada y empezar a atenderla','Incorporarla para ver si puede andar','Darle agua para que se recupere del susto'],e:'Proteger: comprueba que no hay más peligros (tráfico, corriente, fuego, gas) y señaliza.'},
  /* ---- HIG (fase 4, 17-11-2026: de 3 a 10 escenas) ---- */
  {s:'HIG',t:'La persona que está en el sillón dental deja de contestar de repente. ¿Qué haces primero?',ok:'Hablarle y tocarle los hombros para ver si responde',no:['Echarle agua fría en la cara para despertarla','Sentarla derecha en el sillón para que le llegue el aire','Esperar un rato a ver si se le pasa sola'],e:'Socorrer empieza por la evaluación primaria: ¿responde? Háblale y tócale los hombros.'},
  {s:'HIG',t:'A una compañera le salpica desinfectante en un ojo.',ok:'Lavarlo con mucha agua 15-20 minutos, párpados abiertos',no:['Frotarlo con una gasa húmeda para retirar bien el producto','Echarle colirio y seguir trabajando con cuidado','Taparlo con un parche y esperar a que deje de picar'],e:'Quemadura química: agua abundante 15-20 minutos; en los ojos, con los párpados abiertos.'},
  {s:'HIG',t:'Una persona se atraganta en la sala de espera, pero tose con fuerza.',ok:'Animarla a seguir tosiendo',no:['Darle golpes en la espalda enseguida','Hacerle la maniobra de Heimlich ya','Darle agua para que le baje lo que tiene'],e:'Si la tos es eficaz, es el mejor remedio: anímala a toser y no le des golpes.'},
  {s:'HIG',t:'Una persona se desploma en la sala de espera: no responde y no respira con normalidad. En recepción hay un DEA.',ok:'112, que traigan el DEA y empezar la RCP',no:['Ponerla en posición lateral de seguridad','Buscarle el pulso en la muñeca durante un minuto','Echarle agua en la cara para que reaccione'],e:'No responde y no respira con normalidad: es una parada. 112 (con altavoz), que alguien traiga el DEA y RCP sin esperar.'},
  {s:'HIG',t:'Una persona se cae por la escalera de la clínica. No responde, pero respira con normalidad.',ok:'Dejarla boca arriba, sujetarle la cabeza y llamar al 112',no:['Ponerla de lado, en posición lateral de seguridad, y esperar','Sentarla en una silla para ver si se despierta','Ponerle una chaqueta doblada bajo la cabeza'],e:'Si hay un golpe o una caída no se usa la posición lateral de seguridad (ERC 2025): se la deja boca arriba, se le sujeta la cabeza con las dos manos para que el cuello no se mueva, se vigila que respire y se llama al 112.'},
  {s:'HIG',t:'Una compañera se corta la mano con el cristal de una vitrina y sangra mucho.',ok:'Presión directa y firme con gasas, con guantes, y 112',no:['Levantarle el brazo y esperar a que deje de sangrar','Lavar la herida con alcohol y luego taparla','Dejar que sangre un poco para que se limpie'],e:'Hemorragia: presión directa, firme y continua con gasas o un apósito, con guantes, y 112.'},
  {s:'HIG',t:'Al ponerse unos guantes de látex, una persona se llena de ronchas, se le hincha la cara y le cuesta respirar.',ok:'112 y ayudarla con su autoinyector, si lo lleva',no:['Darle agua fría para que le baje la hinchazón','Que salga a caminar al aire libre para que respire mejor','Esperar a ver si se le pasa al quitarse los guantes'],e:'Reacción alérgica grave (anafilaxia): 112, que siga sentada o tumbada y, si lleva autoinyector de adrenalina, se pone cuanto antes en la cara externa del muslo (ERC 2025).'},
  {s:'HIG',t:'Una persona con diabetes está sudorosa, temblorosa y confusa en el gabinete, pero puede tragar.',ok:'Darle azúcar: glucosa o un zumo',no:['Ponerle su insulina, que la lleva en el bolso','Tumbarla y no darle nada por si se atraganta','Mandarla a casa a descansar'],e:'Posible bajada de azúcar: si está despierta y puede tragar, glucosa o, si no hay, azúcar (un zumo, caramelos). Si a los 15 minutos no mejora, otra vez y 112 (ERC 2025).'},
  {s:'HIG',t:'Una persona que espera su turno se lleva la mano al pecho: tiene un dolor opresivo que le baja al brazo.',ok:'Sentarla tranquila, llamar al 112 y no dejarla sola',no:['Que vaya andando a urgencias, que está cerca','Darle agua con azúcar y esperar a que se le pase','Que coja su coche y vaya a su centro de salud'],e:'Dolor en el pecho: tranquilízala, que se siente o se tumbe como esté más cómoda, 112 y quédate con ella hasta que llegue la ayuda (ERC 2025).'},
  {s:'HIG',t:'En pleno agosto, una persona llega a la clínica tras caminar al sol: está confusa y muy caliente.',ok:'A la sombra, enfriarla con agua y llamar al 112',no:['Abrigarla para que no tenga escalofríos','Darle una bebida muy fría aunque esté confusa','Dejarla descansar en la sala hasta que se le pase'],e:'Golpe de calor: apartarla del calor, quitarle ropa y enfriarla con agua fría cuanto antes; 112 (ERC 2025).'},
  /* ---- IFC (fase 4, 17-11-2026: de 3 a 10 escenas) ---- */
  {s:'IFC',t:'Hay una fuga de refrigerante en la sala de máquinas y un compañero inconsciente dentro.',ok:'No entrar sin protección y avisar al 112',no:['Entrar corriendo a sacarlo, que son segundos','Encender la luz para ver dónde está','Entrar con un pañuelo mojado tapándote la boca'],e:'Con gas no se entra sin protección: no te conviertas en otra víctima.'},
  {s:'IFC',t:'Un compañero se cae de la cubierta al instalar una máquina exterior. Está consciente.',ok:'Pedirle que no se mueva y llamar al 112',no:['Quitarle el casco para que respire mejor','Incorporarlo para ver si puede andar','Bajarlo por la escalera entre dos personas'],e:'Caída desde altura: posible lesión de columna. No se le mueve salvo peligro; se le pide que mantenga el cuello quieto, sin quitarle el casco, y se llama al 112.'},
  /* fase 4, 17-11-2026: la trampa ya no dice que todo torniquete es malo: el error es saltarse la presión directa */
  {s:'IFC',t:'Un compañero se corta con una chapa y sangra mucho.',ok:'Presión directa con gasas (y guantes) y llamar al 112',no:['Atarle un cable muy fuerte sin apretar antes la herida','Lavar con alcohol y esperar a ver si para','Levantarle el brazo y esperar a que deje de sangrar'],e:'Hemorragia: primero, presión directa, firme y continua con gasas o un apósito, con guantes, y 112. El torniquete (mejor uno de fábrica) solo si la presión no basta.'},
  {s:'IFC',t:'Al purgar el circuito, a tu compañera le salpica refrigerante en los ojos.',ok:'Lavarlos con mucha agua 15-20 minutos, párpados abiertos',no:['Frotarlos con un trapo limpio para quitar el líquido','Echarle colirio y seguir con la carga de gas','Taparlos con la mano y esperar a que pase'],e:'Salpicadura en los ojos: agua abundante 15-20 minutos con los párpados abiertos, sin frotar, y al médico.'},

   llamas al 112 y es quien trae el DEA y te releva en la RCP. elenco.js se carga después de este guion: aquí solo se usa al jugar. */
const hayElenco=()=>typeof presenta==='function'&&typeof personaje==='function';
const cc=()=>st.cc||(st.cc=hayElenco()?cicloJugador():'HIG');
const vetJ=()=>personaje(cc(),'vet');
const compi=(may)=>{if(!hayElenco())return may?'Tu compañera':'tu compañera';const v=vetJ();return (may?(v.ella?'Tu compañera ':'Tu compañero '):(v.ella?'tu compañera ':'tu compañero '))+v.nombre};
/* dónde trabaja la protagonista (ficha del libro), en frases que valen en cualquier persona gramatical:
   [0] su empleo («higienista en…»), [1] el sitio físico («Estás trabajando en…», «Llamo desde…») */
const LUGAR_PROTA={HIG:['la clínica dental de Triana','la clínica dental de Triana'],IFC:['una cadena de hoteles de Sevilla','un hotel de Sevilla'],
 ITE:['hoteles y edificios de oficinas','un edificio de oficinas de Sevilla'],STI:['el aeropuerto de Sevilla','el aeropuerto de Sevilla']};
const enEmpresa=(c,fisico)=>(LUGAR_PROTA[c]||LUGAR_PROTA.HIG)[fisico?1:0];
const fondoDe=(nueva,c)=>capas(nueva,fondoPuesto(c));
/* presentador con texto enriquecido (negritas): presenta() de elenco.js pone el texto plano */
function narra(cont,op,html){if(!hayElenco()||!cont)return null;const el=presenta(cont,op);if(el&&html!=null)el.querySelector('.pres-txt').innerHTML=html;return el}
function reaccionaHtml(cont,animo,html){if(!hayElenco()||!cont)return;reacciona(cont,animo,null);const t=cont.querySelector('.pres-txt');if(t&&html!=null)t.innerHTML=html}
/* la persona compañera habla en la franja de mensajes de la RCP (aviso() vuelve al texto normal) */
function dice(html,animo){const m=$('#msg');if(!m)return;if(!hayElenco())return aviso(html);m.classList.add('habla');narra(m,{ciclo:cc(),quien:'vet',animo:animo||'neutro',compacto:true},html)}

/* 17-11-2026: reloj del juego. Si la página se oculta (llamada, bloqueo, otra aplicación) se para, y al volver se sigue
   tocando la pantalla de pausa: ninguna pregunta ni prueba pierde tiempo por eso. */
const ahoraJ=()=>(st.parado||performance.now())-(st.pausadoT||0);   // 18-11-2026: reloj del navegador (cambiar la hora del móvil no da tiempo)
/* ===== Pausa (18-11-2026, como en «Serpiente PRL») =====
   Botón de pausa en el marcador, Esc o P, el «atrás» y perder el foco (otra pestaña, otra aplicación, bloqueo, girar el móvil).
   Menú «Seguir / Salir al menú» que tapa la pregunta y el cuerpo: con el reloj parado no se puede ir leyendo.
   Al seguir, la compresión siguiente no mide el hueco de la pausa (st.ultimo=0): la pausa no cuenta ni como ritmo ni como interrupción. */
const PIC_CTL={pausa:'<path d="M9 5.5v13M15 5.5v13" stroke-width="3"/>',son:'<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18 6.5a7.8 7.8 0 0 1 0 11"/>',
 mudo:'<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/>'};
const picCtl=n=>`<svg class="pic" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${PIC_CTL[n]}</svg>`;
const sonTxt=()=>window.SILENCIO?'Poner el sonido':'Quitar el sonido';
const ctlHtml=()=>`<span class="ctl"><button type="button" data-ctl="pausa" aria-label="Pausa" title="Pausa">${picCtl('pausa')}</button><button type="button" data-ctl="son" aria-label="${sonTxt()}" title="${sonTxt()}">${picCtl(window.SILENCIO?'mudo':'son')}</button></span>`;
function pintaSon(){document.querySelectorAll('[data-ctl="son"]').forEach(b=>{b.innerHTML=picCtl(window.SILENCIO?'mudo':'son');b.setAttribute('aria-label',sonTxt());b.title=sonTxt()})}
/* se puede pausar mientras hay pantalla de juego y el nivel no está cerrándose (PLS hecha, relevo hecho, serie terminada) */
function jugando(){
 if(!st.l||st.salido||!app.querySelector('#tj,.rcp'))return false;
 if(st.l.modo==='pls')return st.paso<5;
 return !['fin','finP','fuera'].includes(st.fase);
}
function pausa(){
 if(st.parado||!jugando())return false;
 st.parado=performance.now();st.focoAntes=document.activeElement;
 if(st.cancelaGesto)st.cancelaGesto();   // un arrastre a medias (PLS) o una compresión a medias (profundidad) se suelta aquí
 try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}
 const v=document.createElement('div');v.className='pausa-j';v.id='pausaJ';
 v.setAttribute('role','dialog');v.setAttribute('aria-modal','true');v.setAttribute('aria-labelledby','pausaT');
 v.innerHTML=`<b id="pausaT">Pausa</b><span>El tiempo está parado.</span><div class="pausa-btns"><button type="button" class="btn p" data-pausa="sigue">Seguir</button><button type="button" class="btn s" data-pausa="sal">Salir al menú</button></div>${st.oficial?'<small>Si sales, este intento oficial cuenta como jugado.</small>':''}`;
 document.body.appendChild(v);app.inert=true;
 try{v.querySelector('.btn.p').focus({preventScroll:true})}catch(e){}
 return true;
}
function sigue(){
 if(!st.parado)return false;
 st.pausadoT=(st.pausadoT||0)+(performance.now()-st.parado);st.parado=0;st.ultimo=0;st.inter=[];
 quitaPausa();return true;
}
function quitaPausa(){
 const v=$('#pausaJ');if(!v)return;
 v.remove();app.inert=false;
 const f=st.focoAntes;st.focoAntes=null;if(f&&f.isConnected&&f.focus)try{f.focus({preventScroll:true})}catch(e){}   // vuelve el foco donde estaba (p. ej., el botón de «Mantener pulsado»)
}
document.addEventListener('click',e=>{
 const b=e.target.closest&&e.target.closest('[data-ctl],[data-pausa]');if(!b)return;
 if(b.dataset.ctl==='pausa')pausa();
 else if(b.dataset.ctl==='son'){window.SILENCIO=!window.SILENCIO;ls.set('ipe_silencio',window.SILENCIO?'1':'0');pintaSon()}   // comun.js apaga o enciende el audio con este mismo clic
 else if(b.dataset.pausa==='sigue')sigue();
 else if(b.dataset.pausa==='sal')sal();
});
document.addEventListener('keydown',e=>{
 if(e.key!=='Escape'&&e.key!=='p'&&e.key!=='P')return;
 if(e.target&&e.target.closest&&e.target.closest('input,textarea'))return;
 if($('#pausaJ')){e.preventDefault();sigue()}else if(pausa())e.preventDefault();
});
function paraOculto(e){if(document.hidden||e&&(e.type==='blur'||e.type==='pagehide'))pausa()}
document.addEventListener('visibilitychange',paraOculto);addEventListener('blur',paraOculto);addEventListener('pagehide',paraOculto);
const PAUSA_JUEGO=()=>pausa();   // la usa oficial.js con el «atrás» en la partida oficial
/* el «atrás» en el entrenamiento pausa en vez de salir de la página (en la oficial lo hace oficial.js) */
function guardaAtras(){try{if(!history.state||!history.state.aux)history.pushState({aux:1},'')}catch(e){}}
addEventListener('popstate',()=>{if(!OFI_VIVA&&jugando()){guardaAtras();pausa()}});
/* móvil girado: aviso «Gira el móvil» encima de todo y la partida en pausa (también si el nivel empieza ya girado) */
const MQ_GIRO=matchMedia('(orientation:landscape) and (max-height:500px) and (pointer:coarse)');
{const g=document.createElement('div');g.className='giro';g.setAttribute('aria-live','assertive');g.innerHTML='<span aria-hidden="true">↻</span>Gira el móvil: se juega en vertical';document.body.appendChild(g);
 const f=()=>{if(MQ_GIRO.matches)pausa()};MQ_GIRO.addEventListener?MQ_GIRO.addEventListener('change',f):MQ_GIRO.addListener(f)}
new MutationObserver(()=>{
 const j=!!app.querySelector('#tj,.rcp');document.body.classList.toggle('en-juego',j);
 if(!j){quitaPausa();return}
 if(!OFI_VIVA)guardaAtras();
 if(MQ_GIRO.matches)pausa();
}).observe(app,{childList:true});
/* Sonido (fase 5, 17-11-2026): con la API común de comun.js (nota, sfx, vibrar), que respeta «Sin sonido» y usa este actx.
   Se mantiene el carácter de antes: clic seco del metrónomo, dos tonos graves que bajan al fallar (José, 5-11-2026)
   y tonos que suben al acertar (el relevo bien hecho también suena). */
let actx=null;
const clic=(f=1100)=>nota(f,.07,'sine',.25);
function fallo(){sfx('fallo');vibra(150)}
function acierto(){sfx('premio');vibra([40,40,40])}
const golpeSordo=(v=1)=>nota(150,.08,'sine',.12*v,0,70);   // el «cuerpo» de cada compresión, muy suave
/* Capa de tensión (fase 5): un latido grave y muy discreto que se acelera según se acaba el tiempo (preguntas y PLS).
   q() devuelve lo que queda, de 1 a 0. Se calla con calla() o en cuanto cambia la partida (st nuevo). */
function latido(q){
 const id={};st.lat=id;clearTimeout(st.latT);
 const late=()=>{
  if(st.lat!==id)return;
  const v=q();if(v==null||v<=0)return;
  if(!st.parado&&!document.hidden){nota(80,.12,'triangle',.07,0,52);nota(72,.1,'triangle',.045,.16,48)}
  st.latT=setTimeout(late,Math.round(420+620*Math.max(0,Math.min(1,v))));   // de ~1 latido por segundo a más de 2
 };
 st.latT=setTimeout(late,500);
}
function calla(){st.lat=null;clearTimeout(st.latT)}
/* voz del DEA (José, 5-11-2026): la del propio móvil, en español; si no hay voz, no pasa nada */
function habla(txt){try{const s=window.speechSynthesis;if(!s||window.SILENCIO||st.parado)return;s.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='es-ES';u.rate=.95;
 const v=s.getVoices().find(x=>/^es(-|_)ES/i.test(x.lang))||s.getVoices().find(x=>/^es/i.test(x.lang));if(v)u.voice=v;s.speak(u)}catch(e){}}

addEventListener('online',vaciaCola);setTimeout(vaciaCola,1500);

function empieza(n,oficial){
 const l=n===PROF.n?PROF:NIVELES[n-1];   // fase 6: el entrenamiento de profundidad va aparte (la oficial sigue con 4 niveles)
 st={l,i:0,pts:0,racha:0,vidas:3,aciertos:0,fallos:[],oficial:oficial||null};
 if(l.modo==='test'){
  // fase 4, 17-11-2026: 3 escenas al azar de las de tu sector (10 u 11) (sin código o con TEST, de cualquier sector: antes repetía comunes);
  // la llamada por tarjetas ocupa su hueco sin quitar ninguna de sector y sale después de las escenas del 112 (ll)
  const banco=BANCOS[l.banco], mio=banco.filter(x=>x.s&&x.s===ciclo()), sec=mio.length?mio:banco.filter(x=>x.s), com=baraja(banco.filter(x=>!x.s));
  const s3=baraja(sec).slice(0,3), ll=l.banco==='pas'?1:0;
  st.lista=baraja(s3.concat(com.slice(0,l.preg-ll-s3.length)));
  if(ll){const d=Math.max(1,...st.lista.map((x,i)=>x.ll?i+1:0));st.lista.splice(d+Math.floor(Math.random()*(st.lista.length-d+1)),0,LLAMADA)}
  return pregunta();
 }
 if(l.modo==='pls')return pls();
 if(l.modo==='prof')return prof();
 return rcp();
}

/* ===== Niveles 1 y 2: escenas tipo test ===== */
function pregunta(){
 clearInterval(st.reloj);
 if(st.i>=st.lista.length||st.vidas<=0)return final();
 const s=st.lista[st.i];
 if(s.tipo==='llamada')return llamada(s);
 const ops=baraja([s.ok,...s.no]);
 app.innerHTML=`<div class="cab"><span class="pill">${st.pts} pts</span><span class="pill">${st.racha>1?ico('llama')+' x'+st.racha:'Escena '+(st.i+1)+'/'+st.lista.length}</span><span class="pill vidas" role="img" aria-label="Vidas: ${st.vidas} de 3">${'♥'.repeat(st.vidas)}${'♡'.repeat(3-st.vidas)}</span>${ctlHtml()}</div>
  <div class="barra"><i style="width:${st.i/st.lista.length*100}%"></i></div>
  <div class="tiempo"><i id="t"></i></div>
  <div class="tarjeta" id="tj" style="border-top:6px solid ${st.l.col}">
   ${cabEscena(s)}
   <div class="preg">${st.l.banco==='pas'?'¿Qué haces?':'¿Qué le pasa y qué haces?'}</div>
   <div class="opciones textos">${ops.map((o,k)=>`<button class="op" data-k="${k}">${o}</button>`).join('')}</div>
   <div class="explica" id="ex" role="status" aria-live="polite"></div>
   <button class="sig" id="sig">Siguiente</button>
  </div>`;
 narraEscena(s);
 const T=st.l.t*1000,t0=ahoraJ(),barra=$('#t');
 st.reloj=setInterval(()=>{const q=1-(ahoraJ()-t0)/T;barra.style.width=Math.max(0,q*100)+'%';if(q<=0)responde(null)},50);
 latido(()=>1-(ahoraJ()-t0)/T);
 const responde=k=>{
  clearInterval(st.reloj);calla();
  const elegido=k===null?null:ops[k], ok=elegido===s.ok, seg=(ahoraJ()-t0)/1000;
  app.querySelectorAll('.op').forEach(b=>{b.disabled=true;if(ops[b.dataset.k]===s.ok)b.classList.add('ok');else if(+b.dataset.k===k)b.classList.add('mal')});
  const ex=$('#ex');
  if(ok){
   st.racha++;st.aciertos++;
   const g=Math.round((100+Math.min(30,Math.max(0,st.l.t-seg)*6))*(1+Math.min(st.racha-1,4)*.25));   // fase 3: la rapidez suma como mucho 30 (antes hasta 120): manda saber, no leer deprisa
   st.pts+=g;flota('+'+g,'var(--ok)');sfx('acierto',st.racha-1);   // fase 5: el tono sube con la racha
   if(!explicaEscena(true,`<b>¡Correcto!</b> ${s.e}`)){ex.className='explica ok';ex.innerHTML=`<b>¡Correcto!</b>${s.e}`}
  }else{
   st.racha=0;st.vidas--;st.fallos.push(s);
   const r=Math.min(RESTA,st.pts);st.pts-=r;if(r)flota('−'+r,'var(--mal)');
   $('#tj').classList.add('sacude');fallo();
   if(!explicaEscena(false,`<b>${k===null?'¡Se acabó el tiempo!':'No es correcto.'}</b> Lo correcto: «${s.ok}». ${s.e}`)){ex.className='explica mal';ex.innerHTML=`<b>${k===null?'¡Se acabó el tiempo!':'No es correcto'}</b>Lo correcto: «${s.ok}». ${s.e}`}
  }
  const b=$('#sig');b.style.display='block';setTimeout(()=>muestraRespuesta(b),150);
  b.textContent=(st.vidas<=0||st.i+1>=st.lista.length)?'Ver resultado':'Siguiente';
  b.onclick=()=>{st.i++;pregunta()};
 };
 app.querySelectorAll('.op').forEach(b=>b.onclick=()=>responde(+b.dataset.k));
}
/* ===== Escenas narradas (arte, 17-11-2026) =====
   Cabecera con el puesto desenfocado y oscurecido; la protagonista cuenta la escena y, al responder, reacciona con la
   explicación en su bocadillo. Va encima de las opciones (no las tapa nunca). Sin elenco.js, la tarjeta de siempre. */
function cabEscena(s,fondo){
 if(!hayElenco())return `<div class="icoesc" style="background:${st.l.col}">${ico(s.tipo==='llamada'?'telefono':st.l.banco==='pas'?'escudo':'fonendo')}</div>${s.tipo==='llamada'?'':`<div class="escena">${s.t}</div>`}`;
 const c=s.s&&s.s!==cc()&&typeof ELENCO!=='undefined'&&ELENCO[s.s]?s.s:cc();   // escena de un sector: su puesto; común: el tuyo
 return `<div class="escena-cab" id="ecab"><div class="fondo" aria-hidden="true" style="--fondo:${fondoDe(fondo!==undefined?fondo:ARTE.escena[c],c)}"></div><div class="slot" id="epres" aria-live="polite"></div></div>`;
}
function entradaEscena(s){
 if(s.s&&typeof ELENCO!=='undefined'&&ELENCO[s.s])return `<b>Estás trabajando en ${enEmpresa(s.s,true)}.</b> `;
 if(/^¿/.test(s.t))return '<b>Esto hay que saberlo sin dudar.</b> ';
 return st.l.banco==='val'?'<b>Fíjate bien antes de actuar.</b> ':'<b>Esto puede pasar en cualquier trabajo.</b> ';
}
function narraEscena(s,quien,html){
 const slot=$('#epres');if(!slot)return;
 $('#tj').classList.add('con-escena');
 narra(slot,{ciclo:cc(),quien:quien||'prota',animo:'neutro'},html!=null?html:entradaEscena(s)+s.t);

/* ===== fase 5 (17-11-2026): avance rápido narrado, tutorial de ritmo y salir ===== */
/* Salto de tiempo narrado: antes el reloj saltaba de golpe a 1:40 con «+1 minuto». Ahora corre a la vista unos 3 s mientras
   se cuentan los ciclos 3 y 4, y un rótulo explica que 5 ciclos son unos 2 minutos. No suma ni quita puntos ni compresiones
   (no pasa por toque(): ni enRitmo, ni total, ni la gráfica). */
function avanceRapido(){
 st.fase='salto';metronomo(false);sfx('barrido');
 const de=crono(),a=100,D=3000,ini=ahoraJ();
 let ult=-1;
 aviso(`${ico('avance')}Seguís con la RCP: 30 compresiones y 2 ventilaciones… <b>ciclos 3 y 4</b>`);

  if(!$('#cr')||st.salido)return clearInterval(st.salto);
  const k=Math.min(1,(ahoraJ()-ini)/D),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;   // arranca, corre y frena
  st.t0=ahoraJ()-(de+(a-de)*e)*1000;tic();
  const n=Math.min(59,Math.floor(k*60));                                   // 60 compresiones: dos ciclos de 30
  if(n!==ult){
   $('#ci').textContent='Ciclo '+(3+Math.floor(n/30));$('#cuenta').innerHTML=(n%30+1)+'<small>/30</small>';
   if(Math.floor(n/3)!==Math.floor(ult/3)){st.ecg.push(ahoraJ());hunde(.45,false,180)}
   ult=n;
  }
  if(k>=1){
   clearInterval(st.salto);
   st.cicloN=5;st.cuenta=0;st.ultimo=0;st.inter=[];
   $('#ci').textContent='Ciclo 5';$('#cuenta').innerHTML='0<small>/30</small>';
   combo('5 ciclos ≈ 2 minutos',2400,'rotulo');sfx('premio');
   st.fase='comp';
   aviso('Han pasado <b>casi 2 minutos</b>. Ciclo 5: 30 compresiones más. Mira el cronómetro: a los 2:00, <b>¡relevo!</b>');
   metronomo(true);
  }
 },50);
}

  ${serie.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.r).toFixed(1)}" r="2.6" fill="${col(p.r)}"/>`).join('')}</svg>

}

const tardeEv=ev=>ev&&ev.timeStamp?Math.min(150,Math.max(0,performance.now()-ev.timeStamp)):0;   // como en toque()
/* Calibración. El píxel CSS no mide lo mismo en todas las pantallas, y el navegador no dice cuántos hay por centímetro.
   Referencias: un móvil tiene unos 160 px CSS por pulgada (Android define 1 dp = 1/160 de pulgada; los iPhone, unos 163)
   → 63 px/cm; una tableta, unos 132 → 52 px/cm; con ratón (ordenador), el estándar CSS de 96 por pulgada → 38 px/cm.
   Si la pantalla es baja (móvil apaisado) se reduce a escala para que quepan 6,5 cm. Quien quiera exactitud la ajusta

function pxPorCm(){

  const lado=Math.min(screen.width||innerWidth,screen.height||innerHeight);base=!grueso?37.8:lado<600?63:52}

const RY0=78, RCM=30;   // regla de la escena: 0 cm en y=78 y 30 unidades por cm (8 cm en y=318)

/* Ajuste con la moneda: el diámetro del círculo (px CSS) entre 2,325 cm da los píxeles por centímetro de esta pantalla */

/* Deslizar: máquina de estados de cada trazo (profundidad en cm desde donde se apoyó el dedo).

   Si en «sube» vuelve a bajar 1 cm sin haber llegado arriba, la anterior queda sin descompresión completa. */
function profMueve(cm,ahora){

function profSuelta(){

/* Mantener pulsado: la profundidad crece 1 cm cada 50 ms (5-6 cm = 250-300 ms). Volver a pulsar antes de 150 ms

const profHold=ms=>Math.min(8,Math.max(0,ms/HOLD_MS_CM));
function profPulsa(ahora){
 if(st.fase!=='prof'||st.hold||st.parado)return;
 if(st.descT){clearTimeout(st.descT);st.descT=0;profDesc(false)}
 if(!profNueva(ahora))return;
 st.hold={t0:ahora};const p=$('#padp');if(p)p.classList.add('pulsado');

}
function profSueltaPulsado(ahora){

 const p=$('#padp');if(p)p.classList.remove('pulsado');

}
/* hundimiento proporcional a la profundidad: la ilustración baja 2,6 unidades por cm, las manos 3,4 y la marca de la regla, 30 */
function profPinta(cm,suelta){
 const d=Math.min(8,Math.max(0,cm)),tr=suelta&&!MOV_REDUCIDO?'transform .14s ease-out':'none';
 const pon=(el,v)=>{if(el){el.style.transition=tr;el.style.transform=v}};

}
function profNueva(ahora){
 if(st.cuenta>=PROF_N)return null;

 st.serie.push(c);st.pc=c;st.cuenta++;st.ultimo=ahora;
 vibra(20);golpeSordo(.8);

 if(c.r!=null&&!c.pausa)$('#bpm').innerHTML=Math.round(c.r)+'<small>por minuto</small>';

const okRitmo=c=>c.r==null||(!c.pausa&&c.r>=100&&c.r<=120);
const okProf=c=>c.p>=P_MIN&&c.p<=P_MAX;
function profPico(cm){
 const c=st.pc;if(!c||c.p)return;
 c.p=Math.round(cm*10)/10;
 const e=$('#cm');if(e){e.className='cm '+(c.p<P_MIN?'poco':c.p>P_MAX?'mucho':'ok');e.innerHTML=fmtCm(c.p)+'<small>cm</small>'}
 const pi=$('#pico');if(pi){pi.setAttribute('y1',RY0+Math.min(8,c.p)*RCM);pi.setAttribute('y2',RY0+Math.min(8,c.p)*RCM);pi.setAttribute('opacity','1')}

 if(c.r!=null&&okRitmo(c))st.ptsP+=10;

function profDesc(ok){

function acabaProf(){

/* una frase por aspecto (ritmo, profundidad y descompresión), con los criterios del ERC 2025 */
function evaluaProf(s){
 const n=s.length, pct=(a,b)=>b?Math.round(a/b*100):0;
 const rs=s.filter(c=>c.r!=null&&!c.pausa), okR=rs.filter(c=>c.r>=100&&c.r<=120).length, pausas=s.filter(c=>c.pausa).length;
 const media=rs.length?Math.round(60000/(rs.reduce((a,c)=>a+60000/c.r,0)/rs.length)):0;   // media de los intervalos, no de las frecuencias
 const okP=s.filter(okProf).length, mp=n?s.reduce((a,c)=>a+c.p,0)/n:0, cortas=s.filter(c=>c.p<P_MIN).length, hondas=s.filter(c=>c.p>P_MAX).length;
 const okD=s.filter(c=>c.d!==false).length, validas=s.filter(c=>okRitmo(c)&&okProf(c)&&c.d!==false).length;
 let ritmo;
 if(rs.length<2)ritmo='<b>Ritmo:</b> no hay compresiones seguidas suficientes para medirlo.';
 else if(pct(okR,rs.length)>=70)ritmo=`<b>Ritmo:</b> muy bien. El ${pct(okR,rs.length)} % de tus compresiones, entre 100 y 120 por minuto (media: ${media}).`;
 else if(media<100)ritmo=`<b>Ritmo:</b> vas lento (media: ${media} por minuto). Acelera hasta 100-120: el pitido del principio marca 110.`;
 else if(media>120)ritmo=`<b>Ritmo:</b> vas demasiado rápido (media: ${media} por minuto). Por encima de 120 cuesta llegar a la profundidad y dejar que el pecho suba.`;
 else ritmo=`<b>Ritmo:</b> la media está bien (${media} por minuto), pero es irregular: solo el ${pct(okR,rs.length)} % entre 100 y 120. Busca un compás constante.`;
 if(pausas)ritmo+=` Además, ${pausas===1?'paraste una vez':'paraste '+pausas+' veces'}: las interrupciones tienen que ser mínimas.`;
 const prof=pct(okP,n)>=70?`<b>Profundidad:</b> muy bien. El ${pct(okP,n)} % entre 5 y 6 cm (media: ${fmtCm(mp)} cm).`
  :cortas&&hondas?`<b>Profundidad:</b> irregular (media: ${fmtCm(mp)} cm). ${cortas} de ${n} compresiones no llegan a 5 cm y ${hondas} pasan de 6. Busca siempre la franja verde: al menos 5 cm y no más de 6.`
  :cortas>=hondas?`<b>Profundidad:</b> falta profundidad en ${cortas} de ${n} compresiones (media: ${fmtCm(mp)} cm). En una persona adulta, al menos 5 cm.`
  :`<b>Profundidad:</b> ${hondas} de ${n} compresiones pasan de 6 cm (media: ${fmtCm(mp)} cm). Más hondo no es mejor: no pases de 6 cm.`;
 const desc=okD===n?'<b>Descompresión:</b> perfecta. Dejaste que el pecho subiera del todo en todas.'
  :pct(okD,n)>=70?`<b>Descompresión:</b> bien (${pct(okD,n)} %), aunque en ${n-okD} no dejaste que el pecho subiera del todo. Suelta o vuelve arriba siempre.`
  :`<b>Descompresión:</b> en ${n-okD} de ${n} no dejaste que el pecho subiera del todo. Suelta (o vuelve arriba) después de cada compresión, sin apoyarte: así el corazón se vuelve a llenar de sangre.`;

/* gráfica doble: arriba el ritmo (franja 100-120) y abajo la profundidad (franja 5-6 cm), compresión a compresión */
function graficaProf(s){
 if(!s||s.length<3)return '';
 const W=320,X0=30,x=i=>X0+i*(W-X0-8)/Math.max(1,s.length-1);

 const colR=c=>c.pausa||c.r<100?'#e07a1f':c.r>120?'#d33a1f':'#1a8a4a', colP=v=>v<P_MIN?'#e07a1f':v>P_MAX?'#d33a1f':'#1a8a4a';

  <polyline fill="none" stroke="#9fb3ab" stroke-width="1.4" points="${rs.map(p=>p[0]+','+p[1].toFixed(1)).join(' ')}"/>
  ${rs.map(p=>`<circle cx="${p[0]}" cy="${p[1].toFixed(1)}" r="2.6" fill="${colR(p[2])}"/>`).join('')}
  <text x="${X0}" y="128" font-size="9" font-weight="700" fill="#5d6f69">Profundidad (cm)</text>
  <rect x="${X0}" y="${yP(P_MIN)}" width="${W-X0-2}" height="${yP(P_MAX)-yP(P_MIN)}" fill="#dff3e7" rx="3"/>
  ${[0,2,4,5,6,8].map(v=>et(v,yP(v),v===5||v===6)).join('')}
  <polyline fill="none" stroke="#9fb3ab" stroke-width="1.4" points="${s.map((c,i)=>x(i)+','+yP(c.p).toFixed(1)).join(' ')}"/>
  ${s.map((c,i)=>`<circle cx="${x(i)}" cy="${yP(c.p).toFixed(1)}" r="${c.d===false?3.4:2.6}" fill="${c.d===false?'#fff':colP(c.p)}" stroke="${c.d===false?'#d33a1f':'none'}" stroke-width="1.8"/>`).join('')}</svg>
  <p class="ley"><span style="color:#1a8a4a">● bien</span> <span style="color:#e07a1f">● lento o poco profundo</span> <span style="color:#d33a1f">● rápido o demasiado hondo</span> <span style="color:#d33a1f">○ sin dejar subir el pecho</span></p></div>`;
}

.dlg button.no{background:#e3efe9;color:#004230}
/* portada común de la colección (fase 2): la tarjeta oscura de Serpiente, Auxilios y Aventura, para todos */
:where(.heroe){position:relative;border-radius:24px;padding:22px 18px 18px;text-align:left;color:#fff;overflow:hidden;background:radial-gradient(circle at 85% 10%,var(--brillo,rgba(252,209,0,.28)),transparent 45%),linear-gradient(160deg,#0b5a40,#062a1f 70%);box-shadow:0 14px 30px rgba(0,66,48,.35)}
:where(.heroe) .hm{font:700 12px "Helvetica Neue",Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#a8e6cc}
:where(.heroe) h1{color:#fff;font-size:40px;line-height:1;margin:8px 0 4px}
:where(.heroe h1) span{color:#fcd100}
:where(.heroe) p{color:#d8efe6;font-size:14.5px;line-height:1.45;margin:6px 0 10px}
:where(.heroe) .chips{display:flex;flex-wrap:wrap;gap:6px}
:where(.heroe .chips) span{font:700 12px "Helvetica Neue",Arial,sans-serif;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 10px;color:#fff}`;
  document.head.appendChild(css);

  /* Botones de opciones: al final de la portada, para no tapar nada mientras se juega. */
  const caja = document.createElement('div');
  caja.className = 'opcs';
  /* lee (opcional): de dónde sale el estado real. 18-11-2026: el sonido también se cambia desde el marcador de los juegos; al
     volver a la portada, el botón se repinta con el estado real (antes enseñaba el antiguo y el primer toque no hacía nada) */
  function boton(texto, activo, alCambiar, lee) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'opc';
    const pinta = v => { b.setAttribute('aria-pressed', v ? 'true' : 'false'); b.textContent = texto(v) };
    let v = activo; pinta(v);
    b.sync = () => { if (lee) { v = lee(); pinta(v) } };
    b.onclick = e => { e.stopPropagation(); b.sync(); v = !v; pinta(v); alCambiar(v) };
    caja.appendChild(b);
    return b;
  }
  const muestra = () => { const p = app && app.querySelector('.portada'); [...caja.children].forEach(b => b.sync && b.sync()); if (p && caja.children.length && caja.parentNode !== p) p.appendChild(caja) };
  if (app) new MutationObserver(muestra).observe(app, { childList: true });

  /* Sonido sí/no: en todos los juegos desde la fase 5 (también quita la vibración). */
  {
    const aplica = () => {
      try {
        const c = typeof actx !== 'undefined' && actx ? actx : AUDIO.ctx;
        if (window.SILENCIO) { if (c) c.suspend(); try { window.speechSynthesis && speechSynthesis.cancel() } catch (e) {} }
        else if (c && c.state === 'suspended') c.resume();
      } catch (e) {}
    };
    window.SILENCIO = L.get('ipe_silencio', '0') === '1';
    boton(v => v ? '🔊 Sonido y vibración' : '🔇 Sin sonido ni vibración', !window.SILENCIO, v => { window.SILENCIO = !v; L.set('ipe_silencio', v ? '0' : '1'); aplica() }, () => !window.SILENCIO);
    aplica();
    /* si el juego crea el sonido después, se vuelve a silenciar */
    document.addEventListener('click', () => setTimeout(aplica, 0), true);
    document.addEventListener('touchend', () => setTimeout(aplica, 0), true);
  }

  /* Ayuda de colores para daltonismo (solo señales: escribe el color de la señal en el nivel 1). */
  if (typeof GIRO !== 'undefined') {
    window.AYUDA_COLOR = L.get('ipe_ayuda_color', '0') === '1';
    boton(v => v ? '👁 Ayuda de colores: sí' : '👁 Ayuda de colores: no', window.AYUDA_COLOR,
      v => { window.AYUDA_COLOR = v; L.set('ipe_ayuda_color', v ? '1' : '0') });
  }
  muestra();

  /* Instalable (solo en línea desde el 9-11-2026: sw.js no guarda copias, siempre carga de internet). */
  if ('serviceWorker' in navigator && location.protocol === 'https:')
    navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>

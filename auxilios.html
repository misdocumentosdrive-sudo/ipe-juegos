<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Cada minuto cuenta · IPE I</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aleo:wght@600;800&display=swap" rel="stylesheet">
<style>

:root{--verde:#004230;--verde2:#0d6b4f;--naranja:#ff5900;--amarillo:#fcd100;--fondo:#f4f8f6;--texto:#1d2a30;--gris:#5b6b70;--ok:#1a8a4a;--mal:#d33a1f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--fondo);color:var(--texto);font:16px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:520px;min-height:100%;display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
h1,h2,.serif{font-family:Aleo,Georgia,serif}
.cab{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.marca{font:800 13px Aleo,Georgia,serif;color:var(--verde);letter-spacing:.3px}
.pill{background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.vidas{color:var(--mal);letter-spacing:2px}
.barra{height:8px;background:#dde7e2;border-radius:99px;overflow:hidden;margin:6px 0 14px}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--verde2),var(--verde));width:0;transition:width .3s}
.tiempo{height:5px;background:#eadfcf;border-radius:99px;overflow:hidden;margin:-8px 0 12px}
.tiempo i{display:block;height:100%;background:var(--naranja);width:100%}
.tarjeta{background:#fff;border-radius:22px;box-shadow:0 6px 20px rgba(0,66,48,.10);padding:18px;display:flex;flex-direction:column;align-items:center}
.senal{width:min(62vw,230px);height:min(62vw,230px);margin:6px 0 10px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 3px 4px rgba(0,0,0,.15))}
.senal img{max-width:100%;max-height:100%}
.op .mini img,.fila-sen img,.fallo img{width:100%;height:100%;object-fit:contain}
.confeti{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:cae linear forwards;z-index:9}
@keyframes cae{to{transform:translateY(105vh) rotate(720deg)}}
.preg{font:700 18px Aleo,Georgia,serif;color:var(--verde);text-align:center;margin:4px 0 2px}
.opciones{display:grid;gap:10px;margin-top:14px;width:100%}
.opciones.tipos{grid-template-columns:1fr}
.op{border:0;border-radius:14px;padding:14px 14px;font:600 16px "Helvetica Neue",Arial,sans-serif;background:#eef4f1;color:var(--texto);text-align:left;display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .08s,background .2s}
.op:active{transform:scale(.98)}
.op .mini{width:30px;height:30px;flex:none}
.op:disabled{cursor:default;opacity:1;color:var(--texto)}
.op.ok,.op.ok:disabled{background:var(--ok);color:#fff}
.op.mal,.op.mal:disabled{background:var(--mal);color:#fff}
.explica{margin-top:14px;width:100%;border-radius:14px;padding:12px 14px;font-size:15px;display:none}
.explica.ok{display:block;background:#e3f4ea;color:#0b5a2f}
.explica.mal{display:block;background:#fde8e3;color:#8c2512}
.explica b{display:block;font:800 16px Aleo,Georgia,serif;margin-bottom:2px}
.sig{margin-top:12px;width:100%;border:0;border-radius:14px;padding:14px;font:800 17px Aleo,Georgia,serif;background:var(--verde);color:#fff;cursor:pointer;display:none}
.puntos-flota{position:fixed;left:50%;top:38%;transform:translate(-50%,0);font:800 34px Aleo,Georgia,serif;color:var(--ok);pointer-events:none;animation:sube .9s ease-out forwards}
@keyframes sube{to{transform:translate(-50%,-70px);opacity:0}}
.sacude{animation:sacude .35s}
@keyframes sacude{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
/* portada */
.portada{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px}
.portada h1{font-size:32px;color:var(--verde);margin:0;line-height:1.1}
.portada p{color:var(--gris);margin:0}
.fila-sen{display:flex;justify-content:center;gap:8px;margin:6px 0}
.fila-sen img{width:52px;height:52px}
.nivel{border:0;border-radius:18px;padding:16px;text-align:left;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.07);cursor:pointer;display:flex;gap:14px;align-items:center}
.nivel .n{flex:none;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 20px Aleo,Georgia,serif;color:#fff}
.nivel b{display:block;font:800 17px Aleo,Georgia,serif;color:var(--verde)}
.nivel span{font-size:14px;color:var(--gris)}
.record{font-size:13px;color:var(--gris)}
/* final */
.final{text-align:center}
.final .gran{font:800 56px Aleo,Georgia,serif;color:var(--verde);margin:4px 0}
.estrellas{font-size:34px;letter-spacing:4px;color:var(--amarillo);text-shadow:0 1px 0 #c9a400}
.fallos{text-align:left;margin-top:16px}
.fallo{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:10px;margin-bottom:8px}
.fallo img{width:54px;height:54px;flex:none}
.fallo b{display:block;color:var(--verde)}
.fallo small{color:var(--gris)}
.btns{display:grid;gap:10px;margin-top:16px}
.btn{border:0;border-radius:14px;padding:14px;font:800 17px Aleo,Georgia,serif;cursor:pointer}
.btn.p{background:var(--verde);color:#fff}
.btn.s{background:#e3ece8;color:var(--verde)}
.pie{text-align:center;font-size:12px;color:var(--gris);margin-top:auto;padding-top:14px}
.oficial{background:#fff;border:2px solid var(--verde);border-radius:16px;padding:14px;margin:14px 0;text-align:left;display:grid;gap:8px}
.oficial label span,.oficial small{font-size:13px;opacity:.75}
.oficial input{font:700 20px/1.2 inherit;letter-spacing:2px;text-transform:uppercase;padding:10px 12px;border:2px solid #cfd8d3;border-radius:10px;width:100%;box-sizing:border-box}
.oficial input.error{border-color:#c0392b;background:#fdecea}
.oficial .btn[disabled]{opacity:.5}
.entreno{color:var(--verde);font-size:18px;margin:6px 0 4px;text-align:left}
.aviso-of{background:#fff8d6;border:2px solid #fcd100;border-radius:14px;padding:12px;margin:14px 0;line-height:1.5}
.situ{font-size:17px;line-height:1.45;text-align:center;margin:8px 4px 4px;color:var(--texto)}
.opciones.imgs{grid-template-columns:1fr 1fr}
.opciones.imgs .op{justify-content:center;padding:12px;aspect-ratio:1}
.opciones.imgs .op img{width:100%;height:100%;object-fit:contain}
#envio{margin-top:8px;font-weight:700;color:var(--verde)}

/* ===== propio de «Cada minuto cuenta» ===== */
.grafica{background:#fff;border-radius:16px;padding:10px 10px 6px;margin-top:14px;box-shadow:0 2px 10px rgba(0,66,48,.08)}
.grafica h2{color:var(--verde);font-size:17px;margin:2px 4px 6px;text-align:left}
.grafica svg{width:100%;display:block}
.grafica .ley{margin:4px 4px 2px;font-size:12.5px;line-height:1.5;color:var(--gris);text-align:left}
.grafica .ley span{font-weight:700;margin-right:6px;white-space:nowrap}
.chips112{display:grid;gap:8px;margin-top:12px;width:100%}
.chip112{border:2px dashed #b9cdc4;background:#f4f9f6;border-radius:12px;padding:10px 12px;text-align:left;font:600 14.5px/1.3 "Helvetica Neue",Arial;color:var(--texto);cursor:pointer}
.chip112 small{display:block;font-weight:400;color:var(--gris);font-size:13px}
.chip112.usada{opacity:.35;pointer-events:none}
.llamada{width:100%;min-height:54px;margin-top:10px;border-radius:12px;background:#0f2f25;color:#dff3ea;padding:10px 12px;font-size:14px;line-height:1.45;text-align:left}
.llamada b{color:#7dffb5}
.icoesc{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;margin:-4px auto 6px;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.heroe{position:relative;border-radius:24px;padding:22px 18px 18px;text-align:left;color:#fff;overflow:hidden;
 background:radial-gradient(circle at 85% 10%,rgba(255,89,0,.35),transparent 45%),linear-gradient(160deg,#0b5a40,#062a1f 70%);box-shadow:0 14px 30px rgba(0,66,48,.35)}
.heroe .hm{font:700 12px "Helvetica Neue",Arial;letter-spacing:.14em;text-transform:uppercase;color:#a8e6cc}
.heroe h1{color:#fff;font-size:40px;line-height:1;margin:8px 0 4px}
.heroe h1 span{color:#fcd100}
.heroe p{color:#d8efe6;font-size:14.5px;line-height:1.45;margin:6px 0 10px}
.hecg{width:100%;height:54px;display:block}
.hecg .trazo{fill:none;stroke:#7dffb5;stroke-width:3;stroke-linejoin:round;stroke-dasharray:640;stroke-dashoffset:640;animation:traza 2.4s linear infinite;filter:drop-shadow(0 0 5px rgba(125,255,181,.9))}
@keyframes traza{to{stroke-dashoffset:-640}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font:700 12px "Helvetica Neue",Arial;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 10px}
.nivel .ico{font-size:26px;flex:none}
.nivel{transition:transform .12s,box-shadow .12s}.nivel:active{transform:scale(.98)}

.escena{font-size:16px;line-height:1.45;text-align:center;margin:8px 4px 4px}
.opciones.textos .op{font-weight:600;font-size:15px;line-height:1.3}
.rcp{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#16332a 0%,#071a14 70%);color:#fff;display:flex;flex-direction:column;align-items:center;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;z-index:5}
.rcp.pls{background:radial-gradient(circle at 50% 35%,#16304a 0%,#08162a 70%)}
.rcp .arriba{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;padding:12px 14px 0;gap:8px}
.rcp .pill{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}
.rcp .crono{font:800 22px Aleo,Georgia,serif;letter-spacing:1px}
.monitor{width:calc(100% - 28px);max-width:492px;margin-top:8px;border-radius:14px;background:#03100c;border:1px solid rgba(125,255,181,.25);box-shadow:inset 0 0 24px rgba(47,212,122,.08),0 6px 20px rgba(0,0,0,.4);position:relative;overflow:hidden;
 background-image:linear-gradient(rgba(125,255,181,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(125,255,181,.07) 1px,transparent 1px);background-size:14px 14px}
.monitor .ecg{width:100%;height:58px;display:block;filter:drop-shadow(0 0 4px rgba(125,255,181,.8))}
.monitor .et{position:absolute;left:10px;top:6px;font:700 10px "Helvetica Neue",Arial;letter-spacing:.12em;color:#7dffb5;opacity:.8}
.monitor .corazon{position:absolute;right:10px;top:6px;font-size:20px;filter:drop-shadow(0 0 6px rgba(255,80,80,.8))}
.latido{animation:latido .25s ease-out}
@keyframes latido{40%{transform:scale(1.35)}}
.rcp .msg{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:12px;margin:8px 14px 0;padding:8px 12px;width:calc(100% - 28px);max-width:492px;font-weight:600}
.rcp .msg b{color:#7dffb5}
.rcp .arriba .crono{font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(125,255,181,.4)}
.rcp .cuenta,.rcp .bpm{font-variant-numeric:tabular-nums}
.rcp .botones .btn{border-radius:16px;box-shadow:0 6px 16px rgba(0,0,0,.35);backdrop-filter:blur(6px)}
.rcp .abajo{background:linear-gradient(180deg,rgba(3,16,12,0),rgba(3,16,12,.85) 30%)}
.rcp .msg{min-height:44px;max-width:480px;text-align:center;font:700 16px/1.3 "Helvetica Neue",Arial,sans-serif;padding:4px 14px;color:#dff3ea}
.rcp .cuerpo{flex:1;width:100%;max-width:420px;min-height:0;position:relative}
.rcp .cuerpo svg{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 24px rgba(0,0,0,.5))}
.asa{animation:asa 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes asa{50%{transform:scale(1.18)}}
.rcp .abajo{width:100%;max-width:520px;padding:6px 14px calc(14px + env(safe-area-inset-bottom));display:grid;gap:8px}
.rcp .marcador{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rcp .cuenta{font:800 34px Aleo,Georgia,serif;min-width:92px}
.rcp .cuenta small{font-size:15px;opacity:.7}
.rcp .gauge{width:150px;height:84px}
.rcp .bpm{font:800 24px Aleo,Georgia,serif;text-align:right;min-width:86px}
.rcp .bpm small{display:block;font:600 11px "Helvetica Neue",Arial;opacity:.75}
.rcp .botones{display:flex;gap:8px}
.rcp .botones .btn{flex:1;font-size:16px;padding:13px 8px}
.rcp .btn.vent{background:#2e7fd6;color:#fff}
.rcp .btn.rel{background:#fcd100;color:#3a2f00}
.rcp .btn.alarma{background:#ff5900;color:#fff;animation:late .6s infinite}
.rcp .btn[disabled]{opacity:.28}
@keyframes late{50%{transform:scale(1.04);filter:brightness(1.25)}}
.rcp .combo{position:absolute;left:0;right:0;top:6%;text-align:center;font:800 26px Aleo,Georgia,serif;color:#7dffb5;text-shadow:0 0 14px rgba(125,255,181,.6);pointer-events:none;opacity:0;transition:opacity .2s}
.onda{position:absolute;border:3px solid #7dffb5;border-radius:50%;pointer-events:none;animation:onda .55s ease-out forwards}
@keyframes onda{from{width:10px;height:10px;opacity:.9;transform:translate(-50%,-50%)}to{width:150px;height:150px;opacity:0;transform:translate(-50%,-50%)}}
.destello{position:fixed;inset:0;pointer-events:none;z-index:6;animation:destello .25s ease-out forwards}
@keyframes destello{from{opacity:.16}to{opacity:0}}
.rcp .tarjeta-rcp{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:12px;display:grid;gap:8px}
.rcp .tarjeta-rcp .op{background:rgba(255,255,255,.92)}
.rcp .tarjeta-rcp p{margin:0;text-align:center;font-size:15px;line-height:1.4}

/* Tablets y ordenadores (José, 9-11-2026): en pantallas grandes, todo más grande (en el móvil, igual que antes) */
@media (min-width:760px) and (min-height:660px){#app:not(:has(.rcp)){zoom:1.22}}
@media (min-width:1000px) and (min-height:860px){#app:not(:has(.rcp)){zoom:1.4}}
@media (min-width:760px){
 .rcp .arriba,.rcp .abajo{max-width:760px}
 .monitor,.rcp .msg{max-width:732px}
 .rcp .msg{font-size:19px}
 .rcp .cuerpo{max-width:640px}
 .rcp .cuenta{font-size:42px}.rcp .bpm{font-size:30px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* «Cada minuto cuenta» · bancos de preguntas (José, 5-11-2026). Todo sale de la UD 3 del libro, apartado 3.6
   (ERC 2025): PAS, 112, valoración, SVB y RCP, lesiones, Heimlich y botiquín. s = sector ('' = común a todos).
   ok = la respuesta correcta; no = tres trampas; e = la explicación (lo que dice el libro). */
const BANCOS = {
 pas: [
  {s:'',t:'Una compañera ha recibido una descarga y sigue tocando el cuadro eléctrico. ¿Qué haces primero?',ok:'Cortar la corriente antes de tocarla',no:['Tirar de su brazo para separarla','Echarle agua para reanimarla','Llamar al 112 y no hacer nada más'],e:'Proteger: si la tocas con corriente, serás otra víctima. Primero se corta la corriente.'},
  {s:'',t:'Llamas al 112. ¿Qué tienes que decir?',ok:'Quién eres, dónde estás, qué ha pasado, cuántas personas heridas y cómo están',no:['Solo «venid rápido, es urgente»','El nombre completo y el DNI de la víctima','Si la víctima tiene seguro médico'],e:'Avisar: quién eres, dónde estás exactamente, qué ha pasado, cuántas personas heridas hay y cómo están.'},
  {s:'',t:'Estás hablando con el 112. ¿Cuándo cuelgas?',ok:'Cuando te lo indiquen',no:['En cuanto des la dirección','Al minuto, para no ocupar la línea','Cuando llegue la ambulancia a la puerta'],e:'No cuelgues hasta que te lo indiquen: pueden guiarte paso a paso para hacer la RCP. Pon el altavoz.'},
  {s:'',t:'Tienes que socorrer y a la vez hablar con el 112. ¿Qué haces con el móvil?',ok:'Ponerlo en altavoz para tener las manos libres',no:['Sujetarlo con el hombro','Colgar y llamar luego','Pasárselo a la víctima'],e:'Con el altavoz tienes las manos libres para socorrer mientras te guían.'},
  {s:'',t:'¿Qué significa el método PAS?',ok:'Proteger, Avisar y Socorrer',no:['Parar, Analizar y Salir','Prevenir, Ayudar y Sanar','Pedir ayuda, Animar y Sujetar'],e:'PAS: Proteger (que no haya más peligros), Avisar (112) y Socorrer.'},
  {s:'',t:'Hay humo en el almacén y una persona tirada en el suelo. ¿Qué haces?',ok:'No entrar sin protección y avisar al 112',no:['Entrar corriendo a sacarla','Encender la luz para verla mejor','Entrar con un pañuelo en la boca'],e:'Primero, tu seguridad: si hay humo o gas, no entres sin protección.'},
  {s:'',t:'Una persona se ha caído de una escalera, está consciente y le duele el cuello.',ok:'No moverla, sujetarle la cabeza como está y llamar al 112',no:['Ayudarla a levantarse despacio','Sentarla para que respire mejor','Girarle el cuello para ver si se mueve'],e:'Posible lesión de columna: no se mueve salvo peligro inmediato; cabeza, cuello y tronco alineados.'},
  {s:'',t:'¿Le das agua a una persona herida grave que tiene mucha sed?',ok:'No: no se da de comer ni de beber',no:['Sí, con azúcar','Sí, a sorbos pequeños','Solo si es agua fría'],e:'A una persona herida grave no se le da de comer ni de beber.'},
  {s:'',t:'¿Qué lleva el botiquín de la empresa para quien se hace daño?',ok:'Material de curas, pero ningún medicamento',no:['Analgésicos para el dolor','Antibióticos en pastillas','Tranquilizantes para los nervios'],e:'El botiquín de la empresa no lleva medicamentos: solo material de primeros auxilios.'},
  {s:'',t:'Hay varias personas heridas. ¿A quién atiendes primero?',ok:'A quien no responde o no respira con normalidad y a las hemorragias graves',no:['A quien más grita','A quien conoces','A la herida más fácil de curar'],e:'Quien grita respira. Primero, quien no responde o no respira con normalidad y las hemorragias graves.'},
  {s:'',t:'Ha habido un atropello en la puerta y siguen pasando coches. ¿Qué haces primero?',ok:'Señalizar la zona para que no haya otro atropello',no:['Levantar a la víctima y llevarla a la acera','Hacer una foto para el parte','Darle agua para que se recupere'],e:'Proteger: comprueba que no hay más peligros (tráfico, corriente, fuego, gas) y señaliza.'},
  {s:'HIG',t:'Un paciente se desploma en el sillón dental. ¿Qué haces primero?',ok:'Hablarle y tocarle los hombros para ver si responde',no:['Echarle agua fría en la cara','Darle un caramelo por si es una bajada de azúcar','Esperar a que se le pase'],e:'Socorrer empieza por la evaluación primaria: ¿responde? Háblale y tócale los hombros.'},
  {s:'HIG',t:'A una compañera le salpica desinfectante en un ojo.',ok:'Lavar con agua abundante 15-20 minutos con los párpados abiertos',no:['Frotar el ojo con una gasa','Echar colirio y seguir trabajando','Taparlo con un parche'],e:'Quemadura química: agua abundante 15-20 minutos; en los ojos, con los párpados abiertos.'},
  {s:'HIG',t:'Una persona se atraganta en la sala de espera, pero tose con fuerza.',ok:'Animarla a seguir tosiendo',no:['Darle golpes en la espalda ya','Hacerle la maniobra de Heimlich','Darle agua para que pase'],e:'Si la tos es eficaz, es el mejor remedio: anímala a toser y no le des golpes.'},
  {s:'ITE',t:'Un compañero se queda pegado a un cable con tensión en la caja de registro.',ok:'Cortar la corriente antes de tocarlo',no:['Separarlo con las manos','Tirarle del cinturón','Echarle agua'],e:'Contacto eléctrico: cortar la corriente antes de tocar a la persona.'},
  {s:'ITE',t:'Un compañero se cae del tejado al montar una antena y está consciente.',ok:'No moverlo, pedirle que no se mueva y llamar al 112',no:['Incorporarlo para ver si puede andar','Llevarlo en brazos al coche','Darle un analgésico'],e:'Caída desde altura: no se mueve salvo peligro; se le sujeta la cabeza y se llama al 112.'},

/* sonido: un «clic» corto para el pulso de ayuda (WebAudio, sin archivos) */
let actx=null;
function clic(f=1100){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.25,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.07);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.08)}catch(e){}}

/* sonido de fallo: dos tonos graves que bajan (José, 5-11-2026: «cuando falla, un sonido además de moverse la pantalla») */
function zumbido(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t0=actx.currentTime;
 [[220,0],[160,.13]].forEach(([f,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t0+d);g.gain.exponentialRampToValueAtTime(.16,t0+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d+.16);
  o.connect(g).connect(actx.destination);o.start(t0+d);o.stop(t0+d+.18)})}catch(e){}}
function fallo(){zumbido();vibra(150)}
/* sonido de acierto: dos tonos que suben (José, 5-11-2026: el relevo bien hecho también suena) */
function acierto(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t0=actx.currentTime;
 [[660,0],[990,.12]].forEach(([f,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t0+d);g.gain.exponentialRampToValueAtTime(.25,t0+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d+.22);
  o.connect(g).connect(actx.destination);o.start(t0+d);o.stop(t0+d+.24)})}catch(e){}vibra([40,40,40])}
/* voz del DEA (José, 5-11-2026): la del propio móvil, en español; si no hay voz, no pasa nada */
function habla(txt){try{const s=window.speechSynthesis;if(!s)return;s.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='es-ES';u.rate=.95;
 const v=s.getVoices().find(x=>/^es(-|_)ES/i.test(x.lang))||s.getVoices().find(x=>/^es/i.test(x.lang));if(v)u.voice=v;s.speak(u)}catch(e){}}
function envia(d){
 const f=new URLSearchParams();
 f.append(FORM.campo,`${JUEGO} | ${d.codigo} | intento ${d.intento} | ${d.est.map((e,i)=>'N'+(i+1)+' '+e).join(' | ')} | ${d.puntos} pts | +${d.extra}`);
 return fetch(FORM.url,{method:'POST',mode:'no-cors',body:f}).then(()=>true).catch(()=>false);
}
async function puesto(codigo,pts,nuevo){
 try{
  const txt=await fetch(RANKING+'&t='+Date.now()).then(r=>r.text());
  const g=grupoDe(codigo);
  const lista=txt.split(/\r?\n/).slice(1).map(l=>l.split(',')).filter(f=>f[0]===g&&(f[2]||'').trim()===JUEGO).map(f=>+f[1]||0);
  const pos=1+lista.filter(x=>x>pts).length, total=Math.max(lista.length+(nuevo?1:0),pos);
  return {pos,total};
 }catch(e){return null}
}
const recien=()=>Date.now()-(+ls.get(PREF+'_primer_envio',0))<10*60*1000;
function textoPuesto(r,pts){
 if(!r)return 'No se ha podido consultar la clasificación. Inténtalo más tarde desde el menú.';

 return `🏆 Vas <b>${r.pos}.º de ${r.total}</b> en tu grupo con tu mejor partida (${pts} puntos).${podio}<br><small>Clasificación provisional: se actualiza cada pocos minutos.</small>`;
}

function empieza(n,oficial){
 const l=NIVELES[n-1];
 st={l,i:0,pts:0,racha:0,vidas:3,aciertos:0,fallos:[],oficial:oficial||null};
 if(l.modo==='test'){
  const banco=BANCOS[l.banco], sec=banco.filter(x=>x.s===ciclo()), com=baraja(banco.filter(x=>!x.s));
  const s3=baraja(sec).slice(0,3);
  st.lista=baraja(s3.concat(com.slice(0,l.preg-s3.length)));
  if(l.banco==='pas'){st.lista.pop();st.lista.splice(1+Math.floor(Math.random()*(st.lista.length-1)),0,LLAMADA)}
  return pregunta();
 }
 if(l.modo==='pls')return pls();
 return rcp();
}

function pregunta(){
 clearInterval(st.reloj);
 if(st.i>=st.lista.length||st.vidas<=0)return final();

 if(s.tipo==='llamada')return llamada(s);
 const ops=baraja([s.ok,...s.no]);
 app.innerHTML=`<div class="cab"><span class="pill">${st.pts} pts</span><span class="pill">${st.racha>1?'🔥 x'+st.racha:'Escena '+(st.i+1)+'/'+st.lista.length}</span><span class="pill vidas">${'♥'.repeat(st.vidas)}${'♡'.repeat(3-st.vidas)}</span></div>

   <div class="preg">${st.l.banco==='pas'?'¿Qué haces?':'¿Qué le pasa y qué haces?'}</div>

   <div class="opciones textos">${ops.map((o,k)=>`<button class="op" data-k="${k}">${o}</button>`).join('')}</div>
   <div class="explica" id="ex"></div>
   <button class="sig" id="sig">Siguiente</button>
  </div>`;
 const T=st.l.t*1000,t0=Date.now(),barra=$('#t');
 st.reloj=setInterval(()=>{const q=1-(Date.now()-t0)/T;barra.style.width=Math.max(0,q*100)+'%';if(q<=0)responde(null)},50);
 const responde=k=>{
  clearInterval(st.reloj);
  const elegido=k===null?null:ops[k], ok=elegido===s.ok, seg=(Date.now()-t0)/1000;
  app.querySelectorAll('.op').forEach(b=>{b.disabled=true;if(ops[b.dataset.k]===s.ok)b.classList.add('ok');else if(+b.dataset.k===k)b.classList.add('mal')});
  const ex=$('#ex');
  if(ok){
   st.racha++;st.aciertos++;
   const g=Math.round((100+Math.max(0,st.l.t-seg)*6)*(1+Math.min(st.racha-1,4)*.25));
   st.pts+=g;flota('+'+g,'var(--ok)');
   ex.className='explica ok';ex.innerHTML=`<b>¡Correcto!</b>${s.e}`;
  }else{
   st.racha=0;st.vidas--;st.fallos.push(s);
   const r=Math.min(RESTA,st.pts);st.pts-=r;if(r)flota('−'+r,'var(--mal)');
   $('#tj').classList.add('sacude');fallo();
   ex.className='explica mal';ex.innerHTML=`<b>${k===null?'¡Se acabó el tiempo!':'No es correcto'}</b>Lo correcto: «${s.ok}». ${s.e}`;
  }
  const b=$('#sig');b.style.display='block';setTimeout(()=>b.scrollIntoView({behavior:'smooth',block:'end'}),150);
  b.textContent=(st.vidas<=0||st.i+1>=st.lista.length)?'Ver resultado':'Siguiente';
  b.onclick=()=>{st.i++;pregunta()};
 };
 app.querySelectorAll('.op').forEach(b=>b.onclick=()=>responde(+b.dataset.k));
}

function llamada(s){
 const fichas=baraja(s.orden.map((x,k)=>({k,x})).concat([{k:-1,x:s.trampa}]));
 let paso=0,hecho=false;
 app.innerHTML=`<div class="cab"><span class="pill">${st.pts} pts</span><span class="pill">${st.racha>1?'🔥 x'+st.racha:'Escena '+(st.i+1)+'/'+st.lista.length}</span><span class="pill vidas">${'♥'.repeat(st.vidas)}${'♡'.repeat(3-st.vidas)}</span></div>

  const ahora=Date.now();st.ecg=st.ecg.filter(t=>ahora-t<4000);
  const pts=[];for(let x=0;x<=300;x+=3){const t=ahora-(300-x)/300*4000;let y=34;for(const k of st.ecg){const d=t-k;if(d>=0&&d<120)y-=Math.sin(d/120*Math.PI)*(d<60?26:-8)}pts.push(x+','+y.toFixed(1))}
  const l=$('#lin');if(l){l.setAttribute('points',pts.join(' '));st.raf=requestAnimationFrame(dibuja)}
 };
 st.raf=requestAnimationFrame(dibuja);
}
const crono=()=>st.t0?(Date.now()-st.t0)/1000:0;
function tic(){
 if(!$('#cr'))return;
 const s=Math.floor(crono());$('#cr').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
 if(st.compa&&!st.relevo&&s>=140&&!st.agotado){st.agotado=true;st.errores++;fallo();aviso('Llevas más de 2 minutos: te estás agotando y las compresiones pierden profundidad. ¡Pide el relevo!');$('#rel').classList.add('alarma')}
 if(st.fase==='dea3'&&Date.now()-st.deaT>4000){st.errores++;fallo();st.fase='dea4';aviso('El DEA no puede analizar si alguien toca a la persona. ¡Que nadie la toque!');pasoDea()}
}
function aviso(t){const m=$('#msg');if(m)m.innerHTML=t}
function pintaPts(){const p=$('#pts');if(p)p.textContent=Math.max(0,puntosRcp())+' pts'}
const puntosRcp=()=>st.enRitmo*10+(st.sitioOk?100:0)+(st.relevo==='ok'?150:0)+st.deaPaso*40-st.errores*RESTA;
function marca(p,color){
 const cu=$('#cu'),svg=$('#svg'),r=svg.getBoundingClientRect(),m=svg.getScreenCTM();
 const o=document.createElement('div');o.className='onda';o.style.borderColor=color;
 o.style.left=(p.x*m.a+m.e-r.left)+'px';o.style.top=(p.y*m.d+m.f-r.top)+'px';cu.appendChild(o);setTimeout(()=>o.remove(),600);
}
function toque(p){
 if(st.fase==='sitio'){
  if(dist(p,SITIO)<26){
   st.fase='comp';$('#manosg').innerHTML=manosSocorrista;
   aviso('¡Bien! Talón de la mano en el centro del pecho y la otra encima, brazos rectos. <b>Comprime: 30 veces, a 100-120 por minuto.</b>');
   metronomo(true);
  }else{
   st.sitioOk=false;st.errores++;fallo();marca(p,'#ff6b4a');
   aviso('Ahí no. Las manos van en el <b>centro del pecho</b>: ni sobre el corazón, ni en el estómago, ni junto al cuello.');
  }
  return pintaPts();
 }
 if(st.fase==='dea2')return poneParche(p);
 if(st.fase!=='comp')return;
 if(dist(p,SITIO)>60){st.errores++;fallo();marca(p,'#ff6b4a');aviso('¡Las manos en el centro del pecho!');return pintaPts()}
 if(st.cuenta>=30){st.errores++;fallo();aviso('Ya van 30: ahora, <b>2 ventilaciones</b>.');return pintaPts()}
 const ahora=Date.now();if(!st.t0)st.t0=ahora;
 st.cuenta++;st.ecg.push(ahora);vibra(25);marca(p,'#7dffb5');
 const ma=$('#manos');if(ma)ma.animate([{transform:'scale(1)'},{transform:'scale(.7)'},{transform:'scale(1)'}],{duration:200});const fg=$('#fig');if(fg)fg.animate([{transform:'scale(1)'},{transform:'scale(.985)'},{transform:'scale(1)'}],{duration:200});const co=$('#cor');if(co){co.classList.remove('latido');void co.offsetWidth;co.classList.add('latido')}
 if(st.ultimo&&st.cuenta>1){
  const iv=ahora-st.ultimo;st.inter.push(iv);if(st.inter.length>3)st.inter.shift();
  const v=60000/(st.inter.reduce((a,b)=>a+b,0)/st.inter.length), inst=60000/iv;
  st.total++;st.aguja(v);(st.serie=st.serie||[]).push({r:inst,c:st.cicloN});$('#bpm').innerHTML=Math.round(v)+'<small>por minuto</small>';
  if(inst>=100&&inst<=120){st.enRitmo++;st.combo++;destello('#2fd47a');if(st.combo>=5)combo('¡Ritmo perfecto! x'+st.combo)}
  else{st.combo=0;destello(inst<100?'#ff9a3d':'#ff4a4a');aviso(inst<100?'¡Más rápido!':'¡Más despacio!')}
 }
 st.ultimo=ahora;
 $('#cuenta').innerHTML=st.cuenta+'<small>/30</small>';
 if(st.cuenta===10&&st.oficial)metronomo(false);
 if(st.cuenta===30){$('#vent').disabled=false;$('#vent').classList.add('alarma');aviso('¡30! Ahora, <b>2 ventilaciones</b>.');metronomo(false)}
 pintaPts();
}
function combo(t){const c=$('#combo');if(!c)return;c.textContent=t;c.style.opacity=1;clearTimeout(st.cto);st.cto=setTimeout(()=>c.style.opacity=0,500)}
function destello(col){const d=document.createElement('div');d.className='destello';d.style.background=col;document.body.appendChild(d);setTimeout(()=>d.remove(),260)}
function metronomo(on){
 clearInterval(st.metro);
 if(!on)return;
 st.metro=setInterval(()=>{if(st.fase!=='comp'||(st.oficial&&st.cuenta>=10)||st.cuenta>=30)return clearInterval(st.metro);clic();const c=$('#cuenta');if(c)c.animate([{color:'#7dffb5'},{color:'#fff'}],{duration:200})},MET);
}
function ventilar(){
 if(st.fase!=='comp')return;
 if(st.cuenta<30){st.errores++;fallo();aviso('Aún no llevas 30 compresiones.');return pintaPts()}
 st.fase='vent';$('#vent').disabled=true;$('#vent').classList.remove('alarma');
 aviso('Abre la vía aérea (frente atrás y mentón arriba) y da 2 ventilaciones de 1 segundo cada una…');
 setTimeout(()=>{
  if(st.fase!=='vent')return;
  st.cicloN++;st.cuenta=0;st.ultimo=0;st.inter=[];
  if(st.cicloN===2&&!st.compa){st.compa=true;$('#rel').disabled=false}
  // salto de tiempo (José, 5-11-2026: «el RCP se me ha hecho eterno»): tras dos ciclos, el cronómetro salta a 1:40
  if(st.cicloN===3&&!st.saltado){st.saltado=true;st.t0=Date.now()-100000;combo('⏩ +1 minuto')}
  $('#ci').textContent='Ciclo '+st.cicloN;$('#cuenta').innerHTML='0<small>/30</small>';
  st.fase='comp';
  aviso(st.cicloN===3&&!st.relevo?'⏩ Seguís comprimiendo… <b>han pasado casi 2 minutos</b>. Atento al cronómetro: a los 2:00, <b>¡relevo!</b>':st.compa&&!st.relevo?'Tu compañera ya está aquí y el DEA viene de camino. Seguid: <b>relevaos cada 2 minutos</b>.':'Otra vez: 30 compresiones.');
  metronomo(true);
 },2600);
}
function relevar(){
 if(!st.compa||st.relevo)return;
 if(crono()<118){st.errores++;aviso('Aún no: el relevo es <b>cada 2 minutos</b>. Mira el cronómetro.');fallo();return pintaPts()}
 st.relevo=st.agotado?'tarde':'ok';$('#rel').disabled=true;$('#rel').classList.remove('alarma');
 st.fase='dea0';clearInterval(st.metro);
 combo('🔄 ¡Relevo!');if(st.relevo==='ok')acierto();
 aviso('Tu compañera sigue con las compresiones, sin parar. Acaba de llegar el <b>DEA</b>: te toca a ti.');
 st.compRitmo=setInterval(()=>{st.ecg.push(Date.now());const ma=$('#manos');if(ma)ma.animate([{transform:'scale(1)'},{transform:'scale(.86)'},{transform:'scale(1)'}],{duration:200})},MET);
 setTimeout(()=>{st.fase='dea1';pasoDea()},1800);
 pintaPts();
}
function opcionesDea(txt,ops,ok,sig){
 const orden=baraja(ops.map((o,k)=>k));      // la correcta no sale siempre en el mismo sitio
 $('#bot').innerHTML=`<div class="tarjeta-rcp" style="flex:1"><p>${txt}</p>${orden.map(k=>`<button class="op" data-k="${k}">${ops[k]}</button>`).join('')}</div>`;
 $('#bot').querySelectorAll('.op').forEach(b=>b.onclick=()=>{
  if(+b.dataset.k===ok){st.deaPaso++;clic(880);sig()}else{st.errores++;fallo();b.classList.add('mal');b.disabled=true;pintaPts()}
 });
}
function pasoDea(){
 pintaPts();
 if(st.fase==='dea1')return opcionesDea('¿Qué haces con el DEA?',['Encenderlo y seguir sus instrucciones de voz','Esperar a que llegue la ambulancia','Parar la RCP para buscar el pulso'].map((x,i)=>x),0,()=>{st.fase='dea2';habla('Coloque los parches sobre el pecho desnudo del paciente.');st.parches=0;aviso('«Coloque los parches sobre el pecho desnudo del paciente». <b>Toca los dos sitios donde van.</b>');$('#bot').innerHTML='<div class="tarjeta-rcp" style="flex:1"><p>Un parche bajo la clavícula derecha de la persona y el otro en su costado izquierdo, bajo la axila.</p></div>'});
 if(st.fase==='dea4'||st.fase==='dea3'){
  if(st.fase==='dea3')return;
 }
 if(st.fase==='dea4'){
  clearInterval(st.compRitmo);
  habla('Descarga recomendada. Apártense del paciente. Pulse el botón de descarga.');
  return opcionesDea('«Descarga recomendada. Apártense del paciente».',['⚡ Pulsar el botón de descarga, sin que nadie la toque','Sujetarle la mano para tranquilizarla','Quitar los parches'],0,()=>{st.fase='dea5';destello('#fff');vibra([60,40,60]);habla('Descarga administrada. Comience la reanimación cardiopulmonar.');pasoDea()});
 }
 if(st.fase==='dea5')return opcionesDea('Descarga administrada. ¿Y ahora?',['Reanudar las compresiones de inmediato','Comprobar si ya respira antes de seguir','Esperar a ver si se despierta'],0,()=>{st.fase='fin';acierto();aviso('¡Muy bien! Seguís con la RCP y el DEA hasta que llega la ambulancia. <b>Cada minuto cuenta.</b>');setTimeout(acabaRcp,2200)});
}
function poneParche(p){
 const k=PARCHES.findIndex(q=>dist(p,q)<30&&!q.puesto);
 if(k<0){st.errores++;marca(p,'#ff6b4a');fallo();aviso('Ahí no va el parche: uno bajo la clavícula derecha y otro en el costado izquierdo, bajo la axila.');return pintaPts()}
 PARCHES[k].puesto=true;st.parches++;clic(880);
 $('#marcas').innerHTML+=`<rect x="${PARCHES[k].x-16}" y="${PARCHES[k].y-12}" width="32" height="24" rx="5" fill="#fff" stroke="#2fd47a" stroke-width="3"/>`;
 if(st.parches===2){
  st.deaPaso++;st.fase='dea3';st.deaT=Date.now();
  aviso('«Analizando el ritmo cardiaco»… Tu compañera sigue comprimiendo.');habla('Analizando el ritmo cardiaco. No toque al paciente.');
  $('#bot').innerHTML='<button class="btn alarma" id="apart" style="flex:1">✋ ¡Que nadie la toque!</button>';
  $('#apart').onclick=()=>{if(st.fase!=='dea3')return;st.deaPaso++;clearInterval(st.compRitmo);st.fase='dea4';aviso('Bien: nadie la toca mientras el DEA analiza.');pasoDea()};
 }
 pintaPts();
}
function acabaRcp(){
 clearInterval(st.reloj);clearInterval(st.metro);clearInterval(st.compRitmo);cancelAnimationFrame(st.raf||0);
 PARCHES.forEach(q=>delete q.puesto);
 const r=st.total?st.enRitmo/st.total:0, e=st.errores;
 st.estrellas=r>=.7&&e<=1?3:r>=.5&&e<=3?2:r>=.3?1:0;
 st.pts=Math.max(0,puntosRcp());st.aciertos=st.enRitmo;st.lista={length:st.total};
 st.grafica=graficaRitmo(st.serie);
 st.resumen=`Compresiones con buen ritmo (100-120 por minuto): <b>${Math.round(r*100)} %</b> (${st.enRitmo} de ${st.total}). Fallos: ${e}. Relevo: ${st.relevo==='ok'?'a tiempo':st.relevo==='tarde'?'tarde (más de 2 minutos)':'sin hacer'}.`;
 final();
}

/* gráfica de la RCP: el ritmo de cada compresión sobre la franja verde de 100-120 por minuto */
function graficaRitmo(serie){
 if(!serie||serie.length<3)return '';
 const W=320,H=150,MIN=70,MAX=150,X0=26,y=v=>8+(MAX-Math.min(MAX,Math.max(MIN,v)))/(MAX-MIN)*(H-18),x=i=>X0+i*(W-X0-6)/Math.max(1,serie.length-1);
 const col=v=>v>=100&&v<=120?'#1a8a4a':v<100?'#e07a1f':'#d33a1f';
 let cortes='';for(let i=1;i<serie.length;i++)if(serie[i].c!==serie[i-1].c)cortes+=`<line x1="${(x(i)+x(i-1))/2}" y1="6" x2="${(x(i)+x(i-1))/2}" y2="${H-8}" stroke="#c9d6d0" stroke-dasharray="3 3"/>`;
 const et=v=>`<text x="${X0-4}" y="${y(v)+3}" text-anchor="end" font-size="9" fill="${v===100||v===120?'#1a8a4a':'#8a9a95'}" font-weight="${v===100||v===120?700:400}">${v}</text>`;
 return `<div class="grafica"><h2 class="serif">Tu ritmo, compresión a compresión</h2><svg viewBox="0 0 ${W} ${H}">
  <rect x="${X0}" y="${y(120)}" width="${W-X0-2}" height="${y(100)-y(120)}" fill="#dff3e7" rx="3"/>
  ${[80,100,120,140].map(et).join('')}
  ${cortes}<polyline fill="none" stroke="#9fb3ab" stroke-width="1.4" points="${serie.map((p,i)=>x(i)+','+y(p.r).toFixed(1)).join(' ')}"/>
  ${serie.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.r).toFixed(1)}" r="2.6" fill="${col(p.r)}"/>`).join('')}</svg>
  <p class="ley"><span style="color:#1a8a4a">● buen ritmo (100-120)</span> <span style="color:#e07a1f">● lento</span> <span style="color:#d33a1f">● rápido</span><br>Las líneas de puntos separan los ciclos de 30 compresiones.</p></div>`;
}

/* ===== Final de cada nivel y partida oficial ===== */
function final(){
 clearInterval(st.reloj);clearInterval(st.metro);
 const l=st.l;
 let est;
 if(l.modo==='test'){const total=st.lista.length,r=st.aciertos/total;est=st.vidas<=0?0:r>=.95?3:r>=.75?2:r>=.5?1:0;st.resumen=`${st.aciertos} de ${total} aciertos${st.vidas<=0?' · sin vidas':''}`}
 else est=st.estrellas;
 const antes=rec(l.n);guarda(l.n,st.pts);
 const unicos=l.modo==='test'?[...new Set(st.fallos)]:[];
 if(est===3)for(let n=0;n<70;n++){const c=document.createElement('i');c.className='confeti';c.style.left=Math.random()*100+'vw';c.style.background=['#004230','#ff5900','#fcd100','#2f8a5b'][n%4];c.style.animationDuration=(1.6+Math.random()*1.6)+'s';c.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4000)}
 app.innerHTML=`<div class="final">
  <div class="marca">Nivel ${l.n} · ${l.titulo}</div>
  <div class="estrellas">${'★'.repeat(est)}${'☆'.repeat(3-est)}</div>
  <div class="gran">${st.pts}</div><div>puntos · ${st.resumen}</div>
  ${st.pts>antes?'<p style="color:var(--ok);font-weight:700">¡Nuevo récord!</p>':''}
  ${l.modo==='rcp'?(st.grafica||''):''}
  ${unicos.length?`<div class="fallos"><h2 class="serif" style="color:var(--verde);font-size:19px;margin:8px 0">Repasa</h2>${unicos.map(s=>`<div class="fallo"><div><b>${s.ok}</b><small>${s.e}</small></div></div>`).join('')}</div>`:''}
  ${st.oficial?bloqueOficial(est):''}
  <div class="btns" ${st.oficial?'style="display:none"':''}><button class="btn p" id="otra">Jugar otra vez</button>${l.n<ULT?`<button class="btn s" id="sigui">Siguiente nivel</button>`:''}<button class="btn s" id="menu">Volver al menú</button></div>
 </div>`;
 window.scrollTo(0,0);
 if(st.oficial)return finOficial();
 $('#otra').onclick=()=>empieza(l.n);
 $('#menu').onclick=portada;
 if($('#sigui'))$('#sigui').onclick=()=>empieza(l.n+1);
}
function bloqueOficial(est){
 const o=st.oficial;o.est[st.l.n-1]=est;o.pts+=st.pts;
 if(st.l.n<ULT)return `<div class="aviso-of">Partida oficial · intento ${o.intento} de ${INTENTOS}</div><div class="btns"><button class="btn p" id="ofsig">Seguir al nivel ${st.l.n+1}</button></div>`;
 const m=Math.min(...o.est);
 return `<div class="aviso-of"><b>Partida oficial terminada</b><br>Estrellas: ${o.est.map((e,i)=>'N'+(i+1)+' '+'★'.repeat(e)+'☆'.repeat(3-e)).join(' · ')}<br>Subida de nota: <b>+${extraDe(m)}</b> en el criterio de primeros auxilios (cuenta tu mejor intento)<div id="envio">Enviando resultado…</div></div><div class="aviso-of" id="puesto">Consultando tu puesto en la clasificación…</div><div class="btns"><button class="btn p" id="ofmenu">Volver al menú</button></div>`;
}
function finOficial(){
 const o=st.oficial;
 if(st.l.n<ULT){$('#ofsig').onclick=()=>empieza(st.l.n+1,o);return}
 $('#ofmenu').onclick=portada;
 const m=Math.min(...o.est);
 const antes=+ls.get(PREF+'_mejor',0), mejor=Math.max(antes,o.pts);ls.set(PREF+'_mejor',mejor);
 if(!antes)ls.set(PREF+'_primer_envio',Date.now());
 puesto(o.codigo,mejor,recien()).then(r=>{const d=$('#puesto');if(d)d.innerHTML=textoPuesto(r,mejor)});
 envia({codigo:o.codigo,intento:o.intento,est:o.est,puntos:o.pts,extra:extraDe(m)}).then(ok=>{
  $('#envio').textContent=ok?'✔ Resultado enviado a tu profesor.':'No se ha podido enviar. Haz una captura de esta pantalla y enséñasela a tu profesor.';
 });
}
portada();
</script>

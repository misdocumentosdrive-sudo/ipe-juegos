 }
 pulsoMet(()=>st.fase==='prof'&&st.cuenta<10,()=>{const c=$('#cuenta');if(c&&c.animate&&!MOV_REDUCIDO)c.animate([{color:'#7dffb5'},{color:'#fcd100'}],{duration:200})});
}
/* Deslizar: máquina de estados de cada trazo (profundidad en cm desde donde se apoyó el dedo).
   arriba → (pasa de 1 cm) baja → (sube 1 cm desde el máximo) sube → (vuelve a menos de 0,5 cm) arriba.
   Si en «sube» vuelve a bajar 1 cm sin haber llegado arriba, la anterior queda sin descompresión completa. */
function profMueve(cm,ahora){
 const t=st.tr;cm=Math.max(0,cm);profPinta(cm);
 if(st.fase!=='prof')return;
 if(t.e==='arriba'){if(cm>=CM_BAJA){t.e='baja';t.pico=cm;profNueva(ahora)}}
 else if(t.e==='baja'){if(cm>t.pico)t.pico=cm;else if(cm<t.pico-CM_BAJA){t.e='sube';t.min=cm;profPico(t.pico)}}
 else if(t.e==='sube'){
  if(cm<t.min)t.min=cm;
  if(cm<=CM_ARRIBA){t.e='arriba';profDesc(true)}
  else if(cm>=t.min+CM_BAJA){profDesc(false);t.e='baja';t.pico=cm;profNueva(ahora)}
 }
}
function profSuelta(){
 const t=st.tr;profPinta(0,true);
 if(st.fase!=='prof')return;
 if(t.e==='baja')profPico(t.pico);
 if(t.e!=='arriba')profDesc(true);   // soltar el dedo = el pecho sube del todo
}
/* Mantener pulsado: la profundidad crece 1 cm cada 50 ms (5-6 cm = 250-300 ms). Volver a pulsar antes de 150 ms
   de soltar cuenta como descompresión incompleta: no ha dado tiempo a que el pecho suba. */
const profHold=ms=>Math.min(8,Math.max(0,ms/HOLD_MS_CM));
function profPulsa(ahora){
 if(st.fase!=='prof'||st.hold||st.parado)return;
 if(st.descT){clearTimeout(st.descT);st.descT=0;profDesc(false)}
 if(!profNueva(ahora))return;
 st.hold={t0:ahora};const p=$('#padp');if(p)p.classList.add('pulsado');
 const anima=()=>{if(!st.hold||!$('#padp'))return;profPinta(profHold(ahoraJ()-st.hold.t0));st.raf=requestAnimationFrame(anima)};
 st.raf=requestAnimationFrame(anima);
}
function profSueltaPulsado(ahora){
 if(!st.hold)return;
 const cm=profHold(ahora-st.hold.t0);st.hold=null;cancelAnimationFrame(st.raf||0);
 const p=$('#padp');if(p)p.classList.remove('pulsado');
 profPinta(0,true);profPico(cm);
 st.descT=setTimeout(()=>{st.descT=0;profDesc(true)},SUBIDA_MS);
}
/* hundimiento proporcional a la profundidad: la ilustración baja 2,6 unidades por cm, las manos 3,4 y la marca de la regla, 30 */
function profPinta(cm,suelta){
 const d=Math.min(8,Math.max(0,cm)),tr=suelta&&!MOV_REDUCIDO?'transform .14s ease-out':'none';
 const pon=(el,v)=>{if(el){el.style.transition=tr;el.style.transform=v}};
 pon($('#fig'),`translateY(${(d*2.6).toFixed(1)}px) scale(${(1-d*.003).toFixed(4)})`);
 pon($('#manos'),`translateY(${(d*3.4).toFixed(1)}px) scale(${(1-d*.025).toFixed(3)})`);
 pon($('#sombraM'),`scale(${(1-d*.03).toFixed(3)})`);
 pon($('#mk'),`translateY(${(d*RCM).toFixed(1)}px)`);
 if(!suelta){const e=$('#cm');if(e){e.className='cm '+(d<P_MIN?'poco':d>P_MAX?'mucho':'ok');e.innerHTML=fmtCm(d)+'<small>cm</small>'}}
}
function profNueva(ahora){
 if(st.cuenta>=PROF_N)return null;
 const iv=st.ultimo?ahora-st.ultimo:0;
 const c={r:iv?60000/iv:null,p:0,d:null,pausa:iv>PAUSA_MS};
 st.serie.push(c);st.pc=c;st.cuenta++;st.ultimo=ahora;
 vibra(20);golpeSordo(.8);
 if(st.cuenta===3)$('#flecha')&&$('#flecha').setAttribute('opacity','0');
 $('#cuenta').innerHTML=st.cuenta+'<small>/'+PROF_N+'</small>';
 if(c.r!=null&&!c.pausa)$('#bpm').innerHTML=Math.round(c.r)+'<small>por minuto</small>';
 if(st.cuenta===11)combo('Sin pitido: sigue tú',1400,'rotulo');
 return c;
}
const okRitmo=c=>c.r==null||(!c.pausa&&c.r>=100&&c.r<=120);
const okProf=c=>c.p>=P_MIN&&c.p<=P_MAX;
function profPico(cm){
 const c=st.pc;if(!c||c.p)return;
 c.p=Math.round(cm*10)/10;
 const e=$('#cm');if(e){e.className='cm '+(c.p<P_MIN?'poco':c.p>P_MAX?'mucho':'ok');e.innerHTML=fmtCm(c.p)+'<small>cm</small>'}
 const pi=$('#pico');if(pi){pi.setAttribute('y1',RY0+Math.min(8,c.p)*RCM);pi.setAttribute('y2',RY0+Math.min(8,c.p)*RCM);pi.setAttribute('opacity','1')}
 if(okProf(c))st.ptsP+=10;
 if(c.r!=null&&okRitmo(c))st.ptsP+=10;
 aviso(c.pausa?'Has parado: <b>las interrupciones, mínimas</b>.':!okProf(c)?(c.p<P_MIN?`¡Más profundo! ${fmtCm(c.p)} cm: al menos 5.`:`Demasiado: ${fmtCm(c.p)} cm. No pases de 6.`)
  :!okRitmo(c)?(c.r<100?'¡Más rápido!':'¡Más despacio!'):`<b>Bien:</b> ${fmtCm(c.p)} cm.`);
 const p=$('#pts');if(p)p.textContent=st.ptsP+' pts';
}
function profDesc(ok){
 const c=st.pc;if(!c||c.d!=null)return;
 c.d=ok;
 if(ok)st.ptsP+=10;else aviso('¡Deja que el pecho <b>suba del todo</b>! Suelta o vuelve arriba antes de la siguiente.');
 const bien=ok&&okProf(c)&&okRitmo(c);
 if(!MOV_REDUCIDO)marca(SITIO,bien?'#2fd47a':'#ff9a3d');
 if(bien){st.combo++;if(st.combo>=5)combo('¡Compresión completa! x'+st.combo);if(st.combo%5===0)sfx('acierto',st.combo/5-1)}else st.combo=0;
 const p=$('#pts');if(p)p.textContent=st.ptsP+' pts';
 if(st.cuenta>=PROF_N){st.fase='finP';st.tr=null;clearInterval(st.metro);st.profT=tras(800,acabaProf)}
}
function acabaProf(){
 if(st.salido)return;
 clearInterval(st.metro);clearTimeout(st.descT);cancelAnimationFrame(st.raf||0);
 const ev=evaluaProf(st.serie), n=st.serie.length;
 st.estrellas=ev.frac>=.7?3:ev.frac>=.5?2:ev.frac>=.3?1:0;
 st.pts=st.ptsP;st.aciertos=ev.validas;st.lista={length:n};
 st.grafica=graficaProf(st.serie)+`<div class="evalp"><p>${ev.ritmo}</p><p>${ev.prof}</p><p>${ev.desc}</p></div>
  <p class="libro" style="margin-top:8px">En la pantalla, la profundidad es una aproximación: la de verdad se entrena con el maniquí.</p>`;
 st.resumen=`Compresiones completas (ritmo, profundidad y descompresión): <b>${Math.round(ev.frac*100)} %</b> (${ev.validas} de ${n}).`;
 final();
}
/* una frase por aspecto (ritmo, profundidad y descompresión), con los criterios del ERC 2025 */
function evaluaProf(s){
 const n=s.length, pct=(a,b)=>b?Math.round(a/b*100):0;
 const rs=s.filter(c=>c.r!=null&&!c.pausa), okR=rs.filter(c=>c.r>=100&&c.r<=120).length, pausas=s.filter(c=>c.pausa).length;
 const media=rs.length?Math.round(60000/(rs.reduce((a,c)=>a+60000/c.r,0)/rs.length)):0;   // media de los intervalos, no de las frecuencias
 const okP=s.filter(okProf).length, mp=n?s.reduce((a,c)=>a+c.p,0)/n:0, cortas=s.filter(c=>c.p<P_MIN).length, hondas=s.filter(c=>c.p>P_MAX).length;
 const okD=s.filter(c=>c.d!==false).length, validas=s.filter(c=>okRitmo(c)&&okProf(c)&&c.d!==false).length;
 let ritmo;
 if(rs.length<2)ritmo='<b>Ritmo:</b> no hay compresiones seguidas suficientes para medirlo.';
 else if(pct(okR,rs.length)>=70)ritmo=`<b>Ritmo:</b> muy bien. El ${pct(okR,rs.length)} % de tus compresiones, entre 100 y 120 por minuto (media: ${media}).`;
 else if(media<100)ritmo=`<b>Ritmo:</b> vas lento (media: ${media} por minuto). Acelera hasta 100‑120: el pitido del principio marca 110.`;
 else if(media>120)ritmo=`<b>Ritmo:</b> vas demasiado rápido (media: ${media} por minuto). Por encima de 120 cuesta llegar a la profundidad y dejar que el pecho suba.`;
 else ritmo=`<b>Ritmo:</b> la media está bien (${media} por minuto), pero es irregular: solo el ${pct(okR,rs.length)} % entre 100 y 120. Busca un compás constante.`;
 if(pausas)ritmo+=` Además, ${pausas===1?'paraste una vez':'paraste '+pausas+' veces'}: las interrupciones tienen que ser mínimas.`;
 const prof=pct(okP,n)>=70?`<b>Profundidad:</b> muy bien. El ${pct(okP,n)} % entre 5 y 6 cm (media: ${fmtCm(mp)} cm).`
  :cortas&&hondas?`<b>Profundidad:</b> irregular (media: ${fmtCm(mp)} cm). ${cortas} de ${n} compresiones no llegan a 5 cm y ${hondas} pasan de 6. Busca siempre la franja verde: al menos 5 cm y no más de 6.`
  :cortas>=hondas?`<b>Profundidad:</b> falta profundidad en ${cortas} de ${n} compresiones (media: ${fmtCm(mp)} cm). En una persona adulta, al menos 5 cm.`
  :`<b>Profundidad:</b> ${hondas} de ${n} compresiones pasan de 6 cm (media: ${fmtCm(mp)} cm). Más hondo no es mejor: no pases de 6 cm.`;
 const desc=okD===n?'<b>Descompresión:</b> perfecta. Dejaste que el pecho subiera del todo en todas.'
  :pct(okD,n)>=70?`<b>Descompresión:</b> bien (${pct(okD,n)} %), aunque en ${n-okD} no dejaste que el pecho subiera del todo. Suelta o vuelve arriba siempre.`
  :`<b>Descompresión:</b> en ${n-okD} de ${n} no dejaste que el pecho subiera del todo. Suelta (o vuelve arriba) después de cada compresión, sin apoyarte: así el corazón se vuelve a llenar de sangre.`;
 return {ritmo,prof,desc,validas,frac:n?validas/n:0,media,okR,okP,okD,pausas};
}
/* gráfica doble: arriba el ritmo (franja 100‑120) y abajo la profundidad (franja 5-6 cm), compresión a compresión */
function graficaProf(s){
 if(!s||s.length<3)return '';
 const W=320,X0=30,x=i=>X0+i*(W-X0-8)/Math.max(1,s.length-1);
 const yR=v=>10+(150-Math.min(150,Math.max(70,v)))/80*96, yP=v=>140+Math.min(8,Math.max(0,v))/8*96;   // ritmo 70-150 en 10-106; profundidad 0-8 cm en 140-236 (hacia abajo, como el pecho)
 const colR=c=>c.pausa||c.r<100?'#e07a1f':c.r>120?'#d33a1f':'#1a8a4a', colP=v=>v<P_MIN?'#e07a1f':v>P_MAX?'#d33a1f':'#1a8a4a';
 const et=(t,y,fuerte)=>`<text x="${X0-4}" y="${y+3.5}" text-anchor="end" font-size="10" fill="${fuerte?'#157a3f':'#5d6f69'}" font-weight="${fuerte?700:400}">${t}</text>`;
 const rs=s.map((c,i)=>c.r==null?null:[x(i),yR(c.r),c]).filter(Boolean);
 return `<div class="grafica"><h2 class="serif">Tu ritmo y tu profundidad, compresión a compresión</h2><svg viewBox="0 0 ${W} 250">
  <text x="${X0}" y="8" font-size="10" font-weight="700" fill="#5d6f69">Ritmo (por minuto)</text>
  <rect x="${X0}" y="${yR(120)}" width="${W-X0-2}" height="${yR(100)-yR(120)}" fill="#dff3e7" rx="3"/>
  ${[80,100,120,140].map(v=>et(v,yR(v),v===100||v===120)).join('')}
  <polyline fill="none" stroke="#9fb3ab" stroke-width="1.4" points="${rs.map(p=>p[0]+','+p[1].toFixed(1)).join(' ')}"/>
  ${rs.map(p=>`<circle cx="${p[0]}" cy="${p[1].toFixed(1)}" r="2.6" fill="${colR(p[2])}"/>`).join('')}
  <text x="${X0}" y="128" font-size="10" font-weight="700" fill="#5d6f69">Profundidad (cm)</text>
  <rect x="${X0}" y="${yP(P_MIN)}" width="${W-X0-2}" height="${yP(P_MAX)-yP(P_MIN)}" fill="#dff3e7" rx="3"/>
  ${[0,2,4,8].map(v=>et(v,yP(v),false)).join('')}${et('5-6',yP(5.5),true)}
  <polyline fill="none" stroke="#9fb3ab" stroke-width="1.4" points="${s.map((c,i)=>x(i)+','+yP(c.p).toFixed(1)).join(' ')}"/>
  ${s.map((c,i)=>`<circle cx="${x(i)}" cy="${yP(c.p).toFixed(1)}" r="${c.d===false?3.4:2.6}" fill="${c.d===false?'#fff':colP(c.p)}" stroke="${c.d===false?'#d33a1f':'none'}" stroke-width="1.8"/>`).join('')}</svg>
  <p class="ley"><span style="color:#157a3f">● bien</span> <span style="color:#a85208">● lento o poco profundo</span> <span style="color:#b8301a">● rápido o demasiado hondo</span> <span style="color:#b8301a">○ sin dejar subir el pecho</span></p></div>`;
}

function cicloJugador() {
  try {
    const m = /^[12]([A-Z]{2,5})-/.exec((localStorage.getItem('ipe_codigo') || '').toUpperCase());

  const c = ELENCO[ciclo] || ELENCO.HIG, k = ELENCO[ciclo] ? ciclo : 'HIG', vet = quien === 'vet';

/* ===== Común a los tres juegos (José, 9-11-2026): libro, sonido sí/no, accesibilidad e instalable =====
   Lo meten los montar_*.py antes de </body>, junto con PAGINAS (paginas_libro.js). */

/* «Repasa» con la página del libro de tu ciclo (sale del código de lista; sin código, solo el apartado). */
function libro(ud, ap, txt) {
  let c = '';
  try { c = (/^[12]([A-Z]{2,5})-/.exec((localStorage.getItem('ipe_codigo') || '').toUpperCase()) || [])[1] || '' } catch (e) {}
  const p = (((typeof PAGINAS !== 'undefined' && PAGINAS['UD' + ud]) || {})[c] || {})[ap];
  return `📖 En el libro: UD ${ud}, apartado ${txt || ap}${p ? `, página ${p}` : ''}`;
}

/* Diálogo propio (fase 2, 17-11-2026): sustituye a alert y confirm del navegador, que en el móvil parecen un error y no
   llevan los colores del centro. dialogo(texto) avisa; dialogo(texto, {si, no}) pregunta y devuelve true o false. */
function dialogo(txt, op) {
  return new Promise(res => {
    const antes = document.activeElement;
    const fondo = document.createElement('div'); fondo.className = 'dlg-fondo';
    const caja = document.createElement('div'); caja.className = 'dlg';
    caja.setAttribute('role', op ? 'alertdialog' : 'dialog'); caja.setAttribute('aria-modal', 'true');
    const p = document.createElement('p'); p.id = 'dlg-txt'; p.textContent = txt; caja.setAttribute('aria-describedby', 'dlg-txt');
    const bs = document.createElement('div'); bs.className = 'dlg-btns';
    const boton = (texto, clase, v) => { const b = document.createElement('button'); b.type = 'button'; b.className = clase; b.textContent = texto; b.onclick = e => { e.stopPropagation(); fin(v) }; bs.appendChild(b); return b };
    const tecla = e => {
      e.stopPropagation();                                   // el juego no se entera de las teclas mientras está abierto
      if (e.key === 'Escape') { e.preventDefault(); fin(!op) }
      else if (e.key === 'Tab') { const l = [...bs.children], i = l.indexOf(document.activeElement); e.preventDefault(); l[(i + (e.shiftKey ? l.length - 1 : 1)) % l.length].focus() }
    };
    const fin = v => { document.removeEventListener('keydown', tecla, true); fondo.remove(); try { antes && antes.focus && antes.focus({ preventScroll: true }) } catch (e) {} res(v) };
    if (op) boton(op.no || 'No', 'no', false);
    const si = boton(op ? (op.si || 'Sí') : 'Entendido', 'si', true);
    caja.append(p, bs); fondo.appendChild(caja);
    ['pointerdown', 'touchstart', 'mousedown', 'click'].forEach(ev => fondo.addEventListener(ev, e => e.stopPropagation()));
    document.addEventListener('keydown', tecla, true);
    document.body.appendChild(fondo); si.focus({ preventScroll: true });
  });
}

/* ===== Sonido y respuesta física comunes (fase 5, 17-11-2026) =====
   Todo sintetizado con WebAudio (sin archivos). Un solo contexto: el «actx» del juego si lo declara (let actx=null) y,
   si no, uno propio. Pasa por un volumen general y un compresor para que nada sature. Respeta «Sin sonido» (SILENCIO),
   que también quita la vibración. Se desbloquea con el primer toque (iOS).
   sfx('toque'|'acierto'|'fallo'|'tic'|'golpe'|'rompe'|'premio'|'fanfarria'|'alarma'|'barrido'|'paso', n) · vibrar(ms o patrón)
   sacudir(elemento, px) · parada(ms) → promesa (pausa de impacto; el juego decide qué congela) */
const AUDIO = { ctx: null, maestro: null, ruido: null };
function audio() {
  try {
    let c = typeof actx !== 'undefined' ? actx : AUDIO.ctx;
    if (!c) { c = new (window.AudioContext || window.webkitAudioContext)(); if (typeof actx !== 'undefined') actx = c; }
    AUDIO.ctx = c;
    if (!AUDIO.maestro || AUDIO.maestro.context !== c) {
      const comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
      AUDIO.maestro = c.createGain(); AUDIO.maestro.gain.value = .8; AUDIO.maestro.connect(comp).connect(c.destination);
      const b = c.createBuffer(1, c.sampleRate * .5, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      AUDIO.ruido = b;
    }
    if (c.state === 'suspended' && !window.SILENCIO) c.resume();
    return c;
  } catch (e) { return null }
}
function nota(f, dur, tipo = 'sine', vol = .2, d = 0, hasta = 0) {
  const c = audio(); if (!c || window.SILENCIO) return;
  const t0 = c.currentTime + d, o = c.createOscillator(), g = c.createGain();
  o.type = tipo; o.frequency.setValueAtTime(f, t0); if (hasta) o.frequency.exponentialRampToValueAtTime(hasta, t0 + dur);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .012); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g).connect(AUDIO.maestro); o.start(t0); o.stop(t0 + dur + .03);
}
function ruido(dur, vol = .2, filtro = 1200, d = 0, q = 1) {
  const c = audio(); if (!c || window.SILENCIO) return;
  const t0 = c.currentTime + d, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = AUDIO.ruido; f.type = 'bandpass'; f.frequency.value = filtro; f.Q.value = q;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  s.connect(f).connect(g).connect(AUDIO.maestro); s.start(t0); s.stop(t0 + dur + .02);
}
const PENTA = [0, 2, 4, 7, 9];
const escala = n => 523.25 * Math.pow(2, (PENTA[n % 5] + 12 * Math.floor(n / 5)) / 12);   // do pentatónico que sube con n
function sfx(nombre, n = 0) {
  switch (nombre) {
    case 'toque': nota(1400, .035, 'triangle', .12); break;
    case 'paso': nota(320 + n * 6, .03, 'sine', .05); break;
    case 'tic': nota(1000, .03, 'square', .07); break;
    case 'acierto': { const b = escala(Math.min(n, 9)); nota(b, .12, 'triangle', .22); nota(b * 1.5, .16, 'triangle', .2, .07); break }
    case 'fallo': nota(220, .16, 'square', .14); nota(155, .2, 'square', .14, .12); break;
    case 'golpe': nota(160, .09, 'sine', .3, 0, 60); ruido(.05, .12, 900); break;
    case 'rompe': ruido(.09, .22, 1800 + Math.min(n, 12) * 180, 0, 2); nota(escala(Math.min(n, 12)), .07, 'triangle', .1); break;
    case 'premio': [0, 2, 4].forEach((k, i) => nota(escala(k + 5), .14, 'sine', .18, i * .07)); break;
    case 'fanfarria': [523, 659, 784, 1047].forEach((f, i) => nota(f, .22, 'triangle', .2, i * .11)); break;
    case 'alarma': nota(880, .12, 'square', .1); nota(880, .12, 'square', .1, .2); break;
    case 'barrido': ruido(.25, .08, 600, 0, .7); break;
  }
}
function vibrar(p) { try { if (!window.SILENCIO && navigator.vibrate) navigator.vibrate(p) } catch (e) {} }
const MOV_REDUCIDO = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches } catch (e) { return false } })();
function sacudir(el, px = 6) {
  if (!el || MOV_REDUCIDO || !el.animate) return;
  el.animate([{ transform: 'translate(0,0)' }, { transform: `translate(${-px}px,${px / 2}px)` }, { transform: `translate(${px}px,${-px / 2}px)` }, { transform: `translate(${-px / 2}px,0)` }, { transform: 'translate(0,0)' }], { duration: 220, easing: 'ease-out' });
}
const parada = ms => new Promise(r => setTimeout(r, MOV_REDUCIDO ? 0 : ms));
['pointerdown', 'touchend', 'keydown'].forEach(ev => document.addEventListener(ev, () => { if (!window.SILENCIO) audio() }, { capture: true, passive: true }));

  };
  const app = document.getElementById('app');
  const css = document.createElement('style');
  css.textContent = `

  document.head.appendChild(css);

  /* Botones de opciones: al final de la portada, para no tapar nada mientras se juega. */
  const caja = document.createElement('div');
  caja.className = 'opcs';
  /* lee (opcional): de dónde sale el estado real. 18-11-2026: el sonido también se cambia desde el marcador de los juegos; al
     volver a la portada, el botón se repinta con el estado real (antes enseñaba el antiguo y el primer toque no hacía nada) */
  function boton(texto, activo, alCambiar, lee) {
    const b = document.createElement('button');

    b.onclick = e => { e.stopPropagation(); b.sync(); v = !v; pinta(v); alCambiar(v) };
    caja.appendChild(b);

  }

  if (app) new MutationObserver(muestra).observe(app, { childList: true });

  {

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cada minuto cuenta · IPE I</title>
<style>@font-face{font-family:"Aleo";src:url(aleo.woff2?v=d7c8feba) format("woff2"),url(aleo.ttf?v=fed0d713) format("truetype");font-weight:100 900;font-style:normal;font-display:swap}</style>
<style>

:root{--verde:#004230;--verde2:#0d6b4f;--naranja:#ff5900;--amarillo:#fcd100;--fondo:#f4f8f6;--texto:#1d2a30;--gris:#5b6b70;--ok:#178045;--mal:#d33a1f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--fondo);color:var(--texto);font:16px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:520px;min-height:100%;display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
h1,h2,.serif{font-family:Aleo,Georgia,serif}
.cab{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.marca{font:800 13px Aleo,Georgia,serif;color:var(--verde);letter-spacing:.3px}
.pill{background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.vidas{color:var(--mal);letter-spacing:2px}
.barra{height:8px;background:#dde7e2;border-radius:99px;overflow:hidden;margin:6px 0 14px}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--verde2),var(--verde));width:0;transition:width .3s}
.tiempo{height:5px;background:#eadfcf;border-radius:99px;overflow:hidden;margin:-8px 0 12px}
.tiempo i{display:block;height:100%;background:var(--naranja);width:100%}
.tarjeta{background:#fff;border-radius:22px;box-shadow:0 6px 20px rgba(0,66,48,.10);padding:18px;display:flex;flex-direction:column;align-items:center}
.senal{width:min(62vw,230px);height:min(62vw,230px);margin:6px 0 10px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 3px 4px rgba(0,0,0,.15))}
.senal img{max-width:100%;max-height:100%}
.op .mini img,.fila-sen img,.fallo img{width:100%;height:100%;object-fit:contain}
.confeti{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:cae linear forwards;z-index:9}
@keyframes cae{to{transform:translateY(105vh) rotate(720deg)}}
.preg{font:700 18px Aleo,Georgia,serif;color:var(--verde);text-align:center;margin:4px 0 2px}
.opciones{display:grid;gap:10px;margin-top:14px;width:100%}
.opciones.tipos{grid-template-columns:1fr}
.op{border:0;border-radius:14px;padding:14px 14px;font:600 16px "Helvetica Neue",Arial,sans-serif;background:#eef4f1;color:var(--texto);text-align:left;display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .08s,background .2s}
.op:active{transform:scale(.98)}
.op .mini{width:30px;height:30px;flex:none}
.op:disabled{cursor:default;opacity:1;color:var(--texto)}
.op.ok,.op.ok:disabled{background:var(--ok);color:#fff}
.op.mal,.op.mal:disabled{background:var(--mal);color:#fff}
.explica{margin-top:14px;width:100%;border-radius:14px;padding:12px 14px;font-size:15px;display:none}
.explica.ok{display:block;background:#e3f4ea;color:#0b5a2f}
.explica.mal{display:block;background:#fde8e3;color:#8c2512}
.explica b{display:block;font:800 16px Aleo,Georgia,serif;margin-bottom:2px}
.sig{margin-top:12px;width:100%;border:0;border-radius:14px;padding:14px;font:800 17px Aleo,Georgia,serif;background:var(--verde);color:#fff;cursor:pointer;display:none}
.puntos-flota{position:fixed;left:50%;top:38%;transform:translate(-50%,0);font:800 34px Aleo,Georgia,serif;color:var(--ok);pointer-events:none;animation:sube .9s ease-out forwards}
@keyframes sube{to{transform:translate(-50%,-70px);opacity:0}}
.sacude{animation:sacude .35s}
@keyframes sacude{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
/* portada */
.portada{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px}
.portada h1{font-size:32px;color:var(--verde);margin:0;line-height:1.1}
.portada p{color:var(--gris);margin:0}
.fila-sen{display:flex;justify-content:center;gap:8px;margin:6px 0}
.fila-sen img{width:52px;height:52px}
.nivel{border:0;border-radius:18px;padding:16px;text-align:left;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.07);cursor:pointer;display:flex;gap:14px;align-items:center}
.nivel .n{flex:none;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 20px Aleo,Georgia,serif;color:#fff}
.nivel b{display:block;font:800 17px Aleo,Georgia,serif;color:var(--verde)}
.nivel span{font-size:14px;color:var(--gris)}
.record{font-size:13px;color:var(--gris)}
/* final */
.final{text-align:center}
.final .gran{font:800 56px Aleo,Georgia,serif;color:var(--verde);margin:4px 0}
.estrellas{font-size:34px;letter-spacing:4px;color:var(--amarillo);text-shadow:0 1px 0 #c9a400}
.fallos{text-align:left;margin-top:16px}
.fallo{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:10px;margin-bottom:8px}
.fallo img{width:54px;height:54px;flex:none}
.fallo b{display:block;color:var(--verde)}
.fallo small{color:var(--gris)}
.btns{display:grid;gap:10px;margin-top:16px}
.btn{border:0;border-radius:14px;padding:14px;font:800 17px Aleo,Georgia,serif;cursor:pointer}
.btn.p{background:var(--verde);color:#fff}
.btn.s{background:#e3ece8;color:var(--verde)}
.pie{text-align:center;font-size:12px;color:var(--gris);margin-top:auto;padding-top:14px}
.oficial{background:#fff;border:2px solid var(--verde);border-radius:16px;padding:14px;margin:14px 0;text-align:left;display:grid;gap:8px}
.oficial label span,.oficial small{font-size:13px;opacity:.75}
.oficial input{font:700 20px/1.2 "Helvetica Neue",Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;padding:10px 12px;border:2px solid #cfd8d3;border-radius:10px;width:100%;box-sizing:border-box}
.oficial input.error{border-color:#c0392b;background:#fdecea}
.oficial .btn[disabled]{opacity:.5}
.entreno{color:var(--verde);font-size:18px;margin:6px 0 4px;text-align:left}
.aviso-of{background:#fff8d6;border:2px solid #fcd100;border-radius:14px;padding:12px;margin:14px 0;line-height:1.5}
.situ{font-size:17px;line-height:1.45;text-align:center;margin:8px 4px 4px;color:var(--texto)}
.opciones.imgs{grid-template-columns:1fr 1fr}
.opciones.imgs .op{justify-content:center;padding:12px;aspect-ratio:1}
.opciones.imgs .op img{width:100%;height:100%;object-fit:contain}
#envio{margin-top:8px;font-weight:700;color:var(--verde)}

/* ===== propio de «Cada minuto cuenta» ===== */
.grafica{background:#fff;border-radius:16px;padding:10px 10px 6px;margin-top:14px;box-shadow:0 2px 10px rgba(0,66,48,.08)}
.grafica h2{color:var(--verde);font-size:17px;margin:2px 4px 6px;text-align:left}
.grafica svg{width:100%;display:block}
.grafica .ley{margin:4px 4px 2px;font-size:12.5px;line-height:1.5;color:var(--gris);text-align:left}
.grafica .ley span{font-weight:700;margin-right:6px;white-space:nowrap}
.chips112{display:grid;gap:8px;margin-top:12px;width:100%}
.chip112 small{display:block;font-weight:600;color:#5e4229;font-size:13px;text-shadow:none}
.chip112.usada{pointer-events:none;--placa:url(aux_placa_gris.webp);color:#fbf6ec;text-shadow:0 -1px 0 rgba(0,0,0,.4)}.chip112.usada small{color:#fff}   /* 19-11-2026 (revisión total, lote 7): antes, opacidad .35 (1,6:1); lote 6: placa gris (4,7:1) */
.llamada{width:100%;min-height:54px;margin-top:0;border-radius:22px;background:url(aux_bandeja.webp) center/100% 100% no-repeat,#1c3327;color:#dff3ea;padding:16px 20px;font-size:14px;line-height:1.45;text-align:left;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}   /* lote 6: la bandeja verde de plastilina */
.llamada b{color:#7dffb5}
.heroe{--brillo:rgba(255,89,0,.35)}   /* 19-11-2026 (lote 7): el resto de la tarjeta de la portada lo pone comun.js (antes, repetido aquí) */
.heroe h1{color:#fff;font-size:40px;line-height:1;margin:8px 0 4px}   /* gana a .portada h1 del estilo común */
.hecg{width:100%;height:54px;display:block}
.hecg path{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
/* fase 5: antes solo había el trazo animado (dasharray) y, al empezar y al acabar cada pasada, se veía un guion suelto
   que parecía un icono sin cargar. Ahora la línea completa está siempre (tenue) y por encima corre el barrido. */
.hecg .base{stroke:rgba(125,255,181,.3)}
.hecg .trazo{stroke:#7dffb5;stroke-dasharray:90 410;stroke-dashoffset:90;animation:traza 2.4s linear infinite}
@keyframes traza{to{stroke-dashoffset:-410}}
.nivel .ico{flex:none;width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:var(--verde);background:#eef4f1;box-shadow:inset 0 2px 0 #fff,inset 0 -3px 0 rgba(0,66,48,.1)}
.nivel .ico .pic{width:28px;height:28px}
.nivel:active{transform:translateY(2px)}

.escena{font-size:16px;line-height:1.45;text-align:center;margin:8px 4px 4px}
.opciones.textos .op{font-weight:600;font-size:15px;line-height:1.3}
.rcp{position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#16332a 0%,#071a14 70%);color:#fff;display:flex;flex-direction:column;align-items:center;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;z-index:5}
.rcp.pls{background:radial-gradient(circle at 50% 35%,#16304a 0%,#08162a 70%)}
.rcp .crono{--placa:url(aux_placa_crema.webp);font:800 22px Aleo,Georgia,serif;letter-spacing:1px;padding:7px 18px 8px;min-width:86px;text-align:center;color:#3d2a17;text-shadow:0 1px 0 rgba(255,255,255,.6),0 -1px 0 rgba(0,0,0,.15)}   /* lote 6: el reloj, en una placa crema */
.monitor{width:calc(100% - 28px);max-width:492px;margin-top:8px;border-radius:14px;background:#03100c;border:1px solid rgba(125,255,181,.25);box-shadow:inset 0 0 24px rgba(47,212,122,.08),0 6px 20px rgba(0,0,0,.4);position:relative;overflow:hidden;
 background-image:linear-gradient(rgba(125,255,181,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(125,255,181,.07) 1px,transparent 1px);background-size:14px 14px}
.monitor .ecg{width:100%;height:58px;display:block}   /* fase 5: lienzo a 30 fps, sin filtros (antes, polilínea SVG + drop-shadow en cada fotograma) */
.monitor .et{position:absolute;left:10px;top:6px;font:700 10px "Helvetica Neue",Arial;letter-spacing:.12em;color:#7dffb5;opacity:.8}
.monitor .corazon{position:absolute;right:10px;top:5px;width:22px;height:22px}.monitor .corazon .pic{width:22px;height:22px;display:block}
.latido{animation:latido .25s ease-out}
@keyframes latido{40%{transform:scale(1.35)}}
.rcp .msg b{color:#7dffb5}
.rcp .arriba .crono{font-variant-numeric:tabular-nums}
.rcp .cuenta,.rcp .bpm{font-variant-numeric:tabular-nums}
.rcp .cuerpo{flex:1;width:100%;max-width:420px;min-height:0;position:relative}
.rcp .cuerpo>svg{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 24px rgba(0,0,0,.5));will-change:transform}   /* 19-11-2026 (revisión total): solo la figura; antes alcanzaba al icono del rótulo «¡Relevo!», que tapaba a la persona entera */
.asa{animation:asa 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center;outline:none}
.asa:focus-visible,.zt:focus-visible{stroke:#fff;stroke-width:5;stroke-dasharray:none;fill:rgba(252,209,0,.45)}   /* teclado (lote 7) */
.zt{fill:transparent;outline:none}
@keyframes asa{50%{transform:scale(1.18)}}
.rcp .marcador{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 18px;border-radius:22px;background:url(aux_bandeja.webp) center/100% 100% no-repeat;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}   /* lote 6: en la bandeja de plastilina */
.rcp .cuenta{font:800 34px Aleo,Georgia,serif;min-width:92px;color:#fcd100;text-shadow:0 2px 0 #b48a00,0 3px 0 #7a5d00,0 5px 6px rgba(0,0,0,.45)}   /* lote 6: la cifra en relieve amarillo, como el líquido de la nómina */
.rcp .cuenta small{font-size:15px;opacity:.7}
.rcp .gauge{width:150px;height:84px}
.rcp .bpm{font:800 24px Aleo,Georgia,serif;text-align:right;min-width:86px;text-shadow:0 -1px 0 rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.18)}
.rcp .bpm small{display:block;font:600 11px "Helvetica Neue",Arial;opacity:.75}
.rcp .botones .btn{border-radius:16px;flex:1;font-size:16px;padding:13px 8px}
.rcp .btn.rel{--placa:url(aux_placa_mostaza.webp);color:#3a2a00;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.rcp .btn.alarma{--placa:url(aux_placa_naranja.webp);color:#fff;text-shadow:0 -1px 0 rgba(0,0,0,.45);animation:late .6s infinite}
.rcp .btn[disabled]{opacity:.45;filter:grayscale(.6)}
@keyframes late{50%{transform:scale(1.04);filter:brightness(1.2) drop-shadow(0 3px 3px rgba(0,0,0,.38))}}
.rcp .combo{position:absolute;left:0;right:0;top:6%;text-align:center;font:800 26px Aleo,Georgia,serif;color:#7dffb5;text-shadow:0 0 14px rgba(125,255,181,.6);pointer-events:none;opacity:0;transition:opacity .2s;z-index:2}
.rcp .combo.rotulo{left:50%;right:auto;transform:translateX(-50%);white-space:nowrap;font-size:22px;color:#062a1f;text-shadow:none;background:#fcd100;border-radius:999px;padding:8px 18px;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -4px 0 rgba(0,0,0,.18),0 8px 20px rgba(0,0,0,.4)}
.onda{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border:3px solid #7dffb5;border-radius:50%;pointer-events:none;animation:onda .55s ease-out forwards}   /* 19-11-2026 (revisión total, lote 7): con transform (antes animaba width y height: ~18 recolocaciones por compresión) */
@keyframes onda{from{transform:scale(.07);opacity:.9}to{transform:scale(1);opacity:0}}
/* fase 5: sin destellos a pantalla completa; solo un brillo local sobre el cuerpo (descarga del DEA) */
.brillo{position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(circle at 50% 38%,var(--c) 0,transparent 58%);animation:brillo .45s ease-out forwards}
@keyframes brillo{from{opacity:.6}to{opacity:0}}
.rcp .tarjeta-rcp .op{--placa:url(aux_placa_crema.webp);position:relative;justify-content:center;text-align:center;padding:12px 38px 13px;font:700 15px/1.25 ui-rounded,"SF Pro Rounded","Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#3d2a17;text-shadow:0 1px 0 rgba(255,255,255,.6),0 -1px 0 rgba(0,0,0,.15)}
.rcp .tarjeta-rcp p{margin:0;text-align:center;font-size:15px;line-height:1.4}

/* pausa (18-11-2026, como en «Serpiente PRL»): menú «Seguir / Salir al menú» que tapa la pregunta y el cuerpo con el reloj parado */
.pausa-j{position:fixed;inset:0;z-index:50;background:#0b1f19;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;font:700 18px/1.4 "Helvetica Neue",Arial,sans-serif}
.pausa-j b{font:800 30px Aleo,Georgia,serif;color:#fcd100}
.pausa-j .pausa-btns{display:grid;gap:10px;width:100%;max-width:300px;margin-top:10px}
.pausa-j .btn{min-height:48px}.pausa-j .btn.p{background:#fcd100;color:#004230}
.pausa-j small{max-width:300px;font:600 14px/1.4 "Helvetica Neue",Arial,sans-serif;color:#cfe9de}
/* ===== fase 5 (17-11-2026): pictogramas propios y relieve suave de plastilina, coherente con las ilustraciones ===== */
.pic{width:1em;height:1em;display:inline-block;vertical-align:-.15em;flex:none}
.icoesc .pic{width:28px;height:28px}
.btn .pic,.op .pic{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
.pill .pic{width:15px;height:15px;vertical-align:-2px;margin-right:2px;color:#c24400}
.rcp .msg .pic{width:18px;height:18px;vertical-align:-3px;color:#7dffb5;margin-right:4px}
.tarjeta{border-radius:24px;box-shadow:0 10px 24px rgba(0,66,48,.12),0 2px 4px rgba(0,66,48,.06),inset 0 2px 0 rgba(255,255,255,.95),inset 0 -5px 0 rgba(0,66,48,.06)}
.op{box-shadow:inset 0 2px 0 rgba(255,255,255,.85),inset 0 -3px 0 rgba(0,66,48,.12),0 2px 5px rgba(0,66,48,.08);transition:transform .08s,box-shadow .08s,background .2s}
.op:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(0,66,48,.12),0 1px 2px rgba(0,66,48,.08)}
.op.ok,.op.mal{box-shadow:inset 0 2px 0 rgba(255,255,255,.25),inset 0 -3px 0 rgba(0,0,0,.18)}
.btn,.sig{box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset 0 -4px 0 rgba(0,0,0,.2),0 4px 10px rgba(0,66,48,.18);transition:transform .08s,box-shadow .08s}
.btn.s{box-shadow:inset 0 2px 0 rgba(255,255,255,.85),inset 0 -4px 0 rgba(0,66,48,.12),0 3px 8px rgba(0,66,48,.1)}
.btn:active:not([disabled]),.sig:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -1px 0 rgba(0,0,0,.2),0 1px 3px rgba(0,66,48,.18)}
.nivel{transition:transform .1s,box-shadow .1s;box-shadow:0 6px 14px rgba(0,66,48,.09),inset 0 2px 0 #fff,inset 0 -4px 0 rgba(0,66,48,.07)}
.nivel .n{box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.22)}
.pill{box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 rgba(0,66,48,.08),0 2px 4px rgba(0,66,48,.08)}
.icoesc{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:-4px auto 6px;color:#fff;font-size:0;box-shadow:inset 0 3px 0 rgba(255,255,255,.28),inset 0 -4px 0 rgba(0,0,0,.2),0 6px 14px rgba(0,0,0,.18)}
.chip112{--placa:url(aux_placa_crema.webp);padding:12px 30px 13px;text-align:center;font:700 14.5px/1.25 ui-rounded,"SF Pro Rounded","Avenir Next","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#3d2a17;cursor:pointer;text-shadow:0 1px 0 rgba(255,255,255,.6),0 -1px 0 rgba(0,0,0,.15)}   /* lote 6: placa crema (antes, borde discontinuo) */
.oficial{box-shadow:inset 0 2px 0 #fff,0 6px 14px rgba(0,66,48,.08)}
.oficial .btn[disabled]{opacity:1;background:#5b6b70;color:#fff}   /* 19-11-2026 (revisión total, lote 7): «Comprobando tus intentos…» legible (antes 2,8:1) */
.rcp .pill{--placa:url(aux_placa_marron.webp);color:#fbf6ec;padding:9px 15px;text-shadow:0 -1px 0 rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.18);font-variant-numeric:tabular-nums}
.rcp .tarjeta-rcp{background:url(aux_bandeja.webp) center/100% 100% no-repeat,#1c3327;border-radius:22px;padding:14px 18px;display:grid;gap:8px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}   /* lote 6: la bandeja de plastilina */
.rcp .crono.urge{--placa:url(aux_placa_naranja.webp);color:#fff;text-shadow:0 -1px 0 rgba(0,0,0,.45)}
/* salir de los niveles 3 y 4 */
.rcp .izq{display:flex;align-items:center;gap:8px}
.rcp .salir .pic{width:20px;height:20px}
/* compresión con cuerpo: sombra de las manos */
#sombraM{transform-box:fill-box;transform-origin:center}
/* tutorial jugable del nivel 4 */
.tuto{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px 14px;background:rgba(3,16,12,.86);border-radius:18px;text-align:center}
.tuto h3{margin:0;font:800 20px Aleo,Georgia,serif;color:#fcd100}
.tuto p{margin:0;font-size:15px;line-height:1.4;color:#dff3ea;max-width:330px}
.tuto .pad{width:min(150px,24vh);height:min(150px,24vh);border-radius:50%;border:0;padding:0;cursor:pointer;touch-action:none;will-change:transform;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#7dffb5;font:800 16px "Helvetica Neue",Arial,sans-serif;

/* ===== 19-11-2026 (revisión total, lote 6): dirección de arte, como en «Cuadra la nómina» =====

.tarjeta.escenario .preg,.escenario .op,.tarjeta.escenario .sig,.chip112,.escenario .explica,.cab .pill,.cab .ctl button,.rcp .pill,.rcp .ctl button,.rcp .salir,.rcp .crono,.rcp .botones .btn,.rcp .tarjeta-rcp .op{
 border:0;border-radius:999px;box-shadow:none!important;background:var(--placa,url(aux_placa_marron.webp)) center/100% 100% no-repeat!important;filter:drop-shadow(0 3px 3px rgba(0,0,0,.38))}

 background:radial-gradient(circle at 34% 28%,#fff6e6 0,#e6d6bd 42%,#bea584 100%);box-shadow:inset 0 -2px 2px rgba(80,50,20,.25),0 2px 3px rgba(0,0,0,.45)}

 box-shadow:inset 0 -2px 2px rgba(90,60,0,.3),0 0 0 3px rgba(252,209,0,.35),0 3px 4px rgba(0,0,0,.45)}
/* la mecha: un churro de plastilina trenzado que se consume de derecha a izquierda (recorte, sin recolocar la página), con la chispa
   en la punta; en el último 30 % la chispa crece. Lo quemado queda como un hilo de ceniza */
.cab>.tiempo.mecha{flex:0 0 calc(100% - 22px);position:relative;height:24px;margin:0 16px 0 6px;background:none;border-radius:0;overflow:visible}
.mecha::before{content:"";position:absolute;left:6px;right:0;top:50%;height:3px;margin-top:-1px;border-radius:3px;background:rgba(40,28,18,.75)}
.mecha i{position:absolute;inset:0;width:auto;height:auto;background:none;clip-path:inset(0 calc((1 - var(--q,1))*100%) 0 0)}
.mecha i::before{content:"";position:absolute;left:0;right:0;top:6px;height:12px;border-radius:999px;
 background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 42%,rgba(60,30,0,.32)),repeating-linear-gradient(118deg,#e6b062 0 7px,#b87a35 7px 10px);box-shadow:0 2px 3px rgba(0,0,0,.5)}
.mecha .carril{position:absolute;inset:0;transform:translateX(calc((var(--q,1) - 1)*100%));pointer-events:none}
.chispa{position:absolute;right:-14px;top:50%;width:28px;height:28px;margin-top:-14px;transition:transform .3s;filter:drop-shadow(0 0 6px rgba(255,170,40,.9))}
.chispa::before,.chispa::after{content:"";position:absolute;inset:0;clip-path:polygon(50% 0,61% 32%,95% 18%,72% 46%,100% 62%,66% 66%,72% 100%,50% 76%,26% 98%,32% 66%,0 60%,28% 44%,6% 16%,39% 32%);animation:chispa .18s steps(2,jump-none) infinite alternate}
.chispa::before{background:radial-gradient(circle at 45% 40%,#ffb347,#e85d04)}
.chispa::after{inset:7px;background:radial-gradient(circle at 40% 35%,#fffbe0,#ffd23a);animation-duration:.13s}
@keyframes chispa{to{transform:rotate(30deg) scale(.8)}}
.mecha.urge .chispa{transform:scale(1.35)}
.mecha.apagada .chispa{display:none}
/* tableta y ordenador: el velo del marcador, de lado a lado de la pantalla (no una franja del ancho de la columna) y las tarjetas

<script>
/* «Cada minuto cuenta» · bancos de preguntas (José, 5-11-2026). Todo sale de la UD 3 del libro, apartado 3.6
   (ERC 2025): PAS, 112, valoración, SVB y RCP, lesiones, Heimlich y botiquín. s = sector ('' = común a todos).
   ok = la respuesta correcta; no = tres trampas; e = la explicación (lo que dice el libro).
   Fase 4, 17-11-2026: trampas con errores reales y de largo parecido a la correcta (antes la correcta era la más larga
   en 29 de 41); 10 escenas por sector (salen 3 al azar); columna, torniquete y Toxicológico cotejados con ERC 2025.
   ll = escena del 112 que ya trata la llamada por tarjetas: la llamada sale después (fase 4, 17-11-2026).
   19-11-2026 (revisión total): en cada escena del nivel 1 cuya correcta nombra el 112, al menos una trampa también lo nombra (antes
   «la que dice 112» acertaba casi siempre); el botiquín con el contenido mínimo del RD 486/1997 (anexo VI) y dos escenas más; el
   porqué del pañuelo mojado; «112 siempre» tras un contacto eléctrico; y ERC 2025: llamar al 112 antes de mirar si respira.
   Decisiones de José (19-11-2026, aprobadas las recomendadas): el nivel 2 también tiene escenas de sector (salen 3 y 5 comunes, como
   en el nivel 1); nu = núcleo del nivel 2, que sale SIEMPRE en la partida oficial (boqueadas, llamar primero, PLS y hemorragia);
   g = tema: en una partida no salen dos escenas del mismo tema (p. ej., la quemadura del sector y la común). Aspirina en el dolor
   torácico (ERC 2025). */
const BANCOS = {
 pas: [
  {s:'',t:'Una compañera ha recibido una descarga y sigue tocando el cuadro eléctrico. ¿Qué haces primero?',ok:'Cortar la corriente antes de tocarla',no:['Tirar de su brazo con fuerza para separarla','Apartarla empujándola con una barra metálica','Tocarla un segundo para ver si da calambre'],e:'Proteger: si la tocas con corriente, serás otra víctima. Primero se corta la corriente. Después, 112 siempre, aunque parezca estar bien: la corriente puede alterar el ritmo del corazón.'},
  /* fase 4, 17-11-2026: fuera «¿Qué tienes que decir al 112?»: es la misma pregunta que la llamada por tarjetas */
  {s:'',ll:1,t:'Estás hablando con el 112. ¿Cuándo cuelgas?',ok:'Cuando te lo indiquen',no:['En cuanto hayas dado la dirección exacta','Al minuto, para dejar la línea libre','Cuando veas llegar la ambulancia a la puerta'],e:'No cuelgues hasta que te lo indiquen: pueden guiarte paso a paso para hacer la RCP. Pon el altavoz.'},
  {s:'',ll:1,t:'Tienes que socorrer y a la vez hablar con el 112. ¿Qué haces con el móvil?',ok:'Ponerlo en altavoz para tener las manos libres',no:['Sujetarlo entre el hombro y la oreja','Colgar y volver a llamar cuando hayas terminado','Seguir con el móvil en una mano y socorrer con la otra'],e:'Con el altavoz tienes las manos libres para socorrer mientras te guían.'},
  {s:'',t:'¿Qué significa el método PAS?',ok:'Proteger, Avisar y Socorrer',no:['Parar, Analizar y Salir','Prevenir, Ayudar y Sanar','Pedir ayuda, Atender y Señalizar'],e:'PAS: Proteger (que no haya más peligros), Avisar (112) y Socorrer.'},
  {s:'',t:'Hay humo en el almacén y una persona tirada en el suelo. ¿Qué haces?',ok:'No entrar sin protección y avisar al 112',no:['Entrar corriendo a sacarla antes de que sea tarde','Entrar agachado con un pañuelo mojado en la boca','Avisar al 112 y entrar a por ella aguantando la respiración'],e:'Primero, tu seguridad. Agacharte y taparte la boca te ayuda a salir de una zona con humo, no a entrar a rescatar: un pañuelo no filtra los gases tóxicos ni da oxígeno. Sin equipo de protección no se entra: avisa al 112.'},
  /* fase 4, 17-11-2026: ERC 2025, persona despierta con posible lesión de cuello: que lo mantenga quieto ella misma; sujetar la cabeza es para quien no responde */
  {s:'',t:'Una persona se ha caído de una escalera, está consciente y le duele el cuello.',ok:'Pedirle que no se mueva y llamar al 112',no:['Ayudarla a levantarse despacio','Llamar al 112 y sentarla para que respire mejor','Ponerle una chaqueta doblada bajo la cabeza'],e:'Posible lesión de columna: no se la mueve salvo peligro inmediato. Si está consciente, se le pide que mantenga el cuello quieto en la postura en que esté cómoda; nunca se la obliga a cambiar de postura.'},
  {s:'',t:'¿Le das agua a una persona herida grave que tiene mucha sed?',ok:'No: no se da de comer ni de beber',no:['Sí, agua con azúcar para que no se maree','Sí, pero solo a sorbos pequeños','Sí, si lo pide y está consciente'],e:'A una persona herida grave no se le da de comer ni de beber.'},
  {s:'',t:'¿Qué lleva el botiquín de la empresa para quien se hace daño?',ok:'Antiséptico y material de curas, pero no pastillas',no:['Analgésicos y antiinflamatorios para el dolor','Antibióticos en pastillas por si hay infección','Tranquilizantes por si alguien se pone nervioso'],e:'Como mínimo (RD 486/1997, anexo VI): desinfectantes y antisépticos, gasas estériles, algodón, venda, esparadrapo, apósitos, tijeras, pinzas y guantes desechables. Ni pastillas ni otros medicamentos para tomar.'},
  /* 19-11-2026 (revisión total): el botiquín es la mitad del CE i) y solo tenía una escena; contenido mínimo del RD 486/1997, anexo VI */
  {s:'',t:'Al curar a una compañera has gastado las últimas gasas del botiquín.',ok:'Avisar para que se repongan cuanto antes',no:['Esperar a la revisión anual del botiquín','Cambiarlas por papel de cocina limpio','Añadir ibuprofeno para completar el botiquín'],e:'El botiquín se revisa periódicamente y se repone en cuanto algo se usa o caduca (RD 486/1997, anexo VI).'},
  {s:'',t:'Vas a curar una herida pequeña que sangra poco.',ok:'Lavarte las manos y ponerte guantes',no:['Soplar la herida para limpiarla','Echar alcohol directamente y taparla','Poner algodón pegado sobre la herida'],e:'Herida leve: manos limpias y guantes; agua y jabón o suero, antiséptico y apósito.'},
  {s:'',t:'Hay varias personas heridas. ¿A quién atiendes primero?',ok:'A quien no responde o tiene una hemorragia grave',no:['A quien más grita, porque es quien peor lo pasa','A quien conoces, porque sabes cómo se llama','A la persona herida más cercana a la puerta'],e:'Quien grita respira. Primero, quien no responde o no respira con normalidad y las hemorragias graves.'},
  {s:'',t:'Ha habido un atropello en la puerta y siguen pasando coches. ¿Qué haces primero?',ok:'Señalizar la zona para que no haya otro atropello',no:['Arrodillarte a su lado en la calzada y empezar a atenderla','Incorporarla para ver si puede andar','Darle agua para que se recupere del susto'],e:'Proteger: comprueba que no hay más peligros (tráfico, corriente, fuego, gas) y señaliza.'},
  /* ---- HIG (fase 4, 17-11-2026: de 3 a 10 escenas) ---- */
  {s:'HIG',t:'La persona que está en el sillón dental deja de contestar de repente. ¿Qué haces primero?',ok:'Hablarle y tocarle los hombros para ver si responde',no:['Echarle agua fría en la cara para despertarla','Sentarla derecha en el sillón para que le llegue el aire','Esperar un rato a ver si se le pasa sola'],e:'Socorrer empieza por la evaluación primaria: ¿responde? Háblale y tócale los hombros.'},
  {s:'HIG',t:'A una compañera le salpica desinfectante en un ojo.',ok:'Lavarlo con mucha agua 15-20 minutos, párpados abiertos',no:['Frotarlo con una gasa húmeda para retirar bien el producto','Echarle colirio y seguir trabajando con cuidado','Taparlo con un parche y esperar a que deje de picar'],e:'Quemadura química: agua abundante 15-20 minutos; en los ojos, con los párpados abiertos.'},
  {s:'HIG',t:'Una persona se atraganta en la sala de espera, pero tose con fuerza.',ok:'Animarla a seguir tosiendo',no:['Darle golpes en la espalda enseguida','Hacerle la maniobra de Heimlich ya','Darle agua para que le baje lo que tiene'],e:'Si la tos es eficaz, es el mejor remedio: anímala a toser y no le des golpes.'},
  {s:'HIG',t:'Una persona se desploma en la sala de espera: no responde y no respira con normalidad. En recepción hay un DEA.',ok:'112, que traigan el DEA y empezar la RCP',no:['112 y ponerla en posición lateral de seguridad','Buscarle el pulso en la muñeca durante un minuto','Echarle agua en la cara para que reaccione'],e:'No responde y no respira con normalidad: es una parada. 112 (con altavoz), que alguien traiga el DEA y RCP sin esperar.'},
  {s:'HIG',t:'Una persona se cae por la escalera de la clínica. No responde, pero respira con normalidad.',ok:'Dejarla boca arriba, sujetarle la cabeza y llamar al 112',no:['Ponerla en posición lateral de seguridad y llamar al 112','Sentarla en una silla para ver si se despierta','Ponerle una chaqueta doblada bajo la cabeza'],e:'Si hay un golpe o una caída no se usa la posición lateral de seguridad (ERC 2025): se la deja boca arriba, se le sujeta la cabeza con las dos manos para que el cuello no se mueva, se vigila que respire y se llama al 112.'},
  {s:'HIG',t:'Una compañera se corta la mano con el cristal de una vitrina y sangra mucho.',ok:'Presión directa y firme con gasas, con guantes, y 112',no:['Levantarle el brazo y llamar al 112, sin apretar la herida','Lavar la herida con alcohol y luego taparla','Dejar que sangre un poco para que se limpie'],e:'Hemorragia: presión directa, firme y continua con gasas o un apósito, con guantes, y 112.'},
  {s:'HIG',t:'Al ponerse unos guantes de látex, una persona se llena de ronchas, se le hincha la cara y le cuesta respirar.',ok:'112 y ayudarla con su autoinyector, si lo lleva',no:['Darle agua fría para que le baje la hinchazón','Llamar al 112 y que salga a caminar al aire libre','Esperar a ver si se le pasa al quitarse los guantes'],e:'Reacción alérgica grave (anafilaxia): 112, que siga sentada o tumbada y, si lleva autoinyector de adrenalina, se pone cuanto antes en la cara externa del muslo (ERC 2025).'},
  {s:'HIG',t:'Una persona con diabetes está sudorosa, temblorosa y confusa en el gabinete, pero puede tragar.',ok:'Darle azúcar: glucosa o un zumo',no:['Ponerle su insulina, que la lleva en el bolso','Tumbarla y no darle nada por si se atraganta','Mandarla a casa a descansar'],e:'Posible bajada de azúcar: si está despierta y puede tragar, glucosa o, si no hay, azúcar (un zumo, caramelos). Si a los 15 minutos no mejora, otra vez y 112 (ERC 2025).'},
  {s:'HIG',t:'Una persona que espera su turno se lleva la mano al pecho: tiene un dolor opresivo que le baja al brazo.',ok:'Sentarla tranquila, llamar al 112 y no dejarla sola',no:['Que vaya andando a urgencias, que está cerca','Llamar al 112 y que salga a esperar la ambulancia a la puerta','Que coja su coche y vaya a su centro de salud'],e:'Dolor en el pecho: tranquilízala, que se siente o se tumbe como esté más cómoda, 112 y quédate con ella hasta que llegue la ayuda (ERC 2025). Si no es alérgica, anímala a masticar una aspirina suya mientras llega la ayuda (el botiquín no la lleva).'},
  {s:'HIG',t:'En pleno agosto, una persona llega a la clínica tras caminar al sol: está confusa y muy caliente.',ok:'A la sombra, enfriarla con agua y llamar al 112',no:['Llamar al 112 y abrigarla para que no tenga escalofríos','Darle una bebida muy fría aunque esté confusa','Dejarla descansar en la sala hasta que se le pase'],e:'Golpe de calor: apartarla del calor, quitarle ropa y enfriarla con agua fría cuanto antes; 112 (ERC 2025).'},
  /* ---- IFC (fase 4, 17-11-2026: de 3 a 10 escenas) ---- */
  {s:'IFC',t:'Hay una fuga de refrigerante en la sala de máquinas y un compañero inconsciente dentro.',ok:'No entrar sin protección y avisar al 112',no:['Entrar corriendo a sacarlo, que son segundos','Avisar al 112 y entrar a sacarlo aguantando la respiración','Entrar con un pañuelo mojado tapándote la boca'],e:'Primero, tu seguridad. Agacharte y taparte la boca te ayuda a salir de una zona con humo, no a entrar a rescatar: un pañuelo no filtra los gases tóxicos ni da oxígeno. Sin equipo de protección no se entra: avisa al 112.'},
  {s:'IFC',t:'Un compañero se cae de la cubierta al instalar una máquina exterior. Está consciente.',ok:'Pedirle que no se mueva y llamar al 112',no:['Llamar al 112 y quitarle el casco para que respire mejor','Incorporarlo para ver si puede andar','Bajarlo por la escalera entre dos personas'],e:'Caída desde altura: posible lesión de columna. No se le mueve salvo peligro; se le pide que mantenga el cuello quieto, sin quitarle el casco, y se llama al 112.'},
  /* fase 4, 17-11-2026: la trampa ya no dice que todo torniquete es malo: el error es saltarse la presión directa */
  {s:'IFC',t:'Un compañero se corta con una chapa y sangra mucho.',ok:'Presión directa con gasas (y guantes) y llamar al 112',no:['Atarle un cable muy fuerte sin apretar antes la herida','Lavar con alcohol y esperar a ver si para','Llamar al 112 y esperar, sin apretar la herida'],e:'Hemorragia: primero, presión directa, firme y continua con gasas o un apósito, con guantes, y 112. El torniquete (mejor uno de fábrica) solo si la presión no basta.'},
  {s:'IFC',t:'Al purgar el circuito, a tu compañera le salpica refrigerante en los ojos.',ok:'Lavarlos con mucha agua 15-20 minutos, párpados abiertos',no:['Frotarlos con un trapo limpio para quitar el líquido','Echarle colirio y seguir con la carga de gas','Taparlos con la mano y esperar a que pase'],e:'Salpicadura en los ojos: agua abundante 15-20 minutos con los párpados abiertos, sin frotar, y al médico.'},
  {s:'IFC',t:'Un compañero se desploma en la azotea mientras cargáis gas: no responde y no respira con normalidad.',ok:'112, pedir un DEA y empezar la RCP',no:['112 y ponerlo en posición lateral de seguridad','Buscarle el pulso en el cuello durante un minuto','Esperar a que se le pase el mareo a la sombra'],e:'No responde y no respira con normalidad: es una parada. 112 (con altavoz), que alguien traiga el DEA y RCP sin esperar.'},
  {s:'IFC',t:'Tu compañera se cae del andamio. No responde, pero respira con normalidad.',ok:'Dejarla boca arriba, sujetarle la cabeza y llamar al 112',no:['Ponerla en posición lateral de seguridad y llamar al 112','Quitarle el casco y el arnés para que respire mejor','Sentarla apoyada en la pared para que se despierte'],e:'Si hay un golpe o una caída no se usa la posición lateral de seguridad (ERC 2025): se la deja boca arriba, se le sujeta la cabeza con las dos manos para que el cuello no se mueva, se vigila que respire y se llama al 112.'},
  {s:'IFC',t:'En una cubierta, a tu compañero le pica una avispa: se le hincha la cara y le cuesta respirar.',ok:'112 y ayudarle con su autoinyector, si lo lleva',no:['Ponerle barro en la picadura y seguir trabajando','Llamar al 112 y que baje solo por la escalera','Darle agua fría para que le baje la hinchazón'],e:'Reacción alérgica grave (anafilaxia): 112, que siga sentado o tumbado y, si lleva autoinyector de adrenalina, se pone cuanto antes en la cara externa del muslo (ERC 2025).'},
  {s:'IFC',t:'Un compañero con diabetes está sudoroso, tembloroso y confuso en la obra, pero puede tragar.',ok:'Darle azúcar: glucosa o un zumo',no:['Ponerle su insulina','Tumbarlo sin darle nada','Que descanse en la furgoneta'],e:'Posible bajada de azúcar: si está despierto y puede tragar, glucosa o, si no hay, azúcar (un zumo, caramelos). Si a los 15 minutos no mejora, otra vez y 112 (ERC 2025).'},
  {s:'IFC',t:'Montando un equipo, tu compañera nota un dolor opresivo en el pecho que le baja al brazo.',ok:'Sentarla tranquila, llamar al 112 y no dejarla sola',no:['Que conduzca la furgoneta hasta urgencias','Llamar al 112 y que baje sola a esperar la ambulancia','Que termine la instalación y luego vaya al médico'],e:'Dolor en el pecho: tranquilízala, que se siente o se tumbe como esté más cómoda, 112 y quédate con ella hasta que llegue la ayuda (ERC 2025). Si no es alérgica, anímala a masticar una aspirina suya mientras llega la ayuda (el botiquín no la lleva).'},
  {s:'IFC',t:'En julio, instalando una máquina en la cubierta, tu compañero está confuso y muy caliente.',ok:'A la sombra, enfriarlo con agua y llamar al 112',no:['Llamar al 112 y abrigarlo para que no tenga escalofríos','Darle una bebida muy fría aunque esté confuso','Que siga trabajando más despacio y bebiendo mucha agua'],e:'Golpe de calor: apartarlo del calor, quitarle ropa y enfriarlo con agua fría cuanto antes; 112 (ERC 2025).'},
  /* ---- ITE (fase 4, 17-11-2026: de 3 a 10 escenas) ---- */
  {s:'ITE',t:'Un compañero se queda pegado a un cable con tensión en la caja de registro.',ok:'Cortar la corriente antes de tocarlo',no:['Separarlo tirando de su ropa','Apartarlo empujándolo con una escalera metálica','Agarrarlo con los guantes de trabajo y tirar fuerte'],e:'Contacto eléctrico: cortar la corriente antes de tocar a la persona. Los guantes de trabajo no aíslan. Después, 112 siempre, aunque parezca estar bien: la corriente puede alterar el ritmo del corazón.'},
  {s:'ITE',t:'Un compañero se cae del tejado al montar una antena y está consciente.',ok:'Pedirle que no se mueva y llamar al 112',no:['Incorporarlo para ver si puede andar','Llevarlo en brazos hasta el coche','Llamar al 112 y quitarle el casco para que respire mejor'],e:'Caída desde altura: posible lesión de columna. No se le mueve salvo peligro; se le pide que mantenga el cuello quieto, sin quitarle el casco, y se llama al 112.'},
  {s:'ITE',t:'Al taladrar, un trozo de metal se queda clavado en el brazo de tu compañero.',ok:'No sacarlo, sujetarlo y llamar al 112',no:['Sacarlo con cuidado y llamar al 112','Tirar de él con unos alicates con cuidado','Lavar con alcohol y seguir trabajando'],e:'Herida grave: no se extraen los objetos clavados.'},
  {s:'ITE',t:'En el sótano de un edificio, un compañero está tirado junto al cuarto de contadores y huele mucho a gas.',ok:'No entrar ni encender nada y llamar al 112',no:['Entrar a sacarlo aguantando la respiración','Llamar al 112 y encender la luz para verlo mejor','Entrar con un pañuelo mojado tapándote la boca'],e:'Primero, tu seguridad. Agacharte y taparte la boca te ayuda a salir de una zona con humo, no a entrar a rescatar: un pañuelo no filtra los gases tóxicos ni da oxígeno. Sin equipo de protección no se entra, y con gas no se enciende nada: avisa al 112.'},
  {s:'ITE',t:'Pelando cable coaxial, tu compañera se corta con el cúter y sangra mucho de la mano.',ok:'Presión directa y firme con gasas, con guantes, y 112',no:['Llamar al 112 y esperar, sin apretar la herida','Echarle alcohol y taparlo con cinta aislante','Dejar que sangre un poco para que se limpie'],e:'Hemorragia: presión directa, firme y continua con gasas o un apósito, con guantes, y 112.'},
  {s:'ITE',t:'Tu compañero se cae de la escalera en un patio. No responde, pero respira con normalidad.',ok:'Dejarlo boca arriba, sujetarle la cabeza y llamar al 112',no:['Ponerlo en posición lateral de seguridad y llamar al 112','Quitarle el casco para que respire mejor','Sentarlo apoyado en la pared para que se despierte'],e:'Si hay un golpe o una caída no se usa la posición lateral de seguridad (ERC 2025): se le deja boca arriba, se le sujeta la cabeza con las dos manos para que el cuello no se mueva, se vigila que respire y se llama al 112.'},
  {s:'ITE',t:'En un edificio, tu compañera se desploma junto al armario de telecomunicaciones: no responde y no respira con normalidad.',ok:'112, pedir el DEA y empezar la RCP',no:['112 y ponerla en posición lateral de seguridad','Buscarle el pulso en el cuello durante un minuto','Echarle agua en la cara para que reaccione'],e:'No responde y no respira con normalidad: es una parada. 112 (con altavoz), que alguien traiga el DEA y RCP sin esperar.'},
  {s:'ITE',t:'Montando una antena, a tu compañero le pica una avispa: se le hincha la cara y le cuesta respirar.',ok:'112 y ayudarle con su autoinyector, si lo lleva',no:['Ponerle barro en la picadura y seguir trabajando','Llamar al 112 y que baje solo del tejado','Darle agua fría para que le baje la hinchazón'],e:'Reacción alérgica grave (anafilaxia): 112, que siga sentado o tumbado y, si lleva autoinyector de adrenalina, se pone cuanto antes en la cara externa del muslo (ERC 2025).'},
  {s:'ITE',t:'Una compañera con diabetes está sudorosa, temblorosa y confusa en la obra, pero puede tragar.',ok:'Darle azúcar: glucosa o un zumo',no:['Ponerle su insulina','Tumbarla sin darle nada','Que descanse en la furgoneta'],e:'Posible bajada de azúcar: si está despierta y puede tragar, glucosa o, si no hay, azúcar (un zumo, caramelos). Si a los 15 minutos no mejora, otra vez y 112 (ERC 2025).'},
  {s:'ITE',t:'Tirando cable por una fachada, tu compañero nota un dolor opresivo en el pecho que le baja al brazo.',ok:'Sentarlo tranquilo, llamar al 112 y no dejarlo solo',no:['Que conduzca la furgoneta hasta urgencias','Llamar al 112 y que baje solo a esperar la ambulancia','Que termine el tendido y luego vaya al médico'],e:'Dolor en el pecho: tranquilízalo, que se siente o se tumbe como esté más cómodo, 112 y quédate con él hasta que llegue la ayuda (ERC 2025). Si no es alérgico, anímalo a masticar una aspirina suya mientras llega la ayuda (el botiquín no la lleva).'},
  {s:'ITE',t:'En julio, orientando una antena en el tejado, tu compañera está confusa y muy caliente.',ok:'A la sombra, enfriarla con agua y llamar al 112',no:['Llamar al 112 y abrigarla para que no tenga escalofríos','Darle una bebida muy fría aunque esté confusa','Que siga trabajando más despacio y bebiendo mucha agua'],e:'Golpe de calor: apartarla del calor, quitarle ropa y enfriarla con agua fría cuanto antes; 112 (ERC 2025).'},
  /* ---- STI (fase 4, 17-11-2026: de 3 a 10 escenas) ---- */
  {s:'STI',t:'En el CPD salta la extinción por gas y hay una persona dentro inconsciente.',ok:'No entrar sin protección y avisar al 112',no:['Entrar a sacarla aguantando la respiración','Avisar al 112 y entrar a apagar el sistema de extinción','Entrar tapándote la boca con la camiseta'],e:'Primero, tu seguridad. Agacharte y taparte la boca te ayuda a salir de una zona con humo, no a entrar a rescatar: un pañuelo o la camiseta no filtran los gases tóxicos ni dan oxígeno. Sin equipo de protección no se entra: avisa al 112.'},
  {s:'STI',t:'Un compañero toca una parte con tensión de un rack y queda inconsciente.',ok:'Cortar la corriente antes de tocarlo',no:['Separarlo con las manos, sin perder tiempo','Empezar la RCP sin cortar la corriente','Apartarlo con la pulsera antiestática puesta'],e:'Contacto eléctrico: cortar la corriente antes de tocar a la persona. Después, 112 siempre, aunque parezca estar bien: la corriente puede alterar el ritmo del corazón.'},
  {s:'STI',t:'Un compañero se cae de la escalera al pasar cable por el techo y le duele la espalda.',ok:'Pedirle que no se mueva y llamar al 112',no:['Ayudarlo a levantarse poco a poco','Llamar al 112 y sentarlo en una silla con respaldo','Llevarlo en el coche a urgencias'],e:'Posible lesión de columna: no se le mueve salvo peligro inmediato; se le pide que se quede quieto y se llama al 112.'},
  {s:'STI',t:'En la oficina técnica, tu compañera se desploma: no responde y no respira con normalidad. En recepción hay un DEA.',ok:'112, que traigan el DEA y empezar la RCP',no:['112 y ponerla en posición lateral de seguridad','Buscarle el pulso en el cuello durante un minuto','Echarle agua en la cara para que reaccione'],e:'No responde y no respira con normalidad: es una parada. 112 (con altavoz), que alguien traiga el DEA y RCP sin esperar.'},
  {s:'STI',t:'Tu compañero se cae de la escalera en el CPD. No responde, pero respira con normalidad.',ok:'Dejarlo boca arriba, sujetarle la cabeza y llamar al 112',no:['Ponerlo en posición lateral de seguridad y llamar al 112','Sentarlo en una silla para ver si se despierta','Ponerle una chaqueta doblada bajo la cabeza'],e:'Si hay un golpe o una caída no se usa la posición lateral de seguridad (ERC 2025): se le deja boca arriba, se le sujeta la cabeza con las dos manos para que el cuello no se mueva, se vigila que respire y se llama al 112.'},
  {s:'STI',t:'Montando un rack, tu compañera se corta la mano con el borde de una chapa y sangra mucho.',ok:'Presión directa y firme con gasas, con guantes, y 112',no:['Llamar al 112 y esperar, sin apretar la herida','Echarle alcohol y taparlo con cinta americana','Dejar que sangre un poco para que se limpie'],e:'Hemorragia: presión directa, firme y continua con gasas o un apósito, con guantes, y 112.'},
  {s:'STI',t:'En la sala de descanso, tu compañero come algo con frutos secos: se le hincha la cara y le cuesta respirar.',ok:'112 y ayudarle con su autoinyector, si lo lleva',no:['Darle agua fría para que le baje la hinchazón','Llamar al 112 y que salga a caminar al aire libre','Esperar a ver si se le pasa al dejar de comer'],e:'Reacción alérgica grave (anafilaxia): 112, que siga sentado o tumbado y, si lleva autoinyector de adrenalina, se pone cuanto antes en la cara externa del muslo (ERC 2025).'},
  {s:'STI',t:'Una compañera con diabetes está sudorosa, temblorosa y confusa en su puesto, pero puede tragar.',ok:'Darle azúcar: glucosa o un zumo',no:['Ponerle su insulina, que la lleva en la mochila','Tumbarla y no darle nada por si se atraganta','Mandarla a casa en el coche a descansar'],e:'Posible bajada de azúcar: si está despierta y puede tragar, glucosa o, si no hay, azúcar (un zumo, caramelos). Si a los 15 minutos no mejora, otra vez y 112 (ERC 2025).'},
  {s:'STI',t:'Configurando un servidor, tu compañero nota un dolor opresivo en el pecho que le baja al brazo.',ok:'Sentarlo tranquilo, llamar al 112 y no dejarlo solo',no:['Que vaya en su coche a urgencias','Llamar al 112 y que vaya solo a esperar la ambulancia','Que termine la configuración y luego vaya al médico'],e:'Dolor en el pecho: tranquilízalo, que se siente o se tumbe como esté más cómodo, 112 y quédate con él hasta que llegue la ayuda (ERC 2025). Si no es alérgico, anímalo a masticar una aspirina suya mientras llega la ayuda (el botiquín no la lleva).'},
  {s:'STI',t:'Con la climatización del CPD averiada en agosto, tu compañera lleva horas dentro: está confusa y muy caliente.',ok:'Sacarla del calor, enfriarla con agua y llamar al 112',no:['Llamar al 112 y abrigarla para que no tenga escalofríos','Darle una bebida muy fría aunque esté confusa','Que siga trabajando más despacio y bebiendo mucha agua'],e:'Golpe de calor: apartarla del calor, quitarle ropa y enfriarla con agua fría cuanto antes; 112 (ERC 2025).'}
 ],
 val: [
  {s:'',nu:1,t:'No responde, pero respira con normalidad. No ha sufrido golpes ni caídas.',ok:'PLS, 112 y vigilar que siga respirando',no:['Dejarla boca arriba con las piernas en alto','Sentarla en una silla para que se despierte','Empezar la RCP por si acaso'],e:'No responde, pero respira con normalidad: llama al 112 con el altavoz si aún no lo has hecho, ponla en posición lateral de seguridad y vigila su respiración. Si deja de respirar con normalidad, boca arriba y RCP (ERC 2025).'},
  /* 19-11-2026 (revisión total, ERC 2025): ante quien no responde, se llama al 112 antes de mirar si respira (el libro ya lo dice: _algoritmo_svb) */
  {s:'',nu:1,t:'Encuentras a una persona en el suelo: no responde cuando le hablas y le tocas los hombros.',ok:'Llamar al 112 con el altavoz y mirar si respira',no:['Mirar un minuto si respira y luego llamar','Ir a por el DEA antes de llamar a nadie','Incorporarla para que vuelva en sí'],e:'ERC 2025: ante cualquier persona que no responde, llama al 112 enseguida (con el altavoz) y, mientras contestan, mira si respira con normalidad. Si no respira con normalidad, o dudas, empieza la RCP: quien te atiende te guía.'},
  {s:'',nu:1,t:'No responde y hace respiraciones lentas y trabajosas, como «boqueadas».',ok:'Es una parada: 112 y RCP',no:['Está respirando: posición lateral de seguridad','Esperar un minuto a ver si mejora','Echarle agua en la cara para que reaccione'],e:'Las boqueadas no son una respiración normal: hay que empezar la RCP.'},
  {s:'',t:'¿Cuánto tiempo compruebas si respira con normalidad?',ok:'No más de 10 segundos',no:['Un minuto entero, para asegurarte','Hasta que llegue la ambulancia','Medio minuto, mirando su pecho'],e:'Se mira, se escucha y se siente durante no más de 10 segundos.'},
  {s:'',t:'¿Dónde se ponen las manos para las compresiones?',ok:'En el centro del pecho',no:['En el lado izquierdo, sobre el corazón','Sobre la boca del estómago','En la parte alta del pecho, junto al cuello'],e:'El talón de una mano en el centro del pecho y la otra encima, con los brazos rectos.'},
  {s:'',t:'¿A qué ritmo se hacen las compresiones?',ok:'De 100 a 120 por minuto',no:['De 60 a 80 por minuto','De 140 a 160 por minuto','Lo más rápido que puedas'],e:'Entre 100 y 120 por minuto: unas dos compresiones por segundo.'},
  {s:'',t:'¿Qué profundidad tienen las compresiones en una persona adulta?',ok:'Al menos 5 cm, pero no más de 6',no:['1 o 2 cm, para no romper costillas','Unos 10 cm, con todo tu peso','Lo justo para notar que se hunde un poco'],e:'Al menos 5 cm y no más de 6, dejando que el pecho vuelva a su sitio.'},
  {s:'',t:'¿Cuál es la proporción de la RCP?',ok:'30 compresiones y 2 ventilaciones',no:['15 compresiones y 2 ventilaciones','5 compresiones y 1 ventilación','100 compresiones y 10 ventilaciones'],e:'RCP 30:2: 30 compresiones y 2 ventilaciones.'},
  {s:'',t:'No sabes dar ventilaciones. ¿Qué haces?',ok:'Compresiones sin parar hasta que llegue la ayuda',no:['Nada: esperar a que llegue la ambulancia','Solo ventilaciones, sin compresiones','Darle palmadas en la cara hasta que reaccione'],e:'Sin ventilaciones si no sabes: compresiones sin parar.'},
  {s:'',t:'¿Hasta cuándo sigues con la RCP?',ok:'Hasta que llegue la ayuda, respire con normalidad o te agotes',no:['Diez minutos y, si no reacciona, paras porque ya no sirve','Hasta que creas notarle el pulso, aunque no respire con normalidad','Hasta que pase un rato sin que reaccione'],e:'Hasta que llegue la ayuda sanitaria, la persona respire con normalidad o te agotes (con más personas, relevaos cada 2 minutos).'},
  {s:'',t:'Llega el desfibrilador (DEA). ¿Qué haces?',ok:'Encenderlo ya y seguir lo que dice su voz',no:['Esperar a que llegue alguien que sepa usarlo','Guardarlo para que lo use la ambulancia','Usarlo solo si ves que la persona responde'],e:'El DEA es muy fácil de usar: da instrucciones de voz. Se usa en cuanto llega.'},
  {s:'',t:'Se atraganta, no puede toser ni hablar.',ok:'Hasta 5 golpes en la espalda, entre los omóplatos',no:['Barrerle la boca con los dedos para sacar lo que sea','Darle agua para que le baje el trozo','Que levante los brazos para que entre aire'],e:'Si la tos ya no sirve: inclínala hacia delante y hasta 5 golpes entre los omóplatos.'},
  {s:'',t:'Los 5 golpes en la espalda no han resuelto el atragantamiento.',ok:'Hasta 5 compresiones abdominales (maniobra de Heimlich)',no:['Empezar la RCP aunque siga consciente','Meterle los dedos hasta el fondo para que vomite el trozo','Seguir con golpes en la espalda hasta que se desmaye'],e:'Si los golpes no bastan: hasta 5 compresiones abdominales, alternándolas con los golpes, y 112.'},
  {s:'',g:'quem',t:'Se quema la mano al tocar una pieza muy caliente.',ok:'Enfriarla con agua corriente al menos 20 minutos',no:['Poner hielo directamente sobre la quemadura','Echar pasta de dientes o aceite para calmar','Pinchar la ampolla para que salga el líquido'],e:'Enfriar con agua corriente durante al menos 20 minutos, sin pomadas ni despegar la ropa.'},
  {s:'',nu:1,g:'hemo',t:'Una herida sangra mucho en el antebrazo.',ok:'Presión directa y firme sobre la herida y 112',no:['Lavarla con alcohol y esperar a ver si para','Levantar el brazo y esperar a que deje de sangrar','Dejar que sangre un poco para que se limpie'],e:'Hemorragia: presión directa, firme y continua sobre la herida, con guantes, y 112.'},
  /* fase 4, 17-11-2026: torniquete según ERC 2025 (hemorragia de una extremidad que amenaza la vida y no para con presión directa) */
  {s:'',g:'hemo',t:'Un corte profundo en el muslo sangra a chorro y, aunque aprietas fuerte con gasas, no para. Te traen un torniquete de fábrica.',ok:'Ponerlo por encima de la herida y anotar la hora',no:['Seguir solo apretando: el torniquete siempre es peligroso','Ponerlo y aflojarlo cada pocos minutos para que circule','Apretarlo un poco y quitarlo cuando deje de sangrar'],e:'Si una hemorragia que amenaza la vida en un brazo o una pierna no para con presión directa, torniquete cuanto antes: 5-7 cm por encima de la herida (no sobre una articulación), apretado hasta que pare, con la hora anotada y sin aflojarlo; solo lo quita el personal sanitario (ERC 2025).'},
  {s:'',g:'frac',t:'Se ha torcido el tobillo y puede que esté roto.',ok:'Inmovilizarlo como está, sin intentar recolocarlo',no:['Recolocarlo de un tirón para que no se quede mal','Hacerle andar un poco para ver si está roto','Darle un masaje fuerte para bajar la hinchazón'],e:'Fractura o esguince: inmovilizar en la posición en que está, sin recolocar.'},
  {s:'',t:'Está pálida, con sudor frío, pulso rápido y mucha sed después de un golpe.',ok:'Tumbarla, abrigarla, no darle de beber y avisar al 112',no:['Darle agua con azúcar a sorbos para que recupere fuerzas','Hacerla caminar un poco para que se active','Sentarla con la cabeza entre las rodillas'],e:'Signos de shock: tumbarla, abrigarla, no darle de beber y 112.'},
  /* fase 4, 17-11-2026: teléfono del Servicio de Información Toxicológica comprobado en mjusticia.gob.es (24 horas) */
  {s:'',g:'intox',t:'Ha bebido un producto de limpieza por error.',ok:'Llamar al 112 o al Toxicológico con el envase a mano',no:['Darle un vaso de leche para que neutralice el producto','Darle agua con sal para que vomite y lo eche todo','Provocarle el vómito metiéndole los dedos en la boca'],e:'Intoxicación: 112 o Servicio de Información Toxicológica (91 562 04 20, las 24 horas) con el envase o la etiqueta a mano; no provocar el vómito ni dar nada de beber.'},
  {s:'',t:'Una mujer embarazada está inconsciente y respira con normalidad.',ok:'De lado sobre el costado izquierdo',no:['De lado sobre el costado derecho','Boca arriba con las piernas en alto','Sentada con la espalda apoyada en la pared'],e:'A una mujer embarazada se la coloca sobre el costado izquierdo.'},

   hay que hacer, con el reloj parado hasta «¡Vamos!». Corta y sin respuestas: lo demás se aprende jugando. Mientras se lee, se
   descargan las ilustraciones de la víctima si hacen falta (antes se pedían todas al abrir el juego) */
const PRES_N={1:['Escenas de tu trabajo: ¿qué haces primero? Cuidado con las trampas.','30 s por escena y 3 vidas. En una te toca llamar al 112.'],
 2:['Escenas de tu trabajo y de cualquier trabajo: valora a la persona y elige qué le pasa y qué haces.','30 s por escena y 3 vidas.'],
 3:['Una persona no responde, pero respira con normalidad: colócala en posición lateral de seguridad.','Arrastra cada parte de su cuerpo a su sitio, en orden. Tienes 60 s y, si fallas, una pista.'],
 4:['Una persona se desploma delante de ti: haz la RCP como en un caso real, con desfibrilador y relevo.','Aquí no hay cuenta atrás: el tiempo lo marca la propia RCP.']};
function presentaNivel(va){
 const l=st.l,o=st.oficial,yo=st;
 if(l.n>=3||o)precargaVictima();
 app.innerHTML=`<div class="intro-n"><div class="placa-n" style="--c:${l.col}"><span class="num" aria-hidden="true">${l.n}</span>
   <div class="marca">${o?'Partida oficial · ':''}Nivel ${l.n} de ${ULT}</div><h2 class="serif">${l.titulo}</h2>
   <ul>${PRES_N[l.n].map(x=>`<li>${x}</li>`).join('')}</ul>${st.lento&&l.n<=3?'<p class="lento-n">Con más tiempo para leer: el doble de tiempo.</p>':''}</div>
  <div class="btns"><button class="btn p" id="vamos" type="button">¡Vamos!</button><button class="btn s" id="menuN" type="button">${o?'Abandonar la partida oficial':'Volver al menú'}</button></div></div>`;
 window.scrollTo(0,0);bloqueaToques();
 $('#vamos').onclick=()=>{if(st===yo&&!tocaPronto())va()};
 $('#menuN').onclick=async()=>{
  if(o&&!(await dialogo('¿Seguro? El intento '+o.intento+' de '+INTENTOS+' ya está gastado y esta partida no contará para nota.',{si:'Sí, salir',no:'Seguir jugando'})))return;
  if(st!==yo)return;if(o)OFI_VIVA=false;st.salido=true;portada();
 };
 try{$('#vamos').focus({preventScroll:true})}catch(e){}
}

/* ===== Niveles 1 y 2: escenas tipo test ===== */
/* 19-11-2026 (revisión total): el marcador se repinta al responder (antes, vidas y puntos cambiaban con la escena siguiente) */
/* 19-11-2026 (revisión total, lote 6, dirección de arte): el número de escena va en las cuentas de plastilina (una por escena, con su
   número; ✓ o ✗ al responder); la placa del marcador solo enseña la racha y guarda su sitio cuando no la hay (nada salta) */
const escTxt=()=>st.racha>1?ico('llama')+' x'+st.racha:'';
const cuentasIn=()=>st.lista.map((x,k)=>{const m=(st.marcas||[])[k];return m===true?'<i class="ok">✓</i>':m===false?'<i class="mal">✗</i>':`<i${k===st.i?' class="ya"':''}>${k+1}</i>`}).join('');
const cuentasHtml=()=>`<div class="barra cuentas" id="cuentas" role="img" aria-label="Escena ${st.i+1} de ${st.lista.length}">${cuentasIn()}</div>`;
/* el tiempo de cada escena: una mecha de plastilina que se consume, con su chispa (antes, una barra plana) */
const mechaHtml=()=>'<div class="tiempo mecha" id="t" aria-hidden="true"><i></i><span class="carril"><b class="chispa"></b></span></div>';
function quemaMecha(m,q){if(!m)return;q=Math.max(0,q);m.style.setProperty('--q',q.toFixed(4));m.classList.toggle('urge',q<.3)}
const vidasTxt=()=>'♥'.repeat(Math.max(0,st.vidas))+'♡'.repeat(3-Math.max(0,st.vidas));
/* 19-11-2026 (arte de José, piezas de plastilina): corazones de plastilina; si aún no han cargado (o faltan), los de texto */
const vidasHtml=()=>{const ll=arte(ARTE.corazon[0],''),va=arte(ARTE.corazon[1],''),v=Math.max(0,st.vidas);return ll&&va?[0,1,2].map(i=>`<img src="${i<v?ll:va}" alt="">`).join(''):vidasTxt()};
const cabHtml=()=>`<div class="cab"><span class="pill" id="cpts">${st.pts} pts</span><span class="pill racha${st.racha>1?'':' no'}" id="cesc">${escTxt()}</span><span class="pill vidas" id="cvid" role="img" aria-label="Vidas: ${st.vidas} de 3">${vidasHtml()}</span>${ctlHtml()}${cuentasHtml()}${mechaHtml()}</div>`;   // lote 6: las cuentas y la mecha, dentro del marcador fijo (se ven aunque se desplace la página)
function pintaCab(){
 const p=$('#cpts'),e=$('#cesc'),v=$('#cvid'),cu=$('#cuentas');
 if(p)p.textContent=st.pts+' pts';if(e){e.innerHTML=escTxt();e.classList.toggle('no',st.racha<2)}
 if(cu){cu.innerHTML=cuentasIn();const b=cu.children[st.i];if(b&&b.animate&&(st.marcas||[])[st.i]!=null)b.animate([{transform:'scale(.4)'},{transform:'scale(1.25)',offset:.6},{transform:'scale(1)'}],{duration:340,easing:'ease-out'})}
 if(v){const antes=v.querySelectorAll('img').length?v.innerHTML:null;v.innerHTML=vidasHtml();if(antes!==null&&antes!==v.innerHTML&&v.animate)v.animate([{transform:'scale(1)'},{transform:'scale(1.2)',offset:.35},{transform:'scale(1)'}],{duration:320});v.setAttribute('aria-label','Vidas: '+Math.max(0,st.vidas)+' de 3')}
}
/* 19-11-2026 (revisión total, decisión 2): pausa sin ventaja, como en «Cuadra la nómina». Antes, pausar (o cambiar de aplicación) con una
   escena a la vista devolvía la misma escena con el mismo tiempo: daba tiempo para pensarla. Ahora, detrás de la pausa se cambia por
   otra del mismo montón (su sector o las comunes del mismo nivel) que no haya salido, con el tiempo que le quedaba y sin puntos de
   rapidez. Las del núcleo del nivel 2 no se cambian en la oficial (tienen que salir): se quedan, sin rapidez */
function repuesto(s){
 if(s.tipo||st.oficial&&s.nu)return null;
 const fuera=new Set((st.fuera||[]).concat(st.lista)), temas=new Set(st.lista.filter(x=>x!==s&&x.g).map(x=>x.g));
 return baraja(BANCOS[st.l.banco].filter(x=>x.s===s.s&&!x.ll&&!fuera.has(x)&&!(x.g&&temas.has(x.g))&&!(st.oficial&&x.nu)))[0]||null;
}
function pregunta(resto){   // resto: ms que le quedaban a la escena que se ha cambiado en la pausa
 clearInterval(st.reloj);
 if(st.i>=st.lista.length||st.vidas<=0)return final();
 const s=st.lista[st.i];
 if(s.tipo==='llamada')return llamada(s);
 if(resto==null)st.sinRap=false;
 const ops=baraja([s.ok,...s.no]);
 /* 19-11-2026 (revisión total, lote 6): la escena se juega dentro del escenario (el puesto a toda pantalla, detrás), sin la tarjeta
    blanca de página web; las opciones, placas de plastilina abajo, a mano del pulgar */
 app.innerHTML=`${cabHtml()}
  <div class="tarjeta escenario" id="tj">
   ${cabEscena(s)}
   <div class="abajo-e"><div class="preg">${st.l.banco==='pas'?'¿Qué haces?':'¿Qué le pasa y qué haces?'}</div>
   <div class="opciones textos">${ops.map((o,k)=>`<button class="op" data-k="${k}">${o}</button>`).join('')}</div>
   <div class="explica" id="ex" role="status" aria-live="polite"></div>
   <button class="sig" id="sig">Siguiente</button></div>
  </div>`;
 ponTras();narraEscena(s);bloqueaToques();alPrincipio();
 const T=st.l.t*K()*1000,t0=ahoraJ()-(resto==null?0:T-resto),barra=$('#t');
 let hecha=false;
 st.enPausa=()=>{if(hecha)return;st.sinRap=true;const r=repuesto(s);if(!r)return;(st.fuera=st.fuera||[]).push(s);st.lista[st.i]=r;pregunta(T-(ahoraJ()-t0))};
 st.reloj=setInterval(()=>{const q=1-(ahoraJ()-t0)/T;quemaMecha(barra,q);if(q<=0)responde(null)},50);   // lote 7: sin recolocar la página (lote 6: la mecha, con recorte y transform)
 quemaMecha(barra,1-(ahoraJ()-t0)/T);
 latido(()=>1-(ahoraJ()-t0)/T);
 const responde=k=>{
  if(k!==null&&tocaPronto())return;   // segundo toque de un doble toque
  hecha=true;clearInterval(st.reloj);calla();
  const elegido=k===null?null:ops[k], ok=elegido===s.ok, seg=Math.min(T/1000,(ahoraJ()-t0)/1000);
  (st.marcas=st.marcas||[])[st.i]=ok;barra.classList.add('apagada');   // lote 6: la cuenta de esta escena, ✓ o ✗; la chispa se apaga
  st.tj=(st.tj||0)+seg;   // tiempo de juego del nivel (para el servidor): solo mientras corre el reloj de la escena
  app.querySelectorAll('.op').forEach(b=>{b.disabled=true;if(ops[b.dataset.k]===s.ok)b.classList.add('ok');else if(+b.dataset.k===k)b.classList.add('mal')});
  const ex=$('#ex');
  if(ok){
   st.racha++;st.aciertos++;
   const g=Math.round((100+rapidez(30,T/1000-seg))*(1+Math.min(st.racha-1,4)*.25));   // fase 3: la rapidez suma como mucho 30 (antes hasta 120): manda saber, no leer deprisa
   st.pts+=g;flota('+'+g,'var(--ok)');sfx('acierto',st.racha-1);   // fase 5: el tono sube con la racha
   if(!explicaEscena(true,`<b>¡Correcto!</b> ${s.e}`)){ex.className='explica ok';ex.innerHTML=`<b>¡Correcto!</b>${s.e}`}
  }else{
   st.racha=0;st.vidas--;st.fallos.push(s);
   const r=Math.min(RESTA,st.pts);st.pts-=r;if(r)flota('−'+r,'var(--mal)');
   $('#tj').classList.add('sacude');fallo();
   if(!explicaEscena(false,`<b>${k===null?'¡Se acabó el tiempo!':'No es correcto.'}</b> Lo correcto: «${s.ok}». ${s.e}`)){ex.className='explica mal';ex.innerHTML=`<b>${k===null?'¡Se acabó el tiempo!':'No es correcto'}</b>Lo correcto: «${s.ok}». ${s.e}`}
  }
  pintaCab();
  const b=$('#sig');b.style.display='block';setTimeout(()=>muestraRespuesta(b),150);
  b.textContent=(st.vidas<=0||st.i+1>=st.lista.length)?'Ver resultado':'Siguiente';
  b.onclick=()=>{st.i++;pregunta()};
 };
 app.querySelectorAll('.op').forEach(b=>b.onclick=()=>responde(+b.dataset.k));
}
/* ===== Escenas narradas (arte, 17-11-2026) =====
   Cabecera con el puesto desenfocado y oscurecido; la protagonista cuenta la escena y, al responder, reacciona con la
   explicación en su bocadillo. Va encima de las opciones (no las tapa nunca). Sin elenco.js, la tarjeta de siempre. */
/* 19-11-2026 (revisión total, lote 7): al pasar de escena, la página vuelve arriba y el foco va a la pregunta (antes volvía al principio del documento) */
function alPrincipio(){if(st.i>0||st.fuera){window.scrollTo(0,0);const q=app.querySelector('.preg');if(q){q.tabIndex=-1;try{q.focus({preventScroll:true})}catch(e){}}}}
function cabEscena(s,fondo){
 /* 19-11-2026 (revisión total, lote 6): el escenario va a toda pantalla detrás de la escena (ponTras), no en una cabecera desenfocada */
 if(!hayElenco()){st.fondoEsc=ARTE.escena.HIG?`url('${ARTE.escena.HIG}')`:'none';return `<div class="icoesc" style="background:${st.l.col}">${ico(s.tipo==='llamada'?'telefono':st.l.banco==='pas'?'escudo':'fonendo')}</div>${s.tipo==='llamada'?'':`<div class="escena">${s.t}</div>`}`}
 const c=s.s&&s.s!==cc()&&typeof ELENCO!=='undefined'&&ELENCO[s.s]?s.s:cc();   // escena de un sector: su puesto; común: el tuyo
 if(fondo===undefined)fondo=st.l.banco==='val'&&!s.s&&ARTE.descanso&&ARTE_OK[ARTE.descanso]!==0?ARTE.descanso:ARTE.escena[c];   // 19-11-2026: las comunes del nivel 2, en la sala de descanso (si falta, el puesto)
 if(!fondo)fondo=ARTE.escena[c];   // la llamada, sin imagen propia: el puesto sin personas
 st.fondoEsc=fondoDe(fondo,c);
 return `<div class="escena-cab" id="ecab"><div class="slot" id="epres" aria-live="polite" aria-atomic="true"></div></div>`;
}
/* el escenario, detrás de todo y fijo al desplazar (fuera de la tarjeta: su sacudida al fallar no lo mueve) */
function ponTras(){const d=document.createElement('div');d.className='tras';d.id='tras';d.setAttribute('aria-hidden','true');d.style.setProperty('--fondo',st.fondoEsc||'none');app.prepend(d)}
function entradaEscena(s){
 if(s.s&&typeof ELENCO!=='undefined'&&ELENCO[s.s])return `<b>Estás trabajando en ${enEmpresa(s.s,true)}.</b> `;
 if(/^¿/.test(s.t))return '<b>Esto hay que saberlo sin dudar.</b> ';
 return st.l.banco==='val'?'<b>Fíjate bien antes de actuar.</b> ':'<b>Esto puede pasar en cualquier trabajo.</b> ';
}
function narraEscena(s,quien,html){
 const slot=$('#epres');if(!slot)return;
 $('#tj').classList.add('con-escena');
 narra(slot,{ciclo:cc(),quien:quien||'prota',animo:'neutro'},html!=null?html:entradaEscena(s)+s.t);
}
function explicaEscena(ok,html){
 const cab=$('#ecab'),slot=$('#epres');if(!cab||!slot||!slot.querySelector('.pres'))return false;
 cab.classList.add(ok?'bien':'mal');const t=$('#tras');if(t)t.classList.add(ok?'bien':'mal');reaccionaHtml(slot,ok?'bien':'mal',html);return true;
}
function muestraRespuesta(b){
 const tj=$('#tj'),cab=$('#ecab');if(!tj||!b)return;
 if(!cab)return b.scrollIntoView({behavior:'smooth',block:'end'});
 /* 19-11-2026 (revisión total, lote 6): se cuenta el marcador fijo de arriba (con las cuentas y la mecha), que si no tapaba el principio de la explicación */
 const m=app.querySelector('.cab'),h=m?m.getBoundingClientRect().height:0;if(m)cab.style.scrollMarginTop=(m.offsetHeight+6)+'px';   // h, en la pantalla (con el zoom de la tableta)
 if(b.getBoundingClientRect().bottom-cab.getBoundingClientRect().top<=innerHeight-h-12)b.scrollIntoView({behavior:'smooth',block:'end'});   // cabe: explicación, opciones y «Siguiente» a la vista
 else cab.scrollIntoView({behavior:'smooth',block:'start'});                                                  // no cabe: primero la explicación
}
/* La llamada al 112 (José, 5-11-2026): se contesta tocando tarjetas; una es trampa («Cuelgo ya»).
   Arte, 17-11-2026: la persona compañera de ciclo se queda con la víctima y empieza la RCP mientras tú llamas (dos personas: una
   llama con el altavoz y la otra no deja de socorrer); «quién eres» y «dónde estás» son los de tu empresa.
   19-11-2026 (revisión total, decisión 1, aprobada por José): el 112 pregunta y se contesta con la tarjeta que toca, en el orden de la
   guía del 112 de Andalucía: «112, ¿qué ocurre?» → «¿Dónde está exactamente?» → «¿Cuántas personas y cómo están?» → «¿Quién llama?».
   Antes se exigía quién → dónde → qué → cuántas → cómo y quien siguiera la guía oficial fallaba. (El libro cambia a la vez: PAS de ud03.py) */
const DONDE={HIG:'«Calle Pureza, 12, Triana, Sevilla; en la clínica, planta baja, gabinete 2»',
 IFC:'«Hotel de la calle Luis Montoto, 40, Sevilla; sótano 1, sala de máquinas»',
 ITE:'«Calle Betis, 30, Sevilla; edificio de oficinas, en la azotea: se sube por la escalera principal»',
 STI:'«Aeropuerto de Sevilla, edificio terminal; planta 1, centro de datos, pasillo B»'};
function ordenLlamada(s){
 if(!hayElenco())return s.orden;
 const c=cc();
 return s.orden.map(x=>x.id==='quien'?Object.assign({},x,{r:[x.r[0],`«Llamo desde ${enEmpresa(c,true)}: trabajo con la persona herida»`]}):x.id==='donde'&&DONDE[c]?Object.assign({},x,{r:[x.r[0],DONDE[c]]}):x);
}
const LLAMADA={tipo:'llamada',t:'Llamas al 112 con el altavoz puesto. Te van preguntando: contesta tocando la tarjeta que toca.',
 ok:'Contestar a lo que te preguntan: qué ocurre, dónde, cuántas personas y cómo están, y quién llama',
 e:'Di qué ha pasado y dónde estás exactamente (calle, número, planta y cómo se llega), cuántas personas heridas hay y cómo están, y quién eres. Contesta a lo que te pregunten y no cuelgues hasta que te lo indiquen.',
 orden:[{id:'que',p:'112, ¿qué ocurre?',r:['Qué ha pasado','«Una persona de mi equipo se ha desplomado de repente»']},
  {id:'donde',p:'¿Dónde está exactamente?',r:['Dónde estás exactamente','«Calle Feria, 12, Sevilla; planta baja, al fondo del pasillo»']},
  {id:'cuantas',p:'¿Cuántas personas y cómo están?',r:['Cuántas personas y cómo están','«Una persona: no responde y no respira con normalidad»']},
  {id:'quien',p:'¿Quién llama?',r:['Quién eres','«Trabajo con la persona herida y llamo desde aquí»']}],
 trampa:['Cuelgo ya','«Cuelgo para no ocupar la línea»']};
const preg112=p=>`<div class="q"><b>Te preguntan:</b> «${p}»</div>`;
function llamada(s){
 const orden=ordenLlamada(s);
 const fichas=baraja(orden.map((x,k)=>({k,x:x.r})).concat([{k:-1,x:s.trampa}]));
 let paso=0,hecho=false;
 /* 19-11-2026 (revisión total, lote 6): en el escenario, como las escenas; la conversación en una bandeja de plastilina y las tarjetas
    abajo, quietas mientras la conversación crece hacia ellas */
 app.innerHTML=`${cabHtml()}
  <div class="tarjeta escenario" id="tj">${cabEscena(s,ARTE.llamada[cc()])}
   <div class="preg">${arte(ARTE.telefono,'')?`<img class="tel" src="${ARTE.telefono}" alt="">`:''}Llamada al 112</div>
   <div class="llamada"><div class="lin" id="ll" aria-live="polite"><div class="ins">${hayElenco()?'Te van preguntando: contesta tocando la tarjeta que toca.':s.t}</div>${preg112(orden[0].p)}</div></div>
   <div class="abajo-e"><div class="chips112">${fichas.map(f=>`<button class="chip112" data-k="${f.k}">${f.x[0]}<small>${f.x[1]}</small></button>`).join('')}</div>
   <div class="explica" id="ex" role="status" aria-live="polite"></div><button class="sig" id="sig">Siguiente</button></div></div>`;
 ponTras();alPrincipio();
 if(hayElenco())narraEscena(s,'vet','Alguien de nuestro equipo se ha desplomado: no responde y no respira con normalidad. Me quedo a su lado y empiezo la RCP. <b>Llama tú al 112, con el altavoz puesto.</b>');
 bloqueaToques();
 const T=(st.l.t+15)*K()*1000,t0=ahoraJ(),barra=$('#t');
 st.sinRap=false;
 /* 19-11-2026 (decisión 2): pausar con la llamada a la vista baraja otra vez las tarjetas que quedan */
 st.enPausa=()=>{if(hecho)return;const c=app.querySelector('.chips112');if(c)baraja([...c.children]).forEach(b=>c.appendChild(b))};
 const acaba=(ok,mala)=>{
  if(hecho)return;hecho=true;clearInterval(st.reloj);calla();app.querySelectorAll('.chip112').forEach(b=>b.disabled=true);
  const ex=$('#ex'),seg=Math.min(T/1000,(ahoraJ()-t0)/1000);st.tj=(st.tj||0)+seg;
  (st.marcas=st.marcas||[])[st.i]=!!ok;barra.classList.add('apagada');   // lote 6: la cuenta de la llamada y la chispa apagada
  app.querySelector('.chips112').classList.add('hecha');   // lote 6: las tarjetas ya no sirven (lo dicho queda en la conversación): «Siguiente» sube, sin bajar media página
  if(ok){st.racha++;st.aciertos++;const g=Math.round((150+rapidez(45,T/1000-seg))*(1+Math.min(st.racha-1,4)*.25));st.pts+=g;flota('+'+g,'var(--ok)');sfx('premio');
   if(!explicaEscena(true,`<b>¡Llamada perfecta!</b> ${s.e}`)){ex.className='explica ok';ex.innerHTML=`<b>¡Llamada perfecta!</b>${s.e}`}}
  else{st.racha=0;st.vidas--;st.fallos.push(s);const r=Math.min(RESTA,st.pts);st.pts-=r;if(r)flota('−'+r,'var(--mal)');$('#tj').classList.add('sacude');fallo();
   const cual=seg*1000>=T?'¡Se acabó el tiempo!':mala===-1?'¡No cuelgues!':`Te preguntaban «${orden[paso].p}»: tocaba «${orden[paso].r[0]}».`;
   if(!explicaEscena(false,`<b>${cual}</b> ${s.e}`)){ex.className='explica mal';ex.innerHTML=`<b>${cual}</b>${s.e}`}}
  pintaCab();
  const b=$('#sig');b.style.display='block';setTimeout(()=>muestraRespuesta(b),150);
  b.textContent=(st.vidas<=0||st.i+1>=st.lista.length)?'Ver resultado':'Siguiente';b.onclick=()=>{st.i++;pregunta()};
 };
 st.reloj=setInterval(()=>{const q=1-(ahoraJ()-t0)/T;quemaMecha(barra,q);if(q<=0)acaba(false)},50);
 quemaMecha(barra,1);
 latido(()=>hecho?null:1-(ahoraJ()-t0)/T);
 app.querySelectorAll('.chip112').forEach(b=>b.onclick=()=>{
  if(tocaPronto())return;   // segundo toque de un doble toque
  if(hecho)return;
  const k=+b.dataset.k;
  if(k!==paso)return acaba(false,k);
  b.classList.add('usada');sfx('acierto',paso);paso++;   // fase 5: cada tarjeta bien puesta, un tono más alto
  const ll=$('#ll');ll.innerHTML+=`<div class="tu"><b>Tú:</b> ${orden[k].r[1]}</div>`+(paso<orden.length?preg112(orden[paso].p):'<div class="q"><b>Te dicen:</b> «No cuelgue: le voy indicando qué hacer.»</div>');
  ll.scrollTop=ll.scrollHeight;   // lote 6: la conversación tiene alto máximo y enseña siempre lo último (las tarjetas no se mueven)
  if(paso===orden.length)acaba(true);
 });

/* 19-11-2026 (revisión total, lote 5): los puntos que suben al acertar salían en mitad de la pantalla, encima del bocadillo y de la

/* Ajuste con la moneda: el diámetro del círculo (px CSS) entre 2,325 cm da los píxeles por centímetro de esta pantalla */

function profEmpieza(){
 st.fase='prof';st.ultimo=0;
 if(st.modoP==='pulsar'){
  $('#bot').innerHTML=`<button class="pad-prof" id="padp" type="button" aria-label="Mantén pulsado para comprimir y suelta para que el pecho suba">${ico('mano')}Mantén pulsado</button>`;
  const pad=$('#padp');
  pad.onpointerdown=ev=>{ev.preventDefault();if(st.hold)return;try{pad.setPointerCapture(ev.pointerId)}catch(e){}profPulsa(ahoraJ()-tardeEv(ev))};
  pad.onpointerup=pad.onpointercancel=ev=>profSueltaPulsado(ahoraJ()-tardeEv(ev));
  pad.onkeydown=ev=>{if((ev.key===' '||ev.key==='Enter')&&!ev.repeat){ev.preventDefault();profPulsa(ahoraJ())}};

  pad.onclick=ev=>ev.preventDefault();
  try{pad.focus({preventScroll:true})}catch(e){}

 }else{

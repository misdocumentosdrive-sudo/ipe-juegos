<title>Tres en red · IPE I</title>
<style>@font-face{font-family:"Aleo";src:url(aleo.woff2?v=d7c8feba) format("woff2"),url(aleo.ttf?v=fed0d713) format("truetype");font-weight:100 900;font-style:normal;font-display:swap}</style>
<style>
/* «Tres en red» (UD8, La Seguridad Social; CE g RA3 y, con la hucha, el f). Guion: fuente/red/GUION - Tres en red (UD8).md.
   Misma estructura que los demás juegos (portada, presentación de cada nivel, escenario de 360 × 640 escalado, tutorial jugable,
   pausa, final y partida oficial), sobre el motor del tablero de fuente/red/tablero.js y los casos de fuente/red/casos.js.
   25-11-2026: con piezas provisionales (placas de color con icono) hasta que lleguen las láminas de plastilina de José. */
:root{--verde:#004230;--verde2:#0d6b4f;--naranja:#ff5900;--naranjaAA:#c24400;--amarillo:#fcd100;--fondo:#f4f8f6;--texto:#1d2a30;--gris:#5b6b70;--ok:#178045;--mal:#d33a1f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{background:var(--fondo);color:var(--texto);font:16px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:520px;min-height:100%;display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
h1,h2,.serif{font-family:Aleo,Georgia,serif}
.ico{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none;display:inline-block}
.marca{font:800 13px Aleo,Georgia,serif;color:var(--verde);letter-spacing:.3px}
.confeti{position:fixed;top:-12px;width:10px;height:14px;border-radius:2px;pointer-events:none;animation:caeC linear forwards;z-index:40}
@keyframes caeC{to{transform:translateY(105vh) rotate(720deg)}}
/* portada */
.portada{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px}
.heroe.red{background:linear-gradient(180deg,rgba(0,40,29,.6) 0%,rgba(0,34,25,.85) 50%,rgba(0,22,16,.96) 100%),var(--fondoP,none) center 40%/cover no-repeat,#0a3a2b}
.heroe.red h1,.heroe.red .hm,.heroe.red>p{text-shadow:0 1px 3px rgba(0,0,0,.55)}
.heroe .narra{margin:12px 0 6px}
.heroe .tira{display:flex;gap:6px;margin:10px 0 6px;flex-wrap:wrap}
.heroe .tira .pz{position:static;width:42px;height:42px;font-size:22px}
.heroe .tira .pz:nth-child(2n){transform:translateY(-4px) rotate(-6deg)}
.nivel{border:0;border-radius:18px;padding:14px 16px;text-align:left;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.07);cursor:pointer;display:flex;gap:14px;align-items:center;font:inherit;color:inherit;width:100%}
.nivel .n{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 20px Aleo,Georgia,serif;color:#fff}
.nivel b{display:block;font:800 17px Aleo,Georgia,serif;color:var(--verde)}
.nivel span{font-size:14px;color:var(--gris)}
.record{font-size:13px;color:var(--gris)}
.oficial{background:#fff;border:2px solid var(--verde);border-radius:16px;padding:14px;margin:14px 0;text-align:left;display:grid;gap:8px}
.oficial label span,.oficial small{font-size:13px;opacity:.75}
.oficial input{font:700 20px/1.2 "Helvetica Neue",Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;padding:10px 12px;border:2px solid #cfd8d3;border-radius:10px;width:100%}
.oficial input.error{border-color:#c0392b;background:#fdecea}
.oficial .btn[disabled]{opacity:.5}
.oficial .primera{margin:8px 0 0;font-size:14px;font-weight:700;color:var(--verde)}
.entreno{color:var(--verde);font-size:18px;margin:6px 0 4px;text-align:left}
.aviso-of{background:#fff8d6;border:2px solid #fcd100;border-radius:14px;padding:12px;margin:14px 0;line-height:1.5}
#envio{margin-top:8px;font-weight:700;color:var(--verde)}
.libro{font-size:14px;color:var(--verde2)}
.btns{display:grid;gap:10px;margin-top:16px}
.btn{border:0;border-radius:14px;padding:14px;font:800 17px Aleo,Georgia,serif;cursor:pointer;min-height:48px}
.btn.p{background:var(--verde);color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 4px 12px rgba(0,66,48,.25)}
.btn.s{background:#e3ece8;color:var(--verde)}
.pie{text-align:center;font-size:12px;color:var(--gris);margin-top:auto;padding-top:14px}
label.lento{display:flex;gap:10px;align-items:flex-start;text-align:left;margin:0 0 4px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.7);font-size:14px;line-height:1.35;color:var(--gris);cursor:pointer}
label.lento b{color:var(--verde)}
label.lento input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--verde)}
.tutob .n{font-size:24px}
/* presentación del nivel */
.intro{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px}
.intro h1{color:var(--verde);margin:0;font-size:27px;line-height:1.15}
.escena-n{position:relative;border-radius:20px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:170px;padding:22px 16px;
 background:linear-gradient(180deg,rgba(0,40,29,.1) 0%,rgba(0,32,23,.72) 58%,rgba(0,24,17,.94) 100%),var(--esc,none) center 45%/cover no-repeat,#0b5a40;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.escena-n .pres{width:100%;max-width:640px}
.reglas{background:#fff;border-radius:16px;padding:12px 16px;font-size:15px;line-height:1.45;box-shadow:0 3px 10px rgba(0,0,0,.06);text-align:left}
.reglas .cortas{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
.reglas .cortas li{display:flex;gap:10px;align-items:flex-start}
.reglas .cortas .ico{color:var(--naranjaAA);margin-top:2px}
.reglas details{margin-top:8px;font-size:14px}
.reglas summary{cursor:pointer;font-weight:700;color:var(--verde);min-height:44px;display:flex;align-items:center}
.leyendaN{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.leyendaN div{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--texto)}
.leyendaN .pz{position:static;width:38px;height:38px;font-size:20px;flex:none}
/* ===== pantalla de juego: escenario lógico fijo de 360 × 640, escalado a la pantalla (como la nómina) ===== */
#app.jugando{max-width:none;padding:6px 6px calc(6px + env(safe-area-inset-bottom));height:100%;min-height:0;background:linear-gradient(rgba(0,20,14,.25),rgba(0,20,14,.45)),var(--esc,none) center/cover no-repeat,#24453a}
.juego{flex:1;display:flex;flex-direction:column;min-height:0}
.hud{display:flex;justify-content:space-between;align-items:center;gap:4px;margin:0 auto 6px;width:100%;flex-wrap:nowrap}
.hud .pill{border:0;color:#fbf6ec;font-size:13px;font-weight:700;padding:9px 12px;white-space:nowrap;font-variant-numeric:tabular-nums;text-shadow:0 -1px 0 rgba(0,0,0,.5);
 --placa:url(aux_rect_marron.webp);filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.hud .pill.hu{--placa:url(aux_rect_mostaza.webp);color:#3d2a10;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.hud .pill.hu.rojo{--placa:url(aux_rect_naranja.webp);color:#fff}
.hud .pill.racha{--placa:url(aux_rect_naranja.webp);display:none}
.hud .pill.racha.si{display:inline-block}
.hud .ctl{display:flex;gap:4px}
.hud button.pill{cursor:pointer;min-width:46px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;font:inherit;font-weight:800}
.hud .ctl .ico{width:20px;height:20px}
.marco{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.lienzo{position:relative;flex:none}
.esc{position:absolute;left:0;top:0;width:360px;height:640px;transform-origin:0 0}
/* la placa del caso: cara con el aro de tiempo y el texto (y, al responder, la línea del porqué en su lugar) */
.caso{position:absolute;left:6px;top:4px;width:348px;height:120px;display:flex;gap:10px;align-items:center;padding:12px 14px 12px 12px;color:#3d2a17;
 --placa:url(aux_rect_crema.webp);filter:drop-shadow(0 5px 6px rgba(0,0,0,.35))}
.caso .cara{position:relative;flex:none;width:70px;height:70px}
.caso .cara img{position:absolute;left:7px;top:7px;width:56px;height:56px;border-radius:50%;object-fit:cover;background:#e8dcc4}
.aro{position:absolute;inset:0;pointer-events:none}
.aro::before{content:"";position:absolute;inset:0;background:url(nomina_aro_verde.webp) center/contain no-repeat;filter:grayscale(1) brightness(.5);opacity:.45}
.aro i{position:absolute;inset:0;background:var(--aro,url(nomina_aro_verde.webp)) center/contain no-repeat;
 -webkit-mask:conic-gradient(#000 calc(var(--q,1)*360deg),transparent 0);mask:conic-gradient(#000 calc(var(--q,1)*360deg),transparent 0)}
.caso .tx{flex:1;min-width:0;font:600 14.5px/1.28 Aleo,Georgia,serif}
.caso .eti{display:block;font:800 10.5px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#8a6a48;margin-bottom:4px}
.caso .eti b{color:#b07a00}
.caso.bien{--placa:url(aux_rect_verde.webp);color:#f2fbf6}
.caso.mal{--placa:url(aux_rect_marron.webp);color:#fbf1ea}
.caso.bien .eti,.caso.mal .eti{color:#fcd100}
.caso.bien .tx,.caso.mal .tx{font:700 14px/1.32 "Helvetica Neue",Arial,sans-serif}
.caso .tx small{display:block;font-weight:600;font-size:11.5px;opacity:.8;margin-top:3px}
.caso .seguir{margin-top:6px;border:0;border-radius:10px;padding:7px 14px;min-height:40px;font:800 14px Aleo,Georgia,serif;color:#fff;--placa:url(aux_rect_verde.webp);cursor:pointer}
/* el tablero: la red (provisional: cuerdas dibujadas) con las placas atadas a los nudos */
.tab{position:absolute;left:12px;top:134px;width:336px;height:336px;border-radius:14px;
 background:repeating-linear-gradient(0deg,transparent 0 22px,rgba(236,222,190,.85) 22px 26px,transparent 26px 48px),repeating-linear-gradient(90deg,transparent 0 22px,rgba(236,222,190,.85) 22px 26px,transparent 26px 48px),rgba(8,30,22,.55);
 box-shadow:inset 0 0 0 3px rgba(236,222,190,.6),0 8px 16px rgba(0,0,0,.35)}
.tab.bote{animation:bote .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes bote{0%{transform:none}30%{transform:translateY(9px) scaleY(.985)}100%{transform:none}}
.pz{position:absolute;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:24px;border-radius:9px;border:2px solid rgba(0,0,0,.2);
 box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.2),0 3px 3px rgba(0,0,0,.3);transition:transform .15s,opacity .2s,filter .2s;cursor:grab;background-size:100% 100%}
.pz img{width:100%;height:100%;pointer-events:none}
.tab .pz.cae{animation:caePz .28s ease-out}
@keyframes caePz{from{transform:translateY(-36px);opacity:0}to{transform:none;opacity:1}}
.tab .pz.sube{transform:translateY(-4px) scale(1.1);box-shadow:0 0 0 3px #fcd100,0 6px 10px rgba(0,0,0,.4);z-index:2}
.tab .pz.sel{box-shadow:0 0 0 3px #fff,0 0 12px rgba(255,255,255,.8)}
.tab .pz.foco{box-shadow:0 0 0 3px #fcd100}
.tab .pz.pop{transform:scale(.15) rotate(25deg);opacity:0}
.tab .pz.cruce{animation:cruce .5s}
@keyframes cruce{50%{transform:scale(.55) rotate(18deg)}}
.tab .pz.gris{filter:grayscale(1) brightness(.8)}
.persona{position:absolute;left:50%;top:-40px;font-size:34px;transform:translateX(-50%);pointer-events:none;z-index:6;animation:persona .95s cubic-bezier(.4,0,.6,1) forwards}
@keyframes persona{0%{top:-40px}60%{top:42%}76%{top:34%}100%{top:40%;opacity:0}}
.nada{position:absolute;left:50px;width:260px;top:512px;height:50px;border:0;cursor:pointer;color:#fff;font:800 17px Aleo,Georgia,serif;text-shadow:0 -1px 0 rgba(0,0,0,.5);
 --placa:url(aux_rect_gris.webp);filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
.leyenda{position:absolute;left:6px;right:6px;top:570px;display:flex;flex-wrap:wrap;justify-content:center;gap:3px 10px;font:700 11.5px/1.2 "Helvetica Neue",Arial,sans-serif;color:#eaf6f0;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.leyenda span{display:inline-flex;align-items:center;gap:4px}
.leyenda .pz{position:static;width:20px;height:20px;font-size:11px;border-width:1px;border-radius:5px;cursor:default}
.flota{position:absolute;font:900 22px Aleo,Georgia,serif;color:#fcd100;text-shadow:0 2px 0 #6b4a00,0 3px 8px rgba(0,0,0,.5);pointer-events:none;white-space:nowrap;z-index:7}
.flota.mal{color:#ffb39a;text-shadow:0 2px 0 #5c1608,0 3px 8px rgba(0,0,0,.5)}
.aviso-c{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);padding:12px 22px;color:#fcd100;font:900 28px Aleo,Georgia,serif;text-align:center;pointer-events:none;z-index:9;white-space:nowrap;
 --placa:url(aux_rect_marron.webp);filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}
.aviso-c small{display:block;font:700 15px "Helvetica Neue",Arial,sans-serif;margin-top:6px;color:#fbf6ec}
.mano{position:absolute;width:56px;height:56px;pointer-events:none;z-index:8;color:#fff;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
/* la barra del caso: se llena con las placas de su prestación (no dice cuál es) */
.barra{display:flex;gap:4px;margin-top:6px}
.barra i{flex:1;height:12px;border-radius:6px;background:rgba(80,55,25,.18);box-shadow:inset 0 2px 2px rgba(0,0,0,.18);transition:background .25s}
.caso:not(.elegido) .barra{visibility:hidden}
.barra i.si{background:linear-gradient(#ffe25a,#e0a800);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2),0 0 6px rgba(252,209,0,.7)}
.caso.bien .barra,.caso.mal .barra{display:none}
.caso.entra{animation:entra .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes entra{from{transform:translateY(-14px) scale(.96);opacity:.4}}
.caso.no{animation:no .3s}
@keyframes no{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tiempo{position:absolute;left:24px;right:24px;top:475px;height:10px;border-radius:5px;background:rgba(0,0,0,.35);box-shadow:inset 0 2px 3px rgba(0,0,0,.4);overflow:hidden}
.tiempo i{display:block;height:100%;width:100%;border-radius:8px;background:linear-gradient(#5fd38d,#178045);box-shadow:inset 0 2px 0 rgba(255,255,255,.3)}
.vuela{z-index:7;pointer-events:none}
.tab .pz.oro{box-shadow:0 0 0 3px #fcd100,0 0 14px 4px rgba(252,209,0,.85);animation:brilla 1s ease-in-out infinite alternate;z-index:3}
.tab .pz.oro::after{content:"✨";position:absolute;right:-6px;top:-8px;font-size:15px}
@keyframes brilla{from{filter:brightness(1)}to{filter:brightness(1.35)}}
.tab .pz.esp-f{background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.55) 0 4px,transparent 4px 9px)}
.tab .pz.esp-c{background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 4px,transparent 4px 9px)}
.tab .pz.esp-x{background:conic-gradient(#e8823a,#f1d36a,#2f8f5b,#3d7cc4,#8a5cc2,#ec9cbb,#e8823a)!important;box-shadow:0 0 10px rgba(255,255,255,.8)}
.caso.pregunta .tx{font-size:13.5px}
.caso .eti .pz{position:static;display:inline-flex;width:18px;height:18px;font-size:10px;border-width:1px;border-radius:4px;vertical-align:-4px}
.elige .op{display:flex;align-items:center;gap:8px;min-height:44px;width:100%;max-width:none;padding:6px 12px;font:800 14px/1.2 "Helvetica Neue",Arial,sans-serif}
.elige .op .num{flex:none;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;font-size:13px}
.elige .op.bien{--placa:url(aux_rect_verde.webp);color:#fff}
.elige .op.mal{--placa:url(aux_rect_marron.webp);color:#fff}
.elige{position:absolute;left:10px;right:10px;top:491px;display:flex;flex-direction:column;gap:5px}
.elige .ch{display:flex;align-items:center;gap:5px;min-height:44px;padding:4px 10px 4px 5px;border:0;cursor:pointer;color:#3d2a17;font:800 12px/1.1 "Helvetica Neue",Arial,sans-serif;text-align:left;
 --placa:url(aux_rect_crema.webp);filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));max-width:118px}
.elige .ch .pz{position:static;width:30px;height:30px;font-size:16px;flex:none;cursor:pointer}
.elige .ch[data-k="nada"]{--placa:url(aux_rect_gris.webp);color:#fff}
.elige .ch.si{--placa:url(aux_rect_verde.webp);color:#fff;transform:scale(1.06)}
.elige .ch:disabled:not(.si){opacity:.45}
.elige .ch.op{max-width:none;width:100%;font-size:14px}
.elige .ch.op:disabled:not(.bien):not(.mal){opacity:.5}
.tuto-dice{position:absolute;left:8px;right:8px;top:588px;z-index:8;padding:7px 12px;color:#f2fbf6;font:700 12.5px/1.25 "Helvetica Neue",Arial,sans-serif;--placa:url(aux_rect_verde.webp);filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.tuto-dice b{color:#fcd100}
/* 25-11-2026 (José: «nuestras placas rectangulares con esquinas suaves»): como en Señales, el Muro y Cada minuto cuenta, la placa
   en 9 trozos (las esquinas no se estiran) con la misma placa entera debajo, para que no salgan costuras al escalar */
.hud .pill,.caso,.elige .ch,.tuto-dice,.tuto-dice .seguir,.primera,.aviso-c,.caso .seguir,.ventanilla{border:0 solid transparent;border-radius:13px;background:var(--placa) center/100% 100% no-repeat;border-image:var(--placa) 52 fill / 15px / 0 stretch}
/* 25-11-2026: expedientes, ventanilla, efectos, celebración, ayudas y camino de niveles */
.ventanilla{position:absolute;left:60px;right:60px;top:474px;height:30px;display:flex;align-items:center;justify-content:center;gap:6px;color:#3a2a00;font:800 13px Aleo,Georgia,serif;--placa:url(aux_rect_mostaza.webp)}
.ventanilla .ico{width:16px;height:16px}
.tab .pz.exp{box-shadow:0 0 0 3px #fff,0 0 12px 3px rgba(255,255,255,.7);z-index:3;font-size:28px}
.tab.quieto .pz:not(.exp){filter:saturate(.6) brightness(.85)}
.efectos{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.chispa{position:absolute;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.rayo{position:absolute;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);box-shadow:0 0 18px 6px rgba(255,240,170,.85)}
.rayo.h{left:12px;width:336px;height:16px;transform:translateY(-50%)}
.rayo.v{top:134px;height:336px;width:16px;transform:translateX(-50%);background:linear-gradient(180deg,transparent,rgba(255,255,255,.95),transparent)}
.onda{position:absolute;width:60px;height:60px;border-radius:50%;border:6px solid rgba(255,255,255,.9);box-shadow:0 0 20px rgba(252,209,0,.9)}
.palabra{position:absolute;left:50%;top:300px;z-index:9;pointer-events:none;white-space:nowrap;font:900 34px/1 Aleo,Georgia,serif;color:#fcd100;
 text-shadow:0 3px 0 #b06a00,0 -2px 0 #fff3b0,3px 0 0 #6b3d00,-3px 0 0 #6b3d00,0 6px 14px rgba(0,0,0,.5)}
.palabra.grande{top:250px;font-size:30px;color:#7dffb0;text-shadow:0 3px 0 #0b5a40,3px 0 0 #063524,-3px 0 0 #063524,0 6px 14px rgba(0,0,0,.5)}
.celebra{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:radial-gradient(circle at 50% 45%,rgba(252,209,0,.35),rgba(0,20,14,.75) 70%);cursor:pointer}
.celebra .masc{font-size:110px;line-height:1;animation:salto .7s cubic-bezier(.3,1.6,.5,1) infinite alternate}
.celebra .masc img{width:200px;height:auto}

<script>
/* ===== «Tres en red» (UD8) · el tablero, sin dibujos (25-11-2026) =====
   Todo lo que decide el juego y se puede probar sin pantalla: crear el tablero, ver qué trío forma un cambio, resolver tríos,
   cascadas y relleno, y la GARANTÍA CIEGA del guion (apartado 2): todas las prestaciones del nivel tienen siempre al menos un trío
   posible y el tablero no sabe cuál es la respuesta del caso, así que mirarlo no ayuda a acertar.

   Tipos: números 0..n-1 = prestaciones del nivel (en el orden de la leyenda y de las teclas 1-6); MONEDA = la cotización.
   Tablero: array plano de F×C (fila a fila, la fila 0 arriba). Una casilla vacía vale -1 solo durante la resolución.

   rng(semilla)                         generador repetible (las pruebas repiten partidas con la misma semilla)
   crea(n, F, C, r)                     tablero sin tríos hechos y con la garantía cumplida
   grupos(t, F, C)                      tríos (o más) en línea: [{tipo, celdas}]
   jugadas(t, F, C)                     cambios posibles: [{a, b, tipos}] (tipos = los de los tríos que forma)
   porTipo(t, F, C, n)                  cuántas jugadas forma cada tipo (la moneda en la posición n)
   prueba(t, F, C, a, b)                lo que haría el cambio a↔b sin tocar nada: {valido, tipos, respuesta, moneda, grupos}
   resuelve(t, F, C, n, r, a, b)        hace el cambio y todas las cascadas; devuelve los pasos para animarlos y si hubo que recolocar
   garantia(t, F, C, n)                 ¿todas las prestaciones tienen al menos una jugada?

   © José Carlos González Acedo. Todos los derechos reservados. */
const RED_TAB = (() => {
 const MONEDA = 99, EXP = 98;   // EXP: el expediente que baja por el tablero hasta la ventanilla (no se junta ni lo rompen las especiales)
 const PAPEL = 97;   // papeleo atascado (nivel 2): no se mueve, no cae y tapa el paso; se rompe con un trío pegado o con una especial
 const ESPECIAL = v => v === 'f' || v === 'c' || v === 'x' || v === 's';

 function rng(semilla) {
  let a = (semilla >>> 0) || 1;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 };
 }
 const tiposDe = n => { const v = []; for (let i = 0; i < n; i++) v.push(i); v.push(MONEDA); return v };

 /* ¿forma trío la casilla i con lo que tiene a la izquierda o arriba? (para crear sin tríos hechos) */
 function haceTrio(t, C, i, v) {
  const f = Math.floor(i / C), c = i % C;
  if (c >= 2 && t[i - 1] === v && t[i - 2] === v) return true;
  if (f >= 2 && t[i - C] === v && t[i - 2 * C] === v) return true;
  return false;
 }

 function grupos(t, F, C) {
  const g = [];
  for (let f = 0; f < F; f++) for (let c = 0; c < C;) {
   const v = t[f * C + c]; let k = c + 1;
   while (k < C && t[f * C + k] === v) k++;
   if (v >= 0 && v !== EXP && v !== PAPEL && k - c >= 3) { const cel = []; for (let x = c; x < k; x++) cel.push(f * C + x); g.push({ tipo: v, celdas: cel }) }
   c = k;
  }
  for (let c = 0; c < C; c++) for (let f = 0; f < F;) {
   const v = t[f * C + c]; let k = f + 1;
   while (k < F && t[k * C + c] === v) k++;
   if (v >= 0 && v !== EXP && v !== PAPEL && k - f >= 3) { const cel = []; for (let y = f; y < k; y++) cel.push(y * C + c); g.push({ tipo: v, celdas: cel }) }
   f = k;
  }
  return g;
 }

 /* los tríos que nacen de un cambio: solo los que tocan una de las dos casillas cambiadas */
 function gruposDelCambio(t, F, C, a, b) {
  const u = t.slice(); [u[a], u[b]] = [u[b], u[a]];
  return { u, g: grupos(u, F, C).filter(x => x.celdas.includes(a) || x.celdas.includes(b)) };
 }
 const vecinas = (C, a, b) => { const fa = Math.floor(a / C), fb = Math.floor(b / C); return (fa === fb && Math.abs(a - b) === 1) || Math.abs(a - b) === C };

 function prueba(t, F, C, a, b) {
  if (!vecinas(C, a, b) || t[a] === t[b]) return { valido: false, tipos: [], respuesta: null, moneda: false, grupos: [] };
  const { g } = gruposDelCambio(t, F, C, a, b);
  const presta = [...new Set(g.map(x => x.tipo).filter(v => v !== MONEDA))], moneda = g.some(x => x.tipo === MONEDA);
  /* dos prestaciones distintas a la vez: no vale como respuesta (guion, apartado 2) */
  const valido = g.length > 0 && presta.length <= 1;
  return { valido, tipos: presta, respuesta: presta.length === 1 ? presta[0] : null, moneda, grupos: g };
 }

 function jugadas(t, F, C) {
  const j = [];
  for (let i = 0; i < F * C; i++) for (const k of [i + 1, i + C]) {
   if (k >= F * C || (k === i + 1 && k % C === 0) || t[i] === t[k]) continue;
   const { g } = gruposDelCambio(t, F, C, i, k);
   if (g.length) j.push({ a: i, b: k, tipos: [...new Set(g.map(x => x.tipo))] });
  }
  return j;
 }
 function porTipo(t, F, C, n) {
  const cu = new Array(n + 1).fill(0);
  for (const x of jugadas(t, F, C)) {
   const p = x.tipos.filter(v => v !== MONEDA);
   if (p.length === 1) cu[p[0]]++;          // solo las jugadas que valen como respuesta de una prestación
   if (x.tipos.includes(MONEDA)) cu[n]++;
  }
  return cu;
 }
 const garantia = (t, F, C, n) => porTipo(t, F, C, n).slice(0, n).every(x => x >= 1);

 /* tablero nuevo: fichas repartidas por igual entre los tipos (±1), sin tríos hechos y con la garantía. La garantía no sabe nada
    del caso: es la misma para todas las prestaciones */
 function crea(n, F, C, r) {
  const T = tiposDe(n);
  for (let intento = 0; intento < 500; intento++) {
   const bolsa = [];
   for (let i = 0; i < F * C; i++) bolsa.push(T[i % T.length]);
   for (let i = bolsa.length - 1; i > 0; i--) { const k = Math.floor(r() * (i + 1)); [bolsa[i], bolsa[k]] = [bolsa[k], bolsa[i]] }
   const t = new Array(F * C).fill(-1); let ok = true;
   for (let i = 0; i < F * C && ok; i++) {
    let k = bolsa.findIndex(v => !haceTrio(t, C, i, v));
    if (k < 0) { ok = false; break }
    t[i] = bolsa[k]; bolsa.splice(k, 1);
   }
   if (ok && !grupos(t, F, C).length && garantia(t, F, C, n)) return t;
  }
  throw new Error('No se pudo crear un tablero con la garantía');
 }

 /* relleno dirigido: cada casilla vacía (de abajo arriba) recibe el tipo que menos fichas tiene en el tablero entre los que no
    hacen trío al caer. Así casi nunca hace falta recolocar, y sigue siendo ciego a la respuesta */
 function rellena(t, F, C, n, r) {
  const T = tiposDe(n);
  for (let i = F * C - 1; i >= 0; i--) {
   if (t[i] !== -1) continue;
   const cuenta = new Map(T.map(v => [v, 0])); for (const v of t) if (v >= 0) cuenta.set(v, cuenta.get(v) + 1);
   const cand = T.filter(v => !haceTrioAlRellenar(t, F, C, i, v));
   const lista = cand.length ? cand : T, minimo = Math.min(...lista.map(v => cuenta.get(v)));
   const pocos = lista.filter(v => cuenta.get(v) <= minimo + 1);
   t[i] = pocos[Math.floor(r() * pocos.length)];
  }
 }

async function puesto(codigo,pts,nuevo){
 try{
  let txt=!nuevo&&RANK_MEM&&Date.now()-RANK_MEM.t<60000?RANK_MEM.txt:null;
  if(txt===null){
   const ctl=new AbortController(),tt=setTimeout(()=>ctl.abort(),10000);   // 17-11-2026: sin esto podía quedarse en «Consultando…»
   txt=await fetch(RANKING+'&t='+Date.now(),{signal:ctl.signal}).then(r=>r.text());clearTimeout(tt);RANK_MEM={t:Date.now(),txt};
  }
  const g=grupoDe(codigo), sinJuego=JUEGO==='UD2 Señales';   // las primeras filas (solo Señales) no tenían la columna del juego
  const lista=txt.split(/\r?\n/).slice(1).map(l=>l.split(',')).filter(f=>f[0]===g&&(sinJuego&&!f[2]||(f[2]||'').trim()===JUEGO)).map(f=>parseInt(String(f[1]||'').replace(/\D/g,''),10)||0);   // 18-11-2026: «12.345» (con punto de miles) también se lee bien
  const pos=1+lista.filter(x=>x>pts).length, total=Math.max(lista.length+(nuevo?1:0),pos);
  const empate=Math.max(0,lista.filter(x=>x===pts).length-(nuevo?0:1));   // 19-11-2026: otras personas con los mismos puntos
  return {pos,total,empate};
 }catch(e){return null}
}

 const r=baraja(sale),oros=r.filter(x=>x.oro),oro=oros.length?baraja(oros)[0]:null;

   compañero o compañera de ciclo (ver la ficha del libro, más abajo). Sus imágenes (plastilina, José) van junto a cada juego: elenco_prota_XXX.jpg,
   elenco_vet_XXX.jpg y elenco_puesto_XXX.jpg (su puesto de trabajo). comun_montar.py mete este archivo y copia las imágenes.

   cicloJugador()                      ciclo del código de lista (o el elegido para entrenar, o uno fijo por dispositivo)
   personaje(ciclo, 'prota'|'vet')     {nombre, ella, cara, puesto, sector, empresa, visita}
   fondoPuesto(ciclo)                  url de la escena de su puesto de trabajo
   presenta(contenedor, {quien, texto, animo, ciclo})   cara + nombre + bocadillo; animo: 'neutro' | 'bien' | 'mal' | 'piensa'
   reacciona(contenedor, animo, texto)                    cambia gesto y texto del presentador que ya está pintado */

/* FICHA DEL LIBRO (libro/ipe1/ud01_casos.py, PERSONAJES; José, 17-11-2026: «la Alba que elegimos definitivamente en los
   libros»). Por ciclo, dos personas que ACABAN DE TERMINAR el mismo ciclo y empiezan su primer empleo, cada una en una
   empresa distinta: la protagonista (19-20 años, primer empleo en la empresa de su formación en empresa) y su compañero o
   compañera de ciclo (23 años, primer trabajo estable). No hay «veteranos»: se ayudan entre iguales. Las caras salen de las
   portadas del libro (recursos/libro/img/portada_ud01_XXX.jpg). La clave «vet» se mantiene por compatibilidad: es la
   persona compañera.
   vetVisita (José, 17-11-2026, opción B): por qué la persona compañera está ese día en el trabajo de la protagonista
   (Auxilios y Evacuación), con «para…» y sin posesivos, para que valga en primera y en tercera persona. */
const ELENCO = {
  HIG: { prota: 'Alba', ella: true, edad: 20, de: 'Triana', puesto: 'higienista', lugar: 'la clínica dental de Triana',
         vet: 'Samuel', vetElla: false, vetEdad: 23, vetDe: 'Sevilla', vetPuesto: 'higienista', vetLugar: 'el centro de salud',
         vetVisita: 'para preparar una campaña de salud bucodental con el centro de salud',
         sector: 'la clínica dental' },
  IFC: { prota: 'Rafa', ella: false, edad: 20, de: 'Dos Hermanas', puesto: 'técnico de climatización', lugar: 'los hoteles que mantiene',
         vet: 'Curro', vetElla: false, vetEdad: 23, vetDe: 'el Cerro del Águila', vetPuesto: 'técnico de climatización', vetLugar: 'la empresa instaladora',
         vetVisita: 'para cambiar una enfriadora de la sala de máquinas',
         sector: 'la sala de máquinas' },
  ITE: { prota: 'Claudia', ella: true, edad: 19, de: 'Alcalá de Guadaíra', puesto: 'instaladora de telecomunicaciones', lugar: 'los hoteles y oficinas donde instala',
         vet: 'Marcos', vetElla: false, vetEdad: 23, vetDe: 'Bellavista', vetPuesto: 'instalador de telecomunicaciones', vetLugar: 'las azoteas donde instala antenas',
         vetVisita: 'para instalar la nueva antena del edificio',
         sector: 'la azotea' },
  STI: { prota: 'Fran', ella: false, edad: 20, de: 'Mairena del Aljarafe', puesto: 'técnico de sistemas', lugar: 'el centro de datos del aeropuerto',
         vet: 'Alma', vetElla: true, vetEdad: 23, vetDe: 'la Macarena', vetPuesto: 'técnica de sistemas', vetLugar: 'las empresas clientes',
         vetVisita: 'para montar la red de una empresa cliente de la terminal',
         sector: 'el centro de datos' }
};

function cicloJugador() {
  try {
    const m = /^[12]([A-Z]{2,5})-/.exec((localStorage.getItem('ipe_codigo') || '').toUpperCase());
    if (m && ELENCO[m[1]]) return m[1];
    const e = localStorage.getItem('ipe_ciclo_elegido');
    if (e && ELENCO[e]) return e;
    let f = localStorage.getItem('ipe_ciclo_dispositivo');
    if (!f || !ELENCO[f]) { f = Object.keys(ELENCO)[Math.floor(Math.random() * 4)]; localStorage.setItem('ipe_ciclo_dispositivo', f) }
    return f;
  } catch (e) { return 'HIG' }
}

/* Caras con gesto (elenco_prota_HIG_bien.jpg, _mal, _piensa…): comun_montar.py escribe en ELENCO_GESTOS las que existen.
   Sin el archivo, se usa la cara de siempre y el gesto lo pone el aro de color. */
const gestoDe = (cara, animo) => { const g = cara.replace(/\.jpg$/, '_' + animo + '.jpg');
  return typeof ELENCO_GESTOS !== 'undefined' && ELENCO_GESTOS.indexOf(g) >= 0 ? g : cara };

function personaje(ciclo, quien) {
  const c = ELENCO[ciclo] || ELENCO.HIG, k = ELENCO[ciclo] ? ciclo : 'HIG', vet = quien === 'vet';
  return { nombre: vet ? c.vet : c.prota, ella: vet ? c.vetElla : c.ella, cara: `elenco_${vet ? 'vet' : 'prota'}_${k}.jpg`,
    edad: vet ? c.vetEdad : c.edad, de: vet ? c.vetDe : c.de, puesto: vet ? c.vetPuesto : c.puesto,
    lugar: vet ? c.vetLugar : c.lugar, empresa: vet ? c.vetLugar : c.lugar, sector: c.sector, visita: vet ? c.vetVisita : '' };
}

const fondoPuesto = ciclo => `elenco_puesto_${ELENCO[ciclo] ? ciclo : 'HIG'}.jpg`;

function presenta(cont, op) {
  if (!cont) return null;
  op = op || {};
  const p = personaje(op.ciclo || cicloJugador(), op.quien || 'prota');
  const el = document.createElement('div');
  el.className = 'pres pres-' + (op.animo || 'neutro') + (op.compacto ? ' pres-compacto' : '');
  el.dataset.cara = p.cara;
  el.innerHTML = `<div class="pres-cara"><img src="${gestoDe(p.cara, op.animo || 'neutro')}" alt="" draggable="false"></div>
    <div class="pres-globo" role="status" aria-live="polite"><b>${p.nombre}</b><span class="pres-txt"></span></div>`;
  el.querySelector('.pres-txt').textContent = op.texto || '';
  cont.innerHTML = ''; cont.appendChild(el);
  return el;
}

function reacciona(cont, animo, texto) {
  const el = cont && (cont.classList && cont.classList.contains('pres') ? cont : cont.querySelector('.pres'));
  if (!el) return;
  el.classList.remove('pres-neutro', 'pres-bien', 'pres-mal', 'pres-piensa');
  void el.offsetWidth;
  el.classList.add('pres-' + (animo || 'neutro'));
  const img = el.querySelector('.pres-cara img');
  if (img && el.dataset.cara) img.src = gestoDe(el.dataset.cara, animo || 'neutro');
  if (texto != null) el.querySelector('.pres-txt').textContent = texto;
}

/* ===== Común a los tres juegos (José, 9-11-2026): libro, sonido sí/no, accesibilidad e instalable =====
   Lo meten los montar_*.py antes de </body>, junto con PAGINAS (paginas_libro.js). */

/* «Repasa» con la página del libro de tu ciclo (sale del código de lista; sin código, solo el apartado). */
function libro(ud, ap, txt) {
  let c = '';
  try { c = (/^[12]([A-Z]{2,5})-/.exec((localStorage.getItem('ipe_codigo') || '').toUpperCase()) || [])[1] || '' } catch (e) {}
  const p = (((typeof PAGINAS !== 'undefined' && PAGINAS['UD' + ud]) || {})[c] || {})[ap];
  return `📖 En el libro: UD ${ud}, apartado ${txt || ap}${p ? `, página ${p}` : ''}`;
}

/* Diálogo propio (fase 2, 17-11-2026): sustituye a alert y confirm del navegador, que en el móvil parecen un error y no
   llevan los colores del centro. dialogo(texto) avisa; dialogo(texto, {si, no}) pregunta y devuelve true o false. */
function dialogo(txt, op) {
  return new Promise(res => {
    const antes = document.activeElement;
    const fondo = document.createElement('div'); fondo.className = 'dlg-fondo';
    const caja = document.createElement('div'); caja.className = 'dlg';
    caja.setAttribute('role', op ? 'alertdialog' : 'dialog'); caja.setAttribute('aria-modal', 'true');
    const p = document.createElement('p'); p.id = 'dlg-txt'; p.textContent = txt; caja.setAttribute('aria-describedby', 'dlg-txt');
    const bs = document.createElement('div'); bs.className = 'dlg-btns';
    const boton = (texto, clase, v) => { const b = document.createElement('button'); b.type = 'button'; b.className = clase; b.textContent = texto; b.onclick = e => { e.stopPropagation(); fin(v) }; bs.appendChild(b); return b };
    const tecla = e => {
      e.stopPropagation();                                   // el juego no se entera de las teclas mientras está abierto
      if (e.key === 'Escape') { e.preventDefault(); fin(!op) }
      else if (e.key === 'Tab') { const l = [...bs.children], i = l.indexOf(document.activeElement); e.preventDefault(); l[(i + (e.shiftKey ? l.length - 1 : 1)) % l.length].focus() }
    };
    const fin = v => { document.removeEventListener('keydown', tecla, true); fondo.remove(); try { antes && antes.focus && antes.focus({ preventScroll: true }) } catch (e) {} res(v) };
    if (op) boton(op.no || 'No', 'no', false);
    const si = boton(op ? (op.si || 'Sí') : 'Entendido', 'si', true);
    caja.append(p, bs); fondo.appendChild(caja);
    ['pointerdown', 'touchstart', 'mousedown', 'click'].forEach(ev => fondo.addEventListener(ev, e => e.stopPropagation()));
    document.addEventListener('keydown', tecla, true);
    document.body.appendChild(fondo); si.focus({ preventScroll: true });
  });
}

/* ===== Sonido y respuesta física comunes (fase 5, 17-11-2026) =====
   Todo sintetizado con WebAudio (sin archivos). Un solo contexto: el «actx» del juego si lo declara (let actx=null) y,
   si no, uno propio. Pasa por un volumen general y un compresor para que nada sature. Respeta «Sin sonido» (SILENCIO),
   que también quita la vibración. Se desbloquea con el primer toque (iOS).
   sfx('toque'|'acierto'|'fallo'|'tic'|'golpe'|'rompe'|'premio'|'fanfarria'|'alarma'|'barrido'|'paso', n) · vibrar(ms o patrón)
   sacudir(elemento, px) · parada(ms) → promesa (pausa de impacto; el juego decide qué congela) */
const AUDIO = { ctx: null, maestro: null, ruido: null };
function audio() {
  try {
    let c = typeof actx !== 'undefined' ? actx : AUDIO.ctx;
    if (!c) { c = new (window.AudioContext || window.webkitAudioContext)(); if (typeof actx !== 'undefined') actx = c; }
    AUDIO.ctx = c;
    if (!AUDIO.maestro || AUDIO.maestro.context !== c) {
      const comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
      AUDIO.maestro = c.createGain(); AUDIO.maestro.gain.value = .8; AUDIO.maestro.connect(comp).connect(c.destination);
      const b = c.createBuffer(1, c.sampleRate * .5, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      AUDIO.ruido = b;
    }
    if (c.state === 'suspended' && !window.SILENCIO) c.resume();
    return c;
  } catch (e) { return null }
}
function nota(f, dur, tipo = 'sine', vol = .2, d = 0, hasta = 0) {
  const c = audio(); if (!c || window.SILENCIO) return;
  const t0 = c.currentTime + d, o = c.createOscillator(), g = c.createGain();
  o.type = tipo; o.frequency.setValueAtTime(f, t0); if (hasta) o.frequency.exponentialRampToValueAtTime(hasta, t0 + dur);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .012); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g).connect(AUDIO.maestro); o.start(t0); o.stop(t0 + dur + .03);
}
function ruido(dur, vol = .2, filtro = 1200, d = 0, q = 1) {
  const c = audio(); if (!c || window.SILENCIO) return;
  const t0 = c.currentTime + d, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = AUDIO.ruido; f.type = 'bandpass'; f.frequency.value = filtro; f.Q.value = q;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  s.connect(f).connect(g).connect(AUDIO.maestro); s.start(t0); s.stop(t0 + dur + .02);
}
const PENTA = [0, 2, 4, 7, 9];
const escala = n => 523.25 * Math.pow(2, (PENTA[n % 5] + 12 * Math.floor(n / 5)) / 12);   // do pentatónico que sube con n
function sfx(nombre, n = 0) {
  switch (nombre) {
    case 'toque': nota(1400, .035, 'triangle', .12); break;
    case 'paso': nota(320 + n * 6, .03, 'sine', .05); break;
    case 'tic': nota(1000, .03, 'square', .07); break;
    case 'acierto': { const b = escala(Math.min(n, 9)); nota(b, .12, 'triangle', .22); nota(b * 1.5, .16, 'triangle', .2, .07); break }
    case 'fallo': nota(220, .16, 'square', .14); nota(155, .2, 'square', .14, .12); break;
    case 'golpe': nota(160, .09, 'sine', .3, 0, 60); ruido(.05, .12, 900); break;
    case 'rompe': ruido(.09, .22, 1800 + Math.min(n, 12) * 180, 0, 2); nota(escala(Math.min(n, 12)), .07, 'triangle', .1); break;
    case 'premio': [0, 2, 4].forEach((k, i) => nota(escala(k + 5), .14, 'sine', .18, i * .07)); break;
    case 'fanfarria': [523, 659, 784, 1047].forEach((f, i) => nota(f, .22, 'triangle', .2, i * .11)); break;
    case 'alarma': nota(880, .12, 'square', .1); nota(880, .12, 'square', .1, .2); break;
    case 'barrido': ruido(.25, .08, 600, 0, .7); break;
  }
}
function vibrar(p) { try { if (!window.SILENCIO && navigator.vibrate) navigator.vibrate(p) } catch (e) {} }
const MOV_REDUCIDO = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches } catch (e) { return false } })();
function sacudir(el, px = 6) {
  if (!el || MOV_REDUCIDO || !el.animate) return;
  el.animate([{ transform: 'translate(0,0)' }, { transform: `translate(${-px}px,${px / 2}px)` }, { transform: `translate(${px}px,${-px / 2}px)` }, { transform: `translate(${-px / 2}px,0)` }, { transform: 'translate(0,0)' }], { duration: 220, easing: 'ease-out' });
}
const parada = ms => new Promise(r => setTimeout(r, MOV_REDUCIDO ? 0 : ms));
['pointerdown', 'touchend', 'keydown'].forEach(ev => document.addEventListener(ev, () => { if (!window.SILENCIO) audio() }, { capture: true, passive: true }));

  /* Sonido sí/no: en todos los juegos desde la fase 5 (también quita la vibración). */
  {
    const aplica = () => {
      try {
        const c = typeof actx !== 'undefined' && actx ? actx : AUDIO.ctx;
        if (window.SILENCIO) { if (c) c.suspend(); try { window.speechSynthesis && speechSynthesis.cancel() } catch (e) {} }
        else if (c && c.state === 'suspended') c.resume();
      } catch (e) {}
    };
    window.SILENCIO = L.get('ipe_silencio', '0') === '1';
    boton(v => v ? '🔊 Sonido y vibración' : '🔇 Sin sonido ni vibración', !window.SILENCIO, v => { window.SILENCIO = !v; L.set('ipe_silencio', v ? '0' : '1'); aplica() }, () => !window.SILENCIO);
    aplica();
    /* si el juego crea el sonido después, se vuelve a silenciar */
    document.addEventListener('click', () => setTimeout(aplica, 0), true);
    document.addEventListener('touchend', () => setTimeout(aplica, 0), true);
  }

  /* Ayuda de colores para daltonismo (solo señales: escribe el color de la señal en el nivel 1). */
  if (typeof GIRO !== 'undefined') {
    window.AYUDA_COLOR = L.get('ipe_ayuda_color', '0') === '1';
    boton(v => v ? '👁 Ayuda de colores: sí' : '👁 Ayuda de colores: no', window.AYUDA_COLOR,
      v => { window.AYUDA_COLOR = v; L.set('ipe_ayuda_color', v ? '1' : '0') });
  }
  muestra();

  /* Instalable (solo en línea desde el 9-11-2026: sw.js no guarda copias, siempre carga de internet). */
  if ('serviceWorker' in navigator && location.protocol === 'https:')
    navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
